notes: >
  One row per imported attempt bundle (500 rows, one per execution EX0001 to EX0050 of each of the ten
  executable conditions). required_actions_establish is the number of entries of actions[] of the bundle
  (experiments/E02-state-establishment/executor/README.md, section 3); verification_flagged_actions is the number
  of those entries whose verification flag is true; run_outcome_status is the run manifest's outcome.status as
  recorded, copied without interpretation. The script verifies the actions.json sha256 against the one listed in the
  run manifest, the recorded counted_action_count against the number of entries, and the run-level fields against
  the locked configuration, and fails on any disagreement. The three dispatched attempts that left no bundle
  (EX0008 of E02-CS003-SUT01-WEB, run 43095065967; EX0007 of E02-CS003-SUT02-WEB, run 43094844376; EX0005 of
  E02-CS003-SUT03-WEB, run 43094956611; attempt 1 each) have no row; the rows of those executions are their
  imported attempt 2. The script was run twice and wrote equal bytes.
