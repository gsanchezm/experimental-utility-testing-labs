  (Recomendado)" earlier the same day
notes: >
  Deterministic, non-interpretive computation. Implements the descriptive procedure pre-registered in the E05 campaign
  configuration: TSRR, CEOR, E2E-ROR and Outcome Entropy H(Y) with k stated, per condition, with Wilson 95% intervals without
  continuity correction (D-05), the H3 evaluation of the five SUT-01 conditions classified a priori as deterministic (satisfied
  when M = S with S at or above 45 of 50; falsified by any unexpected stimulus-phase category; not evaluable below S = 45), and
  the secondary attribution table. The H3 label and the classification are written from the configuration and never derived
  from the data. No label is re-mapped; no attempt is excluded; no test, p-value, effect size, pooled rate, cross-ecosystem
  difference, ranking or composite is computed (none is frozen for H3). The consistency checks of the core returned no
  violation, and the toolchain drift report is empty. The script was run twice and wrote equal bytes (--check), and an
  independent recomputation in a second language (Python) from the same 650 bundles gave the same counts, category counts,
  entropy, Wilson bounds and H3 statuses for each of the 13 conditions. A SATISFIED status is not a proof of determinism.
