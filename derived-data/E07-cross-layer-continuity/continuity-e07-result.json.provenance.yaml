instruction: >
  the human research lead selected the option "Sí, corre el análisis de E07 (Recomendada)" in a question dialog of 2026-11-19 local time
  (question 2026-11-20T01:28:53Z, answer 2026-11-20T01:33:53Z, UTC): fill the pins of the analysis script, run it over the 200 attempts and
  write the two derived datasets with provenance sidecars, descriptive only, with no confirmatory H4 contrast, test, p-value, effect size,
  ranking, comparison between ecosystems or composite score
notes: >
  Deterministic, non-interpretive computation. Implements the descriptive procedure pre-registered in the E07 campaign configuration: per
  condition T (valid measured attempts), V (executions with the category VERIFIED), E (attempts that reached the verification block, last phase
  verification), the continuity proportion A = V / T (primary) and the conditional proportion B = V / E (reported apart), each with the Wilson 95%
  interval without continuity correction (z = 1.959963984540054), the counts per declared category, the interrupted-cause counts and the
  attributed counts (TOOLING and SUT per category) beside the raw rates; the raw rates are never recomputed on the attributed counts. A
  rate over an empty denominator would be NOT_ESTIMABLE, never 0. No attempt is excluded; no label is re-mapped. Not computed: any
  between-ecosystem comparison, pooled rate, composite score, latency, H4 confirmatory comparison, test, p-value, risk difference, effect size
  or ranking. The consistency checks returned no violation and the toolchain drift report is empty. The script was run and its --check
  recomputation equals the files on disk, and an independent recomputation in a second language (Python) from the same 200 bundles gave the
  same T, V, E, A, B, Wilson bounds and counts per category, interrupted cause and attribution for each of the 4 conditions. The unchanged core
  writes the Wilson lower bound of a rate of 0 of 50 as 6.938893903907228e-18 (floating-point arithmetic); the independent recomputation
  clamps it at 0 and agrees within 1e-12.
