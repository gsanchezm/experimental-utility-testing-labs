instruction: >
  the human research lead selected "Análisis TSRR de E04" among the options of a question dialog of 2026-11-18 (the option
  text: descriptive analysis of the E04 part of the H3 variable, with a loader over the unchanged core, only on the instruction
  of the human research lead, without touching raw data), together with three other options, all four selected
notes: >
  Deterministic, non-interpretive computation. Implements the descriptive procedure pre-registered in the E04 campaign
  configuration: per condition T (valid measured attempts), S (executions with the category TARGET_STATE_VERIFIED) and
  TSRR = S / T with the Wilson 95% interval without continuity correction (z = 1.959963984540054), the counts per declared
  category and the attributed counts (TOOLING and SUT per category) beside the raw rate; the raw rate is never recomputed on
  the attributed counts. No attempt is excluded; no label is re-mapped. Not computed: any between-ecosystem comparison, pooled
  rate, composite score, CEOR, E2E-ROR, Outcome Entropy, H3 evaluation, test, p-value, effect size or ranking. The consistency
  checks returned no violation and the toolchain drift report is empty. The script was run and its --check recomputation
  equals the files on disk, and an independent recomputation in a second language (Python) from the same 650 bundles gave
  the same T, S, rate and Wilson bounds for each of the 13 conditions.
