notes: >
  Deterministic, non-interpretive computation. Implements the descriptive procedure pre-registered in the E08 campaign configuration: per condition the count
  of each category out of N = 50, the detection proportion over the valid measurements (DETECTED or NOT_DETECTED, E08-D-18) and the baseline-against-baseline
  false-positive proportion over the executions that have such a record, each with the Wilson 95% interval, the medians of the three metric values and of the
  two differences (descriptive), and the H5 count of ground-truth conditions per ecosystem for E08 only (each configured condition counts once whatever its
  detection result, E08-D-2; taken from the conditions file, never from the outcomes). The classification of the H5 comparisons is written in the script from
  the configuration and is not derived from the data. No test, p-value, Holm correction, Fisher table, risk difference, pooled rate, composite, ranking or
  support / non-support determination is computed (none is frozen for H5). The recorded category of every bundle equals the one the script derives from its
  detection evidence, and equals the category of its attempt record and of its condition summary (listed disagreements: none); the order of the three loads of
  every execution equals the rotation rule of the conditions file. The script was run twice and wrote equal bytes (--check), and an independent recomputation in
  a second language (Python) from the same bundles gave the same category counts, detection and false-positive counts and medians in each of the four conditions.
