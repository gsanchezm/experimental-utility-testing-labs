notes: >
  Deterministic, non-interpretive computation. Implements the descriptive procedure pre-registered in the E11 campaign configuration: per cell the count of each
  category out of N = 50 with the Wilson 95% interval, the detection rate of each known ground-truth condition and the false-positive rate of each control
  (M1 and M2 reported separately, never combined), and the H5 count of controlled ground-truth conditions per ecosystem for the E11 contribution (each
  configured condition counts once, the controls do not; taken from the cells file, never from the outcomes). The classification of the H5 comparisons is
  written in the script from the configuration and is not derived from the data. No test, p-value, Holm correction, Fisher table, risk difference, pooled
  rate, composite, ranking or support / non-support determination is computed (none is frozen for H5; SUT-02 and SUT-03 have no condition). The recorded
  category of every bundle equals the one the script derives from its evidence (listed disagreements: none). The script was run twice and wrote equal bytes
  (--check), and an independent recomputation in a second language (Python) from the same bundles gave the same positive counts and the same counts of other
  alerts in each of the 14 cells.
