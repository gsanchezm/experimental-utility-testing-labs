notes: >
  Deterministic, non-interpretive computation. Implements the descriptive procedure pre-registered in the E09 campaign
  configuration: the detection rate of the glitch condition over the ground-truth instances (draws whose DOM state at scan
  time is ALL_EMPTY) with a Wilson 95% interval, the other draws reported beside it and never in the denominator, the control
  condition's rule reports, and the H5 count of controlled ground-truth conditions per ecosystem for the E09 contribution
  (SUT-01 one; SUT-02 to SUT-05 zero, no data; SUT-06 structural, no data). The classification of the H5 comparisons is
  written in the script from the configuration and is not derived from the data. No test, p-value, Holm correction, Fisher
  table, risk difference or support / non-support determination is computed (none is frozen for H5; SUT-02 and SUT-03 have
  no condition). The recorded classification of every bundle equals the one the script derives from its evidence (listed
  disagreements: none). The script was run twice and wrote equal bytes, and an independent recomputation in a second
  language from the same bundles gave the same counts and intervals.
