notes: >
  Deterministic, non-interpretive computation. Implements the descriptive branch of the frozen plan for a design
  with one canonical scenario (CS-001): per-condition distribution of Required Actions (reset) over the executions
  that reached the reset action, run outcome.status frequencies beside it, and for each of the two CONFIRMATORY
  (H2) pairs, SUT-01 vs SUT-02 and SUT-01 vs SUT-03 on the WEB surface, the per-scenario counts and their paired
  difference in the original unit. The descriptive branch is fixed by the plan (section 3: Wilcoxon signed-rank
  "only when the design justifies pairing and the number of non-tied pairs is adequate; otherwise the comparison is
  reported descriptively"), so it was not chosen after seeing the data. No Wilcoxon test, bootstrap interval,
  rank-biserial correlation, p-value, or support/non-support determination is computed (none is frozen for H2).
  The result's limitations field states why the interval and the standardized effect size are not estimable and
  that, under section 5 of the plan, the two comparison rows are descriptive observations and not inferential
  results. The classification of the two comparisons is written in the script from the campaign configuration and
  is not derived from the data. Comparisons involving SUT-04 and SUT-05 stay EXPLORATORY and are not computed.
