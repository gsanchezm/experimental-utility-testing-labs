notes: >
  Deterministic, non-interpretive computation. Implements the descriptive branch pre-registered in the E02 campaign
  configuration for the two CONFIRMATORY (H2) comparisons, SUT-01 vs SUT-02 and SUT-01 vs SUT-03 on the WEB
  surface, with two pairs each (CS-003 and CS-004): the per-condition distribution of Required Actions (establish)
  over the executions that reached the verification, with the run outcome.status frequencies beside it; for each
  pair the per-scenario counts and their paired difference in the original unit (SUT-01 minus the baseline); and the
  median of the two differences. The descriptive branch is fixed by the plan (section 3) and by the configuration,
  so it was not chosen after seeing the data. No Wilcoxon test, bootstrap interval, rank-biserial correlation,
  p-value (so no Holm correction), or support/non-support determination is computed (none is frozen for H2). The
  result's limitations field states why the interval and the standardized effect size are not estimable and that,
  under section 5 of the plan, the comparison rows are descriptive observations and not inferential results. The
  classification of the two comparisons is written in the script from the campaign configuration and is not
  derived from the data. Comparisons involving SUT-04 and SUT-05, and every API comparison, stay EXPLORATORY and
  are not computed; their conditions appear only in the per-condition descriptives. This output is not combined
  with H2-reset-result.json: the two sides use different canonical scenarios (CS-001 on the reset side; CS-003 and
  CS-004 on the establish side) and cannot be paired. The script was run twice and wrote equal bytes.
