instruction: >
  the human research lead selected the option "Sí, analiza H4 entre plataformas (Recomendado)" in a question dialog of 2026-11-22 local time
  (question 2026-11-22T20:12:51Z, answer 2026-11-22T20:14:16Z, UTC): write the analysis script and its unit tests, run it over the 200 frozen
  executions of E06 and write the derived datasets with provenance sidecars, descriptive only (the parity proportion per ecosystem with its
  Wilson interval, and SUT-01 versus SUT-02 by risk difference with an interval and Fisher exact test, as the campaign configuration names them)
notes: >
  Deterministic, non-interpretive computation. Implements the descriptive procedure pre-registered in the E06 campaign configuration: execution k
  of the WEB condition of an ecosystem is paired with execution k of its ANDROID condition (k = 1 to 50); a pair is in parity when both
  executions have the category ARRIVED_IDENTITY_READ and the same normalized identity of the first catalogue position (string equality; the raw
  identifier is recorded beside it); every other pair is a non-parity, with exactly one class (NOT_ARRIVED, IDENTITY_UNREADABLE, ARRIVAL_ONLY,
  IDENTITY_DIFFERENT, by that precedence); no execution or pair is excluded; the parity proportion has the Wilson 95% interval without continuity
  correction (z = 1.959963984540054); the risk difference SUT-01 minus SUT-02 has the Newcombe hybrid score interval (method 10; the interval
  method is not named in the configuration and was fixed in the script before the data were read, from the Wilson convention of the repository)
  and the Fisher exact p-value is two-sided. The category counts of each surface, the non-arrival and unreadable counts, the attributed counts and
  the cross-tabulation of the two categories of each pair are reported beside the parity counts. Not computed: any pooled rate across ecosystems
  or surfaces, composite score, latency, ranking or result for iOS; SUT-01 versus SUT-03 is not estimable (no mobile data). The consistency checks
  returned no violation and the toolchain drift report is empty. The script was run and its --check recomputation equals the files on disk, and
  an independent recomputation in Python from the run manifests and evidence facts files of the same 200 bundles gave the same parity counts and
  category counts for each ecosystem.
