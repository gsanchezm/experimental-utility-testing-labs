date_generated: "2026-09-18"
protocol_version: v1
frozen_procedure_source: protocol/statistical-analysis-plan-v1.md, section 4.3 (H1 row); protocol/study-design-v1.md, section 6 (H1 wording, notes (a), (c), (d)); protocol/capability-rubric-v1.md, "Score 3 confirmation" and "Tie-break rule for undecidable adjacent scores"
notes: >
  Deterministic, non-interpretive computation only. Implements exactly the frozen H1 procedure: a
  descriptive count, per ecosystem, of modalities with effective_confirmed_score = 3 in the corrected
  matrix, for SUT-01, SUT-02, and SUT-03 only (the frozen general-purpose-baseline comparison set;
  protocol/study-design-v1.md, section 6, note (c)). No confidence interval, p-value, or effect size is
  computed (none is prescribed for ordinal rubric scores; protocol/statistical-analysis-plan-v1.md,
  section 3). No support/non-support determination is computed (none is frozen for H1). Specialist
  ecosystems (SUT-04, SUT-05, SUT-06) are excluded from the comparison entirely, per protocol/study-design-v1.md
  section 6 notes (a) and (d); H1 makes no prediction about them and they are not pre-registered as
  CONFIRMATORY for H1 in experiments/E01-capability-audit/README.md's campaign configuration.

  SAP "confirmed_score" -> matrix field mapping (see analysis/h1-analysis/compute-h1.js header comment for
  the full citation chain): the script counts effective_confirmed_score, not confirmed_score_as_stored.
  confirmed_score_as_stored is literal per-cell auditor-row provenance only (PROTO-U06) and is null on 20
  cells, including every SUT-02 cell, several of which have effective_confirmed_score = 3; using
  confirmed_score_as_stored as the count field would be a representational error, not an application of the
  frozen rule. For the one DISPUTED-then-human-ruled cell in the H1 population (SUT-01 Visual Testing),
  PROTO-U04 downstream_consumption_semantics rule 4 (manifests/e01-proto-u04-correction.yaml) is the
  already-approved substitution rule that resolves the count: the human ruling's effective score stands in
  "in place of the auditor's confirmed_score." This is an application of an already-frozen/approved rule to
  the concrete matrix representation, not a new rule invented for this analysis; the resulting sensitivity
  (count would be 8 rather than 9 under an unfrozen, stricter reading requiring confirmation_state =
  CONFIRMED specifically) is disclosed in the result's own "limitations" field, and does not change the
  directional finding either way.
