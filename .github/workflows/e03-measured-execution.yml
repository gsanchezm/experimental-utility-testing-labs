# E03 Measured Execution
# Study EUS-2026-001 (Experimental Utility of Software-Testing Laboratory Ecosystems).
# Authored by ORCHESTRATOR under E03-CI-WRITE-AUTH-01 (AGENT-INSTRUCTIONS.md, "E03 CI/CD infrastructure").
#
# The ONLY path through which an E03-resetability MEASURED_EXPERIMENT may ever run. It is manually
# dispatched, one condition, one execution, one attempt per run, and it FAILS CLOSED: the gate job
# verifies every frozen input and every campaign gate against the checked-out repository before the
# measured job is allowed to start. As of its creation (2026-09-22) E03 is NOT_STARTED, no campaign
# configuration is locked, no executor prompt or executor implementation is frozen, and mobile
# qualification has not run, so this workflow cannot execute a measured condition; that is the
# intended state until a human starts the campaign. (Agent governance v2 was frozen 2026-09-22; agent governance v3 was frozen
# 2026-10-03 and read by gate G-6 from 2026-10-05, operation OP-CI-03; agent governance v4 is in force since 2026-10-27 and is
# the document that gate G-6 reads since 2026-10-27, operation OP-CI-11.)
#
# Execution/attempt model: campaign -> SUT -> scenario -> condition -> execution -> attempt. Attempt 1
# is immutable; a retry is a new dispatch with attempt+1. GitHub-native re-runs of a measured run are
# refused (github.run_attempt must be 1). Artifacts are uploaded with overwrite disabled, so an
# attempt's bundle can never be replaced. Nothing is ever committed by this workflow (permissions:
# contents: read); the artifact bundle is imported into the canonical repository under ORCHESTRATOR
# coordination with hash verification (experiments/E03-resetability/ci-cd-execution-model.md).
#
# Read isolation: the measured job checks out only the common frozen inputs and the assigned SUT's own
# raw-data/E03-resetability/<SUT>/ subtree; no other SUT's measured outputs are present in the
# workspace (protocol/agent-governance-v4.md, Section 3.5, isolation of measured jobs; the READ boundary of v3, carried).
name: E03 Measured Execution

on:
  workflow_dispatch:
    inputs:
      condition_id:
        description: "Condition to execute (one of the nine CS-001 conditions)"
        required: true
        type: choice
        options:
          - E03-CS001-SUT01-WEB
          - E03-CS001-SUT01-API
          - E03-CS001-SUT02-WEB
          - E03-CS001-SUT02-ANDROID
          - E03-CS001-SUT02-IOS
          - E03-CS001-SUT03-WEB
          - E03-CS001-SUT04-WEB
          - E03-CS001-SUT04-API
          - E03-CS001-SUT05-API
      assigned_sut:
        description: "SUT assigned to this executor instantiation (must match the condition)"
        required: true
        type: choice
        options: [SUT-01, SUT-02, SUT-03, SUT-04, SUT-05]
      execution_id:
        description: "Execution id within the condition, format EXnnnn (for example EX0001)"
        required: true
        type: string
      attempt:
        description: "1-based attempt number of this execution (a retry is a new dispatch with attempt+1)"
        required: true
        default: "1"
        type: string
      campaign_start_authorization_id:
        description: "Human authorization id of the E03 campaign START (must appear in the protocol/CHANGELOG.md campaign NOT_STARTED -> IN_PROGRESS row)"
        required: true
        type: string
      executor_prompt_version:
        description: "Frozen executor prompt version id (file prompts/frozen/<id>.md must exist)"
        required: true
        type: string
      executor_implementation_sha256:
        description: "SHA-256 of experiments/E03-resetability/executor/run-condition.sh as recorded in the locked campaign configuration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e03-measured-${{ inputs.condition_id }}
  cancel-in-progress: false

env:
  TZ: UTC
  RECORD_CLASS: MEASURED_EXPERIMENT
  RUN_ID: ${{ inputs.condition_id }}__${{ inputs.execution_id }}__A${{ inputs.attempt }}
  ARTIFACT_RETENTION_DAYS: "90"
  TIMEOUT_POLICY: "job timeout-minutes as declared; no step retry; no automatic re-run"
  RETRY_POLICY: "none: a further attempt is a new dispatch with attempt+1; github.run_attempt must be 1"
  CONCURRENCY_POLICY: "one run per condition at a time; never cancel in progress"

jobs:
  gate:
    name: E03 Measured Execution Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      all_gates_passed: ${{ steps.gates.outputs.all_gates_passed }}
      configuration_sha256: ${{ steps.gates.outputs.configuration_sha256 }}
      cs001_sha256: ${{ steps.gates.outputs.cs001_sha256 }}
      schema_v2_sha256: ${{ steps.gates.outputs.schema_v2_sha256 }}
      executor_prompt_sha256: ${{ steps.gates.outputs.executor_prompt_sha256 }}
      governance_sha256: ${{ steps.gates.outputs.governance_sha256 }}
      workflow_sha256: ${{ steps.gates.outputs.workflow_sha256 }}
      environment_type: ${{ steps.gates.outputs.environment_type }}
      canonical_source_commit: ${{ steps.gates.outputs.canonical_source_commit }}
    steps:
      - name: Check out frozen inputs only (no raw-data of any SUT)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            protocol
            manifests
            experiments
            schemas
            prompts
            qualification
            .github/workflows
          sparse-checkout-cone-mode: true
      - name: Refuse anything but a first attempt of a dispatch on the default branch
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = "refs/heads/main" || { echo "measured execution runs only from refs/heads/main (got ${{ github.ref }})"; exit 1; }
          test "${{ github.run_attempt }}" = "1" || { echo "GitHub-native re-run refused: dispatch a new run with attempt+1 instead"; exit 1; }
      - name: Verify every campaign gate against the repository (fail closed)
        id: gates
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, hashlib, os, re, subprocess, sys, yaml
          cond = '${{ inputs.condition_id }}'; sut = '${{ inputs.assigned_sut }}'; attempt = '${{ inputs.attempt }}'
          auth = '${{ inputs.campaign_start_authorization_id }}'; pv = '${{ inputs.executor_prompt_version }}'; impl_sha = '${{ inputs.executor_implementation_sha256 }}'
          failures = []
          def gate(name, ok, detail=''):
              print(('PASS ' if ok else 'FAIL ') + name + (': ' + detail if detail else ''))
              if not ok: failures.append(name)
          def sha(p): return hashlib.sha256(open(p, 'rb').read()).hexdigest()
          # G-A inputs are self-consistent
          gate('condition matches assigned SUT', cond.split('-')[2] == sut.replace('-', ''), f'{cond} vs {sut}')
          gate('execution_id format', bool(re.fullmatch(r'EX[0-9]{4}', '${{ inputs.execution_id }}')))
          gate('attempt is a positive integer', attempt.isdigit() and int(attempt) >= 1, attempt)
          # G-1 campaign START exists
          sm = yaml.safe_load(open('manifests/study-manifest.yaml'))
          st = {c['id']: c['status'] for c in sm['campaigns']}
          gate('E03 campaign status IN_PROGRESS', st.get('E03-resetability') == 'IN_PROGRESS', str(st.get('E03-resetability')))
          chg = open('protocol/CHANGELOG.md').read()
          start_rows = [l for l in chg.splitlines() if 'experiments/E03-resetability/README.md' in l and 'campaign NOT_STARTED -> IN_PROGRESS' in l]
          gate('campaign START change-log row exists', len(start_rows) == 1)
          gate('campaign START row carries the authorization id', bool(start_rows) and auth and auth in start_rows[0])
          # G-2 configuration frozen
          readme = open('experiments/E03-resetability/README.md').read()
          m = re.search(r'\n## Campaign configuration\n(.*?)(\n## |\Z)', readme, re.S)
          gate('locked "Campaign configuration" record exists', m is not None)
          cfg = m.group(1) if m else ''
          gate('configuration names the condition', cond in cfg)
          gate('configuration names run-manifest schema v2', 'run-manifest.schema.v2.json' in cfg)
          gate('configuration names the executor prompt version', pv in cfg)
          gate('configuration names the executor implementation hash', impl_sha in cfg)
          # G-3 CS-001 frozen and active; G-4 CS-002 excluded
          cs1 = yaml.safe_load(open('experiments/scenario-mappings/CS-001.yaml'))
          gate('CS-001 mapping FROZEN', cs1.get('mapping_status') == 'FROZEN')
          entry = next((e for e in cs1['mappings'] if e['sut_id'] == sut), None)
          gate('assigned SUT COMPARABLE on CS-001 for this surface', entry is not None and entry['comparability'] == 'COMPARABLE' and cond.split('-')[3] in entry['surfaces_used'])
          gate('configuration cites CS-001 and no CS-002 condition', 'CS-001' in cfg and 'E03-CS002' not in cfg)
          gate('CS-002 excluded in change log', 'CS-002.yaml | 1 | 1 | mapping FROZEN -> EXCLUDED_FROM_CAMPAIGN' in chg)
          cat = open('experiments/E03-resetability/canonical-scenario-catalogue.md').read()
          gate('catalogue active = CS-001 only', 'Active catalogue: 1 scenario (CS-001)' in cat)
          # G-5 schema version
          import json
          v2 = json.load(open('schemas/run-manifest.schema.v2.json'))
          gate('schema v2 present with v2 id', v2.get('$id', '').endswith(':run-manifest:v2'))
          # G-6 governance frozen: protocol/agent-governance-v4.md (FROZEN-PRE-DATA and in force since 2026-10-27; v3 AMENDED, superseded
          # by it; v2 and v1 AMENDED). Re-pointed from v3 on 2026-10-27 (operation OP-CI-11, the separate CI operation that
          # manifests/agent-governance-v4-amendment-v1.yaml, gate_effects, names; v3 was re-pointed from v2 on 2026-10-05, operation
          # OP-CI-03); the accepted states are unchanged: FROZEN-PRE-DATA or
          # AMENDED (a frozen document, in force or superseded by a frozen successor), never DRAFT or absent.
          gov = open('protocol/agent-governance-v4.md').read()
          gm = re.search(r'\| Protocol state \| ([A-Z-]+) \|', gov)
          gate('agent-governance-v4 frozen', gm is not None and gm.group(1) in ('FROZEN-PRE-DATA', 'AMENDED'), gm.group(1) if gm else 'no header')
          # G-7 mobile runner for mobile cells (protocol/mobile-runner-policy-v3.md sections 1, 7, 8, 9, FROZEN-PRE-DATA and in force
          # since 2026-10-02, which carries sections 1-8 of v2 with non-substantive status corrections, 9.1-9.4 and 9.6 verbatim, one
          # substantive change in 9.5 (a bounded exception clause pointing to 9.7), and the new section 9.7; v2 AMENDED 2026-10-02,
          # under which both compatibility smokes were executed; v1 AMENDED 2026-09-26, under which the qualification gate ran and
          # the section 8 selection was made; citations re-pointed 2026-10-05, operation OP-CI-03, comments only). PROTO-U14
          # (2026-09-24, prospective correction before E03 START): the selected runner is determined first, then only
          # the lineage of that runner is checked. Admissible paths: (A) Mobilewright selected after PASSING the gate;
          # (B) Appium 3 selected by the section 8 switch after Mobilewright FAILED the gate. Both require the
          # selection to rest on exactly one VALID, ISSUED, dispatched gate authorization and the selected runner's own
          # recorded version equal to its pin. PROTO-U15 (2026-09-24): the compatibility smoke is checked per SUT x
          # platform x selected runner (policy section 9) from manifests/compatibility-smoke-status.yaml, the ORCHESTRATOR
          # mirror of the QUALIFIER-MOBILE-01 records under qualification/compatibility-smoke/; a result for another SUT,
          # platform, or runner never counts, and the study-level compatibility_smoke_status summaries of the toolchain
          # manifest are not read. Selected runner none or anything else, a smoke that is not PASS, or an absent version
          # fails closed. The provenance-only keys selection_kind, transcribed_by_role, and
          # values_before_this_transcription are never read.
          # OP-CI-14 (2026-11-03): the study-wide fallback rule below implements the effective-admissibility rule of v3 sections 9.7.9 to
          # 9.7.11 (the REQUIRED_IMPLEMENTATION_DEPENDENCY_OF_PROTO_U19): it reads the remediation lineage record when one exists and
          # verifies it clause by clause; the per-condition checks below are unchanged except for the mirror-authorization clause.
          surface = cond.split('-')[3]
          if surface in ('ANDROID', 'IOS'):
              tm = yaml.safe_load(open('manifests/toolchain-manifest.yaml'))['tools']
              mp = tm['mobile_primary_candidate']; fb = tm['mobile_fallback']; sel = tm.get('mobile_runner_selection') or {}
              runner = str(sel.get('selected_runner'))
              gate('a mobile runner is selected: Mobilewright or Appium 3 (policy sections 1, 8)', runner in ('Mobilewright', 'Appium 3'), runner)
              entry, qual_needed, pin = {}, None, None
              if runner == 'Appium 3':
                  entry, qual_needed = fb, 'FAILED'
                  pin = str((fb.get('pinned_candidate_version') or {}).get('version'))
                  gate('Appium 3 path: fallback is Appium 3 pinned 3.7.0 and the selection names that pin', str(fb.get('candidate')) == 'Appium 3' and pin == '3.7.0' and str(sel.get('selected_version_pin')) == pin, f"{fb.get('candidate')} {pin} / {sel.get('selected_version_pin')}")
                  gate('Appium 3 path: selection basis is the frozen section 8 switch', 'protocol/mobile-runner-policy-v1.md section 8' in str(sel.get('basis')))
              elif runner == 'Mobilewright':
                  entry, qual_needed = mp, 'PASSED'
                  pin = str((mp.get('pinned_candidate_version') or {}).get('version'))
                  gate('Mobilewright path: the primary candidate is Mobilewright and the selection names its pin', str(mp.get('candidate')) == 'Mobilewright' and str(sel.get('selected_version_pin')) == pin, f"{mp.get('candidate')} {pin} / {sel.get('selected_version_pin')}")
              gate('Mobilewright qualification_status matches the selected-runner path (' + str(qual_needed) + ')', qual_needed is not None and mp.get('qualification_status') == qual_needed, str(mp.get('qualification_status')))
              ga = str(sel.get('human_authorization'))
              recs = [r for r in (yaml.safe_load(open(p)) for p in sorted(glob.glob('manifests/mobile-qualification-execution-auth-v*.yaml'))) if isinstance(r, dict) and r.get('authorization_id') == ga]
              gate('the selection rests on exactly one VALID, ISSUED, dispatched gate authorization', len(recs) == 1 and recs[0].get('record_validity') == 'VALID' and recs[0].get('status') == 'ISSUED' and recs[0].get('dispatch_performed') is True, ga)
              ver = str(entry.get('version') or '').strip()
              gate('the version of the selected runner itself is recorded and equals its pin', bool(ver) and pin is not None and ver.split()[0] == pin, ver or '(absent)')
              plat = surface.lower()
              smk_path = 'manifests/compatibility-smoke-status.yaml'
              smk = (yaml.safe_load(open(smk_path)) or {}) if os.path.isfile(smk_path) else {}
              # PROTO-U18 (2026-09-26; IMPLEMENTATION_GAP_AGAINST_FROZEN_MOBILE_RUNNER_POLICY_V2) and OP-CI-14 (2026-11-03; the
              # REQUIRED_IMPLEMENTATION_DEPENDENCY_OF_PROTO_U19): study-wide fallback rule of protocol/mobile-runner-policy-v3.md,
              # section 9.5, with the effective-admissibility rule of its sections 9.7.9 to 9.7.11, checked for EVERY mobile
              # condition before its own smoke. The selected runner stays admissible only if the study-level status (toolchain
              # mobile_runner_selection.mobile_runner_status) is exactly SELECTED and no UNRESOLVED FAIL_RUNNER of the selected
              # runner is recorded -- ORCHESTRATOR mirror or QUALIFIER-MOBILE-01 source table -- on ANY SUT x platform. A FAIL_RUNNER
              # is unresolved unless it is the single historical FAIL_RUNNER named as the trigger by a VERIFIED remediation lineage
              # record (manifests/mobile-runner-remediation-v1.yaml, 9.7.10): that row is retained, never edited, and no longer counted.
              # The lineage is verified clause by clause (each a separate gate below, 9.7.9 requirements 1 to 12): the named row is
              # checked by its authorization, run, result, and row SHA-256; the records it points to by SHA-256; the remediation by its
              # single authorization, single dispatch, run attempt 1, successor lock, official PASS row, mirror entry, and restoration
              # basis. The imported artifacts themselves are verified byte-exact against their import records by the validation
              # workflow (step QUAL-U05, through the export manifest on a public snapshot), not re-hashed here: several are transformed by
              # the publication-only classes, and every file hashed here is compared through same(), which on a public snapshot
              # (PUBLIC-EXPORT-MANIFEST.yaml at its root) needs exactly one manifest entry and bridges only UNCHANGED or an alias class.
              # A FAIL_RUNNER recorded after the lineage record (9.7.11) leaves the lineage valid and is itself unresolved (9.5 applies
              # again); one that already existed when the status was restored invalidates the lineage (9.7.9, requirement 12). A
              # source FAIL_RUNNER is verified by its own provenance (the import record of its authorization namespace and the
              # attribution record of its SUT x platform); a mirror FAIL_RUNNER must match such a row, but the mirror need not show a
              # historical one. Fallback state, in this order: PROVENANCE_INCONSISTENT_FAIL_CLOSED when a lineage record or restoration
              # basis exists and does not verify, or when a PASS is recorded after an unresolved FAIL_RUNNER of the same SUT x platform
              # (no valid lineage); ADMISSIBLE when no unresolved FAIL_RUNNER exists and the status is SELECTED; FALLBACK_EXHAUSTED_VERIFIED
              # when every unresolved FAIL_RUNNER is verified and the status is UNRESOLVED_AFTER_FALLBACK_FAILURE; any other combination
              # is PROVENANCE_INCONSISTENT_FAIL_CLOSED (no exhaustion is asserted until reconciled). Every non-admissible state blocks
              # every mobile condition, including one whose own smoke passed.
              src_path = 'qualification/compatibility-smoke/README.md'
              def smoke_rows(path):
                  # rows of the "Smoke records" table only (the "Attribution records" table has another column order); the last
                  # element of a row is its stripped raw line, whose SHA-256 is the row_sha256 of the lineage record
                  out = []
                  if str(path).startswith('qualification/compatibility-smoke/') and os.path.isfile(path):
                      text = open(path).read()
                      if '## Smoke records' in text:
                          text = text[text.index('## Smoke records'):]
                          text = text[:text.index('\n## ', 4)] if '\n## ' in text[4:] else text
                      for line in text.splitlines():
                          cells = [c.strip() for c in line.strip().strip('|').split('|')]
                          if line.startswith('|') and len(cells) >= 8 and cells[0].startswith('SUT-') and cells[1] in ('android', 'ios'):
                              out.append(cells + [line.strip()])
                  return out
              def row_auth(r):
                  m = re.search(r'formal/(APPIUM3-COMPAT-SMOKE-AUTH-[0-9]{2})/', r[8]) if len(r) > 9 else None
                  return m.group(1) if m else None
              def row_run(r):
                  m = re.search(r'\(run ([0-9]+), attempt ([0-9]+)', r[4])
                  return (m.group(1), m.group(2)) if m else (None, None)
              def row_time(r):
                  m = re.match(r'[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}', r[4])
                  return m.group(0) if m else ''
              def load_yaml(p):
                  try: return yaml.safe_load(open(p)) or {}
                  except Exception: return {}
              rd = lambda p: open(p, encoding='utf-8').read() if os.path.isfile(p) else ''
              pem = None
              if os.path.isfile('PUBLIC-EXPORT-MANIFEST.yaml'):
                  pem = {}
                  for pe in load_yaml('PUBLIC-EXPORT-MANIFEST.yaml').get('files') or []:
                      pem.setdefault(pe.get('path'), []).append(pe)
              def same(p, want):
                  # the file's SHA-256 equals want: byte-exact in the canonical repository; on a public snapshot through its unique export-manifest entry
                  if not (isinstance(p, str) and isinstance(want, str) and os.path.isfile(p)):
                      return False
                  h = sha(p)
                  if pem is None:
                      return h == want
                  es = pem.get(p) or []
                  if len(es) != 1:
                      return False
                  tr = es[0].get('transformations')
                  if tr == ['UNCHANGED']:
                      return h == want
                  return bool(tr) and set(tr) <= {'PROVIDER_NEUTRAL_PATH_ALIAS', 'PROVIDER_NEUTRAL_METADATA_REWRITE'} and es[0].get('canonical_sha256') == want and es[0].get('exported_sha256') == h
              of_runner = lambda r: pin is not None and pin in r[5] and runner.split()[0] in r[5]
              status = sel.get('mobile_runner_status')
              rows_all = smoke_rows(src_path)
              src_fail = [r for r in rows_all if r[7] == 'FAIL_RUNNER' and of_runner(r)]
              mir_ents = [e for e in (smk.get('entries') or []) if isinstance(e, dict) and e.get('runner') == runner]
              mir_fail = [e for e in mir_ents if e.get('result') == 'FAIL_RUNNER']
              def src_verified(r):
                  a = row_auth(r); run_id = row_run(r)[0]
                  base = 'qualification/compatibility-smoke/formal/' + str(a) + '/'
                  ir = load_yaml(base + 'IMPORT-RECORD.yaml'); at = load_yaml(base + 'ATTRIBUTION-' + r[0] + '-' + r[1] + '.yaml')
                  return bool(a) and run_id is not None and ir.get('authorization_id') == a and str((ir.get('workflow') or {}).get('run_id')) == run_id and at.get('authorization_id') == a and at.get('result') == 'FAIL_RUNNER' and at.get('sut_id') == r[0] and at.get('platform') == r[1]
              def mir_matches(e):
                  rs = [r for r in src_fail if r[0] == e.get('sut_id') and r[1] == e.get('platform') and row_auth(r) == e.get('authorization_id')]
                  return bool(e.get('authorization_id')) and len(rs) == 1 and src_verified(rs[0]) and str(e.get('runner_version') or '').strip().split(' ')[0] == pin
              # the remediation lineage record of policy v3, 9.7.10, and the constants it must agree with
              LIN = 'manifests/mobile-runner-remediation-v1.yaml'
              TRIG, TRIG_RUN = 'APPIUM3-COMPAT-SMOKE-AUTH-02', '36539790536'
              REM_BASIS = 'restored under mobile-runner-policy-v3 after one successful post-fallback remediation qualification'
              lin_files = sorted(glob.glob('manifests/mobile-runner-remediation-v*.yaml'))
              lin = load_yaml(LIN) if lin_files == [LIN] else {}
              named = [r for r in src_fail if r[0] == 'SUT-02' and r[1] == 'ios' and row_auth(r) == TRIG and row_run(r) == (TRIG_RUN, '1')]
              lin_in_play = bool(lin_files or 'restoration_basis' in sel)   # a restoration is claimed: a lineage record or a restoration basis exists
              lin_res = []
              def lcheck(name, ok, detail=''):
                  lin_res.append(bool(ok))
                  gate(name, ok, detail)
              if lin_in_play:
                  lcheck('exactly one remediation lineage record exists and it is a REMEDIATION_LINEAGE_RECORD (policy v3, 9.7.10)', lin_files == [LIN] and lin.get('record_class') == 'REMEDIATION_LINEAGE_RECORD', str(lin_files))
              if lin_in_play and lin:
                  hf = lin.get('historical_failing_observation') or {}
                  rem = lin.get('remediation') or {}
                  osr = rem.get('official_result_source_record') or {}
                  il = rem.get('implementation_lock') or {}
                  ar = rem.get('authorization_record') or {}
                  rri = rem.get('run_identity_record') or {}
                  RID = str(rem.get('authorization_id'))
                  auth_rec = load_yaml(str(ar.get('path')))
                  rrec = load_yaml(str(rri.get('path')))
                  pol1, pol2, pol3 = rd('protocol/mobile-runner-policy-v1.md'), rd('protocol/mobile-runner-policy-v2.md'), rd('protocol/mobile-runner-policy-v3.md')
                  lcheck('policy v3 is FROZEN-PRE-DATA with section 9.7, v2 and v1 are AMENDED, and the lineage names v3 as the new policy and v2 as the prior policy (9.7.9, requirement 2)', '| Document | protocol/mobile-runner-policy-v3.md |' in pol3 and '| Protocol state | FROZEN-PRE-DATA |' in pol3 and '### 9.7 Post-fallback remediation qualification' in pol3 and '| Protocol state | AMENDED |' in pol2 and '| Superseded by | protocol/mobile-runner-policy-v3.md |' in pol2 and '| Protocol state | AMENDED |' in pol1 and '| Superseded by | protocol/mobile-runner-policy-v2.md |' in pol1 and lin.get('new_policy') == 'protocol/mobile-runner-policy-v3.md' and lin.get('prior_policy') == 'protocol/mobile-runner-policy-v2.md')
                  lcheck('the lineage names the historical FAIL_RUNNER: APPIUM3-COMPAT-SMOKE-AUTH-02, run 36539790536, run attempt 1, SUT-02 x iOS, FAIL_RUNNER, historical_result_immutable true (9.7.9, requirement 1)', hf.get('authorization_id') == TRIG and str(hf.get('run_id')) == TRIG_RUN and str(hf.get('run_attempt')) == '1' and str(hf.get('ecosystem_platform')).replace('×', 'x').lower() == 'sut-02 x ios' and hf.get('result') == 'FAIL_RUNNER' and hf.get('historical_result_immutable') is True)
                  lcheck('the named historical row still exists unchanged in the Smoke records: its authorization, run, result, and the SHA-256 of the row equal the lineage record (9.7.9, requirement 10)', len(named) == 1 and (hf.get('smoke_record_row') or {}).get('file') == src_path and hashlib.sha256(named[0][-1].encode('utf-8')).hexdigest() == (hf.get('smoke_record_row') or {}).get('row_sha256'))
