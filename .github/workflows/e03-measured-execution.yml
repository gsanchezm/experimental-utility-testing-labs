                  before = lambda t: not t or not rec_at or str(t)[:19] <= rec_at
                  other_before = [r for r in src_fail if r not in named and before(row_time(r))] + [e for e in mir_fail if before(e.get('executed_at'))]
                  lcheck('no other FAIL_RUNNER of the selected runner existed when the status was restored (before the recorded_at of the lineage record; 9.7.9, requirement 12)', re.fullmatch(r'[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}', rec_at) is not None and not other_before, str([(r[0], r[1], row_auth(r)) for r in other_before if isinstance(r, list)] + [(e.get('sut_id'), e.get('platform')) for e in other_before if isinstance(e, dict)]))
              lineage_ok = all(lin_res) if lin_in_play else True   # no restoration claimed: nothing to verify
