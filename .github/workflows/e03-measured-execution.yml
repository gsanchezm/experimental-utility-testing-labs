                  lcheck('the remediation used the approved successor implementation lock v4: its SHA-256 equals the lineage record and the authorization record (9.7.9, requirement 5)', il.get('id') == 'manifests/compatibility-smoke-implementation-lock-v4.yaml' and same(il.get('id'), il.get('sha256')) and (auth_rec.get('implementation_lock') or {}).get('path') == il.get('id') and (auth_rec.get('implementation_lock') or {}).get('sha256') == il.get('sha256'))
                  pass_rows = [r for r in rows_all if row_auth(r) == RID]
