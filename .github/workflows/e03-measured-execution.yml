              elif not unresolved and status == 'SELECTED':
                  fb_state = 'ADMISSIBLE'
              elif runner == 'Appium 3' and unresolved and not src_unverified and not mir_unmatched and status == 'UNRESOLVED_AFTER_FALLBACK_FAILURE':
                  fb_state = 'FALLBACK_EXHAUSTED_VERIFIED'
              else:
                  fb_state = 'PROVENANCE_INCONSISTENT_FAIL_CLOSED'
              fb_detail = f"{fb_state}; status={status}; lineage={'not applicable' if not lin_in_play else ('verified' if lineage_ok else 'NOT verified')}; QUALIFIER FAIL_RUNNER rows={[(r[0], r[1], row_auth(r)) for r in src_fail]} (retained by the verified lineage: {len(named) if lineage_valid else 0}); unresolved={[(r[0], r[1]) for r in unresolved_src] + [(e.get('sut_id'), e.get('platform')) for e in unresolved_mir]}; mirror FAIL_RUNNER={[(e.get('sut_id'), e.get('platform')) for e in mir_fail]}; PASS recorded after an unresolved FAIL_RUNNER={pass_beside_fail}"
              gate('study-level mobile-runner status is SELECTED (policy v3, 9.5 and 9.7.9)', status == 'SELECTED', str(status))
              gate('no unresolved FAIL_RUNNER of the selected runner recorded for any SUT x platform (mirror or QUALIFIER record; the one historical FAIL_RUNNER named by a verified remediation lineage record is retained and not counted)', not unresolved, fb_detail)
              gate('the selected runner remains admissible study-wide (no exhausted or inconsistent fallback state)', fb_state == 'ADMISSIBLE', fb_detail)
              ents = [e for e in (smk.get('entries') or []) if isinstance(e, dict) and e.get('sut_id') == sut and e.get('platform') == plat and e.get('runner') == runner]
