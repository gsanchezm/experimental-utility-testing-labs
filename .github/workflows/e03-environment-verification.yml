# E03 Environment Verification
# Study EUS-2026-001 (Experimental Utility of Software-Testing Laboratory Ecosystems).
# Authored by ORCHESTRATOR under E03-CI-WRITE-AUTH-01 (AGENT-INSTRUCTIONS.md, "E03 CI/CD infrastructure").
#
# Purpose: NON-MEASURED provisioning and environment verification of the controlled instances that
# the nine E03-resetability candidate conditions (experiments/scenario-mappings/CS-001.yaml) need on
# GitHub-hosted runners. Every job provisions one system under test (SUT) surface from the version
# pinned in manifests/sut-manifest.yaml, starts it, verifies that the surface and its reset mechanism
# are reachable, and uploads an artifact labeled ENVIRONMENT_VERIFICATION. No job establishes and
# resets business state as an experiment, counts Required Actions, or writes under raw-data/. Nothing
# here is a MEASURED_EXPERIMENT (protocol/setup-effort-v2.md, section 2: one-time provisioning is never
# counted; experiments/E03-resetability/ci-cd-execution-model.md).
#
# Publication hygiene at capture (human decision D3 of 2026-10-04): before upload, every kept text artifact of every job has
# the runner's workspace, temp, and home path prefixes replaced by the marker <host-path> and any residual /Users/<x> or
# /home/<x> by <home> (the smoke_scrub precedent of qualification/compatibility-smoke/smoke-common.sh), so that an imported
# artifact needs no publication-only transformation. Nothing else in a kept artifact is changed.
#
# environment_type on a GitHub-hosted runner: SELF_HOSTED for web/api instances (an ephemeral cloud
# host under the study's control for the duration of the job, protocol/study-design-v1.md, section
# 10.1), EMULATED for the Android emulator, SIMULATED for the iOS Simulator.
name: E03 Environment Verification

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which SUT surface(s) to provision and verify"
        required: true
        default: all
        type: choice
        options: [all, SUT-01, SUT-02-web, SUT-02-android, SUT-02-ios, SUT-03, SUT-04, SUT-05]

permissions:
  contents: read

concurrency:
  group: e03-environment-verification
  cancel-in-progress: false

env:
  TZ: UTC
  RECORD_CLASS: ENVIRONMENT_VERIFICATION
  ARTIFACT_RETENTION_DAYS: 90

jobs:
  sut-01-web-api:
    name: E03 Environment Verification SUT-01 web+api
    if: ${{ inputs.target == 'all' || inputs.target == 'SUT-01' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out study repository
        uses: actions/checkout@v4
      - name: Read the pinned SUT-01 provenance
        id: pin
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import yaml
          c = yaml.safe_load(open('manifests/sut-manifest.yaml'))['suts']['SUT-01']['components']['api']
          print(f"repo={c['repository']}"); print(f"sha={c['commit_sha']}")
          PY
      - name: Clone the pinned SUT source
        id: clone
        run: |
          set -euo pipefail
          git clone --quiet "${{ steps.pin.outputs.repo }}" sut
          git -C sut checkout --quiet "${{ steps.pin.outputs.sha }}"
          test "$(git -C sut rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
      - name: Set up Python (backend requires 3.11 or 3.12 per the SUT README)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js and pnpm (frontend)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Provision and start the api instance
        id: api
        run: |
          set -euo pipefail
          cd sut/backend
          python -m pip install --quiet -r requirements.txt
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > "$GITHUB_WORKSPACE/api-stdout.log" 2> "$GITHUB_WORKSPACE/api-stderr.log" &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/health
      - name: Provision, build, and serve the web instance
        id: web
        run: |
          set -euo pipefail
          npm install -g pnpm@10 --no-audit --no-fund
          cd sut/frontend
          pnpm install --frozen-lockfile
          VITE_API_URL=http://127.0.0.1:8000 pnpm build
          nohup pnpm exec vite preview --host 127.0.0.1 --port 3000 --strictPort > "$GITHUB_WORKSPACE/web-stdout.log" 2> "$GITHUB_WORKSPACE/web-stderr.log" &
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
      - name: Verify surface and reset-mechanism reachability (no state established, nothing measured)
        id: verify
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, datetime, urllib.request, urllib.error
          def http(method, url, body=None, headers=None):
              req = urllib.request.Request(url, data=body, method=method, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r: return r.status
              except urllib.error.HTTPError as e: return e.code
              except Exception as e: return f'ERROR:{e.__class__.__name__}'
          spec = json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/openapi.json'))  # the SUT mounts its OpenAPI document under /api (backend/main.py: openapi_url)
          paths = spec.get('paths', {})
          checks = {
              'api_health_GET': http('GET', 'http://127.0.0.1:8000/health'),
              'api_openapi_declares_/api/session/reset': '/api/session/reset' in paths,
              'api_openapi_declares_/api/session': '/api/session' in paths,
              'api_POST_/api/session/reset_unauthenticated_status': http('POST', 'http://127.0.0.1:8000/api/session/reset', b''),
              'api_GET_/api/session_unauthenticated_status': http('GET', 'http://127.0.0.1:8000/api/session'),
              'web_GET_/_status': http('GET', 'http://127.0.0.1:3000/'),
          }
          ok = checks['api_health_GET'] == 200 and checks['api_openapi_declares_/api/session/reset'] and checks['web_GET_/_status'] == 200 \
               and not str(checks['api_POST_/api/session/reset_unauthenticated_status']).startswith('ERROR') \
               and checks['api_POST_/api/session/reset_unauthenticated_status'] != 404
          rec = {
              'record_class': os.environ['RECORD_CLASS'], 'measured_experiment': False, 'study_id': 'EUS-2026-001',
              'campaign_id': 'E03-resetability', 'sut_id': 'SUT-01', 'surfaces': ['WEB', 'API'],
              'conditions_covered': ['E03-CS001-SUT01-WEB', 'E03-CS001-SUT01-API'], 'environment_type': 'SELF_HOSTED',
              'sut_provenance': {'repository': '${{ steps.pin.outputs.repo }}', 'commit_sha': '${{ steps.pin.outputs.sha }}'},
              'reset_mechanism_under_verification': 'POST /api/session/reset (SUT01-EV-0006); reachability only',
              'checks': checks, 'verification_result': 'VERIFIED' if ok else 'NOT_VERIFIED',
              'runner': {'os': os.environ.get('RUNNER_OS'), 'image': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'), 'arch': os.environ.get('RUNNER_ARCH')},
              'tool_versions': {'python': subprocess.run(['python', '--version'], capture_output=True, text=True).stdout.strip(), 'node': subprocess.run(['node', '--version'], capture_output=True, text=True).stdout.strip(), 'pnpm': subprocess.run(['pnpm', '--version'], capture_output=True, text=True).stdout.strip()},
              'github': {'run_id': '${{ github.run_id }}', 'run_attempt': '${{ github.run_attempt }}', 'job': '${{ github.job }}', 'repository_sha': '${{ github.sha }}', 'workflow_ref': '${{ github.workflow_ref }}'},
              'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'timezone': 'UTC',
          }
          json.dump(rec, open('environment-verification.json', 'w'), indent=2); print(json.dumps(rec, indent=2))
          assert ok, 'environment verification failed'
          PY
      - name: Write a NOT_VERIFIED record when the verification step did not write one
        if: always()
        env:
          EV_SUT: SUT-01
          EV_SURFACES: WEB API
          EV_CONDITIONS: E03-CS001-SUT01-WEB E03-CS001-SUT01-API
          EV_ENVIRONMENT_TYPE: SELF_HOSTED
          EV_MECHANISM: "POST /api/session/reset (SUT01-EV-0006); reachability only"
          EV_REPOSITORY: ${{ steps.pin.outputs.repo }}
          EV_COMMIT: ${{ steps.pin.outputs.sha }}
          EV_STEP_OUTCOMES: pin=${{ steps.pin.outcome }} clone=${{ steps.clone.outcome }} api=${{ steps.api.outcome }} web=${{ steps.web.outcome }} verify=${{ steps.verify.outcome }}
        run: |
          if [ -f environment-verification.json ]; then exit 0; fi
          python3 - <<'PY'
          import json, os, datetime
          e = os.environ
          unread = 'UNREAD (the pin step did not complete)'
          rec = {'record_class': e['RECORD_CLASS'], 'measured_experiment': False, 'study_id': 'EUS-2026-001', 'campaign_id': 'E03-resetability',
                 'sut_id': e['EV_SUT'], 'surfaces': e['EV_SURFACES'].split(), 'conditions_covered': e['EV_CONDITIONS'].split(), 'environment_type': e['EV_ENVIRONMENT_TYPE'],
                 'sut_provenance': {'repository': e.get('EV_REPOSITORY') or unread, 'commit_sha': e.get('EV_COMMIT') or unread},
                 'reset_mechanism_under_verification': e['EV_MECHANISM'],
                 'step_outcomes': dict(kv.split('=', 1) for kv in e['EV_STEP_OUTCOMES'].split()),
                 'checks': {}, 'verification_result': 'NOT_VERIFIED',
                 'not_verified_reason': 'a provisioning or verification step did not complete (see step_outcomes); nothing was verified',
                 'runner': {'os': e.get('RUNNER_OS'), 'image': e.get('ImageOS'), 'image_version': e.get('ImageVersion'), 'arch': e.get('RUNNER_ARCH')},
                 'github': {'run_id': e.get('GITHUB_RUN_ID'), 'run_attempt': e.get('GITHUB_RUN_ATTEMPT'), 'job': e.get('GITHUB_JOB'), 'repository_sha': e.get('GITHUB_SHA'), 'workflow_ref': e.get('GITHUB_WORKFLOW_REF')},
                 'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'timezone': 'UTC'}
          json.dump(rec, open('environment-verification.json', 'w'), indent=2); print(json.dumps(rec, indent=2))
          PY
      - name: Replace runner host paths in the kept files by a neutral marker (publication hygiene at capture; smoke_scrub precedent)
        if: always()
        env:
          EV_KEPT: environment-verification.json api-stdout.log api-stderr.log web-stdout.log web-stderr.log
        run: |
          python3 - <<'PY'
          import os, re
          prefixes = sorted({p for p in (os.environ.get('GITHUB_WORKSPACE'), os.environ.get('RUNNER_TEMP'), os.environ.get('HOME')) if p and len(p) > 1}, key=len, reverse=True)
          homes = re.compile(r'/(?:Users|home)/[A-Za-z0-9._-]+')
          paths = []
          for k in os.environ['EV_KEPT'].split():
              if os.path.isdir(k):
                  paths += [os.path.join(d, f) for d, _, fs in os.walk(k) for f in fs]
              elif os.path.isfile(k):
                  paths.append(k)
          changed = 0
          for p in sorted(paths):
              b = open(p, 'rb').read()
              if b'\0' in b[:8000]:
                  continue
              try:
                  t = b.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              n = t
              for pre in prefixes:
                  n = n.replace(pre, '<host-path>')
              n = homes.sub('<home>', n)
              if n != t:
                  open(p, 'w', encoding='utf-8', newline='').write(n)
                  changed += 1
          print(f'host paths replaced in {changed} of {len(paths)} kept file(s)')
          PY
      - name: Upload the ENVIRONMENT_VERIFICATION record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E03-ENVIRONMENT_VERIFICATION-SUT-01-web-api-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            environment-verification.json
            api-stdout.log
            api-stderr.log
            web-stdout.log
            web-stderr.log
          retention-days: 90
          if-no-files-found: error

  sut-02-web:
    name: E03 Environment Verification SUT-02 web
    if: ${{ inputs.target == 'all' || inputs.target == 'SUT-02-web' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out study repository
        uses: actions/checkout@v4
      - name: Read the pinned SUT-02 web provenance
        id: pin
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import yaml
          c = yaml.safe_load(open('manifests/sut-manifest.yaml'))['suts']['SUT-02']['components']['web']
          print(f"repo={c['repository']}"); print(f"sha={c['commit_sha']}")
          PY
      - name: Clone the pinned SUT source
        id: clone
        run: |
          set -euo pipefail
          git clone --quiet "${{ steps.pin.outputs.repo }}" sut
          git -C sut checkout --quiet "${{ steps.pin.outputs.sha }}"
          test "$(git -C sut rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
      - name: Set up Node.js (engines >=24.9.0 at the pinned commit)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Provision, build, and serve the web instance
        id: provision
        run: |
          set -euo pipefail
          cd sut
          npm ci --no-audit --no-fund
          npm run build
          nohup npx vite preview --host 127.0.0.1 --port 3000 --strictPort > "$GITHUB_WORKSPACE/web-stdout.log" 2> "$GITHUB_WORKSPACE/web-stderr.log" &
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
      - name: Verify surface and reset-mechanism reachability (nothing measured)
        id: verify
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, datetime, urllib.request, urllib.error
          def http(url):
              try:
                  with urllib.request.urlopen(url, timeout=15) as r: return r.status
              except urllib.error.HTTPError as e: return e.code
              except Exception as e: return f'ERROR:{e.__class__.__name__}'
          src_hits = subprocess.run(['grep', '-rl', 'Reset App State', 'sut/src'], capture_output=True, text=True).stdout.split()
          checks = {'web_GET_/_status': http('http://127.0.0.1:3000/'), 'source_files_containing_Reset_App_State': src_hits}
          ok = checks['web_GET_/_status'] == 200 and len(src_hits) > 0
          rec = {'record_class': os.environ['RECORD_CLASS'], 'measured_experiment': False, 'study_id': 'EUS-2026-001', 'campaign_id': 'E03-resetability',
                 'sut_id': 'SUT-02', 'surfaces': ['WEB'], 'conditions_covered': ['E03-CS001-SUT02-WEB'], 'environment_type': 'SELF_HOSTED',
                 'sut_provenance': {'repository': '${{ steps.pin.outputs.repo }}', 'commit_sha': '${{ steps.pin.outputs.sha }}'},
                 'reset_mechanism_under_verification': "'Reset App State' in-app control (SUT02-EV-0002); presence at source level and served web surface",
                 'checks': checks, 'verification_result': 'VERIFIED' if ok else 'NOT_VERIFIED',
                 'runner': {'os': os.environ.get('RUNNER_OS'), 'image': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'), 'arch': os.environ.get('RUNNER_ARCH')},
                 'tool_versions': {'node': subprocess.run(['node', '--version'], capture_output=True, text=True).stdout.strip(), 'npm': subprocess.run(['npm', '--version'], capture_output=True, text=True).stdout.strip()},
                 'github': {'run_id': '${{ github.run_id }}', 'run_attempt': '${{ github.run_attempt }}', 'job': '${{ github.job }}', 'repository_sha': '${{ github.sha }}', 'workflow_ref': '${{ github.workflow_ref }}'},
                 'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'timezone': 'UTC'}
          json.dump(rec, open('environment-verification.json', 'w'), indent=2); print(json.dumps(rec, indent=2)); assert ok
          PY
      - name: Write a NOT_VERIFIED record when the verification step did not write one
        if: always()
        env:
          EV_SUT: SUT-02
          EV_SURFACES: WEB
          EV_CONDITIONS: E03-CS001-SUT02-WEB
          EV_ENVIRONMENT_TYPE: SELF_HOSTED
          EV_MECHANISM: "'Reset App State' in-app control (SUT02-EV-0002); presence at source level and served web surface"
          EV_REPOSITORY: ${{ steps.pin.outputs.repo }}
          EV_COMMIT: ${{ steps.pin.outputs.sha }}
          EV_STEP_OUTCOMES: pin=${{ steps.pin.outcome }} clone=${{ steps.clone.outcome }} provision=${{ steps.provision.outcome }} verify=${{ steps.verify.outcome }}
        run: |
          if [ -f environment-verification.json ]; then exit 0; fi
          python3 - <<'PY'
          import json, os, datetime
          e = os.environ
          unread = 'UNREAD (the pin step did not complete)'
          rec = {'record_class': e['RECORD_CLASS'], 'measured_experiment': False, 'study_id': 'EUS-2026-001', 'campaign_id': 'E03-resetability',
                 'sut_id': e['EV_SUT'], 'surfaces': e['EV_SURFACES'].split(), 'conditions_covered': e['EV_CONDITIONS'].split(), 'environment_type': e['EV_ENVIRONMENT_TYPE'],
                 'sut_provenance': {'repository': e.get('EV_REPOSITORY') or unread, 'commit_sha': e.get('EV_COMMIT') or unread},
                 'reset_mechanism_under_verification': e['EV_MECHANISM'],
                 'step_outcomes': dict(kv.split('=', 1) for kv in e['EV_STEP_OUTCOMES'].split()),
                 'checks': {}, 'verification_result': 'NOT_VERIFIED',
                 'not_verified_reason': 'a provisioning or verification step did not complete (see step_outcomes); nothing was verified',
                 'runner': {'os': e.get('RUNNER_OS'), 'image': e.get('ImageOS'), 'image_version': e.get('ImageVersion'), 'arch': e.get('RUNNER_ARCH')},
                 'github': {'run_id': e.get('GITHUB_RUN_ID'), 'run_attempt': e.get('GITHUB_RUN_ATTEMPT'), 'job': e.get('GITHUB_JOB'), 'repository_sha': e.get('GITHUB_SHA'), 'workflow_ref': e.get('GITHUB_WORKFLOW_REF')},
                 'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'timezone': 'UTC'}
          json.dump(rec, open('environment-verification.json', 'w'), indent=2); print(json.dumps(rec, indent=2))
          PY
      - name: Replace runner host paths in the kept files by a neutral marker (publication hygiene at capture; smoke_scrub precedent)
        if: always()
        env:
          EV_KEPT: environment-verification.json web-stdout.log web-stderr.log
        run: |
          python3 - <<'PY'
          import os, re
          prefixes = sorted({p for p in (os.environ.get('GITHUB_WORKSPACE'), os.environ.get('RUNNER_TEMP'), os.environ.get('HOME')) if p and len(p) > 1}, key=len, reverse=True)
          homes = re.compile(r'/(?:Users|home)/[A-Za-z0-9._-]+')
          paths = []
          for k in os.environ['EV_KEPT'].split():
              if os.path.isdir(k):
                  paths += [os.path.join(d, f) for d, _, fs in os.walk(k) for f in fs]
              elif os.path.isfile(k):
                  paths.append(k)
          changed = 0
          for p in sorted(paths):
              b = open(p, 'rb').read()
              if b'\0' in b[:8000]:
                  continue
              try:
                  t = b.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              n = t
              for pre in prefixes:
                  n = n.replace(pre, '<host-path>')
              n = homes.sub('<home>', n)
              if n != t:
                  open(p, 'w', encoding='utf-8', newline='').write(n)
                  changed += 1
          print(f'host paths replaced in {changed} of {len(paths)} kept file(s)')
          PY
      - name: Upload the ENVIRONMENT_VERIFICATION record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E03-ENVIRONMENT_VERIFICATION-SUT-02-web-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            environment-verification.json
            web-stdout.log
            web-stderr.log
          retention-days: 90
          if-no-files-found: error

  sut-02-android:
    name: E03 Environment Verification SUT-02 android
    if: ${{ inputs.target == 'all' || inputs.target == 'SUT-02-android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out study repository
        uses: actions/checkout@v4
      - name: Read the pinned SUT-02 android release
        id: pin
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import yaml
          c = yaml.safe_load(open('manifests/sut-manifest.yaml'))['suts']['SUT-02']['components']['android']
          print(f"repo={c['repository']}"); print(f"sha={c['commit_sha']}"); print(f"release={c['release']}")
          PY
      - name: Download the pinned release artifact
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ steps.pin.outputs.release }}" --repo "${{ steps.pin.outputs.repo }}" --pattern 'mda-*.apk' --clobber
          for f in mda-*.apk; do case "$f" in *androidTest*) ;; *) echo "$f" > apk-name.txt; break ;; esac; done
          sha256sum "$(cat apk-name.txt)" | tee apk.sha256
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Write the android verification script (the emulator action runs each script line in its own sh, so the checks run as one bash script)
        run: |
          cat > sut02-android-verify.sh <<'SH'
          set -euo pipefail
          APK="$(cat apk-name.txt)"
          adb install -r "$APK"
          PKG="$(adb shell pm list packages -3 | sed 's/package://' | tr -d '\r' | grep -i sauce | head -1)"
          echo "package=$PKG" | tee package.txt
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
          sleep 15
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tee resumed.txt
          adb shell uiautomator dump /sdcard/ui.xml && adb pull /sdcard/ui.xml ui-dump.xml
          adb exec-out screencap -p > launch-screenshot.png
          unzip -o -q "$APK" resources.arsc -d apk-res && (strings apk-res/resources.arsc | grep -c 'Reset App State' | tee reset-string-count.txt)
          adb shell getprop ro.build.version.release | tr -d '\r' > android-version.txt
          adb shell getprop ro.build.version.sdk | tr -d '\r' > android-sdk.txt
          SH
          bash -n sut02-android-verify.sh
      - name: Boot an Android emulator (API 35, google_apis, x86_64) and verify install, launch, and mechanism presence
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash ./sut02-android-verify.sh
      - name: Write the ENVIRONMENT_VERIFICATION record
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, datetime
          def rd(p, d=''):
              try: return open(p).read().strip()
              except FileNotFoundError: return d
          count = rd('reset-string-count.txt', '0')
          unread = 'UNREAD (the pin step did not complete)'
          ok = '${{ steps.pin.outcome }}' == 'success' and bool(rd('resumed.txt')) and count.isdigit() and int(count) > 0
          rec = {'record_class': os.environ['RECORD_CLASS'], 'measured_experiment': False, 'study_id': 'EUS-2026-001', 'campaign_id': 'E03-resetability',
                 'sut_id': 'SUT-02', 'surfaces': ['ANDROID'], 'conditions_covered': ['E03-CS001-SUT02-ANDROID'], 'environment_type': 'EMULATED',
