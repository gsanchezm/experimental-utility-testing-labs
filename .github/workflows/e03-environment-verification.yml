          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import yaml
          c = yaml.safe_load(open('manifests/sut-manifest.yaml'))['suts']['SUT-04']['components']['api']
          print(f"repo={c['repository']}"); print(f"sha={c['commit_sha']}")
          PY
      - name: Clone the pinned SUT source
        id: clone
        run: |
          set -euo pipefail
          git clone --quiet "${{ steps.pin.outputs.repo }}" sut
          git -C sut checkout --quiet "${{ steps.pin.outputs.sha }}"
          test "$(git -C sut rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
      - name: Set up JDK 26 (the SUT README requires JDK 26 or higher; SUT04-PROV-0001 built with Temurin 26)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
      - name: Build the service jars with Maven (the documented build, tests skipped as in SUT04-PROV-0001)
        id: build
        run: |
          set -euo pipefail
          java -version 2>&1 | tee "$GITHUB_WORKSPACE/java-version.txt"
          mvn -v | tee "$GITHUB_WORKSPACE/maven-version.txt"
          cd sut
          mvn -B -q clean install -DskipTests
          shopt -s nullglob
          jars=(./*/target/*-exec.jar)
