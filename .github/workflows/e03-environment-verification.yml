  sut-02-ios:
    name: E03 Environment Verification SUT-02 ios
    if: ${{ inputs.target == 'all' || inputs.target == 'SUT-02-ios' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out study repository
        uses: actions/checkout@v4
      - name: Read the pinned SUT-02 ios release (Ruby Psych; the macos-15 image refuses pip installs under PEP 668)
        id: pin
        run: |
          ruby -ryaml -rdate -e '
            m = YAML.safe_load(File.read("manifests/sut-manifest.yaml"), permitted_classes: [Date, Time], aliases: true)
            c = m["suts"]["SUT-02"]["components"]["ios"]
            %w[repository commit_sha release].each { |k| abort("empty pin field: #{k}") if c[k].to_s.empty? }
            puts "repo=#{c["repository"]}", "sha=#{c["commit_sha"]}", "release=#{c["release"]}"
          ' >> "$GITHUB_OUTPUT"
      - name: Download the pinned simulator build
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ steps.pin.outputs.release }}" --repo "${{ steps.pin.outputs.repo }}" --pattern 'SauceLabs-Demo-App.Simulator.zip' --clobber
          shasum -a 256 SauceLabs-Demo-App.Simulator.zip | tee app.sha256
          unzip -q SauceLabs-Demo-App.Simulator.zip -d simapp
          find simapp -maxdepth 3 -name '*.app' -type d | head -1 > app-path.txt
          plutil -p "$(cat app-path.txt)/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|MinimumOSVersion|DTSDKName' | tee app-info.txt
          plutil -extract CFBundleIdentifier raw "$(cat app-path.txt)/Info.plist" > bundle-id.txt
      - name: Boot an iOS Simulator, install, launch, and verify mechanism presence
        id: simulator
        run: |
          set -euo pipefail
          xcodebuild -version | tee xcode-version.txt
          UDID="$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for rt,xs in d.items() if 'iOS' in rt for x in xs if x['name'].startswith('iPhone 16')]; print(c[0]['udid'])")"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices booted | tee booted.txt
          xcrun simctl install "$UDID" "$(cat app-path.txt)"
          xcrun simctl launch "$UDID" "$(cat bundle-id.txt)" | tee launch.txt
          sleep 10
          xcrun simctl get_app_container "$UDID" "$(cat bundle-id.txt)" | tee container.txt
          xcrun simctl io "$UDID" screenshot launch-screenshot.png
          BIN="$(cat app-path.txt)/$(plutil -extract CFBundleExecutable raw "$(cat app-path.txt)/Info.plist")"
          (strings "$BIN" | grep -c 'Reset App State' || true) | tee reset-string-count-binary.txt
          python3 - "$(cat container.txt)" <<'PY'
          import os, sys
          # Presence of the reset label in the app bundle installed on the simulator (the container path above), counted on the raw
          # bytes of every regular file (correction of 2026-10-04): in the pinned build the label occurs in a compiled Menu storyboard
          # scene (.nib) and not as contiguous bytes of the executable (run 37206291883 counted 0 there with strings over the
          # executable alone). Output paths are relative to the bundle.
          app, needle, total, rows = sys.argv[1], b'Reset App State', 0, []
          for d, _, fs in os.walk(app):
              for f in fs:
                  p = os.path.join(d, f)
                  with open(p, 'rb') as fh:
                      n = fh.read().count(needle)
                  if n:
                      total += n
                      rows.append(f'{n}\t{os.path.relpath(p, app)}')
          rows.sort(key=lambda r: r.split('\t', 1)[1])
          open('reset-string-files.txt', 'w').write(''.join(r + '\n' for r in rows))
          open('reset-string-count.txt', 'w').write(f'{total}\n')
          print(f'reset label occurrences in the app bundle: {total}')
          print('\n'.join(rows))
          PY
          xcrun simctl list runtimes | grep -i 'iOS' | tee runtimes.txt
      - name: Write the ENVIRONMENT_VERIFICATION record
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, datetime
          def rd(p, d=''):
              try: return open(p).read().strip()
              except FileNotFoundError: return d
          count = rd('reset-string-count.txt', '0')
          unread = 'UNREAD (the pin step did not complete)'
          ok = '${{ steps.pin.outcome }}' == 'success' and ': ' in rd('launch.txt') and bool(rd('container.txt')) and count.isdigit() and int(count) > 0
          rec = {'record_class': os.environ['RECORD_CLASS'], 'measured_experiment': False, 'study_id': 'EUS-2026-001', 'campaign_id': 'E03-resetability',
                 'sut_id': 'SUT-02', 'surfaces': ['IOS'], 'conditions_covered': ['E03-CS001-SUT02-IOS'], 'environment_type': 'SIMULATED',
                 'sut_provenance': {'repository': '${{ steps.pin.outputs.repo }}' or unread, 'commit_sha': '${{ steps.pin.outputs.sha }}' or unread, 'release': '${{ steps.pin.outputs.release }}' or unread, 'artifact_sha256': rd('app.sha256')},
                 'step_outcomes': {'pin': '${{ steps.pin.outcome }}', 'download': '${{ steps.download.outcome }}', 'simulator': '${{ steps.simulator.outcome }}'},
                 'simulator': {'booted': rd('booted.txt'), 'xcode': rd('xcode-version.txt'), 'runtimes': rd('runtimes.txt'), 'app_info': rd('app-info.txt')},
                 'reset_mechanism_under_verification': "'Reset App State' in the Menu screen behind a confirmation (SUT02-EV-0009); presence in the installed app bundle (raw bytes of every regular file); install and launch verified; the reset itself is not exercised",
                 'checks': {'launch': rd('launch.txt'), 'app_container': rd('container.txt'), 'reset_string_occurrences_in_bundle': count, 'bundle_files_with_reset_string': [l for l in rd('reset-string-files.txt').splitlines() if l], 'reset_string_occurrences_in_binary': rd('reset-string-count-binary.txt', '0')},
                 'verification_result': 'VERIFIED' if ok else 'NOT_VERIFIED',
                 'runner': {'os': os.environ.get('RUNNER_OS'), 'image': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'), 'arch': os.environ.get('RUNNER_ARCH')},
                 'mobile_runner': 'none (no mobile test runner is used for environment verification)',
                 'github': {'run_id': '${{ github.run_id }}', 'run_attempt': '${{ github.run_attempt }}', 'job': '${{ github.job }}', 'repository_sha': '${{ github.sha }}', 'workflow_ref': '${{ github.workflow_ref }}'},
                 'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'timezone': 'UTC'}
          json.dump(rec, open('environment-verification.json', 'w'), indent=2); print(json.dumps(rec, indent=2))
          raise SystemExit(0 if ok else 1)
          PY
      - name: Replace runner host paths in the kept files by a neutral marker (publication hygiene at capture; smoke_scrub precedent)
        if: always()
        env:
          EV_KEPT: environment-verification.json app.sha256 app-info.txt launch.txt container.txt reset-string-files.txt launch-screenshot.png
        run: |
          python3 - <<'PY'
