              req = urllib.request.Request(url, data=body, method=method, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r: return r.status
              except urllib.error.HTTPError as e: return e.code
              except Exception as e: return f'ERROR:{e.__class__.__name__}'
          checks = {
              'web_GET_/_status': http('GET', 'http://127.0.0.1/'),
              'api_POST_/auth/login_empty_body_status': http('POST', 'http://127.0.0.1:3004/auth/login', b'{}', {'Content-Type': 'application/json'}),
              'api_GET_/booking/_status': http('GET', 'http://127.0.0.1:3000/booking/'),
              'api_DELETE_/booking/999999_unauthenticated_status': http('DELETE', 'http://127.0.0.1:3000/booking/999999'),
              'api_GET_/booking/999999_status': http('GET', 'http://127.0.0.1:3000/booking/999999'),
          }
          defined = lambda v: isinstance(v, int)
          ok = defined(checks['web_GET_/_status']) and all(defined(v) for v in checks.values())
          rec = {'record_class': os.environ['RECORD_CLASS'], 'measured_experiment': False, 'study_id': 'EUS-2026-001', 'campaign_id': 'E03-resetability',
                 'sut_id': 'SUT-04', 'surfaces': ['WEB', 'API'], 'conditions_covered': ['E03-CS001-SUT04-WEB', 'E03-CS001-SUT04-API'], 'environment_type': 'SELF_HOSTED',
                 'sut_provenance': {'repository': '${{ steps.pin.outputs.repo }}', 'commit_sha': '${{ steps.pin.outputs.sha }}'},
                 'reset_mechanism_under_verification': 'DELETE /booking/{bookingid} (SUT04-EV-0006); reachability only, against a non-existent id, unauthenticated',
                 'checks': checks, 'verification_result': 'VERIFIED' if ok else 'NOT_VERIFIED',
                 'runner': {'os': os.environ.get('RUNNER_OS'), 'image': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'), 'arch': os.environ.get('RUNNER_ARCH')},
                 'tool_versions': {'docker_compose': open('compose-version.txt').read().strip(), 'java': open('java-version.txt').read().strip(), 'maven': open('maven-version.txt').read().strip()},
                 'github': {'run_id': '${{ github.run_id }}', 'run_attempt': '${{ github.run_attempt }}', 'job': '${{ github.job }}', 'repository_sha': '${{ github.sha }}', 'workflow_ref': '${{ github.workflow_ref }}'},
                 'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'timezone': 'UTC'}
          json.dump(rec, open('environment-verification.json', 'w'), indent=2); print(json.dumps(rec, indent=2)); assert ok
          PY
      - name: Collect service logs
        if: always()
        run: |
          cd sut || exit 0
          docker compose logs --no-color > "$GITHUB_WORKSPACE/compose-logs.txt" 2>&1 || true
      - name: Write a NOT_VERIFIED record when the verification step did not write one
        if: always()
        env:
          EV_SUT: SUT-04
          EV_SURFACES: WEB API
          EV_CONDITIONS: E03-CS001-SUT04-WEB E03-CS001-SUT04-API
          EV_ENVIRONMENT_TYPE: SELF_HOSTED
          EV_MECHANISM: "DELETE /booking/{bookingid} (SUT04-EV-0006); reachability only, against a non-existent id, unauthenticated"
          EV_REPOSITORY: ${{ steps.pin.outputs.repo }}
          EV_COMMIT: ${{ steps.pin.outputs.sha }}
          EV_STEP_OUTCOMES: pin=${{ steps.pin.outcome }} clone=${{ steps.clone.outcome }} build=${{ steps.build.outcome }} provision=${{ steps.provision.outcome }} verify=${{ steps.verify.outcome }}
        run: |
          if [ -f environment-verification.json ]; then exit 0; fi
          python3 - <<'PY'
          import json, os, datetime
          e = os.environ
          unread = 'UNREAD (the pin step did not complete)'
          rec = {'record_class': e['RECORD_CLASS'], 'measured_experiment': False, 'study_id': 'EUS-2026-001', 'campaign_id': 'E03-resetability',
                 'sut_id': e['EV_SUT'], 'surfaces': e['EV_SURFACES'].split(), 'conditions_covered': e['EV_CONDITIONS'].split(), 'environment_type': e['EV_ENVIRONMENT_TYPE'],
                 'sut_provenance': {'repository': e.get('EV_REPOSITORY') or unread, 'commit_sha': e.get('EV_COMMIT') or unread},
                 'reset_mechanism_under_verification': e['EV_MECHANISM'],
                 'step_outcomes': dict(kv.split('=', 1) for kv in e['EV_STEP_OUTCOMES'].split()),
                 'checks': {}, 'verification_result': 'NOT_VERIFIED',
                 'not_verified_reason': 'a provisioning or verification step did not complete (see step_outcomes); nothing was verified',
                 'runner': {'os': e.get('RUNNER_OS'), 'image': e.get('ImageOS'), 'image_version': e.get('ImageVersion'), 'arch': e.get('RUNNER_ARCH')},
                 'github': {'run_id': e.get('GITHUB_RUN_ID'), 'run_attempt': e.get('GITHUB_RUN_ATTEMPT'), 'job': e.get('GITHUB_JOB'), 'repository_sha': e.get('GITHUB_SHA'), 'workflow_ref': e.get('GITHUB_WORKFLOW_REF')},
                 'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'timezone': 'UTC'}
          json.dump(rec, open('environment-verification.json', 'w'), indent=2); print(json.dumps(rec, indent=2))
          PY
      - name: Replace runner host paths in the kept files by a neutral marker (publication hygiene at capture; smoke_scrub precedent)
        if: always()
        env:
          EV_KEPT: environment-verification.json java-version.txt maven-version.txt built-jars.txt compose-version.txt compose-ps.txt compose-logs.txt
        run: |
          python3 - <<'PY'
          import os, re
          prefixes = sorted({p for p in (os.environ.get('GITHUB_WORKSPACE'), os.environ.get('RUNNER_TEMP'), os.environ.get('HOME')) if p and len(p) > 1}, key=len, reverse=True)
          homes = re.compile(r'/(?:Users|home)/[A-Za-z0-9._-]+')
          paths = []
          for k in os.environ['EV_KEPT'].split():
              if os.path.isdir(k):
                  paths += [os.path.join(d, f) for d, _, fs in os.walk(k) for f in fs]
              elif os.path.isfile(k):
                  paths.append(k)
          changed = 0
          for p in sorted(paths):
              b = open(p, 'rb').read()
              if b'\0' in b[:8000]:
                  continue
              try:
                  t = b.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              n = t
              for pre in prefixes:
                  n = n.replace(pre, '<host-path>')
              n = homes.sub('<home>', n)
              if n != t:
                  open(p, 'w', encoding='utf-8', newline='').write(n)
                  changed += 1
          print(f'host paths replaced in {changed} of {len(paths)} kept file(s)')
          PY
      - name: Upload the ENVIRONMENT_VERIFICATION record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E03-ENVIRONMENT_VERIFICATION-SUT-04-web-api-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            environment-verification.json
            java-version.txt
            maven-version.txt
            built-jars.txt
            compose-version.txt
            compose-ps.txt
            compose-logs.txt
          retention-days: 90
          if-no-files-found: error

  sut-05-api:
    name: E03 Environment Verification SUT-05 api
    if: ${{ inputs.target == 'all' || inputs.target == 'SUT-05' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out study repository
        uses: actions/checkout@v4
      - name: Read the pinned SUT-05 provenance (source commit and release)
        id: pin
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import yaml
          c = yaml.safe_load(open('manifests/sut-manifest.yaml'))['suts']['SUT-05']['components']['api']
          for k in ('repository', 'commit_sha', 'release'):
              assert c.get(k), f'empty pin field: {k}'
          print(f"repo={c['repository']}"); print(f"sha={c['commit_sha']}"); print(f"release={c['release']}")
          PY
      - name: Clone the pinned SUT source and relate the release tag to the pinned commit (fail closed)
        id: clone
        run: |
          set -euo pipefail
          git clone --quiet "${{ steps.pin.outputs.repo }}" sut
          git -C sut checkout --quiet "${{ steps.pin.outputs.sha }}"
          test "$(git -C sut rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          # The packaged distribution below is built by the SUT project from the release tag's commit. The pinned source commit
          # (the default-branch HEAD at pin time) differs from it only by one documented non-application file; any other
          # difference fails this step, and the record then says nothing about the reset mechanism (correction of 2026-10-04:
          # the SUT's own source build at the pinned commit no longer completes because an unpinned build-tool dependency of the
          # SUT changed upstream after 2026-09-22; the SUT is never patched).
          git -C sut rev-parse "${{ steps.pin.outputs.release }}^{commit}" | tee "$GITHUB_WORKSPACE/release-commit.txt"
          git -C sut diff --name-only "$(cat "$GITHUB_WORKSPACE/release-commit.txt")" "${{ steps.pin.outputs.sha }}" | tee "$GITHUB_WORKSPACE/release-vs-pin-diff.txt"
          test "$(cat "$GITHUB_WORKSPACE/release-vs-pin-diff.txt")" = "screenshots/bundle-analysis.png"
      - name: Set up Node.js 24.21.0 (the Node.js major the packaged distribution is bound to; the version of SUT05-PROV-0001)
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Download, verify, and unpack the packaged distribution of the pinned release (the SUT README's Packaged Distributions route)
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          EV_REPO: ${{ steps.pin.outputs.repo }}
          EV_RELEASE: ${{ steps.pin.outputs.release }}
        run: |
          set -euo pipefail
          ASSET="juice-shop-${EV_RELEASE#v}_node24_linux_x64.tgz"
          gh release download "$EV_RELEASE" --repo "$EV_REPO" --pattern "$ASSET" --clobber
          SUM="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          DIGEST="$(gh release view "$EV_RELEASE" --repo "$EV_REPO" --json assets --jq ".assets[] | select(.name == \"$ASSET\") | .digest")"
          test -n "$DIGEST"
          test "sha256:$SUM" = "$DIGEST"
          mkdir -p pkg
          tar -xzf "$ASSET" -C pkg
          set -- pkg/*/
          test "$#" -eq 1
          PKG_DIR="${1%/}"
          test -f "$PKG_DIR/package.json"
          test -f "$PKG_DIR/build/app.js"
          echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
          python3 - "$ASSET" "$SUM" "$DIGEST" "$PKG_DIR" <<'PY'
          import json, sys
          asset, digest_sha256, github_digest, pkg_dir = sys.argv[1:5]
          p = json.load(open(pkg_dir + '/package.json'))
          rec = {'route': 'PACKAGED_DISTRIBUTION (SUT README, Packaged Distributions: download the release archive, unpack, npm start)',
                 'asset': asset, 'sha256': digest_sha256, 'github_digest': github_digest, 'unpacked_dir': pkg_dir,
                 'package_json': {k: p.get(k) for k in ('name', 'version', 'engines', 'os', 'cpu')}, 'start_script': (p.get('scripts') or {}).get('start')}
          json.dump(rec, open('package-provenance.json', 'w'), indent=2); print(json.dumps(rec, indent=2))
          PY
      - name: Start the api instance from the packaged distribution (npm start, the documented route)
        id: provision
        env:
          SUT_DIR: ${{ steps.package.outputs.dir }}
        run: |
          set -euo pipefail
          cd "$SUT_DIR"
          nohup npm start > "$GITHUB_WORKSPACE/api-stdout-1.log" 2> "$GITHUB_WORKSPACE/api-stderr-1.log" &
          echo $! > "$GITHUB_WORKSPACE/pid1.txt"
          for _ in $(seq 1 90); do curl -fsS -o /dev/null http://127.0.0.1:3000/rest/admin/application-version && break; sleep 3; done
          curl -fsS http://127.0.0.1:3000/rest/admin/application-version | tee "$GITHUB_WORKSPACE/version-1.json"
      - name: Verify api reachability and the process-restart reset mechanism (nothing measured)
        id: verify
        env:
          SUT_DIR: ${{ steps.package.outputs.dir }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, datetime, time, urllib.request, urllib.error
          def http(method, url, body=None, headers=None):
              req = urllib.request.Request(url, data=body, method=method, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r: return r.status
              except urllib.error.HTTPError as e: return e.code
              except Exception as e: return f'ERROR:{e.__class__.__name__}'
          checks = {
              'api_GET_/rest/admin/application-version_status': http('GET', 'http://127.0.0.1:3000/rest/admin/application-version'),
              'api_POST_/rest/user/login_empty_body_status': http('POST', 'http://127.0.0.1:3000/rest/user/login', b'{}', {'Content-Type': 'application/json'}),
              'api_GET_/api/BasketItems/_unauthenticated_status': http('GET', 'http://127.0.0.1:3000/api/BasketItems/'),
              'api_GET_/rest/basket/1_unauthenticated_status': http('GET', 'http://127.0.0.1:3000/rest/basket/1'),
          }
          # Reset mechanism = ENVIRONMENT_RESTART (SUT05-EV-0003): stop the process and start it again; verify it comes back.
          pid = int(open('pid1.txt').read().strip())
          subprocess.run(['pkill', '-TERM', '-P', str(pid)]); subprocess.run(['kill', '-TERM', str(pid)]); time.sleep(5)
          checks['api_after_stop_status'] = http('GET', 'http://127.0.0.1:3000/rest/admin/application-version')
          p = subprocess.Popen(['npm', 'start'], cwd=os.environ['SUT_DIR'], stdout=open('api-stdout-2.log', 'w'), stderr=open('api-stderr-2.log', 'w'))
          for _ in range(90):
              if http('GET', 'http://127.0.0.1:3000/rest/admin/application-version') == 200: break
              time.sleep(3)
          checks['api_after_restart_status'] = http('GET', 'http://127.0.0.1:3000/rest/admin/application-version')
          ok = checks['api_GET_/rest/admin/application-version_status'] == 200 and str(checks['api_after_stop_status']).startswith('ERROR') and checks['api_after_restart_status'] == 200 \
               and all(isinstance(checks[k], int) for k in ('api_POST_/rest/user/login_empty_body_status', 'api_GET_/api/BasketItems/_unauthenticated_status'))
          pkg = json.load(open('package-provenance.json'))
          rec = {'record_class': os.environ['RECORD_CLASS'], 'measured_experiment': False, 'study_id': 'EUS-2026-001', 'campaign_id': 'E03-resetability',
                 'sut_id': 'SUT-05', 'surfaces': ['API'], 'conditions_covered': ['E03-CS001-SUT05-API'], 'environment_type': 'SELF_HOSTED',
                 'sut_provenance': {'repository': '${{ steps.pin.outputs.repo }}', 'commit_sha': '${{ steps.pin.outputs.sha }}', 'release': '${{ steps.pin.outputs.release }}',
                                    'release_commit': open('release-commit.txt').read().strip(), 'release_vs_pin_diff': open('release-vs-pin-diff.txt').read().split(),
                                    'provisioning_route': pkg['route'], 'package': {k: pkg[k] for k in ('asset', 'sha256', 'github_digest', 'package_json', 'start_script')},
                                    'reported_version': open('version-1.json').read().strip()},
                 'reset_mechanism_under_verification': 'full process restart (sequelize.sync force on start, SUT05-EV-0003); stop/start reachability only, no business state established',
                 'checks': checks, 'verification_result': 'VERIFIED' if ok else 'NOT_VERIFIED',
                 'runner': {'os': os.environ.get('RUNNER_OS'), 'image': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'), 'arch': os.environ.get('RUNNER_ARCH')},
                 'tool_versions': {'node': subprocess.run(['node', '--version'], capture_output=True, text=True).stdout.strip(), 'npm': subprocess.run(['npm', '--version'], capture_output=True, text=True).stdout.strip()},
                 'github': {'run_id': '${{ github.run_id }}', 'run_attempt': '${{ github.run_attempt }}', 'job': '${{ github.job }}', 'repository_sha': '${{ github.sha }}', 'workflow_ref': '${{ github.workflow_ref }}'},
                 'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'timezone': 'UTC'}
          json.dump(rec, open('environment-verification.json', 'w'), indent=2); print(json.dumps(rec, indent=2)); assert ok
          PY
      - name: Collect the npm logs (diagnosis of a failed start)
        if: always()
        run: |
          mkdir -p npm-logs
          cp -p "$HOME"/.npm/_logs/*.log npm-logs/ 2>/dev/null || true
          ls -la npm-logs
      - name: Write a NOT_VERIFIED record when the verification step did not write one
        if: always()
        env:
          EV_SUT: SUT-05
          EV_SURFACES: API
          EV_CONDITIONS: E03-CS001-SUT05-API
          EV_ENVIRONMENT_TYPE: SELF_HOSTED
          EV_MECHANISM: "full process restart (sequelize.sync force on start, SUT05-EV-0003); stop/start reachability only, no business state established"
          EV_REPOSITORY: ${{ steps.pin.outputs.repo }}
          EV_COMMIT: ${{ steps.pin.outputs.sha }}
          EV_RELEASE: ${{ steps.pin.outputs.release }}
          EV_STEP_OUTCOMES: pin=${{ steps.pin.outcome }} clone=${{ steps.clone.outcome }} package=${{ steps.package.outcome }} provision=${{ steps.provision.outcome }} verify=${{ steps.verify.outcome }}
        run: |
          if [ -f environment-verification.json ]; then exit 0; fi
          python3 - <<'PY'
          import json, os, datetime
          e = os.environ
          unread = 'UNREAD (the pin step did not complete)'
          rec = {'record_class': e['RECORD_CLASS'], 'measured_experiment': False, 'study_id': 'EUS-2026-001', 'campaign_id': 'E03-resetability',
                 'sut_id': e['EV_SUT'], 'surfaces': e['EV_SURFACES'].split(), 'conditions_covered': e['EV_CONDITIONS'].split(), 'environment_type': e['EV_ENVIRONMENT_TYPE'],
                 'sut_provenance': {'repository': e.get('EV_REPOSITORY') or unread, 'commit_sha': e.get('EV_COMMIT') or unread, 'release': e.get('EV_RELEASE') or unread},
                 'reset_mechanism_under_verification': e['EV_MECHANISM'],
                 'step_outcomes': dict(kv.split('=', 1) for kv in e['EV_STEP_OUTCOMES'].split()),
                 'checks': {}, 'verification_result': 'NOT_VERIFIED',
                 'not_verified_reason': 'a provisioning or verification step did not complete (see step_outcomes); nothing was verified',
                 'runner': {'os': e.get('RUNNER_OS'), 'image': e.get('ImageOS'), 'image_version': e.get('ImageVersion'), 'arch': e.get('RUNNER_ARCH')},
                 'github': {'run_id': e.get('GITHUB_RUN_ID'), 'run_attempt': e.get('GITHUB_RUN_ATTEMPT'), 'job': e.get('GITHUB_JOB'), 'repository_sha': e.get('GITHUB_SHA'), 'workflow_ref': e.get('GITHUB_WORKFLOW_REF')},
                 'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'timezone': 'UTC'}
          json.dump(rec, open('environment-verification.json', 'w'), indent=2); print(json.dumps(rec, indent=2))
          PY
      - name: Replace runner host paths in the kept files by a neutral marker (publication hygiene at capture; smoke_scrub precedent)
        if: always()
        env:
          EV_KEPT: environment-verification.json release-commit.txt release-vs-pin-diff.txt package-provenance.json npm-logs version-1.json api-stdout-1.log api-stderr-1.log api-stdout-2.log api-stderr-2.log
        run: |
          python3 - <<'PY'
          import os, re
          prefixes = sorted({p for p in (os.environ.get('GITHUB_WORKSPACE'), os.environ.get('RUNNER_TEMP'), os.environ.get('HOME')) if p and len(p) > 1}, key=len, reverse=True)
          homes = re.compile(r'/(?:Users|home)/[A-Za-z0-9._-]+')
          paths = []
          for k in os.environ['EV_KEPT'].split():
              if os.path.isdir(k):
                  paths += [os.path.join(d, f) for d, _, fs in os.walk(k) for f in fs]
              elif os.path.isfile(k):
                  paths.append(k)
          changed = 0
          for p in sorted(paths):
              b = open(p, 'rb').read()
              if b'\0' in b[:8000]:
                  continue
              try:
                  t = b.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              n = t
              for pre in prefixes:
                  n = n.replace(pre, '<host-path>')
              n = homes.sub('<home>', n)
              if n != t:
                  open(p, 'w', encoding='utf-8', newline='').write(n)
                  changed += 1
          print(f'host paths replaced in {changed} of {len(paths)} kept file(s)')
          PY
      - name: Upload the ENVIRONMENT_VERIFICATION record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E03-ENVIRONMENT_VERIFICATION-SUT-05-api-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            environment-verification.json
            release-commit.txt
            release-vs-pin-diff.txt
            package-provenance.json
            npm-logs/
            version-1.json
            api-stdout-1.log
            api-stderr-1.log
            api-stdout-2.log
            api-stderr-2.log
          retention-days: 90
          if-no-files-found: error
