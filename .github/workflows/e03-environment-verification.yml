                 'github': {'run_id': e.get('GITHUB_RUN_ID'), 'run_attempt': e.get('GITHUB_RUN_ATTEMPT'), 'job': e.get('GITHUB_JOB'), 'repository_sha': e.get('GITHUB_SHA'), 'workflow_ref': e.get('GITHUB_WORKFLOW_REF')},
