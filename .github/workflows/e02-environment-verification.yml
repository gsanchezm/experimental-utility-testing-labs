# E02 Environment Verification
# Study EUS-2026-001 (Experimental Utility of Software-Testing Laboratory Ecosystems).
# Not a campaign configuration and not a dispatch authorization. Authored by ORCHESTRATOR under
# CAMPAIGN-CI-WRITE-AUTH-01 (the agent-instructions file, "Campaign CI/CD infrastructure for E02 and E04-E12").
#
# Verifies, per E02 condition id, that the controlled instance can be provisioned on the GitHub-hosted substrate and that
# every establishment step of the condition is reachable, by ONE DRY_RUN execution of the E02 executor. The
# DRY_RUN bundle is uploaded for review and is never imported into raw-data/ (ci-cd-execution-model convention: DRY_RUN is
# never a measured dataset). This verification is NOT a measured experiment and needs no campaign START: it precedes the START
# (human decision of 2026-11-06, manifests/campaign-execution-decisions-v3.yaml). Its gate requires governance v6 in force
# (FROZEN-PRE-DATA or AMENDED), the working copy of the executor prompt (prompts/working/<id>.md; a frozen copy, once the START
# has written it, must be byte-identical to the working copy), and the executor implementation hash that the dispatcher supplies.
# A frozen prompt is not required here: it is written once, at the START (prompts/README.md, rule 2), and the E03 verification
# workflow did not require it either (CI correction OP-CI-17).
#
# dry_run must be true: this workflow implements the DRY_RUN execution only (a verification without an execution is not implemented).
name: E02 Environment Verification

on:
  workflow_dispatch:
    inputs:
      condition_id:
        description: "E02 condition whose controlled instance and establishment steps are verified"
        required: true
        type: choice
        options:
          - E02-CS003-SUT01-API
          - E02-CS003-SUT01-WEB
          - E02-CS003-SUT02-WEB
          - E02-CS003-SUT03-WEB
          - E02-CS003-SUT04-API
          - E02-CS003-SUT04-WEB
          - E02-CS003-SUT05-API
          - E02-CS004-SUT01-WEB
          - E02-CS004-SUT02-WEB
          - E02-CS004-SUT03-WEB
      assigned_sut:
        description: "SUT of the condition (must match)"
        required: true
        type: choice
        options: [SUT-01, SUT-02, SUT-03, SUT-04, SUT-05]
      execution_id:
        description: "DRY_RUN execution id, format DRnnnn (for example DR0001)"
        required: true
        type: string
      executor_prompt_version:
        description: "Executor prompt version id recorded in the DRY_RUN manifest (file prompts/working/<id>.md must exist; a frozen copy, if present, must be byte-identical)"
        required: true
        type: string
      executor_implementation_sha256:
        description: "SHA-256 of experiments/E02-state-establishment/executor/run-condition.sh"
        required: true
        type: string
      dry_run:
        description: "Must be true: only the DRY_RUN execution is implemented in this workflow"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: e02-env-${{ inputs.condition_id }}
  cancel-in-progress: false

env:
  TZ: UTC
  RECORD_CLASS: DRY_RUN
  RUN_ID: ${{ inputs.condition_id }}__${{ inputs.execution_id }}__A1
  ARTIFACT_RETENTION_DAYS: "90"

jobs:
  gate:
    name: E02 Environment Verification Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      all_gates_passed: ${{ steps.gates.outputs.all_gates_passed }}
      governance_sha256: ${{ steps.gates.outputs.governance_sha256 }}
      workflow_sha256: ${{ steps.gates.outputs.workflow_sha256 }}
    steps:
      - name: Check out frozen inputs only (no raw-data of any SUT)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            protocol
            manifests
            experiments
            schemas
            prompts
            .github/workflows
          sparse-checkout-cone-mode: true
      - name: Refuse anything but a DRY_RUN on the default branch
        env:
          GUARD_REF: ${{ github.ref }}
          GUARD_RUN_ATTEMPT: ${{ github.run_attempt }}
          GUARD_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          test "$GUARD_REF" = "refs/heads/main" || { echo "verification runs only from refs/heads/main (got $GUARD_REF)"; exit 1; }
          test "$GUARD_RUN_ATTEMPT" = "1" || { echo "GitHub-native re-run refused"; exit 1; }
          test "$GUARD_DRY_RUN" = "true" || { echo "only the DRY_RUN execution is implemented in this workflow (dry_run must be true)"; exit 1; }
      - name: Verify the gates of the DRY_RUN verification (fail closed)
        id: gates
        env:
          GATE_CONDITION_ID: ${{ inputs.condition_id }}
          GATE_ASSIGNED_SUT: ${{ inputs.assigned_sut }}
          GATE_EXECUTION_ID: ${{ inputs.execution_id }}
          GATE_EXECUTOR_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
          GATE_EXECUTOR_IMPLEMENTATION_SHA256: ${{ inputs.executor_implementation_sha256 }}
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import hashlib, json, os, re, sys, yaml

          E02 = 'E02-state-establishment'
          cond = os.environ['GATE_CONDITION_ID']
          sut = os.environ['GATE_ASSIGNED_SUT']
          execution_id = os.environ['GATE_EXECUTION_ID']
          pv = os.environ['GATE_EXECUTOR_PROMPT_VERSION']
          impl_sha = os.environ['GATE_EXECUTOR_IMPLEMENTATION_SHA256']
          failures = []

          def gate(name, ok, detail=''):
              print(('PASS ' if ok else 'FAIL ') + name + ((': ' + str(detail)) if detail != '' else ''))
              if not ok:
                  failures.append(name)

          def sha(p):
              return hashlib.sha256(open(p, 'rb').read()).hexdigest() if os.path.isfile(p) else 'absent'

          def text(p):
              return open(p, encoding='utf-8').read() if os.path.isfile(p) else ''

          m = re.fullmatch(r'E02-(CS003|CS004)-(SUT0[1-5])-(WEB|API)', cond)
          gate('condition is one of the ten E02 conditions', m is not None, cond)
          gate('condition matches the assigned SUT', m is not None and ('SUT-' + m.group(2)[3:]) == sut, sut)
          gate('execution_id has the format DRnnnn', re.fullmatch(r'DR[0-9]{4}', execution_id) is not None, execution_id)
          gate('executor prompt version is a plain identifier', re.fullmatch(r'[A-Za-z0-9._-]+', pv) is not None, pv)
          wp, fp = f'prompts/working/{pv}.md', f'prompts/frozen/{pv}.md'
          pv_ok = re.fullmatch(r'[A-Za-z0-9._-]+', pv) is not None
          gate('executor prompt working copy exists (prompts/working/<version>.md)', pv_ok and os.path.isfile(wp), wp)
          gate('a frozen copy of the executor prompt, when present, is byte-identical to the working copy', pv_ok and (not os.path.isfile(fp) or sha(fp) == sha(wp)), fp)
          ip = f'experiments/{E02}/executor/run-condition.sh'
          gate('executor implementation hash equals the input', os.path.isfile(ip) and sha(ip) == impl_sha)
          gov = text('protocol/agent-governance-v6.md')
          gm = re.search(r'\| Protocol state \| ([A-Z-]+) \|', gov)
          state = gm.group(1) if gm else 'absent'
          gate('governance v6 is FROZEN-PRE-DATA or AMENDED (fails closed unless v6 is in force)', state in ('FROZEN-PRE-DATA', 'AMENDED'), state)
          gate('governance v6 contains Section 3.7 (G-E02-A; v6 Section 3.7)', re.search(r'^### 3\.7 Dispatch authorization', gov, re.M) is not None)
          out = {
              'all_gates_passed': 'true' if not failures else 'false',
              'governance_sha256': sha('protocol/agent-governance-v6.md'),
              'workflow_sha256': sha('.github/workflows/e02-environment-verification.yml'),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              for k, v in out.items():
                  f.write(f'{k}={v}\n')
          print(json.dumps(out, indent=2))
          if failures:
              print('GATES FAILED (' + str(len(failures)) + '): ' + '; '.join(failures))
              sys.exit(1)
          print('ALL GATES PASSED')
          PY

  verify:
    name: E02 Environment Verification ${{ inputs.condition_id }} ${{ inputs.execution_id }}
    needs: gate
    if: ${{ needs.gate.outputs.all_gates_passed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out common frozen inputs (no raw-data)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            protocol
            manifests
            experiments
            schemas
            prompts
          sparse-checkout-cone-mode: true
      - name: Write the provenance record of the verification (no secret values)
        env:
          PROV_CONDITION_ID: ${{ inputs.condition_id }}
          PROV_ASSIGNED_SUT: ${{ inputs.assigned_sut }}
          PROV_EXECUTION_ID: ${{ inputs.execution_id }}
          PROV_REPOSITORY_SHA: ${{ github.sha }}
          PROV_WORKFLOW_REF: ${{ github.workflow_ref }}
          PROV_GOVERNANCE_SHA256: ${{ needs.gate.outputs.governance_sha256 }}
          PROV_WORKFLOW_SHA256: ${{ needs.gate.outputs.workflow_sha256 }}
          PROV_EXECUTOR_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
          PROV_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          import yaml
          cond = os.environ['PROV_CONDITION_ID']
          sut = os.environ['PROV_ASSIGNED_SUT']
          surface = cond.split('-')[3].lower()
          sm = yaml.safe_load(open('manifests/sut-manifest.yaml'))['suts'][sut]['components'][surface]
          rec = {'record_class': 'DRY_RUN', 'study_id': 'EUS-2026-001', 'campaign_id': 'E02-state-establishment', 'condition_id': cond,
                 'sut_id': sut, 'surface': surface, 'execution_id': os.environ['PROV_EXECUTION_ID'], 'run_id': cond + '__' + os.environ['PROV_EXECUTION_ID'] + '__A1',
                 'repository': {'sha': os.environ['PROV_REPOSITORY_SHA'], 'workflow': os.environ['PROV_WORKFLOW_REF']},
                 'frozen_input_hashes': {'agent_governance_v6_sha256': os.environ['PROV_GOVERNANCE_SHA256'], 'workflow_sha256': os.environ['PROV_WORKFLOW_SHA256'],
                                         'executor_prompt_version': os.environ['PROV_EXECUTOR_PROMPT_VERSION']},
                 'sut_version': {'repository': sm.get('repository'), 'commit_sha': sm.get('commit_sha'), 'release': sm.get('release')},
                 'environment_type': 'SELF_HOSTED', 'github_run_id': os.environ['PROV_RUN_ID'], 'timezone': 'UTC',
                 'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'secrets': 'none used; none recorded',
                 'note': 'DRY_RUN bundle: reviewed by the ORCHESTRATOR, never imported into raw-data/'}
          with open('ci-provenance.json', 'w', encoding='utf-8') as f:
              json.dump(rec, f, indent=2)
          print(json.dumps(rec, indent=2))
          PY
      - name: Record the runtime environment
        run: |
          python3 - <<'PY'
          import json, os, platform, subprocess, datetime
          def v(cmd):
              try: return subprocess.run(cmd, capture_output=True, text=True, timeout=30).stdout.strip()
              except Exception as e: return f'unavailable: {e.__class__.__name__}'
          rec = {'runner': {'os': os.environ.get('RUNNER_OS'), 'image': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'), 'arch': os.environ.get('RUNNER_ARCH'), 'platform': platform.platform()},
                 'runtime_versions': {'python': v(['python3', '--version']), 'node': v(['node', '--version']), 'npm': v(['npm', '--version']), 'java': v(['java', '-version']) or v(['bash', '-c', 'java -version 2>&1']), 'docker': v(['docker', '--version']), 'git': v(['git', '--version'])},
                 'browser_version': {'chrome': v(['bash', '-c', 'google-chrome --version 2>/dev/null || chromium --version 2>/dev/null || echo unavailable'])},
                 'timezone': os.environ.get('TZ'), 'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          json.dump(rec, open('runtime-environment.json', 'w'), indent=2); print(json.dumps(rec, indent=2))
          PY
      # Provisioning of the SUT instances: the steps of the E02 measured-execution workflow (copied from the E03 measured-execution
      # job; the provisioning, the pins, and the instance interface are unchanged except for the E02 names and the SUT gates).
      - name: Read the pinned SUT-01 provenance
        if: ${{ inputs.assigned_sut == 'SUT-01' }}
        id: pin-sut01
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import yaml
          c = yaml.safe_load(open('manifests/sut-manifest.yaml'))['suts']['SUT-01']['components']['api']
          print(f"repo={c['repository']}"); print(f"sha={c['commit_sha']}")
          PY
      - name: Clone the pinned SUT source
        if: ${{ inputs.assigned_sut == 'SUT-01' }}
        id: clone-sut01
        run: |
          set -euo pipefail
          git clone --quiet "${{ steps.pin-sut01.outputs.repo }}" sut
          git -C sut checkout --quiet "${{ steps.pin-sut01.outputs.sha }}"
          test "$(git -C sut rev-parse HEAD)" = "${{ steps.pin-sut01.outputs.sha }}"
      - name: Set up Python (backend requires 3.11 or 3.12 per the SUT README)
        if: ${{ inputs.assigned_sut == 'SUT-01' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js and pnpm (frontend)
        if: ${{ inputs.assigned_sut == 'SUT-01' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Provision and start the api instance
        if: ${{ inputs.assigned_sut == 'SUT-01' }}
        id: api-sut01
        run: |
          set -euo pipefail
          cd sut/backend
          python -m pip install --quiet -r requirements.txt
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8000 > "$GITHUB_WORKSPACE/api-stdout.log" 2> "$GITHUB_WORKSPACE/api-stderr.log" &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/health
      - name: Provision, build, and serve the web instance
        if: ${{ inputs.assigned_sut == 'SUT-01' }}
        id: web-sut01
        run: |
          set -euo pipefail
          npm install -g pnpm@10 --no-audit --no-fund
          cd sut/frontend
          pnpm install --frozen-lockfile
          VITE_API_URL=http://127.0.0.1:8000 pnpm build
          nohup pnpm exec vite preview --host 127.0.0.1 --port 3000 --strictPort > "$GITHUB_WORKSPACE/web-stdout.log" 2> "$GITHUB_WORKSPACE/web-stderr.log" &
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
      # SUT-02 group (operation OP-CI-05): copied from job sut-02-web of e03-environment-verification.yml; ids suffixed -sut02; one guard line per step
      - name: Read the pinned SUT-02 web provenance
        if: ${{ inputs.assigned_sut == 'SUT-02' }}
        id: pin-sut02
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import yaml
          c = yaml.safe_load(open('manifests/sut-manifest.yaml'))['suts']['SUT-02']['components']['web']
          print(f"repo={c['repository']}"); print(f"sha={c['commit_sha']}")
          PY
      - name: Clone the pinned SUT source
        if: ${{ inputs.assigned_sut == 'SUT-02' }}
        id: clone-sut02
        run: |
          set -euo pipefail
          git clone --quiet "${{ steps.pin-sut02.outputs.repo }}" sut
          git -C sut checkout --quiet "${{ steps.pin-sut02.outputs.sha }}"
          test "$(git -C sut rev-parse HEAD)" = "${{ steps.pin-sut02.outputs.sha }}"
      - name: Set up Node.js (engines >=24.9.0 at the pinned commit)
        if: ${{ inputs.assigned_sut == 'SUT-02' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Provision, build, and serve the web instance
        if: ${{ inputs.assigned_sut == 'SUT-02' }}
        id: provision-sut02
        run: |
          set -euo pipefail
          cd sut
          npm ci --no-audit --no-fund
          npm run build
          nohup npx vite preview --host 127.0.0.1 --port 3000 --strictPort > "$GITHUB_WORKSPACE/web-stdout.log" 2> "$GITHUB_WORKSPACE/web-stderr.log" &
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
      # SUT-03 group (operation OP-CI-05): copied from job sut-03-web of e03-environment-verification.yml; ids suffixed -sut03; one guard line per step
      - name: Read the pinned SUT-03 provenance
        if: ${{ inputs.assigned_sut == 'SUT-03' }}
        id: pin-sut03
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import yaml
          c = yaml.safe_load(open('manifests/sut-manifest.yaml'))['suts']['SUT-03']['components']['web']
          print(f"repo={c['repository']}"); print(f"sha={c['commit_sha']}")
          PY
      - name: Clone the pinned SUT source
        if: ${{ inputs.assigned_sut == 'SUT-03' }}
        id: clone-sut03
        run: |
          set -euo pipefail
          git clone --quiet "${{ steps.pin-sut03.outputs.repo }}" sut
          git -C sut checkout --quiet "${{ steps.pin-sut03.outputs.sha }}"
          test "$(git -C sut rev-parse HEAD)" = "${{ steps.pin-sut03.outputs.sha }}"
      - name: Set up Node.js 14 (Next.js 10 era; the pinned tree has no lockfile and predates npm 7 peer-dependency enforcement)
        if: ${{ inputs.assigned_sut == 'SUT-03' }}
        uses: actions/setup-node@v4
        with:
          node-version: "14"
      - name: Provision, build, and serve the web instance
        if: ${{ inputs.assigned_sut == 'SUT-03' }}
        id: provision-sut03
        run: |
          set -euo pipefail
          cd sut
          npm install --legacy-peer-deps --no-audit --no-fund
          # node_modules/swagger-ui-react/swagger-ui.js at the pinned tree imports formdata-node without any package declaring it; v4 (CommonJS) is added without saving (no SUT source changes)
          npm install --no-save formdata-node@4 --no-audit --no-fund
          npm run build
          nohup npx next start -p 3000 > "$GITHUB_WORKSPACE/web-stdout.log" 2> "$GITHUB_WORKSPACE/web-stderr.log" &
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
      - name: Put Node.js 24 first on PATH again for the run-manifest validation (the SUT-03 instance keeps its own Node.js 14 process)
        if: ${{ inputs.assigned_sut == 'SUT-03' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      # SUT-04 group (operations OP-CI-05 and OP-CI-06): copied from job sut-04-web-api of e03-environment-verification.yml; ids suffixed -sut04; one guard line per step
      - name: Read the pinned SUT-04 provenance
        if: ${{ inputs.assigned_sut == 'SUT-04' }}
        id: pin-sut04
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import yaml
          c = yaml.safe_load(open('manifests/sut-manifest.yaml'))['suts']['SUT-04']['components']['api']
          print(f"repo={c['repository']}"); print(f"sha={c['commit_sha']}")
          PY
      - name: Clone the pinned SUT source
        if: ${{ inputs.assigned_sut == 'SUT-04' }}
        id: clone-sut04
        run: |
          set -euo pipefail
          git clone --quiet "${{ steps.pin-sut04.outputs.repo }}" sut
          git -C sut checkout --quiet "${{ steps.pin-sut04.outputs.sha }}"
          test "$(git -C sut rev-parse HEAD)" = "${{ steps.pin-sut04.outputs.sha }}"
      - name: Set up JDK 26 (the SUT README requires JDK 26 or higher; SUT04-PROV-0001 built with Temurin 26)
        if: ${{ inputs.assigned_sut == 'SUT-04' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
      - name: Set up Node.js 24.21.0 (the assets module's npm install and next build run inside the Maven build; the version of SUT04-PROV-0001)
        if: ${{ inputs.assigned_sut == 'SUT-04' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Install Apache Maven 3.9.14 (the version the SUT's README lists at the pinned commit), verified by its published SHA-512
        if: ${{ inputs.assigned_sut == 'SUT-04' }}
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --retry 3 --output "$RUNNER_TEMP/apache-maven-3.9.14-bin.tar.gz" https://archive.apache.org/dist/maven/maven-3/3.9.14/binaries/apache-maven-3.9.14-bin.tar.gz
          expected=d50af8ab5e6005b46a07f0ce9d3719e67cfdf898da988a84871304cd59fb1af0fef2f99dea709e6e66f21f732f905979b5c2dce6b6860406f60a70e84d9cf0b8
          found="$(sha512sum "$RUNNER_TEMP/apache-maven-3.9.14-bin.tar.gz" | cut -d ' ' -f 1)"
          [ "$found" = "$expected" ] || { echo "SHA-512 mismatch: expected $expected, found $found" >&2; exit 1; }
          tar -xzf "$RUNNER_TEMP/apache-maven-3.9.14-bin.tar.gz" -C "$RUNNER_TEMP"
          if [ ! -f "$RUNNER_TEMP/apache-maven-3.9.14/bin/mvn" ] || [ ! -x "$RUNNER_TEMP/apache-maven-3.9.14/bin/mvn" ]; then echo "not an executable file: $RUNNER_TEMP/apache-maven-3.9.14/bin/mvn" >&2; exit 1; fi
          echo "$RUNNER_TEMP/apache-maven-3.9.14/bin" >> "$GITHUB_PATH"
      - name: Build the service jars with Maven 3.9.14 (the documented build, tests skipped as in SUT04-PROV-0001)
        if: ${{ inputs.assigned_sut == 'SUT-04' }}
        id: build-sut04
        run: |
          set -euo pipefail
          java -version 2>&1 | tee "$GITHUB_WORKSPACE/java-version.txt"
          mvn -v | tee "$GITHUB_WORKSPACE/maven-version.txt"
          [[ "$(head -n 1 "$GITHUB_WORKSPACE/maven-version.txt")" == "Apache Maven 3.9.14 "* ]] || { echo "maven-version.txt does not start with Apache Maven 3.9.14: $(head -n 1 "$GITHUB_WORKSPACE/maven-version.txt")" >&2; exit 1; }
          [ "$(command -v mvn)" = "$RUNNER_TEMP/apache-maven-3.9.14/bin/mvn" ] || { echo "mvn resolves to $(command -v mvn), not $RUNNER_TEMP/apache-maven-3.9.14/bin/mvn" >&2; exit 1; }
          node --version | tee "$GITHUB_WORKSPACE/node-version.txt"
          npm --version | tee "$GITHUB_WORKSPACE/npm-version.txt"
          cd sut
          mvn -B -q clean install -DskipTests
          shopt -s nullglob
          jars=(./*/target/*-exec.jar)
          shopt -u nullglob
          [ "${#jars[@]}" -gt 0 ] || { echo "no service exec jar was built under */target/" >&2; exit 1; }
          printf '%s\n' "${jars[@]}" | tee "$GITHUB_WORKSPACE/built-jars.txt"
          test -f assets/.next/BUILD_ID
      - name: Start the six services and the web app on the host by the route of the SUT's README (each in its own session and process group; fail closed)
        if: ${{ inputs.assigned_sut == 'SUT-04' }}
        id: provision-sut04
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os, subprocess, sys, time, urllib.request
          ws = os.environ['GITHUB_WORKSPACE']
          root = os.path.join(ws, 'sut')
          # The route of the SUT's README, decided by the human research lead on 2026-10-06 with the web app's production server
          # (operation OP-PREP-E03-ADD-02): its run_locally.sh at the pinned commit, with npm start (next start -p 3003) in place
          # of npm run dev and each service's -exec jar named in place of the script's jar glob; the six Spring services run with
          # the dev profile from the clone's root, and the web app on the .next directory of the Maven build. The
          # docker-compose.yml of the pinned commit is not used: its image fixes the web app's rewrite destinations at build to
          # the container's own loopback (operation OP-PREP-E03-ADD-01). The rewrite destinations of this build are the local
          # defaults, so no *_API, *Domain, dbRefresh, or dbServer variable may be set. Maven is pinned to 3.9.14, the version the
          # SUT's README lists at the pinned commit, because the runner image's Maven 3.10.0 refuses the pinned POM version (run
          # 38018788066; operation OP-CI-07).
          bad = sorted(k for k in os.environ if k.endswith('_API') or k.endswith('Domain') or k in ('dbRefresh', 'dbServer'))
          if bad:
              sys.exit(f'SUT configuration variable(s) present in the environment: {bad}')
          services = [('auth', 3004), ('booking', 3000), ('room', 3001), ('report', 3005), ('branding', 3002), ('message', 3006)]
          started, procs = [], []
          def start(name, argv, cwd, port, ready_url):
              log = f'sut04-{name}.log'
              p = subprocess.Popen(argv, cwd=cwd, stdin=subprocess.DEVNULL, stdout=open(f'{ws}/{log}', 'w'), stderr=subprocess.STDOUT, start_new_session=True)
              if os.getpgid(p.pid) != p.pid:
                  sys.exit(f'{name}: process group {os.getpgid(p.pid)} is not the new session leader {p.pid}')
              procs.append((name, p))
              started.append({'name': name, 'argv': argv, 'cwd': os.path.relpath(cwd, ws), 'pid': p.pid, 'pgid': p.pid, 'log': log, 'port': port, 'ready_url': ready_url})
          for name, port in services:
              jars = sorted(glob.glob(os.path.join(root, name, 'target', f'restful-booker-platform-{name}-*-exec.jar')))
              if len(jars) != 1:
                  sys.exit(f'{name}: expected exactly one -exec jar under {name}/target, found {len(jars)}')
              start(name, ['java', '-jar', '-Dspring.profiles.active=dev', os.path.relpath(jars[0], root)], root, port, f'http://127.0.0.1:{port}/{name}/actuator/health')
          start('web', ['npm', 'start'], os.path.join(root, 'assets'), 3003, 'http://127.0.0.1:3003/')
          # Readiness: every service's actuator health and the web root answer 200 within one bound (workstation route: 46-155 s,
          # operation OP-PREP-E03-ADD-02); a process that exits, or the bound, fails this step and the record is NOT_VERIFIED.
          bound_s, t0, ready = 300, time.monotonic(), {}
          pending = {s['name']: s['ready_url'] for s in started}
          while pending:
              for name, p in procs:
                  if p.poll() is not None:
                      sys.exit(f'{name} exited early with code {p.returncode} (sut04-{name}.log)')
              for name, url in list(pending.items()):
                  try:
                      with urllib.request.urlopen(url, timeout=5) as r:
                          if r.status == 200:
                              ready[name] = round(time.monotonic() - t0, 1)
                              del pending[name]
                  except Exception:
                      pass
              if pending:
                  if time.monotonic() - t0 >= bound_s:
                      sys.exit(f'not ready within {bound_s} s: {sorted(pending)} (ready: {ready})')
                  time.sleep(3)
          rec = {'route': "the route of the SUT's README (run_locally.sh at the pinned commit, with npm start in place of npm run dev and each service's -exec jar in place of the script's jar glob; human decision of 2026-10-06)",
                 'processes': started, 'readiness_s': ready, 'readiness_bound_s': bound_s}
          json.dump(rec, open(f'{ws}/sut04-start.json', 'w'), indent=2)
          print(json.dumps(rec, indent=2))
          PY
      # SUT-05 group (operation OP-CI-05): copied from job sut-05-api of e03-environment-verification.yml; ids suffixed -sut05; one guard line per step
      - name: Read the pinned SUT-05 provenance (source commit and release)
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        id: pin-sut05
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import yaml
          c = yaml.safe_load(open('manifests/sut-manifest.yaml'))['suts']['SUT-05']['components']['api']
          for k in ('repository', 'commit_sha', 'release'):
              assert c.get(k), f'empty pin field: {k}'
          print(f"repo={c['repository']}"); print(f"sha={c['commit_sha']}"); print(f"release={c['release']}")
          PY
      - name: Clone the pinned SUT source and relate the release tag to the pinned commit (fail closed)
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        id: clone-sut05
        run: |
          set -euo pipefail
          git clone --quiet "${{ steps.pin-sut05.outputs.repo }}" sut
          git -C sut checkout --quiet "${{ steps.pin-sut05.outputs.sha }}"
          test "$(git -C sut rev-parse HEAD)" = "${{ steps.pin-sut05.outputs.sha }}"
          # The packaged distribution below is built by the SUT project from the release tag's commit. The pinned source commit
          # (the default-branch HEAD at pin time) differs from it only by one documented non-application file; any other
          # difference fails this step, and the record then says nothing about the reset mechanism (correction of 2026-10-04:
          # the SUT's own source build at the pinned commit no longer completes because an unpinned build-tool dependency of the
          # SUT changed upstream after 2026-09-22; the SUT is never patched).
          git -C sut rev-parse "${{ steps.pin-sut05.outputs.release }}^{commit}" | tee "$GITHUB_WORKSPACE/release-commit.txt"
          git -C sut diff --name-only "$(cat "$GITHUB_WORKSPACE/release-commit.txt")" "${{ steps.pin-sut05.outputs.sha }}" | tee "$GITHUB_WORKSPACE/release-vs-pin-diff.txt"
          test "$(cat "$GITHUB_WORKSPACE/release-vs-pin-diff.txt")" = "screenshots/bundle-analysis.png"
      - name: Set up Node.js 24.21.0 (the Node.js major the packaged distribution is bound to; the version of SUT05-PROV-0001)
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Download, verify, and unpack the packaged distribution of the pinned release (the SUT README's Packaged Distributions route)
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        id: package-sut05
        env:
          GH_TOKEN: ${{ github.token }}
          EV_REPO: ${{ steps.pin-sut05.outputs.repo }}
          EV_RELEASE: ${{ steps.pin-sut05.outputs.release }}
        run: |
          set -euo pipefail
          ASSET="juice-shop-${EV_RELEASE#v}_node24_linux_x64.tgz"
          gh release download "$EV_RELEASE" --repo "$EV_REPO" --pattern "$ASSET" --clobber
          SUM="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          DIGEST="$(gh release view "$EV_RELEASE" --repo "$EV_REPO" --json assets --jq ".assets[] | select(.name == \"$ASSET\") | .digest")"
          test -n "$DIGEST"
          test "sha256:$SUM" = "$DIGEST"
          mkdir -p pkg
          tar -xzf "$ASSET" -C pkg
          set -- pkg/*/
          test "$#" -eq 1
          PKG_DIR="${1%/}"
          test -f "$PKG_DIR/package.json"
          test -f "$PKG_DIR/build/app.js"
          echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
          python3 - "$ASSET" "$SUM" "$DIGEST" "$PKG_DIR" <<'PY'
          import json, sys
          asset, digest_sha256, github_digest, pkg_dir = sys.argv[1:5]
          p = json.load(open(pkg_dir + '/package.json'))
          rec = {'route': 'PACKAGED_DISTRIBUTION (SUT README, Packaged Distributions: download the release archive, unpack, npm start)',
                 'asset': asset, 'sha256': digest_sha256, 'github_digest': github_digest, 'unpacked_dir': pkg_dir,
                 'package_json': {k: p.get(k) for k in ('name', 'version', 'engines', 'os', 'cpu')}, 'start_script': (p.get('scripts') or {}).get('start')}
          json.dump(rec, open('package-provenance.json', 'w'), indent=2); print(json.dumps(rec, indent=2))
          PY
      - name: Start the api instance from the packaged distribution in its own session and process group (npm start, the documented route)
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        id: provision-sut05
        env:
          SUT_DIR: ${{ steps.package-sut05.outputs.dir }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess, sys, time, urllib.request
          ws = os.environ['GITHUB_WORKSPACE']
          # The instance starts in a new session (setsid(2), via start_new_session): npm, the shell it spawns, and the node process that
          # serves port 3000 then share one process group, which the verification step stops as a whole. Run 37265782721 had signaled
          # only the npm process and its direct children, and the API kept answering (correction of 2026-10-05, operation OP-CI-02).
          p = subprocess.Popen(['npm', 'start'], cwd=os.environ['SUT_DIR'], stdin=subprocess.DEVNULL,
                               stdout=open(f'{ws}/api-stdout-1.log', 'w'), stderr=open(f'{ws}/api-stderr-1.log', 'w'), start_new_session=True)
          pgid = os.getpgid(p.pid)
          assert pgid == p.pid, (p.pid, pgid)
          open(f'{ws}/pid1.txt', 'w').write(f'{p.pid}\n')
          open(f'{ws}/pgid1.txt', 'w').write(f'{pgid}\n')
          body = None
          for _ in range(90):
              if p.poll() is not None:
                  sys.exit(f'npm start exited early with code {p.returncode} (api-stderr-1.log)')
              try:
                  with urllib.request.urlopen('http://127.0.0.1:3000/rest/admin/application-version', timeout=20) as r:
                      if r.status == 200:
                          body = r.read()
                          break
              except Exception:
                  pass
              time.sleep(3)
          if body is None:
              sys.exit('the api did not answer GET /rest/admin/application-version with 200 within the readiness window')
          open(f'{ws}/version-1.json', 'wb').write(body)
          print(f'started: pid {p.pid}, process group {pgid}; version response {body.decode("utf-8", "replace")}')
          PY
