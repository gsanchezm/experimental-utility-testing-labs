      - name: Write the instance interface instance.json for SUT-05 (experiments/E02-state-establishment/executor/README.md, section 6)
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        env:
          E02_INSTANCE_REPOSITORY: ${{ steps.pin-sut05.outputs.repo }}
          E02_INSTANCE_COMMIT: ${{ steps.pin-sut05.outputs.sha }}
          E02_INSTANCE_RELEASE: ${{ steps.pin-sut05.outputs.release }}
          E02_INSTANCE_PACKAGE_DIR: ${{ steps.package-sut05.outputs.dir }}
          E02_INSTANCE_START: "1"
        run: |
          python3 - <<'PY'
          import json, os, sys
          e = os.environ
          ws = e['GITHUB_WORKSPACE']
          n = e['E02_INSTANCE_START']
          assert n in ('1', '2'), f'E02_INSTANCE_START {n!r} (expected 1 or 2)'
          pid_f, pgid_f = f'{ws}/pid{n}.txt', f'{ws}/pgid{n}.txt'
          missing = [os.path.basename(p) for p in (pid_f, pgid_f) if not os.path.isfile(p)]
          if missing:
              sys.exit(f'SUT-05 instance start {n}: {", ".join(missing)} absent; instance.json is not written and the executor is not called')
          pid, pgid = int(open(pid_f).read().strip()), int(open(pgid_f).read().strip())
          pkg = json.load(open(f'{ws}/package-provenance.json'))
          pkg_dir = e['E02_INSTANCE_PACKAGE_DIR']
          out_log, err_log = f'{ws}/api-stdout-{n}.log', f'{ws}/api-stderr-{n}.log'
          inst = {
              'interface_version': 1,
              'sut_id': 'SUT-05',
              'record_class': e['RECORD_CLASS'],
              'surfaces': {'web': None, 'api': {'base_url': 'http://127.0.0.1:3000'}, 'auth': None},
              'provisioning': {'route': 'GitHub-hosted runner instance provisioned in this job by the steps of job sut-05-api of .github/workflows/e03-environment-verification.yml: clone of the pinned commit related to the release tag; Node.js 24.21.0 (setup-node); release archive verified against its GitHub digest and unpacked; npm start in its own session and process group; route recorded by the package step: ' + pkg['route'],
                               'repository': e['E02_INSTANCE_REPOSITORY'], 'commit_sha': e['E02_INSTANCE_COMMIT'], 'release': e['E02_INSTANCE_RELEASE'],
                               'asset': {'name': pkg['asset'], 'sha256': pkg['sha256']},
                               'commands': ['ASSET="juice-shop-${EV_RELEASE#v}_node24_linux_x64.tgz"', 'gh release download "$EV_RELEASE" --repo "$EV_REPO" --pattern "$ASSET" --clobber', 'SUM="$(sha256sum "$ASSET" | cut -d\' \' -f1)"', 'DIGEST="$(gh release view "$EV_RELEASE" --repo "$EV_REPO" --json assets --jq ".assets[] | select(.name == \\"$ASSET\\") | .digest")"', 'test -n "$DIGEST"', 'test "sha256:$SUM" = "$DIGEST"', 'mkdir -p pkg', 'tar -xzf "$ASSET" -C pkg', 'set -- pkg/*/', 'test "$#" -eq 1', 'PKG_DIR="${1%/}"', 'test -f "$PKG_DIR/package.json"', 'test -f "$PKG_DIR/build/app.js"', 'echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"', 'python3 - "$ASSET" "$SUM" "$DIGEST" "$PKG_DIR" <<\'PY\'', 'npm start'],
                               'provisioning_record': None},
              'process': {'pgid': pgid, 'pid': pid, 'start_command': ['npm', 'start'], 'cwd': os.path.abspath(pkg_dir), 'env': {'SUT_DIR': pkg_dir},
                          'stdout_log': out_log, 'stderr_log': err_log, 'port': 3000, 'readiness_url': '/rest/admin/application-version',
                          'readiness_timeout_s': 180, 'stop_timeout_s': 30},
              'logs': [out_log, err_log],
          }
          need = [('repository', inst['provisioning']['repository']), ('commit_sha', inst['provisioning']['commit_sha']), ('release', inst['provisioning']['release']), ('asset.sha256', pkg['sha256'])]
          assert all(v for _, v in need), f'empty provisioning field(s): {[k for k, v in need if not v]}'
          text = json.dumps(inst, indent=2) + '\n'
          assert json.loads(text) == inst and json.loads(text)['interface_version'] == 1
          with open('instance.json', 'w', encoding='utf-8') as f:
              f.write(text)
          print(text)
          PY
      - name: Execute the condition through the frozen executor implementation
        env:
          CONDITION_ID: ${{ inputs.condition_id }}
          ASSIGNED_SUT: ${{ inputs.assigned_sut }}
          EXECUTION_ID: ${{ inputs.execution_id }}
          ATTEMPT: 1
          EXECUTOR_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
          EXPECTED_IMPLEMENTATION_SHA256: ${{ inputs.executor_implementation_sha256 }}
          OUTPUT_DIR: e02-dry-run/${{ inputs.assigned_sut }}/${{ inputs.condition_id }}__${{ inputs.execution_id }}__A1
          PROVENANCE_JSON: ci-provenance.json
          RUNTIME_ENVIRONMENT_JSON: runtime-environment.json
          INSTANCE_JSON: instance.json
        run: |
          set -euo pipefail
          test "$(sha256sum experiments/E02-state-establishment/executor/run-condition.sh | cut -c1-64)" = "$EXPECTED_IMPLEMENTATION_SHA256"
          mkdir -p "$OUTPUT_DIR"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$OUTPUT_DIR/started-at.txt"
          set +e
          bash experiments/E02-state-establishment/executor/run-condition.sh > "$OUTPUT_DIR/stdout.log" 2> "$OUTPUT_DIR/stderr.log"
          echo $? > "$OUTPUT_DIR/exit-status.txt"
          set -e
          date -u +%Y-%m-%dT%H:%M:%SZ > "$OUTPUT_DIR/finished-at.txt"
          cp ci-provenance.json runtime-environment.json "$OUTPUT_DIR/"
          echo "executor exit status: $(cat "$OUTPUT_DIR/exit-status.txt")"
      - name: Validate the run manifest against schema v2 and the E02 campaign convention
        env:
          OUTPUT_DIR: e02-dry-run/${{ inputs.assigned_sut }}/${{ inputs.condition_id }}__${{ inputs.execution_id }}__A1
          EXPECTED_SUT: ${{ inputs.assigned_sut }}
          EXPECTED_CONDITION: ${{ inputs.condition_id }}
          EXPECTED_ATTEMPT: 1
          EXPECTED_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
        run: |
          set -euo pipefail
          test -f "$OUTPUT_DIR/run-manifest.json" || { echo "run-manifest.json missing: the attempt is recorded as ERROR-without-manifest and is not attributable"; exit 1; }
          npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate -s schemas/run-manifest.schema.v2.json --spec=draft2020 --allow-union-types -c ajv-formats -d "$OUTPUT_DIR/run-manifest.json"
          python3 - <<'PY'
          import json, os
          d = os.environ['OUTPUT_DIR']
          m = json.load(open(os.path.join(d, 'run-manifest.json')))
          assert m['campaign_id'] == 'E02-state-establishment' and m['sut_id'] == os.environ['EXPECTED_SUT']
          assert m['run_id'] == os.path.basename(d), (m['run_id'], d)
          assert m['condition'] == os.environ['EXPECTED_CONDITION'] and m['scenario'] in ('CS-003', 'CS-004')
          assert int(m['attempt']) == int(os.environ['EXPECTED_ATTEMPT'])
          assert m.get('establishment_mechanisms'), 'establishment_mechanisms mandatory and non-empty for E02'
          assert m.get('reset_mechanisms') is None, 'reset_mechanisms is not applicable on the establish side (between-run reset is provisioning)'
          acts = m.get('actions') or []
          assert acts or m['outcome']['status'] in ('ABORTED', 'ERROR'), 'actions mandatory unless the run stopped before its first counted action'
          assert all('outcome' in a for a in acts), 'E02 campaign convention: every action record carries outcome'
          assert m.get('prompt_version') == os.environ['EXPECTED_PROMPT_VERSION']
          print('run manifest ok:', m['run_id'], 'counted actions:', len(acts), 'outcomes:', [a['outcome'] for a in acts], 'status:', m['outcome']['status'])
          PY
      - name: Replace runner host paths and private network addresses in the bundle's stdout.log and stderr.log by neutral markers (publication hygiene at capture)
        if: always()
        env:
          EV_KEPT: e02-dry-run/${{ inputs.assigned_sut }}/${{ inputs.condition_id }}__${{ inputs.execution_id }}__A1/stdout.log e02-dry-run/${{ inputs.assigned_sut }}/${{ inputs.condition_id }}__${{ inputs.execution_id }}__A1/stderr.log
        run: |
          python3 - <<'PY'
          import os, re
          prefixes = sorted({p for p in (os.environ.get('GITHUB_WORKSPACE'), os.environ.get('RUNNER_TEMP'), os.environ.get('HOME')) if p and len(p) > 1}, key=len, reverse=True)
          homes = re.compile(r'/(?:Users|home)/[A-Za-z0-9._-]+')
          private = re.compile(r'\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b')
          paths = []
          for k in os.environ['EV_KEPT'].split():
              if os.path.isdir(k):
                  paths += [os.path.join(d, f) for d, _, fs in os.walk(k) for f in fs]
              elif os.path.isfile(k):
                  paths.append(k)
          changed = 0
          for p in sorted(paths):
              b = open(p, 'rb').read()
              if b'\0' in b[:8000]:
                  continue
              try:
                  t = b.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              n = t
              for pre in prefixes:
                  n = n.replace(pre, '<host-path>')
              n = homes.sub('<home>', n)
              n = private.sub('<private-address>', n)
              if n != t:
                  open(p, 'w', encoding='utf-8', newline='').write(n)
                  changed += 1
          print(f'host paths and private network addresses replaced in {changed} of {len(paths)} kept file(s)')
          PY
      - name: Upload the DRY_RUN bundle (reviewed, never imported)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E02-DRY_RUN-${{ inputs.condition_id }}-${{ inputs.execution_id }}-A1
          path: e02-dry-run/${{ inputs.assigned_sut }}/${{ inputs.condition_id }}__${{ inputs.execution_id }}__A1
          retention-days: 90
          overwrite: false
          if-no-files-found: error
