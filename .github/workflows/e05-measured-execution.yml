# E05 Measured Execution -- DRAFT (operation OP-PREP-E05). Not frozen, not locked, not dispatched.
# Study EUS-2026-001 (Experimental Utility of Software-Testing Laboratory Ecosystems).
# Authored by the ORCHESTRATOR under CAMPAIGN-CI-WRITE-AUTH-01 (the agent-instructions file, "Campaign CI/CD infrastructure
# for E02 and E04-E12"), for E05-determinism only.
#
# The ONLY path through which an E05-determinism MEASURED_EXPERIMENT may run. It is dispatched by the ORCHESTRATOR within a dispatch
# authorization of the human research lead, per SUT (protocol/agent-governance-v6.md, Section 3.7). One dispatch runs one condition:
# its fifty executions EX0001 to EX0050, sequentially, on one shared instance (decision D-02, model B). It FAILS CLOSED: the gate job
# verifies every frozen input and campaign gate against the checked-out repository before the measured job may start. As of its creation
# E05 is NOT_STARTED, has no START record, no locked configuration, no dispatch authorization, no controlled-instance verification, and no
# frozen dispatch prompt, so this workflow cannot execute a measured condition. That is the intended state.
#
# Attempt model: one dispatch, one job, fifty executions. The first attempt only; GitHub-native re-runs are refused (github.run_attempt
# must be 1); no input admits a further attempt (a further attempt would need its own explicit approval, which this workflow has no
# field for). The artifact is uploaded with overwrite disabled. Nothing is committed by this workflow (permissions: contents: read); the
# artifact is imported under ORCHESTRATOR coordination with digest verification.
#
# Read isolation: the measured job checks out the common frozen inputs and the assigned SUT's own raw-data subtree only.
#
# Inputs reach every script through the environment of its step (env:), never through an expression inside the script text, so no run
# script carries an expression (the GitHub limit of 21000 characters applies to strings that carry expressions; OP-CI-15 pattern).
#
# The provisioning steps of each SUT group carry the same names and the same run text as in e05-environment-verification.yml; tests in
# experiments/E05-determinism/executor/tests/test_workflows.py enforce this.
#
# Publication hygiene: stdout.log and stderr.log at the artifact root have runner host paths and private network addresses replaced by
# neutral markers before upload. The bundle files are not edited: the executor records their digests and scrubs its own evidence.
name: E05 Measured Execution

on:
  workflow_dispatch:
    inputs:
      condition_id:
        description: "Condition to execute (one of the fourteen E05 conditions of the conditions file; its fifty executions run in this job)"
        required: true
        type: choice
        options:
          - E05-SUT01-API-01
          - E05-SUT01-API-02
          - E05-SUT01-API-03
          - E05-SUT01-API-04
          - E05-SUT01-API-05
          - E05-SUT01-API-06
          - E05-SUT01-WEB-01
          - E05-SUT02-WEB-01
          - E05-SUT02-WEB-02
          - E05-SUT04-WEB-01
          - E05-SUT04-API-01
          - E05-SUT04-API-02
          - E05-SUT05-API-01
          - E05-SUT05-API-02
      assigned_sut:
        description: "SUT assigned to this dispatch (the SUT of the condition; the dispatch authorization is per SUT)"
        required: true
        type: choice
        options: [SUT-01, SUT-02, SUT-04, SUT-05]
      campaign_start_authorization_id:
        description: "Human authorization id of the E05 campaign START (must appear in the protocol/CHANGELOG.md NOT_STARTED -> IN_PROGRESS row)"
        required: true
        type: string
      dispatch_authorization_id:
        description: "Dispatch authorization id of the human research lead for this SUT (manifests/e05-dispatch-authorization-sut0N-v1.yaml)"
        required: true
        type: string
      executor_prompt_version:
        description: "Frozen dispatch-procedure prompt version id (file prompts/frozen/<id>.md must exist; a run needs a non-null prompt_version)"
        required: true
        type: string
      executor_implementation_sha256:
        description: "SHA-256 of experiments/E05-determinism/executor/run-condition.sh as recorded in the locked configuration and the dispatch authorization"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e05-measured-${{ inputs.condition_id }}
  cancel-in-progress: false

env:
  TZ: UTC
  RECORD_CLASS: MEASURED_EXPERIMENT
  ARTIFACT_RETENTION_DAYS: "90"
  EXPECTED_EXECUTIONS: "50"
  TIMEOUT_POLICY: "job timeout-minutes as declared (330, provisional; see the measured-execution job); no step retry; no automatic re-run"
  RETRY_POLICY: "none: one job per dispatch; a further attempt needs its own explicit approval; github.run_attempt must be 1"
  CONCURRENCY_POLICY: "one run per condition at a time; never cancel in progress"

jobs:
  gate:
    name: E05 Measured Execution Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      all_gates_passed: ${{ steps.gates.outputs.all_gates_passed }}
      configuration_sha256: ${{ steps.gates.outputs.configuration_sha256 }}
      schema_v2_sha256: ${{ steps.gates.outputs.schema_v2_sha256 }}
      executor_prompt_sha256: ${{ steps.gates.outputs.executor_prompt_sha256 }}
      governance_sha256: ${{ steps.gates.outputs.governance_sha256 }}
      workflow_sha256: ${{ steps.gates.outputs.workflow_sha256 }}
      dispatch_authorization_sha256: ${{ steps.gates.outputs.dispatch_authorization_sha256 }}
      environment_type: ${{ steps.gates.outputs.environment_type }}
      canonical_source_commit: ${{ steps.gates.outputs.canonical_source_commit }}
    steps:
      - name: Check out frozen inputs only (no raw-data of any SUT)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            protocol
            manifests
            experiments
            schemas
            prompts
            .github/workflows
          sparse-checkout-cone-mode: true
      - name: Refuse anything but a first attempt of a dispatch on the default branch
        env:
          GUARD_REF: ${{ github.ref }}
          GUARD_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$GUARD_REF" = "refs/heads/main" || { echo "measured execution runs only from refs/heads/main (got $GUARD_REF)"; exit 1; }
          test "$GUARD_RUN_ATTEMPT" = "1" || { echo "GitHub-native re-run refused: a further attempt needs its own explicit approval"; exit 1; }
      - name: Verify every campaign gate against the repository (fail closed)
        id: gates
        env:
          GATE_CONDITION_ID: ${{ inputs.condition_id }}
          GATE_ASSIGNED_SUT: ${{ inputs.assigned_sut }}
          GATE_CAMPAIGN_START_AUTHORIZATION_ID: ${{ inputs.campaign_start_authorization_id }}
          GATE_DISPATCH_AUTHORIZATION_ID: ${{ inputs.dispatch_authorization_id }}
          GATE_EXECUTOR_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
          GATE_EXECUTOR_IMPLEMENTATION_SHA256: ${{ inputs.executor_implementation_sha256 }}
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, hashlib, json, os, re, sys, yaml

          # Record names of this gate. The START record, the dispatch authorization and the controlled-instance status are proposed
          # names for E05 (the E09 names with e05 in place of e09); a name that the configuration lock decides differently is changed here.
          CAMPAIGN = 'E05-determinism'
          README = 'experiments/E05-determinism/README.md'
          CONDITIONS = 'experiments/E05-determinism/conditions-draft.json'
          CONTROLLED = 'experiments/E05-determinism/controlled-instance-status.yaml'
          START_RECORD = 'manifests/e05-campaign-start-v1.yaml'
          IMPL = 'experiments/E05-determinism/executor/run-condition.sh'
          GOV = 'protocol/agent-governance-v6.md'
          SCHEMA = 'schemas/run-manifest.schema.v2.json'
          MAPPING = 'experiments/scenario-mappings/CS-001.yaml'
          SUT_MANIFEST = 'manifests/sut-manifest.yaml'
          STUDY = 'manifests/study-manifest.yaml'
          CHANGELOG = 'protocol/CHANGELOG.md'
          MEASURED = '.github/workflows/e05-measured-execution.yml'
          # The components whose pinned commit the configuration must name: the components of the surfaces the E05 conditions use.
          SUTS = {'SUT-01': ('api', 'web'), 'SUT-02': ('web',), 'SUT-04': ('api', 'web'), 'SUT-05': ('api',)}
          SUT_TAGS = {'SUT-01': 'sut01', 'SUT-02': 'sut02', 'SUT-04': 'sut04', 'SUT-05': 'sut05'}

          cond = os.environ['GATE_CONDITION_ID']
          sut = os.environ['GATE_ASSIGNED_SUT']
          auth = os.environ['GATE_CAMPAIGN_START_AUTHORIZATION_ID']
          dauth = os.environ['GATE_DISPATCH_AUTHORIZATION_ID']
          pv = os.environ['GATE_EXECUTOR_PROMPT_VERSION']
          impl = os.environ['GATE_EXECUTOR_IMPLEMENTATION_SHA256']
          failures = []

          def gate(name, ok, detail=''):
              print(('PASS ' if ok else 'FAIL ') + name + ((': ' + str(detail)) if detail != '' else ''))
              if not ok:
                  failures.append(name)

          def sha(p):
              return hashlib.sha256(open(p, 'rb').read()).hexdigest() if os.path.isfile(p) else 'absent'

          def load(p):
              try:
                  return yaml.safe_load(open(p, encoding='utf-8')) or {}
              except Exception:
                  return {}

          def text(p):
              return open(p, encoding='utf-8').read() if os.path.isfile(p) else ''

          # G-A: the inputs are self-consistent with the conditions file
          conds = {c.get('condition_id'): c for c in (load(CONDITIONS).get('conditions') or []) if isinstance(c, dict)}
          c = conds.get(cond) or {}
          gate('condition is one of the fourteen E05 conditions of the conditions file', cond in conds, cond)
          gate('assigned SUT is one of the four SUTs of E05', sut in SUTS, sut)
          gate('condition belongs to the assigned SUT', sut in SUTS and c.get('sut_id') == sut, f"{c.get('sut_id')} vs {sut}")
          gate('condition is a web or api condition (no mobile condition in E05)', c.get('surface') in ('web', 'api'), str(c.get('surface')))
          gate('campaign START authorization id is present', bool(auth), auth)
          gate('executor implementation hash is a SHA-256 value', re.fullmatch(r'[0-9a-f]{64}', impl) is not None)
          pv_ok = re.fullmatch(r'[A-Za-z0-9._-]+', pv) is not None
          gate('executor prompt version is a plain identifier', pv_ok, pv)

          # G-1 campaign START exists (protocol/change-control-v1.md, section 7, moment 1)
          st = {x.get('id'): x.get('status') for x in (load(STUDY).get('campaigns') or []) if isinstance(x, dict)}
          gate('E05 campaign status IN_PROGRESS', st.get(CAMPAIGN) == 'IN_PROGRESS', str(st.get(CAMPAIGN)))
          rows = [l for l in text(CHANGELOG).splitlines() if README in l and 'campaign NOT_STARTED -> IN_PROGRESS' in l]
          gate('exactly one E05 campaign START change-log row', len(rows) == 1, str(len(rows)))
          gate('the START row carries the campaign START authorization id', len(rows) == 1 and bool(auth) and auth in rows[0])
          sr = load(START_RECORD)
          gate('START record exists and names the campaign and the authorization id',
               sr.get('record_class') == 'CAMPAIGN_START' and sr.get('campaign_id') == CAMPAIGN and bool(auth) and sr.get('authorization_id') == auth, START_RECORD)

          # G-2 locked configuration (the "Campaign configuration" section of the campaign README)
          m = re.search(r'\n## Campaign configuration\n(.*?)(\n## |\Z)', text(README), re.S)
          gate('locked "Campaign configuration" record exists', m is not None)
          cfg = m.group(1) if m else ''
          gate('configuration names the condition', cond in cfg)
          gate('configuration names run-manifest schema v2', 'run-manifest.schema.v2.json' in cfg)
          gate('configuration names the executor prompt version', bool(pv) and pv in cfg)
          gate('configuration names the executor implementation hash', impl in cfg)
          gate('configuration names N = 50 executions of the condition', 'N = 50' in cfg)
          gate('configuration names the target scenario CS-001', 'CS-001' in cfg)
          gate('configuration names the H3 hypothesis label', 'H3' in cfg)
          cond_sha = sha(CONDITIONS)
          gate('configuration names the sha256 of the conditions file', cond_sha != 'absent' and cond_sha in cfg, cond_sha)
          comps = ((load(SUT_MANIFEST).get('suts') or {}).get(sut) or {}).get('components') or {}
          pins = [comps[s] for s in SUTS.get(sut, ()) if isinstance(comps.get(s), dict) and comps[s].get('commit_sha')]
          gate('SUT has pinned commits for the E05 surface components in the manifest', len(pins) > 0 and len(pins) == len(SUTS.get(sut, ())), sut)
          gate('configuration names the pinned commit of every E05 surface component of the assigned SUT', bool(pins) and all(p['commit_sha'] in cfg for p in pins))
          gate('configuration names the pinned release of the assigned SUT (where the surface components have one)', all(p['release'] in cfg for p in pins if p.get('release')))

          # G-3 dispatch authorization of the assigned SUT (governance v6, Section 3.7; issued by the human research lead only)
          recs = []
          for p in sorted(glob.glob(f'manifests/e05-dispatch-authorization-{SUT_TAGS.get(sut, "none")}-v*.yaml')):
              d = load(p)
              if isinstance(d, dict) and d.get('authorization_id') == dauth:
                  recs.append((p, d))
          gate('exactly one dispatch authorization record of the assigned SUT names the dispatch authorization id', len(recs) == 1, str(len(recs)))
          d = recs[0][1] if len(recs) == 1 else {}
          fi = d.get('frozen_inputs') or {}
          prompt_path = f'prompts/frozen/{pv}.md'
          prompt_sha = sha(prompt_path) if pv_ok else 'absent'
          gate('dispatch authorization is ISSUED, VALID, dispatch-eligible, not revoked, issued by the human research lead',
               d.get('status') == 'ISSUED' and d.get('record_validity') == 'VALID' and d.get('dispatch_eligibility') == 'ELIGIBLE'
               and d.get('revoked') is False and d.get('issued_by') == 'human research lead', str(d.get('status')))
          gate('dispatch authorization names the assigned SUT', d.get('assigned_sut') == sut)
          gate('dispatch authorization names this condition', cond in (d.get('conditions') or []))
          gate('dispatch authorization names N = 50 executions per condition', d.get('n_executions') == 50, str(d.get('n_executions')))
          gate('dispatch authorization records attempt 1 and an authorization date', str(d.get('attempt')) == '1' and bool(d.get('authorization_date')), str(d.get('attempt')))
          gate('dispatch authorization names the campaign START authorization id', bool(auth) and d.get('campaign_start_authorization_id') == auth)
          gate('dispatch authorization records the executor implementation SHA-256 equal to the input', fi.get('executor_implementation_sha256') == impl)
          gate('dispatch authorization records the executor prompt SHA-256 equal to the frozen prompt file', prompt_sha != 'absent' and fi.get('executor_prompt_sha256') == prompt_sha)
          gate('executor prompt frozen file exists', prompt_sha != 'absent', prompt_path)

          # G-4 governance v6 in force, with its dispatch-authorization section
          gov = text(GOV)
          gm = re.search(r'\| Protocol state \| ([A-Z-]+) \|', gov)
          gate('agent-governance-v6 is FROZEN-PRE-DATA or AMENDED', gm is not None and gm.group(1) in ('FROZEN-PRE-DATA', 'AMENDED'), gm.group(1) if gm else 'no header')
          gate('agent-governance-v6 names the per-SUT dispatch authorization of Section 3.7', re.search(r'^### 3\.7 Dispatch authorization', gov, re.M) is not None)

          # G-5 run-manifest schema v2
          schema = load(SCHEMA)
          gate('run-manifest schema v2 present with the v2 id', str(schema.get('$id', '')).endswith(':run-manifest:v2'))

          # G-6 controlled instance verified on GitHub Actions for this condition (protocol/study-design-v1.md, section 10.3)
          ctl = (load(CONTROLLED).get('conditions') or {}).get(cond) or {}
          gate('controlled instance status CONTROLLED', ctl.get('status') == 'CONTROLLED', str(ctl.get('status')))
          ga = ctl.get('github_actions_verification') or {}
          gate('GitHub Actions environment verification VERIFIED', ga.get('status') == 'VERIFIED', str(ga.get('status')))
          gate('no provisioning change awaiting re-verification', ctl.get('reverification_required') is False, str(ctl.get('reverification_required')))
          env_type = ga.get('environment_type') or 'UNKNOWN'
          gate('environment_type SELF_HOSTED (never PUBLIC_HOSTED for an E05 condition)', env_type == 'SELF_HOSTED', env_type)

          # G-7 target scenario mapping FROZEN (protocol/equivalent-scenario-mapping-v1.md)
          cs = load(MAPPING)
          gate('CS-001 mapping FROZEN', cs.get('mapping_status') == 'FROZEN', str(cs.get('mapping_status')))
          gate('CS-001 names a mapping entry for the assigned SUT', any(isinstance(e, dict) and e.get('sut_id') == sut for e in (cs.get('mappings') or [])), sut)

          # G-8 frozen implementation at the locked hash
          gate('executor implementation exists and equals the locked hash', sha(IMPL) != 'absent' and sha(IMPL) == impl, sha(IMPL))

          # G-9 workflow revision: the locked configuration names the measured workflow file it was locked with (config section 13, gate 7)
          gate('configuration names the sha256 of the measured workflow file (workflow revision)', sha(MEASURED) != 'absent' and sha(MEASURED) in cfg, sha(MEASURED))

          out = {
              'all_gates_passed': 'true' if not failures else 'false',
              'configuration_sha256': sha(README),
              'schema_v2_sha256': sha(SCHEMA),
              'executor_prompt_sha256': prompt_sha,
              'governance_sha256': sha(GOV),
              'workflow_sha256': sha(MEASURED),
              'dispatch_authorization_sha256': sha(recs[0][0]) if len(recs) == 1 else 'absent',
              'environment_type': env_type,
              'canonical_source_commit': 'none (this repository is the canonical repository)',
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              for k, v in out.items():
                  f.write(f'{k}={v}\n')
          print(json.dumps(out, indent=2))
          if failures:
              print('GATES FAILED (' + str(len(failures)) + '): ' + '; '.join(failures))
              sys.exit(1)
          print('ALL GATES PASSED')
          PY

  provenance:
    name: E05 Provenance Capture
    needs: gate
    if: ${{ needs.gate.outputs.all_gates_passed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out frozen inputs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            manifests
            .github/workflows
          sparse-checkout-cone-mode: true
      - name: Write the CI reproducibility contract (no secret values)
        env:
          PROV_CONDITION_ID: ${{ inputs.condition_id }}
          PROV_ASSIGNED_SUT: ${{ inputs.assigned_sut }}
          PROV_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
          PROV_IMPLEMENTATION_SHA256: ${{ inputs.executor_implementation_sha256 }}
          PROV_CONFIGURATION_SHA256: ${{ needs.gate.outputs.configuration_sha256 }}
          PROV_SCHEMA_SHA256: ${{ needs.gate.outputs.schema_v2_sha256 }}
          PROV_PROMPT_FILE_SHA256: ${{ needs.gate.outputs.executor_prompt_sha256 }}
          PROV_GOVERNANCE_SHA256: ${{ needs.gate.outputs.governance_sha256 }}
          PROV_WORKFLOW_SHA256: ${{ needs.gate.outputs.workflow_sha256 }}
          PROV_DISPATCH_SHA256: ${{ needs.gate.outputs.dispatch_authorization_sha256 }}
          PROV_ENVIRONMENT_TYPE: ${{ needs.gate.outputs.environment_type }}
          PROV_CANONICAL_COMMIT: ${{ needs.gate.outputs.canonical_source_commit }}
          PROV_REPOSITORY_SHA: ${{ github.sha }}
          PROV_REF: ${{ github.ref }}
          PROV_WORKFLOW_REF: ${{ github.workflow_ref }}
          PROV_RUN_ID: ${{ github.run_id }}
          PROV_RUN_ATTEMPT: ${{ github.run_attempt }}
          PROV_RUN_NUMBER: ${{ github.run_number }}
          PROV_JOB: ${{ github.job }}
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import datetime, json, os, yaml
          e = os.environ
          sut = e['PROV_ASSIGNED_SUT']
          # the pinned commit of the component that the instance is provisioned from (the web component for SUT-02, the api otherwise)
          pin = yaml.safe_load(open('manifests/sut-manifest.yaml'))['suts'][sut]['components']['web' if sut == 'SUT-02' else 'api']
          rec = {
              'record_class': e['RECORD_CLASS'], 'study_id': 'EUS-2026-001', 'campaign_id': 'E05-determinism',
              'condition_id': e['PROV_CONDITION_ID'], 'sut_id': sut, 'attempt': 1,
              'repository': {'sha': e['PROV_REPOSITORY_SHA'], 'ref': e['PROV_REF'], 'canonical_source_commit': e['PROV_CANONICAL_COMMIT']},
              'workflow': {'ref': e['PROV_WORKFLOW_REF'], 'file_sha256': e['PROV_WORKFLOW_SHA256']},
              'frozen_input_hashes': {'e05_configuration_sha256': e['PROV_CONFIGURATION_SHA256'], 'run_manifest_schema_v2_sha256': e['PROV_SCHEMA_SHA256'],
                                      'executor_prompt_version': e['PROV_PROMPT_VERSION'], 'executor_prompt_sha256': e['PROV_PROMPT_FILE_SHA256'],
                                      'executor_implementation_sha256': e['PROV_IMPLEMENTATION_SHA256'], 'agent_governance_v6_sha256': e['PROV_GOVERNANCE_SHA256'],
                                      'dispatch_authorization_sha256': e['PROV_DISPATCH_SHA256']},
              'sut_version': {'repository': pin.get('repository'), 'commit_sha': pin.get('commit_sha'), 'release': pin.get('release')},
              'environment_type': e['PROV_ENVIRONMENT_TYPE'],
              'timezone': 'UTC', 'timeout_policy': e['TIMEOUT_POLICY'], 'retry_policy': e['RETRY_POLICY'], 'concurrency_policy': e['CONCURRENCY_POLICY'],
              'artifact_retention_days': int(e['ARTIFACT_RETENTION_DAYS']),
              'github': {'run_id': e['PROV_RUN_ID'], 'run_attempt': e['PROV_RUN_ATTEMPT'], 'run_number': e['PROV_RUN_NUMBER'], 'job': e['PROV_JOB']},
              'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'secrets': 'none used; none recorded',
          }
          json.dump(rec, open('ci-provenance.json', 'w', encoding='utf-8'), indent=2)
          print(json.dumps(rec, indent=2))
          PY
      - name: Upload the provenance record
        uses: actions/upload-artifact@v4
        with:
          name: E05-MEASURED_EXPERIMENT-${{ inputs.condition_id }}-provenance
          path: ci-provenance.json
          retention-days: 90
          overwrite: false
          if-no-files-found: error

  measured-execution:
    name: E05 Measured Execution ${{ inputs.condition_id }}
    needs: [gate, provenance]
    if: ${{ needs.gate.outputs.all_gates_passed == 'true' }}
    runs-on: ubuntu-24.04
    # 330 minutes is a provisional ceiling for one condition (fifty executions on one shared instance), below the 360-minute limit of a
    # GitHub-hosted job. Before START it is to be set from the measured DRY_RUN duration of this condition (duration-seconds.txt of its
    # verification bundle), and it is never raised.
    timeout-minutes: 330
    steps:
      - name: Check out common frozen inputs and only the assigned SUT's raw-data subtree
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            protocol
            manifests
            experiments
            schemas
            prompts
            raw-data/E05-determinism/${{ inputs.assigned_sut }}
          sparse-checkout-cone-mode: true
      - name: Assert read isolation (no other SUT's measured outputs in the workspace; the condition's output directory does not exist yet)
        env:
          ISO_ASSIGNED_SUT: ${{ inputs.assigned_sut }}
          ISO_CONDITION_ID: ${{ inputs.condition_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for d in raw-data/E05-determinism/*/; do
            case "$d" in "raw-data/E05-determinism/$ISO_ASSIGNED_SUT/") ;; *) echo "isolation violated: $d present"; exit 1;; esac
          done
          shopt -u nullglob
          test ! -e "raw-data/E05-determinism/$ISO_ASSIGNED_SUT/$ISO_CONDITION_ID" || { echo "output directory of $ISO_CONDITION_ID already exists: attempts are immutable"; exit 1; }
          echo "read isolation ok"
      - name: Download the provenance record
        uses: actions/download-artifact@v4
        with:
          name: E05-MEASURED_EXPERIMENT-${{ inputs.condition_id }}-provenance
          path: provenance
      - name: Record the runtime environment
        run: |
          python3 - <<'PY'
          import datetime, json, os, platform, subprocess
          def v(cmd):
              try: return subprocess.run(cmd, capture_output=True, text=True, timeout=30).stdout.strip()
              except Exception as e: return f'unavailable: {e.__class__.__name__}'
          rec = {'runner': {'os': os.environ.get('RUNNER_OS'), 'image': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'), 'arch': os.environ.get('RUNNER_ARCH'), 'platform': platform.platform()},
