      - name: Clone the pinned SUT-05 source and relate the release tag to the pinned commit (fail closed)
        id: clone-sut05
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        env:
          PIN_REPO: ${{ steps.pin-sut05.outputs.repo }}
          PIN_SHA: ${{ steps.pin-sut05.outputs.sha }}
          PIN_RELEASE: ${{ steps.pin-sut05.outputs.release }}
        run: |
          set -euo pipefail
          git clone --quiet "$PIN_REPO" sut
          git -C sut checkout --quiet "$PIN_SHA"
          test "$(git -C sut rev-parse HEAD)" = "$PIN_SHA"
          # The packaged distribution is built by the SUT project from the release tag's commit. The pinned source commit differs from
          # it only by one documented non-application file; any other difference fails this step (the SUT is never patched).
          git -C sut rev-parse "$PIN_RELEASE^{commit}" | tee "$GITHUB_WORKSPACE/release-commit.txt"
          git -C sut diff --name-only "$(cat "$GITHUB_WORKSPACE/release-commit.txt")" "$PIN_SHA" | tee "$GITHUB_WORKSPACE/release-vs-pin-diff.txt"
          test "$(cat "$GITHUB_WORKSPACE/release-vs-pin-diff.txt")" = "screenshots/bundle-analysis.png"
      - name: Set up Node.js 24.21.0 (the Node.js major the packaged distribution is bound to; the version of SUT05-PROV-0001)
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Download, verify, and unpack the packaged distribution of the pinned release (the SUT README's Packaged Distributions route)
        id: package-sut05
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EV_REPO: ${{ steps.pin-sut05.outputs.repo }}
          EV_RELEASE: ${{ steps.pin-sut05.outputs.release }}
        run: |
          set -euo pipefail
          ASSET="juice-shop-${EV_RELEASE#v}_node24_linux_x64.tgz"
          gh release download "$EV_RELEASE" --repo "$EV_REPO" --pattern "$ASSET" --clobber
          SUM="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          DIGEST="$(gh release view "$EV_RELEASE" --repo "$EV_REPO" --json assets --jq ".assets[] | select(.name == \"$ASSET\") | .digest")"
          test -n "$DIGEST"
          test "sha256:$SUM" = "$DIGEST"
          mkdir -p pkg
          tar -xzf "$ASSET" -C pkg
          set -- pkg/*/
          test "$#" -eq 1
          PKG_DIR="${1%/}"
          test -f "$PKG_DIR/package.json"
          test -f "$PKG_DIR/build/app.js"
          echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
          python3 - "$ASSET" "$SUM" "$DIGEST" "$PKG_DIR" <<'PY'
          import json, sys
          asset, digest_sha256, github_digest, pkg_dir = sys.argv[1:5]
          p = json.load(open(pkg_dir + '/package.json'))
          rec = {'route': 'PACKAGED_DISTRIBUTION (SUT README, Packaged Distributions: download the release archive, unpack, npm start)',
                 'asset': asset, 'sha256': digest_sha256, 'github_digest': github_digest, 'unpacked_dir': pkg_dir,
                 'package_json': {k: p.get(k) for k in ('name', 'version', 'engines', 'os', 'cpu')}, 'start_script': (p.get('scripts') or {}).get('start')}
          json.dump(rec, open('package-provenance.json', 'w'), indent=2); print(json.dumps(rec, indent=2))
          PY
      - name: Start the api from the packaged distribution in its own session and process group (npm start, the documented route; absolute npm path)
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        env:
          SUT_DIR: ${{ steps.package-sut05.outputs.dir }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil, subprocess, sys, time, urllib.request
          ws = os.environ['GITHUB_WORKSPACE']
          cwd = os.path.join(ws, os.environ['SUT_DIR'])
          npm = shutil.which('npm')
          if not npm:
              sys.exit('npm is not on PATH')
          argv = [npm, 'start']
          # The instance starts in a new session (start_new_session): npm, the shell it spawns, and the node process that serves port 3000
          # share one process group, which the executor stops as a whole (operation OP-CI-02 of the E03 verification).
          out = open(os.path.join(ws, 'api-stdout-1.log'), 'w', encoding='utf-8')
          err = open(os.path.join(ws, 'api-stderr-1.log'), 'w', encoding='utf-8')
          p = subprocess.Popen(argv, cwd=cwd, stdin=subprocess.DEVNULL, stdout=out, stderr=err, start_new_session=True)
          pgid = os.getpgid(p.pid)
          if pgid != p.pid:
              sys.exit(f'the api process group {pgid} is not the new session leader {p.pid}')
          ready = False
          for _ in range(60):
              if p.poll() is not None:
                  sys.exit(f'npm start exited early with code {p.returncode} (api-stderr-1.log)')
              try:
                  with urllib.request.urlopen('http://127.0.0.1:3000/rest/admin/application-version', timeout=20) as r:
                      if r.status == 200:
                          ready = True
                          break
              except Exception:
                  pass
              time.sleep(3)
          if not ready:
              sys.exit('the api did not answer GET /rest/admin/application-version with 200 within the readiness window')
          with open(os.path.join(ws, 'e05-process-sut05.json'), 'w', encoding='utf-8') as f:
              json.dump({'pid': p.pid, 'pgid': pgid, 'start_command': argv, 'cwd': cwd, 'env_path': os.environ['PATH']}, f, indent=2)
          print(f'started: pid {p.pid}, process group {pgid}')
          PY
      - name: Record the SUT-05 provisioning (the process block of the api; the restart uses the provisioning PATH)
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        env:
          PIN_REPO: ${{ steps.pin-sut05.outputs.repo }}
          PIN_SHA: ${{ steps.pin-sut05.outputs.sha }}
          PIN_RELEASE: ${{ steps.pin-sut05.outputs.release }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          ws = os.environ['GITHUB_WORKSPACE']
          proc = json.load(open(os.path.join(ws, 'e05-process-sut05.json'), encoding='utf-8'))
          pkg = json.load(open(os.path.join(ws, 'package-provenance.json'), encoding='utf-8'))
          rec = {
              'sut_id': 'SUT-05',
              'surfaces': {'api': {'base_url': 'http://127.0.0.1:3000'}},
              'provisioning': {'repository': os.environ['PIN_REPO'], 'commit_sha': os.environ['PIN_SHA'], 'release': os.environ['PIN_RELEASE'],
                               'route': pkg['route'], 'asset': {'name': pkg['asset'], 'sha256': pkg['sha256']}},
              'process': {'pid': proc['pid'], 'pgid': proc['pgid'], 'port': 3000, 'start_command': proc['start_command'], 'cwd': proc['cwd'],
                          'env': {'PATH': proc['env_path']}, 'readiness_url': '/rest/admin/application-version',
                          'readiness_timeout_s': 180, 'stop_timeout_s': 30},
              'logs': [os.path.join(ws, 'api-stdout-1.log'), os.path.join(ws, 'api-stderr-1.log')],
          }
          with open(os.path.join(ws, 'e05-provisioning.json'), 'w', encoding='utf-8') as f:
              json.dump(rec, f, indent=2)
          print(json.dumps(rec, indent=2))
          PY

      # ---- common steps after the provisioning group of the assigned SUT ----
      - name: Set up Python 3.12 and install the executor's pinned tools in a venv outside the workspace (Playwright for Python with --require-hashes; Chromium)
        id: py312
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the executor venv (pinned wheels, hashes checked) and Chromium, and put the venv first on PATH
        env:
          PY312: ${{ steps.py312.outputs.python-path }}
        run: |
          set -euo pipefail
          "$PY312" -m venv "$RUNNER_TEMP/e05-executor-venv"
          "$RUNNER_TEMP/e05-executor-venv/bin/python" -m pip install --require-hashes --only-binary :all: -r experiments/E05-determinism/executor/requirements.txt
          "$RUNNER_TEMP/e05-executor-venv/bin/python" -m playwright install --with-deps chromium
          echo "$RUNNER_TEMP/e05-executor-venv/bin" >> "$GITHUB_PATH"
      - name: Write the instance interface instance.json (experiments/E05-determinism/executor/README.md, section 3)
        env:
          ASSIGNED_SUT: ${{ inputs.assigned_sut }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          ws = os.environ['GITHUB_WORKSPACE']
          rec = json.load(open(os.path.join(ws, 'e05-provisioning.json'), encoding='utf-8'))
          sut = os.environ['ASSIGNED_SUT']
          expected = {'SUT-01': {'api', 'web'}, 'SUT-02': {'web'}, 'SUT-04': {'api', 'auth', 'message', 'web'}, 'SUT-05': {'api'}}
          assert rec['sut_id'] == sut, (rec['sut_id'], sut)
          assert set(rec['surfaces']) == expected[sut], (sorted(rec['surfaces']), sut)
          assert bool(rec['process']) == (sut in ('SUT-01', 'SUT-05')), 'the process block is required for SUT-01 and SUT-05 only'
          inst = {'interface_version': 1, 'sut_id': sut, 'record_class': os.environ['RECORD_CLASS'], 'surfaces': rec['surfaces'],
                  'provisioning': rec['provisioning'], 'process': rec['process'], 'logs': rec['logs']}
          text = json.dumps(inst, indent=2) + '\n'
          assert json.loads(text) == inst
          with open('instance.json', 'w', encoding='utf-8') as f:
              f.write(text)
          print(text)
          PY

      # ---- execution (fifty executions of the condition, one job, one shared instance) ----
      - name: Execute the condition through the frozen executor implementation (fail closed on the locked hash; fifty executions, no EXECUTIONS override)
        env:
          CONDITION_ID: ${{ inputs.condition_id }}
          ASSIGNED_SUT: ${{ inputs.assigned_sut }}
          ATTEMPT: "1"
          EXECUTOR_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
          LOCKED_IMPLEMENTATION_SHA256: ${{ inputs.executor_implementation_sha256 }}
          OUTPUT_DIR: raw-data/E05-determinism/${{ inputs.assigned_sut }}/${{ inputs.condition_id }}
          PROVENANCE_JSON: provenance/ci-provenance.json
          RUNTIME_ENVIRONMENT_JSON: runtime-environment.json
          INSTANCE_JSON: instance.json
        run: |
          set -euo pipefail
          test "$(sha256sum experiments/E05-determinism/executor/run-condition.sh | cut -c1-64)" = "$LOCKED_IMPLEMENTATION_SHA256"
          mkdir -p "$OUTPUT_DIR"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$OUTPUT_DIR/started-at.txt"
          start_s="$(date +%s)"
          set +e
          bash experiments/E05-determinism/executor/run-condition.sh > "$OUTPUT_DIR/stdout.log" 2> "$OUTPUT_DIR/stderr.log"
          status=$?
          set -e
          end_s="$(date +%s)"
          echo "$status" > "$OUTPUT_DIR/exit-status.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$OUTPUT_DIR/finished-at.txt"
          echo $((end_s - start_s)) > "$OUTPUT_DIR/duration-seconds.txt"
          cp provenance/ci-provenance.json runtime-environment.json "$OUTPUT_DIR/"
          echo "executor exit status: $status"
      - name: Validate the bundle (fail closed on an incomplete or invalid bundle; recorded outcomes are data, never errors)
        if: always()
        env:
          VAL_OUTPUT_DIR: raw-data/E05-determinism/${{ inputs.assigned_sut }}/${{ inputs.condition_id }}
          VAL_CONDITION_ID: ${{ inputs.condition_id }}
          VAL_ASSIGNED_SUT: ${{ inputs.assigned_sut }}
          VAL_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
        run: |
          set -euo pipefail
          test "$(cat "$VAL_OUTPUT_DIR/exit-status.txt")" = "0" || { echo "executor exit status is not 0: the bundle is incomplete"; exit 1; }
          shopt -s nullglob
          manifests=("$VAL_OUTPUT_DIR"/executions/*/run-manifest.json)
          shopt -u nullglob
          test "${#manifests[@]}" -eq "$EXPECTED_EXECUTIONS" || { echo "expected $EXPECTED_EXECUTIONS run manifests, found ${#manifests[@]}"; exit 1; }
          for f in "${manifests[@]}"; do
            npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate -s schemas/run-manifest.schema.v2.json --spec=draft2020 --allow-union-types -c ajv-formats -d "$f"
          done
          python3 - <<'PY'
          import glob, json, os, sys
          out = os.environ['VAL_OUTPUT_DIR']
          bad = []
          paths = sorted(glob.glob(os.path.join(out, 'executions', '*', 'run-manifest.json')))
          for p in paths:
              m = json.load(open(p, encoding='utf-8'))
              run_id = m.get('run_id')
              checks = {
                  'campaign_id': m.get('campaign_id') == 'E05-determinism',
                  'sut_id': m.get('sut_id') == os.environ['VAL_ASSIGNED_SUT'],
                  'condition': m.get('condition') == os.environ['VAL_CONDITION_ID'],
                  'attempt 1': m.get('attempt') == 1,
                  'prompt_version': m.get('prompt_version') == os.environ['VAL_PROMPT_VERSION'],
                  'run_id names the execution directory': run_id == os.path.basename(os.path.dirname(p)),
              }
              bad += [f'{run_id}: {k}' for k, ok in checks.items() if not ok]
          if bad:
              sys.exit('run manifest identity check failed: ' + '; '.join(bad))
          print(f'{len(paths)} run manifests checked: schema v2 and identity')
          PY
      - name: Replace runner host paths and private network addresses in the kept stdout.log and stderr.log by neutral markers (publication hygiene at capture; the bundle files are not edited)
        if: always()
        env:
          SCRUB_OUTPUT_DIR: raw-data/E05-determinism/${{ inputs.assigned_sut }}/${{ inputs.condition_id }}
        run: |
          python3 - <<'PY'
          import os, re
          out = os.environ['SCRUB_OUTPUT_DIR']
          prefixes = sorted({p for p in (os.environ.get('GITHUB_WORKSPACE'), os.environ.get('RUNNER_TEMP'), os.environ.get('HOME')) if p and len(p) > 1}, key=len, reverse=True)
          homes = re.compile(r'/(?:Users|home)/[A-Za-z0-9._-]+')
          private = re.compile(r'\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b')
          changed = 0
          for name in ('stdout.log', 'stderr.log'):
              p = os.path.join(out, name)
              if not os.path.isfile(p):
                  continue
              t = open(p, 'rb').read().decode('utf-8', 'replace')
              n = t
              for pre in prefixes:
                  n = n.replace(pre, '<host-path>')
              n = homes.sub('<home>', n)
              n = private.sub('<private-address>', n)
              if n != t:
                  open(p, 'w', encoding='utf-8', newline='').write(n)
                  changed += 1
          print(f'host paths and private network addresses replaced in {changed} root log file(s)')
          PY
      - name: Upload the immutable attempt bundle (the artifact root holds stdout.log, stderr.log, exit-status.txt and finished-at.txt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e05-${{ inputs.condition_id }}
          path: raw-data/E05-determinism/${{ inputs.assigned_sut }}/${{ inputs.condition_id }}
          retention-days: 90
          overwrite: false
          if-no-files-found: error
