# E03 Mobile Qualification
# Study EUS-2026-001 (Experimental Utility of Software-Testing Laboratory Ecosystems).
# Authored and maintained by ORCHESTRATOR under E03-CI-WRITE-AUTH-01 (AGENT-INSTRUCTIONS.md, "E03 CI/CD infrastructure").
#
# GitHub Actions execution path for the mobile-runner qualification gate of
# protocol/mobile-runner-policy-v1.md (MQ1, MQ2, MQ3; Android emulator and iOS Simulator; qualification
# SUT OmniPizza, SUT-01; pass criteria of section 7; switch rule of section 8), required before the two
# mobile E03 conditions (E03-CS001-SUT02-ANDROID, E03-CS001-SUT02-IOS) may execute. Mobilewright is the
# primary candidate and Appium 3 the fallback; Appium 2 is never introduced.
#
# Every job is class QUALIFICATION (tool qualification): it produces no evidence about any SUT, never
# writes raw-data/, and its artifacts are imported only under qualification/ by QUALIFIER-MOBILE-01.
#
# It fails closed. The gate job requires: the explicit human instruction id (relayed by the ORCHESTRATOR,
# policy section 2) resolved DYNAMICALLY against every manifests/mobile-qualification-execution-auth-v*.yaml
# record (no version is hardcoded as the source), accepting only an authorization_id-unique match whose type,
# record_validity, lifecycle/status, issued_by, and authorizes_execution fields show an actually issued human
# authorization, never a drafted or prepared one; the pinned qualification build, runner pin, and
# emulator/simulator identities in manifests/toolchain-manifest.yaml; the accepted implementation baseline of
# manifests/mobile-qualification-implementation-lock-v1.yaml, independently recomputed from the checkout; the
# frozen launch prompt; and, in qualification/mobilewright/README.md, the recorded instruction and a fully
# realized scenario table. The platform jobs run the gate implementation authored by QUALIFIER-MOBILE-01
# (qualification/mobilewright/run-gate-android.sh, run-gate-ios.sh) on the pinned substrates
# (manifests/toolchain-manifest.yaml, environments) and upload the authorization-specific formal namespace
# qualification/mobilewright/formal/<instruction_id>/ (PROTO-U12; qualification/mobilewright/output/ is the quarantine).
#
# Mode DEVELOPMENT (experiments/E03-resetability/ci-cd-execution-model.md, sections 7 and 9): the same
# harness on the same pinned substrates with N = 1 and no warm-up, every record labeled DEVELOPMENT, output
# kept outside the checkout and uploaded as E03-DEVELOPMENT-*; never a gate execution, never imported under
# qualification/mobilewright/output, never counted toward N. Mode QUALIFICATION is the gate itself.
#
# PROTO-U10 (2026-09-22): the authorization record must not carry record_validity INVALID and the retired id
# MOBILE-QUALIFICATION-EXEC-AUTH-01 is refused; a future gate needs a new human authorization record with a
# new id (manifests/mobile-qualification-authorization-correction-v1.yaml). CI_AUTHORIZATION_RESOLUTION_DEFECT
# correction (2026-09-23): the gate previously read only manifests/mobile-qualification-execution-auth-v1.yaml
# by a hardcoded path, which could never admit a differently-named future authorization record (for example
# MOBILE-QUALIFICATION-EXEC-AUTH-02, manifests/mobile-qualification-execution-auth-v2-prepared.yaml, currently
# PREPARED_AWAITING_EXPLICIT_HUMAN_AUTHORIZATION and refused by this gate on multiple independent grounds).
# Resolution is now dynamic, id-filtered, and fails closed on zero or more than one match.
#
# PRE-DISPATCH EXECUTION-INTEGRITY / PROVENANCE correction (PROTO-U12, 2026-09-23; explicit human instruction
# "MOBILE QUALIFICATION PRE-DISPATCH INTEGRITY CORRECTION"): (A) formal output is written to, uploaded from, and imported
# into only the authorization-specific namespace qualification/mobilewright/formal/<instruction_id>/, which must be absent or
# empty before the first execution -- never the quarantined qualification/mobilewright/output/; (B) one dispatch with
# platform both runs gate -> Android -> iOS, the iOS job starting only after the Android job completed successfully (an
# ordinary measured runner failure does not fail the Android job; an incomplete Android job leaves iOS unexecuted, fail
# closed); (C) the active prompt version id is taken from the authorization record and passed to the platform jobs. The
# implementation baseline is manifests/mobile-qualification-implementation-lock-v2.yaml (lock v1 is immutable history).
# MOBILE-QUALIFICATION-EXEC-AUTH-02 was superseded before dispatch and is refused, like AUTH-01. No retry, no rerun, no
# change to runner images, versions, scenario order, N, warm-ups, timeouts, or attribution.
name: E03 Mobile Qualification

on:
  workflow_dispatch:
    inputs:
      instruction_id:
        description: "Id of the explicit human instruction to execute the qualification gate (relayed by the ORCHESTRATOR)"
        required: true
        type: string
      runner_candidate:
        description: "Runner under qualification"
        required: true
        default: Mobilewright
        type: choice
        options: [Mobilewright, "Appium 3"]
      platform:
        description: "Platform(s) to exercise"
        required: true
        default: both
        type: choice
        options: [android, ios, both]
      confirm:
        description: "Type EXECUTE-QUALIFICATION-GATE to confirm"
        required: true
        type: string
      mode:
        description: "QUALIFICATION = the gate (N = 10, one warm-up per combination); DEVELOPMENT = harness validation on the pinned substrates (N = 1, never counted)"
        required: true
        default: QUALIFICATION
        type: choice
        options: [QUALIFICATION, DEVELOPMENT]

permissions:
  contents: read

concurrency:
  group: e03-mobile-qualification
  cancel-in-progress: false

env:
  TZ: UTC
  RECORD_CLASS: ${{ inputs.mode }}
  GATE_MODE: ${{ inputs.mode }}
  QUALIFICATION_INSTRUCTION_ID: ${{ inputs.instruction_id }}
  QUALIFICATION_RUNNER_CANDIDATE: ${{ inputs.runner_candidate }}
  # The runner under qualification must not report usage to third parties from the study's runs.
  MOBILEWRIGHT_DISABLE_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  gate:
    name: E03 Mobile Qualification Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
      prompt_version_id: ${{ steps.gate.outputs.prompt_version_id }}
      formal_namespace: ${{ steps.gate.outputs.formal_namespace }}
    env:
      GATE_CONFIRM: ${{ inputs.confirm }}
      GATE_PLATFORM: ${{ inputs.platform }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify the qualification prerequisites (fail closed)
        id: gate
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, hashlib, os, re, sys, yaml
          failures = []
          def gate(name, ok, detail=''):
              print(('PASS ' if ok else 'FAIL ') + name + (': ' + detail if detail else ''))
              if not ok: failures.append(name)
          instruction = os.environ.get('QUALIFICATION_INSTRUCTION_ID', '').strip()
          candidate = os.environ.get('QUALIFICATION_RUNNER_CANDIDATE', '')
          gate('explicit confirmation', os.environ.get('GATE_CONFIRM', '') == 'EXECUTE-QUALIFICATION-GATE')
          gate('human instruction id provided', bool(instruction))
          gate('runner candidate is Mobilewright or Appium 3 (never Appium 2)', candidate in ('Mobilewright', 'Appium 3'))
          pol = open('protocol/mobile-runner-policy-v1.md').read()
          gate('mobile-runner policy FROZEN-PRE-DATA', '| Protocol state | FROZEN-PRE-DATA |' in pol)
          tmall = yaml.safe_load(open('manifests/toolchain-manifest.yaml'))
          tm = tmall['tools']
          qb = tm['mobile_primary_candidate']['qualification_build']
          gate('qualification build pinned (repository, commit/release, android and ios build identities, pinned_by, pinned_at)', all(qb.get(k) for k in ('repository', 'commit_sha_or_release', 'android_build_identity', 'ios_build_identity', 'pinned_by', 'pinned_at')))
          key = 'mobile_primary_candidate' if candidate == 'Mobilewright' else 'mobile_fallback'
          pin = (tm[key].get('pinned_candidate_version') or {}).get('version')
          gate('runner version pinned in manifests/toolchain-manifest.yaml (pinned_candidate_version.version)', bool(pin), str(pin))
          if candidate == 'Appium 3':
              gate('fallback pin is an Appium 3 version', str(pin).startswith('3.'), str(pin))
          env_ = tmall.get('environments', {})
          gate('emulator and simulator identities recorded', all(env_.get('android_emulator', {}).get(k) for k in ('image', 'api_level', 'device_profile')) and all(env_.get('ios_simulator', {}).get(k) for k in ('runtime', 'device_profile')))
          # Authorization record discovery: no version is hardcoded (CI_AUTHORIZATION_RESOLUTION_DEFECT
          # correction). Every file matching the family below is a candidate; the gate fails closed unless
          # exactly one admissible record's authorization_id matches the submitted instruction_id. A drafted or
          # prepared record (issued_by empty/placeholder/agent-role, authorizes_execution not exactly true, a
          # status that is absent or anything other than exactly ISSUED, or a missing/bad record_validity) must
          # never pass, regardless of its id (PROTO-U10: a proposed/relayed authorization text is never itself an
          # authorization; AUTH-02 PRE-ISSUANCE CONSISTENCY HARDENING, 2026-09-23: status absence no longer passes).
          auth_candidates = sorted(glob.glob('manifests/mobile-qualification-execution-auth-v*.yaml'))
          matches = []
          for p in auth_candidates:
              try:
                  rec = yaml.safe_load(open(p)) or {}
              except Exception:
                  rec = {}
              if isinstance(rec, dict) and rec.get('authorization_id') == instruction:
                  matches.append((p, rec))
          gate('exactly one authorization record matches the submitted instruction_id', len(matches) == 1, f'{len(matches)} match(es) among {auth_candidates}')
          auth_path, auth = matches[0] if len(matches) == 1 else (None, {})
          if auth_path:
              print('matched authorization record: ' + auth_path)
          gate('authorization_type is MOBILE_QUALIFICATION_EXECUTION', auth.get('authorization_type') == 'MOBILE_QUALIFICATION_EXECUTION', str(auth.get('authorization_type')))
          record_validity = auth.get('record_validity')
          gate('record_validity is explicitly present and not INVALID/SUPERSEDED/RETIRED', record_validity is not None and str(record_validity).upper() not in ('INVALID', 'SUPERSEDED', 'RETIRED'), str(record_validity))
          status_val = auth.get('status')
          gate('status is exactly ISSUED (absence, PREPARED, DRAFT, or any other value fails closed)', status_val == 'ISSUED', str(status_val))
          issued_by = str(auth.get('issued_by') or '').strip()
          bad_issuer_tokens = ('', 'null', 'none', 'tbd', 'pending', 'orchestrator', 'qualifier-mobile-01', 'adjudicator-eu-01', 'executor-e03-resetability')
          gate('issued_by is a human identity, not empty/placeholder/agent-role', issued_by.lower() not in bad_issuer_tokens, issued_by or '(absent)')
          gate('authorizes_execution is explicitly true (never defaulted)', auth.get('authorizes_execution') is True, str(auth.get('authorizes_execution')))
          # PROTO-U12: an issued authorization must also be explicitly dispatch-eligible; a superseded one never is.
          gate('dispatch_eligibility is exactly ELIGIBLE (superseded, retired, or not-yet-issued records fail closed)', auth.get('dispatch_eligibility') == 'ELIGIBLE', str(auth.get('dispatch_eligibility')))
          # PROTO-U10 / PROTO-U12: refuse the retired and the superseded-before-dispatch ids explicitly, even if another
          # field were accidentally changed.
          RETIRED_AUTHORIZATION_IDS = ('MOBILE-QUALIFICATION-EXEC-AUTH-01', 'MOBILE-QUALIFICATION-EXEC-AUTH-02')
          gate('authorization record is not a retired or superseded id (' + ', '.join(RETIRED_AUTHORIZATION_IDS) + ')', instruction not in RETIRED_AUTHORIZATION_IDS)
          prompt = (auth.get('launch_prompt') or {}).get('frozen_copy') or ''
          prompt_sha_claimed = (auth.get('launch_prompt') or {}).get('sha256')
          prompt_version_id_field = (auth.get('launch_prompt') or {}).get('prompt_version_id')
          gate('launch_prompt.frozen_copy is present', bool(prompt))
          gate('launch_prompt.sha256 is present in the authorization record', bool(prompt_sha_claimed), str(prompt_sha_claimed))
          gate('launch_prompt.prompt_version_id is present in the authorization record', bool(prompt_version_id_field), str(prompt_version_id_field))
          gate('frozen launch prompt present', bool(prompt) and os.path.isfile(prompt), prompt)
          # CANONICAL vs PUBLIC EXECUTION PROMPT HASH correction (2026-09-23): this workflow only ever executes from
          # the published public checkout (GitHub Actions has no other repository to run from), which the clean
          # provider-neutral export deterministically transforms (PROVIDER_NEUTRAL_PATH_ALIAS etc.) relative to the
          # canonical source the authorization record was hashed against. Comparing launch_prompt.sha256 directly
          # against the on-disk file therefore fails by design for any transformed file -- it is not a defect to
          # paper over with an exemption or a normalization step, and it is not corrected by overwriting the
          # authorization's canonical hash with the exported one. Instead PUBLIC-EXPORT-MANIFEST.yaml (present in
          # every published checkout; it is the export's own declared transformation record) is the bridge: it must
          # show exactly one entry for this exact path, that entry's canonical_sha256 must equal what AUTH-02
          # claims (proving AUTH-02 was hashed against the same canonical artifact the export started from), the
          # actual on-disk bytes in THIS checkout must equal that entry's exported_sha256 (proving this checkout is
          # exactly the declared transformation of that artifact, not something else), and the declared
          # transformation class must be on the short allowed list -- never an unreviewed or scientifically
          # meaningful transformation. An UNCHANGED entry (the manifest omits explicit canonical_sha256/
          # exported_sha256 for files the export did not touch, since canonical, exported, and on-disk are then
          # identical by construction) is handled by using the freshly computed on-disk hash as the effective value
          # of both, which reduces to the original direct comparison exactly when no transformation occurred.
          prompt_text = open(prompt, encoding='utf-8').read() if prompt and os.path.isfile(prompt) else None
          prompt_sha_actual = hashlib.sha256(prompt_text.encode('utf-8')).hexdigest() if prompt_text is not None else None
          ALLOWED_PROMPT_TRANSFORMATIONS = {'PROVIDER_NEUTRAL_PATH_ALIAS', 'UNCHANGED'}
          manifest_path = 'PUBLIC-EXPORT-MANIFEST.yaml'
          manifest_entries = []
          if os.path.isfile(manifest_path):
              try:
                  pm = yaml.safe_load(open(manifest_path)) or {}
                  manifest_entries = [e for e in (pm.get('files') or []) if isinstance(e, dict) and e.get('path') == prompt]
              except Exception:
                  manifest_entries = []
          gate('PUBLIC-EXPORT-MANIFEST.yaml exists and lists exactly one entry for the frozen prompt path', len(manifest_entries) == 1, f'{len(manifest_entries)} entr(y/ies) for {prompt}')
          entry = manifest_entries[0] if len(manifest_entries) == 1 else {}
          entry_transforms = entry.get('transformations') if isinstance(entry.get('transformations'), list) else []
          entry_unchanged = entry_transforms == ['UNCHANGED']
          manifest_canonical_sha = entry.get('canonical_sha256', prompt_sha_actual if entry_unchanged else None)
          manifest_exported_sha = entry.get('exported_sha256', prompt_sha_actual if entry_unchanged else None)
          gate('manifest transformation class for the frozen prompt is on the allowed list', bool(entry_transforms) and set(entry_transforms) <= ALLOWED_PROMPT_TRANSFORMATIONS, str(entry_transforms))
          gate('manifest entry canonical_sha256 matches the authorization record\'s launch_prompt.sha256', manifest_canonical_sha is not None and prompt_sha_claimed is not None and manifest_canonical_sha == prompt_sha_claimed, str(manifest_canonical_sha))
          gate('actual on-disk SHA-256 of the frozen prompt matches the manifest entry\'s exported_sha256 (this checkout is the declared transformation of the canonical artifact)', prompt_sha_actual is not None and manifest_exported_sha is not None and prompt_sha_actual == manifest_exported_sha, str(prompt_sha_actual))
          gate('the submitted instruction_id appears literally in the frozen launch prompt', prompt_text is not None and instruction in prompt_text)
          gate('no unresolved {{INSTRUCTION_ID}} launch placeholder remains in the active frozen prompt', prompt_text is not None and '{{INSTRUCTION_ID}}' not in prompt_text)
          gate('no unresolved {{...}} launch placeholder of any kind remains in the active frozen prompt', prompt_text is not None and re.search(r'\{\{[A-Z_]+\}\}', prompt_text) is None)
          # PROTO-U12 (defect C): the active execution prompt version must match the authorization. The frozen prompt
          # must declare exactly the authorization's prompt_version_id, and that id is what the platform jobs stamp on
          # every record (QUALIFICATION_PROMPT_VERSION_ID); nothing in the implementation hardcodes a version.
          declared_versions = sorted(set(re.findall(r'Prompt version: (qualifier-mobile-01-mobilewright-gate-v[0-9]+)', prompt_text or '')))
          gate('the frozen prompt declares exactly the authorization\'s prompt version id', bool(prompt_version_id_field) and declared_versions == [prompt_version_id_field], str(declared_versions))
          gate('prompt version id is a qualifier-mobile-01-mobilewright-gate-v<n> id', bool(re.fullmatch(r'qualifier-mobile-01-mobilewright-gate-v[0-9]+', str(prompt_version_id_field or ''))), str(prompt_version_id_field))
          # PROTO-U12 (defect A): formal output isolation, checked BEFORE any execution. The namespace is
          # authorization-specific, never the quarantined output/, and absent or empty (only .gitkeep) in this checkout.
          id_ok = bool(re.fullmatch(r'MOBILE-QUALIFICATION-EXEC-AUTH-[0-9]+', instruction))
          gate('instruction id has the MOBILE-QUALIFICATION-EXEC-AUTH-<n> form (safe as a path component)', id_ok, instruction)
          formal_ns = 'qualification/mobilewright/formal/' + instruction if id_ok else ''
          quarantine_dir = 'qualification/mobilewright/output'
          gate('formal output namespace is isolated from the quarantined qualification/mobilewright/output', bool(formal_ns) and os.path.normpath(formal_ns) != quarantine_dir and not os.path.normpath(formal_ns).startswith(quarantine_dir + '/'), formal_ns)
          ns_extra = [os.path.relpath(os.path.join(d, f), formal_ns) for d, _, fs in os.walk(formal_ns) for f in fs if f != '.gitkeep'] if formal_ns and os.path.isdir(formal_ns) else []
          gate('formal output namespace is absent or empty before the first execution (only .gitkeep allowed)', bool(formal_ns) and (not os.path.exists(formal_ns) or (os.path.isdir(formal_ns) and not ns_extra)), str(ns_extra[:5]))
          gate('the frozen prompt directs output to this authorization\'s formal namespace, not the quarantine', bool(formal_ns) and prompt_text is not None and (formal_ns + '/') in prompt_text)
          gc = open('qualification/mobilewright/gate-common.sh').read()
          gate('gate implementation writes QUALIFICATION output to the formal namespace and stamps the supplied prompt version', 'GATE_OUT="$GATE_HERE/formal/$QUALIFICATION_INSTRUCTION_ID"' in gc and 'GATE_PROMPT_VERSION_ID="${QUALIFICATION_PROMPT_VERSION_ID:-}"' in gc)
          # PROTO-U12 (defect B): platform both must not permit Android/iOS overlap. Checked on this workflow file itself.
          try:
              wf = yaml.safe_load(open('.github/workflows/e03-mobile-qualification.yml'))
              ios_job = wf['jobs']['qualification-ios']
              ios_needs = ios_job.get('needs') if isinstance(ios_job.get('needs'), list) else [ios_job.get('needs')]
              ios_if = str(ios_job.get('if', ''))
              upload_paths = [st.get('with', {}).get('path', '') for j in ('qualification-android', 'qualification-ios') for st in wf['jobs'][j]['steps'] if str(st.get('uses', '')).startswith('actions/upload-artifact')]
          except Exception as ex:
              ios_needs, ios_if, upload_paths = [], '', []
          gate('the iOS job needs the Android job (no Android/iOS overlap under platform both)', 'qualification-android' in ios_needs and "inputs.platform == 'both' && needs.qualification-android.result == 'success'" in ios_if, str(ios_needs))
          gate('both platform uploads come from the formal namespace, never the quarantined output/', len(upload_paths) == 2 and all('needs.gate.outputs.formal_namespace' in p and 'mobilewright/output' not in p for p in upload_paths), str(upload_paths))
          rd = open('qualification/mobilewright/README.md').read()
          real = re.search(r'## Scenario realization.*?\n\n(.*?)\n\n## ', rd, re.S)
          gate('scenario realization recorded (no null / TBD in the realization table)', real is not None and 'null / TBD' not in real.group(1))
          gate('instruction to execute recorded in qualification/mobilewright/README.md', instruction in rd)
          version_id = (auth.get('launch_prompt') or {}).get('prompt_version_id') or ''
          gate('prompt version id recorded in qualification/mobilewright/README.md', bool(version_id) and version_id in rd, version_id)
          for f in ('qualification/mobilewright/run-gate-android.sh', 'qualification/mobilewright/run-gate-ios.sh', 'qualification/mobilewright/gate-common.sh'):
              gate('gate implementation present: ' + f, os.path.isfile(f) and os.path.getsize(f) > 0)
          gate('gate harness lockfile present', os.path.isfile('qualification/mobilewright/harness/package-lock.json'))
          # Implementation-lock verification: the accepted baseline (manifests/mobile-qualification-
          # implementation-lock-v2.yaml, MOBILE-QUALIFICATION-IMPLEMENTATION-LOCK-02, successor of LOCK-01) is independently
          # recomputed from the checked-out working tree, not merely read from the lock file. The formal
          # qualification must not run against an implementation different from the human-accepted baseline.
          try:
              lock = yaml.safe_load(open('manifests/mobile-qualification-implementation-lock-v2.yaml'))
              lv = lock.get('lock_verification', {}) if isinstance(lock, dict) else {}
          except Exception:
              lv = {}
          artifacts = lv.get('artifacts', [])
          gate('implementation-lock manifest lists the expected artifacts', len(artifacts) > 0, str(len(artifacts)))
          for art in artifacts:
              p, expected = art.get('path'), art.get('expected')
              actual = hashlib.sha256(open(p, 'rb').read()).hexdigest() if p and os.path.isfile(p) else None
              gate('implementation-lock hash matches: ' + str(p), actual is not None and actual == expected, str(actual))
          srs = lv.get('scenario_realization_section') or {}
          if srs:
              try:
                  srs_text = open(srs['path'], encoding='utf-8').read()
                  s = srs_text.index('## Scenario realization'); e = srs_text.index('## Pass criteria', s)
                  section = srs_text[s:e]
                  if section.endswith('\n'): section = section[:-1]
                  actual_srs = hashlib.sha256(section.encode('utf-8')).hexdigest()
              except Exception:
                  actual_srs = None
              gate('implementation-lock hash matches: Scenario-realization section of ' + str(srs.get('path')), actual_srs is not None and actual_srs == srs.get('expected'), str(actual_srs))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('ready=' + ('true' if not failures else 'false') + '\n')
              if not failures:
                  f.write('prompt_version_id=' + prompt_version_id_field + '\n')
                  f.write('formal_namespace=' + formal_ns + '\n')
          if failures:
              print('QUALIFICATION GATE NOT READY (' + str(len(failures)) + '): ' + '; '.join(failures)); sys.exit(1)
          print('QUALIFICATION GATE READY for platform(s): ' + os.environ.get('GATE_PLATFORM', '') + ' in mode ' + os.environ.get('GATE_MODE', ''))
          PY

  qualification-android:
    name: E03 Mobile Qualification android
    needs: gate
    if: ${{ needs.gate.outputs.ready == 'true' && (inputs.platform == 'android' || inputs.platform == 'both') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      # Active execution prompt version, from the authorization record (PROTO-U12); stamped on every record.
      QUALIFICATION_PROMPT_VERSION_ID: ${{ needs.gate.outputs.prompt_version_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22 for the runner under qualification
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable KVM for the Android emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the gate implementation is present
        run: |
          set -euo pipefail
          test -s qualification/mobilewright/run-gate-android.sh || { echo "qualification/mobilewright/run-gate-android.sh not authored: failing closed"; exit 1; }
      - name: Execute the qualification gate on the pinned Android emulator
        # ReactiveCircus/android-emulator-runner v2.38.0, pinned at the commit the annotated tag resolves to
        # (manifests/toolchain-manifest.yaml, environments.android_emulator.substrate).
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          # DEVELOPMENT output stays outside the checkout (gate-common.sh refuses a path inside the repository).
          GATE_OUTPUT_DIR: ${{ inputs.mode == 'DEVELOPMENT' && format('{0}/development-output', runner.temp) || '' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: eus-qualification-pixel7-api35
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash qualification/mobilewright/run-gate-android.sh
      - name: Upload ${{ inputs.mode }} artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E03-${{ inputs.mode }}-android-${{ inputs.runner_candidate }}-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ inputs.mode == 'DEVELOPMENT' && format('{0}/development-output', runner.temp) || needs.gate.outputs.formal_namespace }}
          retention-days: 90
          if-no-files-found: warn

  qualification-ios:
    name: E03 Mobile Qualification ios
    # Sequential platforms (PROTO-U12, policy section 7.1): under platform both the iOS job starts only after the
    # Android job has completed successfully; ordinary measured runner failures leave the Android job successful
    # (the orchestrator records them and exits 0), while an incomplete Android job leaves iOS unexecuted (fail closed).
    needs: [gate, qualification-android]
    if: ${{ !cancelled() && needs.gate.outputs.ready == 'true' && ((inputs.platform == 'ios' && needs.qualification-android.result == 'skipped') || (inputs.platform == 'both' && needs.qualification-android.result == 'success')) }}
    runs-on: macos-15
    timeout-minutes: 180
    env:
      # Active execution prompt version, from the authorization record (PROTO-U12); stamped on every record.
      QUALIFICATION_PROMPT_VERSION_ID: ${{ needs.gate.outputs.prompt_version_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22 for the runner under qualification
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Select the pinned Xcode 16.4 (build 16F6)
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version
      - name: Verify the gate implementation is present
        run: |
          set -euo pipefail
          test -s qualification/mobilewright/run-gate-ios.sh || { echo "qualification/mobilewright/run-gate-ios.sh not authored: failing closed"; exit 1; }
      - name: Execute the qualification gate on the pinned iOS Simulator
        env:
          # DEVELOPMENT output stays outside the checkout (gate-common.sh refuses a path inside the repository).
          GATE_OUTPUT_DIR: ${{ inputs.mode == 'DEVELOPMENT' && format('{0}/development-output', runner.temp) || '' }}
        run: |
          set -euo pipefail
          bash qualification/mobilewright/run-gate-ios.sh
      - name: Upload ${{ inputs.mode }} artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E03-${{ inputs.mode }}-ios-${{ inputs.runner_candidate }}-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ inputs.mode == 'DEVELOPMENT' && format('{0}/development-output', runner.temp) || needs.gate.outputs.formal_namespace }}
          retention-days: 90
          if-no-files-found: warn
