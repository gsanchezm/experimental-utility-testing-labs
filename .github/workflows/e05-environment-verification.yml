        run: |
          set -euo pipefail
          test "$(sha256sum experiments/E05-determinism/executor/run-condition.sh | cut -c1-64)" = "$EXPECTED_IMPLEMENTATION_SHA256"
          mkdir -p "$OUTPUT_DIR"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$OUTPUT_DIR/started-at.txt"
          start_s="$(date +%s)"
          set +e
          bash experiments/E05-determinism/executor/run-condition.sh > "$OUTPUT_DIR/stdout.log" 2> "$OUTPUT_DIR/stderr.log"
          status=$?
          set -e
          end_s="$(date +%s)"
          echo "$status" > "$OUTPUT_DIR/exit-status.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$OUTPUT_DIR/finished-at.txt"
          echo $((end_s - start_s)) > "$OUTPUT_DIR/duration-seconds.txt"
          cp provenance/ci-provenance.json runtime-environment.json "$OUTPUT_DIR/"
          echo "executor exit status: $status"
      - name: Check the DRY_RUN bundles (fail on a non-zero executor status, a missing run manifest, an ERROR or ABORTED outcome, or a TOOLING attribution)
        if: always()
        env:
          OUTPUT_DIR: ${{ runner.temp }}/e05-dry-run/${{ matrix.condition_id }}
          EXPECTED_EXECUTIONS: ${{ inputs.executions }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os, sys
          out = os.environ['OUTPUT_DIR']
          expected = int(os.environ['EXPECTED_EXECUTIONS'])
          problems = []
          status_file = os.path.join(out, 'exit-status.txt')
          status = open(status_file).read().strip() if os.path.isfile(status_file) else 'absent'
          if status != '0':
              problems.append(f'executor exit status {status}')
          manifests = sorted(glob.glob(os.path.join(out, 'executions', '*', 'run-manifest.json')))
          if len(manifests) != expected:
              problems.append(f'{len(manifests)} run manifests, expected {expected}')
          for p in manifests:
              m = json.load(open(p, encoding='utf-8'))
              o = m.get('outcome') or {}
              rec_path = os.path.join(os.path.dirname(p), 'attempt-record.json')
              attribution = json.load(open(rec_path, encoding='utf-8')).get('attribution') if os.path.isfile(rec_path) else 'absent'
              line = f"{m.get('run_id')} status {o.get('status')} category {o.get('outcome_category')} attribution {attribution}"
              print(line)
              if attribution == 'absent':
                  problems.append(f'{line} (no attempt record)')
              if o.get('status') in ('ERROR', 'ABORTED') or attribution == 'TOOLING':
                  problems.append(line)
          if problems:
              sys.exit('DRY_RUN check failed: ' + '; '.join(problems))
          print('DRY_RUN check passed')
          PY
      - name: Replace runner host paths and private network addresses in the kept stdout.log and stderr.log by neutral markers (publication hygiene at capture; the bundles are not edited)
        if: always()
        env:
          SCRUB_OUTPUT_DIR: ${{ runner.temp }}/e05-dry-run/${{ matrix.condition_id }}
        run: |
          python3 - <<'PY'
          import os, re
          out = os.environ['SCRUB_OUTPUT_DIR']
          prefixes = sorted({p for p in (os.environ.get('GITHUB_WORKSPACE'), os.environ.get('RUNNER_TEMP'), os.environ.get('HOME')) if p and len(p) > 1}, key=len, reverse=True)
          homes = re.compile(r'/(?:Users|home)/[A-Za-z0-9._-]+')
          private = re.compile(r'\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b')
          changed = 0
          for name in ('stdout.log', 'stderr.log'):
              p = os.path.join(out, name)
              if not os.path.isfile(p):
                  continue
              t = open(p, 'rb').read().decode('utf-8', 'replace')
              n = t
              for pre in prefixes:
                  n = n.replace(pre, '<host-path>')
              n = homes.sub('<home>', n)
              n = private.sub('<private-address>', n)
              if n != t:
                  open(p, 'w', encoding='utf-8', newline='').write(n)
                  changed += 1
          print(f'host paths and private network addresses replaced in {changed} root log file(s)')
          PY
      - name: Upload the DRY_RUN bundle (reviewed, never imported into raw-data/, never measured)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E05-DRY_RUN-${{ matrix.condition_id }}-${{ github.run_number }}
          path: ${{ runner.temp }}/e05-dry-run/${{ matrix.condition_id }}
          retention-days: 90
          overwrite: false
          if-no-files-found: warn
