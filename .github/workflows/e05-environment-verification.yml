          rec = {
              'sut_id': 'SUT-05',
              'surfaces': {'api': {'base_url': 'http://127.0.0.1:3000'}},
              'provisioning': {'repository': os.environ['PIN_REPO'], 'commit_sha': os.environ['PIN_SHA'], 'release': os.environ['PIN_RELEASE'],
                               'route': pkg['route'], 'asset': {'name': pkg['asset'], 'sha256': pkg['sha256']}},
              'process': {'pid': proc['pid'], 'pgid': proc['pgid'], 'port': 3000, 'start_command': proc['start_command'], 'cwd': proc['cwd'],
                          'env': {'PATH': proc['env_path']}, 'readiness_url': '/rest/admin/application-version',
                          'readiness_timeout_s': 180, 'stop_timeout_s': 30},
              'logs': [os.path.join(ws, 'api-stdout-1.log'), os.path.join(ws, 'api-stderr-1.log')],
