          json.dump(rec, open('provenance/ci-provenance.json', 'w', encoding='utf-8'), indent=2)
          print(json.dumps(rec, indent=2))
          PY
      - name: Run the executor for the condition (DRY_RUN; never imported; never measured)
        env:
          CONDITION_ID: ${{ matrix.condition_id }}
          ASSIGNED_SUT: ${{ matrix.sut_id }}
          EXECUTIONS: ${{ inputs.executions }}
          ATTEMPT: "1"
          EXECUTOR_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
          OUTPUT_DIR: ${{ runner.temp }}/e05-dry-run/${{ matrix.condition_id }}
