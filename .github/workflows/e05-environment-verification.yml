      # ---- common steps after the provisioning group of the job's SUT ----
      - name: Set up Python 3.12 and install the executor's pinned tools in a venv outside the workspace (Playwright for Python with --require-hashes; Chromium)
        id: py312
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the executor venv (pinned wheels, hashes checked) and Chromium, and put the venv first on PATH
        env:
