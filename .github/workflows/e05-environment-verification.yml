          sut = os.environ['ASSIGNED_SUT']
          expected = {'SUT-01': {'api', 'web'}, 'SUT-02': {'web'}, 'SUT-04': {'api', 'auth', 'message', 'web'}, 'SUT-05': {'api'}}
          assert rec['sut_id'] == sut, (rec['sut_id'], sut)
          assert set(rec['surfaces']) == expected[sut], (sorted(rec['surfaces']), sut)
          assert bool(rec['process']) == (sut in ('SUT-01', 'SUT-05')), 'the process block is required for SUT-01 and SUT-05 only'
          inst = {'interface_version': 1, 'sut_id': sut, 'record_class': os.environ['RECORD_CLASS'], 'surfaces': rec['surfaces'],
                  'provisioning': rec['provisioning'], 'process': rec['process'], 'logs': rec['logs']}
          text = json.dumps(inst, indent=2) + '\n'
          assert json.loads(text) == inst
          with open('instance.json', 'w', encoding='utf-8') as f:
              f.write(text)
          print(text)
          PY
      - name: Write the CI provenance record for the DRY_RUN (no secret values; environment_type SELF_HOSTED)
        env:
          PROV_ASSIGNED_SUT: ${{ matrix.sut_id }}
          PROV_CONDITION_ID: ${{ matrix.condition_id }}
          PROV_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
          PROV_IMPLEMENTATION_SHA256: ${{ inputs.executor_implementation_sha256 }}
          PROV_REPOSITORY_SHA: ${{ github.sha }}
          PROV_REF: ${{ github.ref }}
          PROV_WORKFLOW_REF: ${{ github.workflow_ref }}
          PROV_RUN_ID: ${{ github.run_id }}
          PROV_RUN_ATTEMPT: ${{ github.run_attempt }}
          PROV_RUN_NUMBER: ${{ github.run_number }}
