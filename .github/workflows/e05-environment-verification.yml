          python3 - <<'PY'
          import datetime, json, os
          e = os.environ
          prov = json.load(open('e05-provisioning.json', encoding='utf-8'))['provisioning']
          rec = {
              'record_class': e['RECORD_CLASS'], 'study_id': 'EUS-2026-001', 'campaign_id': 'E05-determinism',
              'condition_id': e['PROV_CONDITION_ID'], 'sut_id': e['PROV_ASSIGNED_SUT'],
              'environment_type': 'SELF_HOSTED',
              'sut_version': {'repository': prov['repository'], 'commit_sha': prov['commit_sha'], 'release': prov['release']},
              'frozen_input_hashes': {'executor_prompt_version': e['PROV_PROMPT_VERSION'], 'executor_implementation_sha256': e['PROV_IMPLEMENTATION_SHA256']},
              'repository': {'sha': e['PROV_REPOSITORY_SHA'], 'ref': e['PROV_REF']},
              'workflow': {'ref': e['PROV_WORKFLOW_REF']},
              'github': {'run_id': e['PROV_RUN_ID'], 'run_attempt': e['PROV_RUN_ATTEMPT'], 'run_number': e['PROV_RUN_NUMBER'], 'job': e['PROV_JOB']},
              'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'timezone': 'UTC',
              'secrets': 'none used; none recorded',
