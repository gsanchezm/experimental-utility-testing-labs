      - name: Execute the condition through the frozen executor implementation
        env:
          CONDITION_ID: ${{ inputs.condition_id }}
          ASSIGNED_SUT: ${{ inputs.assigned_sut }}
          EXECUTION_ID: ${{ inputs.execution_id }}
          ATTEMPT: ${{ inputs.attempt }}
          EXECUTOR_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
          EXPECTED_IMPLEMENTATION_SHA256: ${{ inputs.executor_implementation_sha256 }}
          OUTPUT_DIR: raw-data/E02-state-establishment/${{ inputs.assigned_sut }}/${{ inputs.condition_id }}__${{ inputs.execution_id }}__A${{ inputs.attempt }}
          PROVENANCE_JSON: provenance/ci-provenance.json
          RUNTIME_ENVIRONMENT_JSON: runtime-environment.json
          INSTANCE_JSON: instance.json
        run: |
          set -euo pipefail
          test "$(sha256sum experiments/E02-state-establishment/executor/run-condition.sh | cut -c1-64)" = "$EXPECTED_IMPLEMENTATION_SHA256"
          mkdir -p "$OUTPUT_DIR"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$OUTPUT_DIR/started-at.txt"
          set +e
          bash experiments/E02-state-establishment/executor/run-condition.sh > "$OUTPUT_DIR/stdout.log" 2> "$OUTPUT_DIR/stderr.log"
          echo $? > "$OUTPUT_DIR/exit-status.txt"
          set -e
          date -u +%Y-%m-%dT%H:%M:%SZ > "$OUTPUT_DIR/finished-at.txt"
          cp provenance/ci-provenance.json runtime-environment.json "$OUTPUT_DIR/"
          echo "executor exit status: $(cat "$OUTPUT_DIR/exit-status.txt")"
      - name: Validate the run manifest against schema v2 and the E02 campaign convention
        env:
          OUTPUT_DIR: raw-data/E02-state-establishment/${{ inputs.assigned_sut }}/${{ inputs.condition_id }}__${{ inputs.execution_id }}__A${{ inputs.attempt }}
          EXPECTED_SUT: ${{ inputs.assigned_sut }}
          EXPECTED_CONDITION: ${{ inputs.condition_id }}
          EXPECTED_ATTEMPT: ${{ inputs.attempt }}
          EXPECTED_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
        run: |
          set -euo pipefail
          test -f "$OUTPUT_DIR/run-manifest.json" || { echo "run-manifest.json missing: the attempt is recorded as ERROR-without-manifest and is not attributable"; exit 1; }
          npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate -s schemas/run-manifest.schema.v2.json --spec=draft2020 --allow-union-types -c ajv-formats -d "$OUTPUT_DIR/run-manifest.json"
          python3 - <<'PY'
          import json, os
          d = os.environ['OUTPUT_DIR']
          m = json.load(open(os.path.join(d, 'run-manifest.json')))
          assert m['campaign_id'] == 'E02-state-establishment' and m['sut_id'] == os.environ['EXPECTED_SUT']
          assert m['run_id'] == os.path.basename(d), (m['run_id'], d)
          assert m['condition'] == os.environ['EXPECTED_CONDITION'] and m['scenario'] in ('CS-003', 'CS-004')
          assert int(m['attempt']) == int(os.environ['EXPECTED_ATTEMPT'])
          assert m.get('establishment_mechanisms'), 'establishment_mechanisms mandatory and non-empty for E02'
          assert m.get('reset_mechanisms') is None, 'reset_mechanisms is not applicable on the establish side (between-run reset is provisioning)'
          acts = m.get('actions') or []
          assert acts or m['outcome']['status'] in ('ABORTED', 'ERROR'), 'actions mandatory unless the run stopped before its first counted action'
          assert all('outcome' in a for a in acts), 'E02 campaign convention: every action record carries outcome'
          assert m.get('prompt_version') == os.environ['EXPECTED_PROMPT_VERSION']
          print('run manifest ok:', m['run_id'], 'counted actions:', len(acts), 'outcomes:', [a['outcome'] for a in acts], 'status:', m['outcome']['status'])
          PY
      - name: Replace runner host paths and private network addresses in the bundle's stdout.log and stderr.log by neutral markers (publication hygiene at capture)
        if: always()
        env:
          EV_KEPT: raw-data/E02-state-establishment/${{ inputs.assigned_sut }}/${{ inputs.condition_id }}__${{ inputs.execution_id }}__A${{ inputs.attempt }}/stdout.log raw-data/E02-state-establishment/${{ inputs.assigned_sut }}/${{ inputs.condition_id }}__${{ inputs.execution_id }}__A${{ inputs.attempt }}/stderr.log
        run: |
          python3 - <<'PY'
          import os, re
          prefixes = sorted({p for p in (os.environ.get('GITHUB_WORKSPACE'), os.environ.get('RUNNER_TEMP'), os.environ.get('HOME')) if p and len(p) > 1}, key=len, reverse=True)
          homes = re.compile(r'/(?:Users|home)/[A-Za-z0-9._-]+')
          private = re.compile(r'\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b')
          paths = []
          for k in os.environ['EV_KEPT'].split():
              if os.path.isdir(k):
                  paths += [os.path.join(d, f) for d, _, fs in os.walk(k) for f in fs]
              elif os.path.isfile(k):
                  paths.append(k)
          changed = 0
          for p in sorted(paths):
              b = open(p, 'rb').read()
              if b'\0' in b[:8000]:
                  continue
              try:
                  t = b.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              n = t
              for pre in prefixes:
                  n = n.replace(pre, '<host-path>')
              n = homes.sub('<home>', n)
              n = private.sub('<private-address>', n)
              if n != t:
                  open(p, 'w', encoding='utf-8', newline='').write(n)
                  changed += 1
          print(f'host paths and private network addresses replaced in {changed} of {len(paths)} kept file(s)')
          PY
      - name: Upload the immutable attempt bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E02-MEASURED_EXPERIMENT-${{ inputs.condition_id }}-${{ inputs.execution_id }}-A${{ inputs.attempt }}
          path: raw-data/E02-state-establishment/${{ inputs.assigned_sut }}/${{ inputs.condition_id }}__${{ inputs.execution_id }}__A${{ inputs.attempt }}
          retention-days: 90
          overwrite: false
          if-no-files-found: error
