      # SUT-03 group (operation OP-CI-05): copied from job sut-03-web of e03-environment-verification.yml; ids suffixed -sut03; one guard line per step
      - name: Read the pinned SUT-03 provenance
        if: ${{ inputs.assigned_sut == 'SUT-03' }}
