          npm install --no-save formdata-node@4 --no-audit --no-fund
          npm run build
          nohup npx next start -p 3000 > "$GITHUB_WORKSPACE/web-stdout.log" 2> "$GITHUB_WORKSPACE/web-stderr.log" &
          for _ in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ && break; sleep 2; done
      - name: Put Node.js 24 first on PATH again for the run-manifest validation (the SUT-03 instance keeps its own Node.js 14 process)
        if: ${{ inputs.assigned_sut == 'SUT-03' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      # SUT-04 group (operations OP-CI-05 and OP-CI-06): copied from job sut-04-web-api of e03-environment-verification.yml; ids suffixed -sut04; one guard line per step
      - name: Read the pinned SUT-04 provenance
        if: ${{ inputs.assigned_sut == 'SUT-04' }}
        id: pin-sut04
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import yaml
          c = yaml.safe_load(open('manifests/sut-manifest.yaml'))['suts']['SUT-04']['components']['api']
          print(f"repo={c['repository']}"); print(f"sha={c['commit_sha']}")
          PY
      - name: Clone the pinned SUT source
        if: ${{ inputs.assigned_sut == 'SUT-04' }}
        id: clone-sut04
        run: |
          set -euo pipefail
          git clone --quiet "${{ steps.pin-sut04.outputs.repo }}" sut
          git -C sut checkout --quiet "${{ steps.pin-sut04.outputs.sha }}"
          test "$(git -C sut rev-parse HEAD)" = "${{ steps.pin-sut04.outputs.sha }}"
      - name: Set up JDK 26 (the SUT README requires JDK 26 or higher; SUT04-PROV-0001 built with Temurin 26)
        if: ${{ inputs.assigned_sut == 'SUT-04' }}
