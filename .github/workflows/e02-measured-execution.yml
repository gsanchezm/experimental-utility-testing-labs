# E02 Measured Execution
# Study EUS-2026-001 (Experimental Utility of Software-Testing Laboratory Ecosystems).
# Not a campaign configuration and not a dispatch authorization. Authored by ORCHESTRATOR under CAMPAIGN-CI-WRITE-AUTH-01
# (the agent-instructions file, "Campaign CI/CD infrastructure for E02 and E04-E12"), and written for the dispatch model of
# protocol/agent-governance-v6.md, Section 3.7 (FROZEN-PRE-DATA since 2026-11-06).
#
# The ONLY path through which an E02-state-establishment MEASURED_EXPERIMENT may run, once the campaign is started. It is
# manually dispatched, one condition, one execution, one attempt (attempt 1 under the dispatch authorization; a further attempt only under
# its own recorded human approval, OP-CI-18), and it FAILS CLOSED: the gate job verifies every frozen
# input and every campaign gate against the checked-out repository before the measured job may start. While E02 is
# NOT_STARTED, no campaign configuration is locked, no per-SUT dispatch authorization exists, and no controlled instance is
# verified for E02, this workflow cannot execute a measured condition. That is the intended state until the human research lead
# starts the campaign and issues the dispatch authorization.
#
# Execution/attempt model: campaign -> SUT -> scenario -> condition -> execution -> attempt. Attempt 1 is immutable; this
# workflow admits a further attempt (attempt + 1) only when a further-attempt approval record of the human research lead names its
# condition, execution and attempt (protocol/agent-governance-v6.md, Section 3.7, "Further attempts"; gate G-E02-A2). GitHub-native
# re-runs are refused (run_attempt
# must be 1). Artifacts are uploaded with overwrite disabled. Nothing is committed by this workflow (permissions: contents
# read); the bundle is imported into the repository under ORCHESTRATOR coordination with digest verification.
#
# Read isolation: the measured job checks out only the common frozen inputs and the assigned SUT's own
# raw-data/E02-state-establishment/<SUT>/ subtree; no other SUT's measured outputs are present in the workspace.
#
# Gate inputs reach the gate script through the environment of its step (never through expressions inside the script text),
# so the script carries no expression; the limit of GitHub for a string that carries expressions is therefore not reached
# (protocol/CHANGELOG.md, OP-CI-15).
name: E02 Measured Execution

on:
  workflow_dispatch:
    inputs:
      condition_id:
        description: "E02 condition to execute (one of the ten conditions of the E02 design brief; mobile conditions are not in this workflow)"
        required: true
        type: choice
        options:
          - E02-CS003-SUT01-API
          - E02-CS003-SUT01-WEB
          - E02-CS003-SUT02-WEB
          - E02-CS003-SUT03-WEB
          - E02-CS003-SUT04-API
          - E02-CS003-SUT04-WEB
          - E02-CS003-SUT05-API
          - E02-CS004-SUT01-WEB
          - E02-CS004-SUT02-WEB
          - E02-CS004-SUT03-WEB
      assigned_sut:
        description: "SUT assigned to this dispatch (must match the condition; one dispatch authorization per assigned SUT)"
        required: true
        type: choice
        options: [SUT-01, SUT-02, SUT-03, SUT-04, SUT-05]
      execution_id:
        description: "Execution id within the condition, format EXnnnn (for example EX0001)"
        required: true
        type: string
      attempt:
        description: "Attempt number: 1 under the dispatch authorization; 2 or more only under a further-attempt approval record that names this condition and execution (gate G-E02-A2)"
        required: true
        default: "1"
        type: string
      campaign_start_authorization_id:
        description: "Human authorization id of the E02 campaign START (must appear in the protocol/CHANGELOG.md campaign NOT_STARTED -> IN_PROGRESS row)"
        required: true
        type: string
      dispatch_authorization_id:
        description: "Id of the per-SUT dispatch authorization (protocol/agent-governance-v6.md, Section 3.7; manifests/e02-dispatch-authorization-sut0N-v*.yaml)"
        required: true
        type: string
      executor_prompt_version:
        description: "Frozen executor prompt version id (file prompts/frozen/<id>.md must exist)"
        required: true
        type: string
      executor_implementation_sha256:
        description: "SHA-256 of experiments/E02-state-establishment/executor/run-condition.sh as recorded in the locked campaign configuration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e02-measured-${{ inputs.condition_id }}
  cancel-in-progress: false

env:
  TZ: UTC
  RECORD_CLASS: MEASURED_EXPERIMENT
  RUN_ID: ${{ inputs.condition_id }}__${{ inputs.execution_id }}__A${{ inputs.attempt }}
  ARTIFACT_RETENTION_DAYS: "90"
  TIMEOUT_POLICY: "job timeout-minutes as declared; no step retry; no automatic re-run"
  RETRY_POLICY: "none: attempt 1 under the dispatch authorization; a further attempt only under a further-attempt approval record (v6, Section 3.7); no GitHub re-run"
  CONCURRENCY_POLICY: "one run per condition at a time; never cancel in progress"

jobs:
  gate:
    name: E02 Measured Execution Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      all_gates_passed: ${{ steps.gates.outputs.all_gates_passed }}
      configuration_sha256: ${{ steps.gates.outputs.configuration_sha256 }}
      cs003_sha256: ${{ steps.gates.outputs.cs003_sha256 }}
      cs004_sha256: ${{ steps.gates.outputs.cs004_sha256 }}
      schema_v2_sha256: ${{ steps.gates.outputs.schema_v2_sha256 }}
      executor_prompt_sha256: ${{ steps.gates.outputs.executor_prompt_sha256 }}
      governance_sha256: ${{ steps.gates.outputs.governance_sha256 }}
      dispatch_authorization_sha256: ${{ steps.gates.outputs.dispatch_authorization_sha256 }}
      further_attempt_approval_sha256: ${{ steps.gates.outputs.further_attempt_approval_sha256 }}
      workflow_sha256: ${{ steps.gates.outputs.workflow_sha256 }}
      environment_type: ${{ steps.gates.outputs.environment_type }}
      canonical_source_commit: ${{ steps.gates.outputs.canonical_source_commit }}
    steps:
      - name: Check out frozen inputs only (no raw-data of any SUT)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            protocol
            manifests
            experiments
            schemas
            prompts
            .github/workflows
          sparse-checkout-cone-mode: true
      - name: Refuse a GitHub-native re-run, a malformed attempt, and a dispatch off the default branch
        env:
          GUARD_REF: ${{ github.ref }}
          GUARD_RUN_ATTEMPT: ${{ github.run_attempt }}
          GUARD_INPUT_ATTEMPT: ${{ inputs.attempt }}
        run: |
          set -euo pipefail
          test "$GUARD_REF" = "refs/heads/main" || { echo "measured execution runs only from refs/heads/main (got $GUARD_REF)"; exit 1; }
          test "$GUARD_RUN_ATTEMPT" = "1" || { echo "GitHub-native re-run refused: a further attempt needs its own approval"; exit 1; }
          [[ "$GUARD_INPUT_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "the attempt must be a positive integer; whether a further attempt is approved is decided by gate G-E02-A2"; exit 1; }
      - name: Verify every campaign gate against the repository (fail closed)
        id: gates
        env:
          GATE_CONDITION_ID: ${{ inputs.condition_id }}
          GATE_ASSIGNED_SUT: ${{ inputs.assigned_sut }}
          GATE_EXECUTION_ID: ${{ inputs.execution_id }}
          GATE_ATTEMPT: ${{ inputs.attempt }}
          GATE_CAMPAIGN_START_AUTHORIZATION_ID: ${{ inputs.campaign_start_authorization_id }}
          GATE_DISPATCH_AUTHORIZATION_ID: ${{ inputs.dispatch_authorization_id }}
          GATE_EXECUTOR_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
          GATE_EXECUTOR_IMPLEMENTATION_SHA256: ${{ inputs.executor_implementation_sha256 }}
        run: |
          set -euo pipefail
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import glob, hashlib, json, os, re, subprocess, sys, yaml

          E02 = 'E02-state-establishment'
          cond = os.environ['GATE_CONDITION_ID']
          sut = os.environ['GATE_ASSIGNED_SUT']
          execution_id = os.environ['GATE_EXECUTION_ID']
          attempt = os.environ['GATE_ATTEMPT']
          auth = os.environ['GATE_CAMPAIGN_START_AUTHORIZATION_ID']
          dispatch_id = os.environ['GATE_DISPATCH_AUTHORIZATION_ID']
          pv = os.environ['GATE_EXECUTOR_PROMPT_VERSION']
          impl_sha = os.environ['GATE_EXECUTOR_IMPLEMENTATION_SHA256']
          failures = []

          def gate(name, ok, detail=''):
              print(('PASS ' if ok else 'FAIL ') + name + ((': ' + str(detail)) if detail != '' else ''))
              if not ok:
                  failures.append(name)

          def sha(p):
              return hashlib.sha256(open(p, 'rb').read()).hexdigest() if os.path.isfile(p) else 'absent'

          def load(p):
              try:
                  with open(p, encoding='utf-8') as f:
                      return yaml.safe_load(f) or {}
              except Exception:
                  return None

          def text(p):
              return open(p, encoding='utf-8').read() if os.path.isfile(p) else ''

          # G-A: the inputs are self-consistent (the condition grammar is the one of the ten E02 conditions)
          m = re.fullmatch(r'E02-(CS003|CS004)-(SUT0[1-5])-(WEB|API)', cond)
          gate('condition is one of the ten E02 conditions', m is not None, cond)
          scenario = ('CS-' + m.group(1)[2:]) if m else 'none'
          cond_sut = ('SUT-' + m.group(2)[3:]) if m else 'none'
          surface = m.group(3) if m else 'none'
          gate('condition matches the assigned SUT', cond_sut == sut, f'{cond_sut} vs {sut}')
          gate('execution_id has the format EXnnnn', re.fullmatch(r'EX[0-9]{4}', execution_id) is not None, execution_id)
          gate('attempt is a positive integer (attempt 1 under the dispatch authorization; a further attempt needs the approval of G-E02-A2)', re.fullmatch(r'[1-9][0-9]*', attempt) is not None, attempt)
          gate('executor prompt version is a plain identifier', re.fullmatch(r'[A-Za-z0-9._-]+', pv) is not None, pv)

          # G-1: the campaign START exists: IN_PROGRESS in the study manifest, one START row with its authorization id
          sm = load('manifests/study-manifest.yaml') or {}
          campaigns = {c.get('id'): c.get('status') for c in (sm.get('campaigns') or []) if isinstance(c, dict)}
          gate('E02 campaign status is IN_PROGRESS', campaigns.get(E02) == 'IN_PROGRESS', campaigns.get(E02))
          chg = text('protocol/CHANGELOG.md')
          start_rows = [l for l in chg.splitlines() if 'experiments/E02-state-establishment/README.md' in l and 'campaign NOT_STARTED -> IN_PROGRESS' in l]
          gate('exactly one E02 campaign START change-log row exists', len(start_rows) == 1, len(start_rows))
          gate('the E02 START row carries the START authorization id', bool(auth) and len(start_rows) == 1 and re.search(re.escape(auth) + r'(?![A-Za-z0-9-])', start_rows[0]) is not None, auth)

          # G-2: the locked "Campaign configuration" section of the E02 README names the condition, schema v2, the prompt, and the hashes
          readme = text(f'experiments/{E02}/README.md')
          mm = re.search(r'\n## Campaign configuration\n(.*?)(\n## |\Z)', readme, re.S)
          cfg = mm.group(1) if mm else ''
          req_sha = sha(f'experiments/{E02}/executor/requirements.txt')
          gate('locked "Campaign configuration" section exists in the E02 README', mm is not None)
          gate('configuration names the condition', cond in cfg)
          gate('configuration names run-manifest schema v2', 'run-manifest.schema.v2.json' in cfg)
          gate('configuration names the executor prompt version', pv != '' and pv in cfg, pv)
          gate('configuration names the executor implementation hash', impl_sha != '' and impl_sha in cfg)
          gate('configuration names the executor requirements hash (pinned toolchain)', req_sha != 'absent' and req_sha in cfg)
          gate('configuration cites no excluded mapping (CS-002)', 'CS-002' not in cfg)
          gate('configuration names the H2 comparison specification (pair, scenarios, surface, method; G-E02-D)', 'H2' in cfg)

          # G-3: both canonical scenarios of the campaign are FROZEN and named; the assigned SUT is COMPARABLE on the condition's scenario
          for sc in ('CS-003', 'CS-004'):
              d = load(f'experiments/scenario-mappings/{sc}.yaml')
              state = d.get('mapping_status') if isinstance(d, dict) else 'absent'
              gate(f'{sc} mapping is FROZEN', state == 'FROZEN', state)
              gate(f'{sc} is named by the configuration', sc in cfg)
          mp = load(f'experiments/scenario-mappings/{scenario}.yaml') or {}
          entry = next((e for e in (mp.get('mappings') or []) if isinstance(e, dict) and e.get('sut_id') == sut), None)
          gate(f'{sut} is COMPARABLE on {scenario} for {surface}', entry is not None and entry.get('comparability') == 'COMPARABLE' and surface in (entry.get('surfaces_used') or []), entry.get('comparability') if entry else 'no entry')

          # G-5: schema v2 with its identifier
          v2 = load('schemas/run-manifest.schema.v2.json') or {}
          gate('schema v2 present with the v2 identifier', str(v2.get('$id', '')).endswith(':run-manifest:v2'))

          # G-6: governance in force is FROZEN-PRE-DATA or AMENDED; a DRAFT never gates a dispatch
          gov = text('protocol/agent-governance-v6.md')
          gm = re.search(r'\| Protocol state \| ([A-Z-]+) \|', gov)
          state = gm.group(1) if gm else 'absent'
          gate('agent-governance-v6 is FROZEN-PRE-DATA or AMENDED', state in ('FROZEN-PRE-DATA', 'AMENDED'), state)
          gate('governance v6 contains Section 3.7, the per-SUT dispatch authorization (G-E02-A; v6 Section 3.7)', re.search(r'^### 3\.7 Dispatch authorization', gov, re.M) is not None)

          # G-E02-A: one ISSUED, unrevoked dispatch authorization for this SUT names this dispatch, condition, N, attempt 1 (v6, Section 3.7)
          sut_tag = sut.replace('-', '').lower()
          matched = []
          for p in sorted(glob.glob(f'manifests/e02-dispatch-authorization-{sut_tag}-v*.yaml')):
              d = load(p)
              if isinstance(d, dict) and d.get('authorization_id') == dispatch_id:
                  matched.append((p, d))
          gate('exactly one E02 dispatch authorization record names this dispatch id', len(matched) == 1, [p for p, _ in matched])
          dispatch_sha = sha(matched[0][0]) if len(matched) == 1 else 'absent'
          if len(matched) == 1:
              _, d = matched[0]
              ex = next((c for c in (d.get('conditions') or []) if isinstance(c, dict) and c.get('condition_id') == cond), None)
              n = (ex or {}).get('executions')
              gate('the authorization is an ISSUED, unrevoked E02 dispatch authorization', d.get('record_class') == 'E02_DISPATCH_AUTHORIZATION' and d.get('status') == 'ISSUED' and d.get('revoked') is False, d.get('status'))
              gate('the authorization names the assigned SUT', d.get('assigned_sut') == sut, d.get('assigned_sut'))
              gate('the authorization names this condition, N executions, and this execution within N', isinstance(n, int) and n >= 1 and re.fullmatch(r'EX[0-9]{4}', execution_id) is not None and int(execution_id[2:]) <= n, n)
              gate('the authorization names the START id, the implementation hash, and the prompt version', d.get('campaign_start_authorization_id') == auth and d.get('executor_implementation_sha256') == impl_sha and d.get('executor_prompt_version') == pv)
              gate('the authorization is for attempt 1 and cites governance v6, Section 3.7', d.get('attempt') == 1 and 'agent-governance-v6.md' in str(d.get('governing_protocol')) and '3.7' in str(d.get('governing_protocol')))
              gate('the authorization names the executor prompt SHA-256, which equals the frozen prompt file (G-9; v6 Section 3.7)', d.get('executor_prompt_sha256') == sha(f'prompts/frozen/{pv}.md') and re.fullmatch(r'[A-Za-z0-9._-]+', pv) is not None)

          # G-E02-A2 (OP-CI-18): a further attempt (attempt 2 or more) needs its own recorded human approval that names this SUT, condition, execution and attempt
          # (v6, Sections 3.6 and 3.7, "Further attempts"); that record is not a dispatch authorization and extends none
          fa_sha = 'not applicable (attempt 1)'
          if attempt != '1' and re.fullmatch(r'[1-9][0-9]*', attempt):
              fa = []
              for p in sorted(glob.glob(f'manifests/e02-further-attempt-approval-{sut_tag}-v*.yaml')):
                  d = load(p)
                  if isinstance(d, dict):
                      for a in (d.get('attempts') or []):
                          if isinstance(a, dict) and a.get('condition_id') == cond and a.get('execution_id') == execution_id and str(a.get('attempt')) == attempt:
                              fa.append((p, d, a))
              gate('exactly one further-attempt approval entry names this condition, this execution and this attempt', len(fa) == 1, [p for p, _, _ in fa])
              if len(fa) == 1:
                  p, d, a = fa[0]
                  fa_sha = sha(p)
                  gate('the approval is an ISSUED, unrevoked E02 further-attempt approval for the assigned SUT', d.get('record_class') == 'E02_FURTHER_ATTEMPT_APPROVAL' and d.get('status') == 'ISSUED' and d.get('revoked') is False and d.get('assigned_sut') == sut, d.get('status'))
                  gate('the approval cites the dispatch authorization of this dispatch, the START id, the implementation hash, and the prompt version', d.get('dispatch_authorization_id') == dispatch_id and d.get('campaign_start_authorization_id') == auth and d.get('executor_implementation_sha256') == impl_sha and d.get('executor_prompt_version') == pv)
                  gate('the approval names the executor prompt SHA-256, which equals the frozen prompt file', d.get('executor_prompt_sha256') == sha(f'prompts/frozen/{pv}.md') and re.fullmatch(r'[A-Za-z0-9._-]+', pv) is not None)
                  gate('the approval cites governance v6, Section 3.7, and names the attempt before this one', 'agent-governance-v6.md' in str(d.get('governing_protocol')) and '3.7' in str(d.get('governing_protocol')) and a.get('previous_attempt') == int(attempt) - 1, a.get('previous_attempt'))

          # G-8: the controlled instance of this condition id is CONTROLLED and verified on GitHub Actions (E02 status file)
          cis = load(f'experiments/{E02}/controlled-instance-status.yaml') or {}
          cc = ((cis.get('conditions') or {}).get(cond) or {}) if isinstance(cis, dict) else {}
          ver = cc.get('github_actions_verification') or {}
          gate('controlled instance of this condition is CONTROLLED', cc.get('status') == 'CONTROLLED', cc.get('status'))
          gate('GitHub Actions verification of this condition is VERIFIED', ver.get('status') == 'VERIFIED', ver.get('status'))
          gate('no provisioning change awaits re-verification', not cc.get('reverification_required'))
          env_type = ver.get('environment_type') or 'UNKNOWN'
          gate('environment_type is SELF_HOSTED or LOCAL (PUBLIC_HOSTED is refused; protocol/study-design-v1.md, section 10.3)', env_type in ('SELF_HOSTED', 'LOCAL'), env_type)

          # G-9: the executor prompt is a frozen file; G-10: the implementation exists and matches the locked hash
          pp = f'prompts/frozen/{pv}.md'
          gate('executor prompt is a frozen file (prompts/frozen/<version>.md)', re.fullmatch(r'[A-Za-z0-9._-]+', pv) is not None and os.path.isfile(pp), pp)
          ip = f'experiments/{E02}/executor/run-condition.sh'
          gate('executor implementation exists', os.path.isfile(ip), ip)
          gate('executor implementation hash equals the input and the configuration', os.path.isfile(ip) and sha(ip) == impl_sha)
          gate('executor requirements file exists (pinned Playwright, hash-locked)', req_sha != 'absent')

          out = {
              'all_gates_passed': 'true' if not failures else 'false',
              'configuration_sha256': sha(f'experiments/{E02}/README.md'),
              'cs003_sha256': sha('experiments/scenario-mappings/CS-003.yaml'),
              'cs004_sha256': sha('experiments/scenario-mappings/CS-004.yaml'),
              'schema_v2_sha256': sha('schemas/run-manifest.schema.v2.json'),
              'executor_prompt_sha256': sha(pp) if re.fullmatch(r'[A-Za-z0-9._-]+', pv) else 'absent',
              'governance_sha256': sha('protocol/agent-governance-v6.md'),
              'dispatch_authorization_sha256': dispatch_sha,
              'further_attempt_approval_sha256': fa_sha,
              'workflow_sha256': sha('.github/workflows/e02-measured-execution.yml'),
              'environment_type': env_type,
          }
          msg = subprocess.run(['git', 'log', '-1', '--format=%(trailers:key=Canonical-Source-Commit,valueonly)'], capture_output=True, text=True).stdout.strip()
          out['canonical_source_commit'] = msg or 'none (this repository is the canonical repository)'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              for k, v in out.items():
                  f.write(f'{k}={v}\n')
          print(json.dumps(out, indent=2))
          if failures:
              print('GATES FAILED (' + str(len(failures)) + '): ' + '; '.join(failures))
              sys.exit(1)
          print('ALL GATES PASSED')
          PY

  provenance:
    name: E02 Provenance Capture
    needs: gate
    if: ${{ needs.gate.outputs.all_gates_passed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROV_CONDITION_ID: ${{ inputs.condition_id }}
      PROV_ASSIGNED_SUT: ${{ inputs.assigned_sut }}
      PROV_EXECUTION_ID: ${{ inputs.execution_id }}
      PROV_ATTEMPT: ${{ inputs.attempt }}
      PROV_EXECUTOR_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
      PROV_REPOSITORY_SHA: ${{ github.sha }}
      PROV_REF: ${{ github.ref }}
      PROV_WORKFLOW_REF: ${{ github.workflow_ref }}
      PROV_WORKFLOW_SHA256: ${{ needs.gate.outputs.workflow_sha256 }}
      PROV_CONFIGURATION_SHA256: ${{ needs.gate.outputs.configuration_sha256 }}
      PROV_CS003_SHA256: ${{ needs.gate.outputs.cs003_sha256 }}
      PROV_CS004_SHA256: ${{ needs.gate.outputs.cs004_sha256 }}
      PROV_SCHEMA_V2_SHA256: ${{ needs.gate.outputs.schema_v2_sha256 }}
      PROV_EXECUTOR_PROMPT_SHA256: ${{ needs.gate.outputs.executor_prompt_sha256 }}
      PROV_GOVERNANCE_SHA256: ${{ needs.gate.outputs.governance_sha256 }}
      PROV_DISPATCH_AUTHORIZATION_SHA256: ${{ needs.gate.outputs.dispatch_authorization_sha256 }}
      PROV_FURTHER_ATTEMPT_APPROVAL_SHA256: ${{ needs.gate.outputs.further_attempt_approval_sha256 }}
      PROV_ENVIRONMENT_TYPE: ${{ needs.gate.outputs.environment_type }}
      PROV_CANONICAL_SOURCE_COMMIT: ${{ needs.gate.outputs.canonical_source_commit }}
      PROV_RUN_ID: ${{ github.run_id }}
      PROV_RUN_ATTEMPT: ${{ github.run_attempt }}
      PROV_RUN_NUMBER: ${{ github.run_number }}
      PROV_JOB: ${{ github.job }}
    steps:
      - name: Check out frozen inputs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            manifests
            .github/workflows
          sparse-checkout-cone-mode: true
      - name: Write the CI reproducibility contract (no secret values)
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import datetime, json, os
          import yaml
          cond = os.environ['PROV_CONDITION_ID']
          sut = os.environ['PROV_ASSIGNED_SUT']
          surface = cond.split('-')[3].lower()
          sm = yaml.safe_load(open('manifests/sut-manifest.yaml'))['suts'][sut]['components'][surface]
          rec = {
            'record_class': os.environ['RECORD_CLASS'], 'study_id': 'EUS-2026-001', 'campaign_id': 'E02-state-establishment',
            'condition_id': cond, 'sut_id': sut, 'surface': surface, 'execution_id': os.environ['PROV_EXECUTION_ID'],
            'attempt': int(os.environ['PROV_ATTEMPT']), 'run_id': os.environ['RUN_ID'],
            'repository': {'sha': os.environ['PROV_REPOSITORY_SHA'], 'ref': os.environ['PROV_REF'], 'canonical_source_commit': os.environ['PROV_CANONICAL_SOURCE_COMMIT']},
            'workflow': {'ref': os.environ['PROV_WORKFLOW_REF'], 'file_sha256': os.environ['PROV_WORKFLOW_SHA256']},
            'frozen_input_hashes': {'e02_configuration_sha256': os.environ['PROV_CONFIGURATION_SHA256'], 'cs003_mapping_sha256': os.environ['PROV_CS003_SHA256'],
                                    'cs004_mapping_sha256': os.environ['PROV_CS004_SHA256'], 'run_manifest_schema_v2_sha256': os.environ['PROV_SCHEMA_V2_SHA256'],
                                    'executor_prompt_sha256': os.environ['PROV_EXECUTOR_PROMPT_SHA256'], 'executor_prompt_version': os.environ['PROV_EXECUTOR_PROMPT_VERSION'],
                                    'agent_governance_v6_sha256': os.environ['PROV_GOVERNANCE_SHA256'], 'dispatch_authorization_sha256': os.environ['PROV_DISPATCH_AUTHORIZATION_SHA256'],
                                    'further_attempt_approval_sha256': os.environ['PROV_FURTHER_ATTEMPT_APPROVAL_SHA256']},
            'sut_version': {'repository': sm.get('repository'), 'commit_sha': sm.get('commit_sha'), 'release': sm.get('release')},
            'environment_type': os.environ['PROV_ENVIRONMENT_TYPE'],
            'runner': {'os': os.environ.get('RUNNER_OS'), 'image': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'), 'arch': os.environ.get('RUNNER_ARCH'), 'note': 'the measured job records its own runner and runtime versions in runtime-environment.json; this job records the gate-time contract'},
            'timezone': 'UTC', 'timeout_policy': os.environ['TIMEOUT_POLICY'], 'retry_policy': os.environ['RETRY_POLICY'],
            'concurrency_policy': os.environ['CONCURRENCY_POLICY'], 'artifact_retention_days': int(os.environ['ARTIFACT_RETENTION_DAYS']),
            'github': {'run_id': os.environ['PROV_RUN_ID'], 'run_attempt': os.environ['PROV_RUN_ATTEMPT'], 'run_number': os.environ['PROV_RUN_NUMBER'], 'job': os.environ['PROV_JOB'],
                       'actor': 'not recorded (agent role, not a person identity, is the provenance unit)'},
            'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'secrets': 'none used; none recorded',
          }
          json.dump(rec, open('ci-provenance.json', 'w'), indent=2)
          print(json.dumps(rec, indent=2))
          PY
      - name: Upload the provenance record
        uses: actions/upload-artifact@v4
        with:
          name: E02-MEASURED_EXPERIMENT-${{ inputs.condition_id }}-${{ inputs.execution_id }}-A${{ inputs.attempt }}-provenance
          path: ci-provenance.json
          retention-days: 90
          overwrite: false
          if-no-files-found: error

  measured-execution:
    name: E02 Measured Execution ${{ inputs.condition_id }} ${{ inputs.execution_id }} A${{ inputs.attempt }}
    needs: [gate, provenance]
    if: ${{ needs.gate.outputs.all_gates_passed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out common frozen inputs and only the assigned SUT's raw-data subtree
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            protocol
            manifests
            experiments
            schemas
            prompts
            raw-data/E02-state-establishment/${{ inputs.assigned_sut }}
          sparse-checkout-cone-mode: true
      - name: Assert read isolation (no other SUT's measured outputs in the workspace)
        env:
          ISO_ASSIGNED_SUT: ${{ inputs.assigned_sut }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for d in raw-data/E02-state-establishment/*/; do
            case "$d" in "raw-data/E02-state-establishment/$ISO_ASSIGNED_SUT/") ;; *) echo "isolation violated: $d present"; exit 1;; esac
          done
          test ! -e "raw-data/E02-state-establishment/$ISO_ASSIGNED_SUT/$RUN_ID" || { echo "run directory $RUN_ID already exists: attempts are immutable"; exit 1; }
          echo "read isolation ok"
      - name: Download the provenance record
        uses: actions/download-artifact@v4
        with:
          name: E02-MEASURED_EXPERIMENT-${{ inputs.condition_id }}-${{ inputs.execution_id }}-A${{ inputs.attempt }}-provenance
          path: provenance
      - name: Record the runtime environment
        run: |
          python3 - <<'PY'
          import json, os, platform, subprocess, datetime
          def v(cmd):
              try: return subprocess.run(cmd, capture_output=True, text=True, timeout=30).stdout.strip()
              except Exception as e: return f'unavailable: {e.__class__.__name__}'
          rec = {'runner': {'os': os.environ.get('RUNNER_OS'), 'image': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'), 'arch': os.environ.get('RUNNER_ARCH'), 'platform': platform.platform()},
                 'runtime_versions': {'python': v(['python3', '--version']), 'node': v(['node', '--version']), 'npm': v(['npm', '--version']), 'java': v(['java', '-version']) or v(['bash', '-c', 'java -version 2>&1']), 'docker': v(['docker', '--version']), 'git': v(['git', '--version'])},
                 'browser_version': {'chrome': v(['bash', '-c', 'google-chrome --version 2>/dev/null || chromium --version 2>/dev/null || echo unavailable'])},
                 'timezone': os.environ.get('TZ'), 'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          json.dump(rec, open('runtime-environment.json', 'w'), indent=2); print(json.dumps(rec, indent=2))
          PY
      # Provisioning of the SUT instances: the steps of the E03 measured-execution job (provisioning, pins, and instance interface),
      # copied unchanged except for the E02 names and the condition gates, which now test the assigned SUT only (see below).
      - name: Read the pinned SUT-01 provenance
        if: ${{ inputs.assigned_sut == 'SUT-01' }}
