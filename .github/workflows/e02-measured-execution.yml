      - name: Set up Node.js 24.21.0 (the assets module's npm install and next build run inside the Maven build; the version of SUT04-PROV-0001)
        if: ${{ inputs.assigned_sut == 'SUT-04' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Install Apache Maven 3.9.14 (the version the SUT's README lists at the pinned commit), verified by its published SHA-512
        if: ${{ inputs.assigned_sut == 'SUT-04' }}
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --retry 3 --output "$RUNNER_TEMP/apache-maven-3.9.14-bin.tar.gz" https://archive.apache.org/dist/maven/maven-3/3.9.14/binaries/apache-maven-3.9.14-bin.tar.gz
          expected=d50af8ab5e6005b46a07f0ce9d3719e67cfdf898da988a84871304cd59fb1af0fef2f99dea709e6e66f21f732f905979b5c2dce6b6860406f60a70e84d9cf0b8
          found="$(sha512sum "$RUNNER_TEMP/apache-maven-3.9.14-bin.tar.gz" | cut -d ' ' -f 1)"
          [ "$found" = "$expected" ] || { echo "SHA-512 mismatch: expected $expected, found $found" >&2; exit 1; }
          tar -xzf "$RUNNER_TEMP/apache-maven-3.9.14-bin.tar.gz" -C "$RUNNER_TEMP"
          if [ ! -f "$RUNNER_TEMP/apache-maven-3.9.14/bin/mvn" ] || [ ! -x "$RUNNER_TEMP/apache-maven-3.9.14/bin/mvn" ]; then echo "not an executable file: $RUNNER_TEMP/apache-maven-3.9.14/bin/mvn" >&2; exit 1; fi
          echo "$RUNNER_TEMP/apache-maven-3.9.14/bin" >> "$GITHUB_PATH"
      - name: Build the service jars with Maven 3.9.14 (the documented build, tests skipped as in SUT04-PROV-0001)
        if: ${{ inputs.assigned_sut == 'SUT-04' }}
        id: build-sut04
        run: |
          set -euo pipefail
          java -version 2>&1 | tee "$GITHUB_WORKSPACE/java-version.txt"
          mvn -v | tee "$GITHUB_WORKSPACE/maven-version.txt"
          [[ "$(head -n 1 "$GITHUB_WORKSPACE/maven-version.txt")" == "Apache Maven 3.9.14 "* ]] || { echo "maven-version.txt does not start with Apache Maven 3.9.14: $(head -n 1 "$GITHUB_WORKSPACE/maven-version.txt")" >&2; exit 1; }
          [ "$(command -v mvn)" = "$RUNNER_TEMP/apache-maven-3.9.14/bin/mvn" ] || { echo "mvn resolves to $(command -v mvn), not $RUNNER_TEMP/apache-maven-3.9.14/bin/mvn" >&2; exit 1; }
          node --version | tee "$GITHUB_WORKSPACE/node-version.txt"
          npm --version | tee "$GITHUB_WORKSPACE/npm-version.txt"
          cd sut
          mvn -B -q clean install -DskipTests
          shopt -s nullglob
          jars=(./*/target/*-exec.jar)
          shopt -u nullglob
          [ "${#jars[@]}" -gt 0 ] || { echo "no service exec jar was built under */target/" >&2; exit 1; }
          printf '%s\n' "${jars[@]}" | tee "$GITHUB_WORKSPACE/built-jars.txt"
          test -f assets/.next/BUILD_ID
      - name: Start the six services and the web app on the host by the route of the SUT's README (each in its own session and process group; fail closed)
        if: ${{ inputs.assigned_sut == 'SUT-04' }}
        id: provision-sut04
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os, subprocess, sys, time, urllib.request
          ws = os.environ['GITHUB_WORKSPACE']
          root = os.path.join(ws, 'sut')
          # The route of the SUT's README, decided by the human research lead on 2026-10-06 with the web app's production server
          # (operation OP-PREP-E03-ADD-02): its run_locally.sh at the pinned commit, with npm start (next start -p 3003) in place
          # of npm run dev and each service's -exec jar named in place of the script's jar glob; the six Spring services run with
          # the dev profile from the clone's root, and the web app on the .next directory of the Maven build. The
          # docker-compose.yml of the pinned commit is not used: its image fixes the web app's rewrite destinations at build to
          # the container's own loopback (operation OP-PREP-E03-ADD-01). The rewrite destinations of this build are the local
          # defaults, so no *_API, *Domain, dbRefresh, or dbServer variable may be set. Maven is pinned to 3.9.14, the version the
          # SUT's README lists at the pinned commit, because the runner image's Maven 3.10.0 refuses the pinned POM version (run
          # 38018788066; operation OP-CI-07).
          bad = sorted(k for k in os.environ if k.endswith('_API') or k.endswith('Domain') or k in ('dbRefresh', 'dbServer'))
          if bad:
              sys.exit(f'SUT configuration variable(s) present in the environment: {bad}')
          services = [('auth', 3004), ('booking', 3000), ('room', 3001), ('report', 3005), ('branding', 3002), ('message', 3006)]
          started, procs = [], []
          def start(name, argv, cwd, port, ready_url):
              log = f'sut04-{name}.log'
              p = subprocess.Popen(argv, cwd=cwd, stdin=subprocess.DEVNULL, stdout=open(f'{ws}/{log}', 'w'), stderr=subprocess.STDOUT, start_new_session=True)
              if os.getpgid(p.pid) != p.pid:
                  sys.exit(f'{name}: process group {os.getpgid(p.pid)} is not the new session leader {p.pid}')
              procs.append((name, p))
              started.append({'name': name, 'argv': argv, 'cwd': os.path.relpath(cwd, ws), 'pid': p.pid, 'pgid': p.pid, 'log': log, 'port': port, 'ready_url': ready_url})
          for name, port in services:
              jars = sorted(glob.glob(os.path.join(root, name, 'target', f'restful-booker-platform-{name}-*-exec.jar')))
              if len(jars) != 1:
                  sys.exit(f'{name}: expected exactly one -exec jar under {name}/target, found {len(jars)}')
              start(name, ['java', '-jar', '-Dspring.profiles.active=dev', os.path.relpath(jars[0], root)], root, port, f'http://127.0.0.1:{port}/{name}/actuator/health')
          start('web', ['npm', 'start'], os.path.join(root, 'assets'), 3003, 'http://127.0.0.1:3003/')
          # Readiness: every service's actuator health and the web root answer 200 within one bound (workstation route: 46-155 s,
          # operation OP-PREP-E03-ADD-02); a process that exits, or the bound, fails this step and the record is NOT_VERIFIED.
          bound_s, t0, ready = 300, time.monotonic(), {}
          pending = {s['name']: s['ready_url'] for s in started}
          while pending:
              for name, p in procs:
                  if p.poll() is not None:
                      sys.exit(f'{name} exited early with code {p.returncode} (sut04-{name}.log)')
              for name, url in list(pending.items()):
                  try:
                      with urllib.request.urlopen(url, timeout=5) as r:
                          if r.status == 200:
                              ready[name] = round(time.monotonic() - t0, 1)
                              del pending[name]
                  except Exception:
                      pass
              if pending:
                  if time.monotonic() - t0 >= bound_s:
                      sys.exit(f'not ready within {bound_s} s: {sorted(pending)} (ready: {ready})')
                  time.sleep(3)
          rec = {'route': "the route of the SUT's README (run_locally.sh at the pinned commit, with npm start in place of npm run dev and each service's -exec jar in place of the script's jar glob; human decision of 2026-10-06)",
                 'processes': started, 'readiness_s': ready, 'readiness_bound_s': bound_s}
          json.dump(rec, open(f'{ws}/sut04-start.json', 'w'), indent=2)
          print(json.dumps(rec, indent=2))
          PY
      # SUT-05 group (operation OP-CI-05): copied from job sut-05-api of e03-environment-verification.yml; ids suffixed -sut05; one guard line per step
      - name: Read the pinned SUT-05 provenance (source commit and release)
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        id: pin-sut05
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import yaml
          c = yaml.safe_load(open('manifests/sut-manifest.yaml'))['suts']['SUT-05']['components']['api']
          for k in ('repository', 'commit_sha', 'release'):
              assert c.get(k), f'empty pin field: {k}'
          print(f"repo={c['repository']}"); print(f"sha={c['commit_sha']}"); print(f"release={c['release']}")
          PY
      - name: Clone the pinned SUT source and relate the release tag to the pinned commit (fail closed)
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        id: clone-sut05
        run: |
          set -euo pipefail
          git clone --quiet "${{ steps.pin-sut05.outputs.repo }}" sut
          git -C sut checkout --quiet "${{ steps.pin-sut05.outputs.sha }}"
          test "$(git -C sut rev-parse HEAD)" = "${{ steps.pin-sut05.outputs.sha }}"
          # The packaged distribution below is built by the SUT project from the release tag's commit. The pinned source commit
          # (the default-branch HEAD at pin time) differs from it only by one documented non-application file; any other
          # difference fails this step, and the record then says nothing about the reset mechanism (correction of 2026-10-04:
          # the SUT's own source build at the pinned commit no longer completes because an unpinned build-tool dependency of the
          # SUT changed upstream after 2026-09-22; the SUT is never patched).
          git -C sut rev-parse "${{ steps.pin-sut05.outputs.release }}^{commit}" | tee "$GITHUB_WORKSPACE/release-commit.txt"
          git -C sut diff --name-only "$(cat "$GITHUB_WORKSPACE/release-commit.txt")" "${{ steps.pin-sut05.outputs.sha }}" | tee "$GITHUB_WORKSPACE/release-vs-pin-diff.txt"
          test "$(cat "$GITHUB_WORKSPACE/release-vs-pin-diff.txt")" = "screenshots/bundle-analysis.png"
      - name: Set up Node.js 24.21.0 (the Node.js major the packaged distribution is bound to; the version of SUT05-PROV-0001)
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: Download, verify, and unpack the packaged distribution of the pinned release (the SUT README's Packaged Distributions route)
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        id: package-sut05
        env:
          GH_TOKEN: ${{ github.token }}
          EV_REPO: ${{ steps.pin-sut05.outputs.repo }}
          EV_RELEASE: ${{ steps.pin-sut05.outputs.release }}
        run: |
          set -euo pipefail
          ASSET="juice-shop-${EV_RELEASE#v}_node24_linux_x64.tgz"
          gh release download "$EV_RELEASE" --repo "$EV_REPO" --pattern "$ASSET" --clobber
          SUM="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          DIGEST="$(gh release view "$EV_RELEASE" --repo "$EV_REPO" --json assets --jq ".assets[] | select(.name == \"$ASSET\") | .digest")"
          test -n "$DIGEST"
          test "sha256:$SUM" = "$DIGEST"
          mkdir -p pkg
          tar -xzf "$ASSET" -C pkg
          set -- pkg/*/
          test "$#" -eq 1
          PKG_DIR="${1%/}"
          test -f "$PKG_DIR/package.json"
          test -f "$PKG_DIR/build/app.js"
          echo "dir=$PKG_DIR" >> "$GITHUB_OUTPUT"
          python3 - "$ASSET" "$SUM" "$DIGEST" "$PKG_DIR" <<'PY'
          import json, sys
          asset, digest_sha256, github_digest, pkg_dir = sys.argv[1:5]
          p = json.load(open(pkg_dir + '/package.json'))
          rec = {'route': 'PACKAGED_DISTRIBUTION (SUT README, Packaged Distributions: download the release archive, unpack, npm start)',
                 'asset': asset, 'sha256': digest_sha256, 'github_digest': github_digest, 'unpacked_dir': pkg_dir,
                 'package_json': {k: p.get(k) for k in ('name', 'version', 'engines', 'os', 'cpu')}, 'start_script': (p.get('scripts') or {}).get('start')}
          json.dump(rec, open('package-provenance.json', 'w'), indent=2); print(json.dumps(rec, indent=2))
          PY
      - name: Start the api instance from the packaged distribution in its own session and process group (npm start, the documented route)
        if: ${{ inputs.assigned_sut == 'SUT-05' }}
        id: provision-sut05
        env:
          SUT_DIR: ${{ steps.package-sut05.outputs.dir }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess, sys, time, urllib.request
          ws = os.environ['GITHUB_WORKSPACE']
          # The instance starts in a new session (setsid(2), via start_new_session): npm, the shell it spawns, and the node process that
          # serves port 3000 then share one process group, which the verification step stops as a whole. Run 37265782721 had signaled
          # only the npm process and its direct children, and the API kept answering (correction of 2026-10-05, operation OP-CI-02).
          p = subprocess.Popen(['npm', 'start'], cwd=os.environ['SUT_DIR'], stdin=subprocess.DEVNULL,
                               stdout=open(f'{ws}/api-stdout-1.log', 'w'), stderr=open(f'{ws}/api-stderr-1.log', 'w'), start_new_session=True)
          pgid = os.getpgid(p.pid)
          assert pgid == p.pid, (p.pid, pgid)
          open(f'{ws}/pid1.txt', 'w').write(f'{p.pid}\n')
          open(f'{ws}/pgid1.txt', 'w').write(f'{pgid}\n')
          body = None
          for _ in range(90):
              if p.poll() is not None:
                  sys.exit(f'npm start exited early with code {p.returncode} (api-stderr-1.log)')
              try:
                  with urllib.request.urlopen('http://127.0.0.1:3000/rest/admin/application-version', timeout=20) as r:
                      if r.status == 200:
                          body = r.read()
                          break
              except Exception:
                  pass
              time.sleep(3)
          if body is None:
              sys.exit('the api did not answer GET /rest/admin/application-version with 200 within the readiness window')
          open(f'{ws}/version-1.json', 'wb').write(body)
          print(f'started: pid {p.pid}, process group {pgid}; version response {body.decode("utf-8", "replace")}')
          PY
