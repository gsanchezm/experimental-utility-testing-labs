# E06-cross-platform-parity: environment-verification workflow (DRAFT, operation OP-PREP-E06-EXECUTOR). Not a measured experiment.
# Study EUS-2026-001. Dispatch only (workflow_dispatch); never on push. Each job runs one condition on the hosted runner, labelled
# ENVIRONMENT_VERIFICATION (one execution) or DRY_RUN (three executions, when dry_run is true). Both record classes are non-measured: the
# bundles go to the runner's temporary directory and are uploaded as an artifact; nothing is written under raw-data/ and nothing enters a
# measured dataset. The workflow needs no START, no configuration lock, and no dispatch authorization, because it measures nothing; each
# dispatch of it still needs the explicit approval of the human research lead to its exact line (protocol/agent-governance-v6.md, Section 3.4).
name: E06 Environment Verification

on:
  workflow_dispatch:
    inputs:
      condition:
        description: "The condition to verify (or all four)"
        required: true
        type: choice
        options:
          - all
          - E06-CS007-SUT01-WEB
          - E06-CS007-SUT01-ANDROID
          - E06-CS007-SUT02-WEB
          - E06-CS007-SUT02-ANDROID
      dry_run:
        description: "true: the DRY_RUN record class (three executions); false: ENVIRONMENT_VERIFICATION (one execution)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: e06-environment-verification-${{ inputs.condition }}
  cancel-in-progress: false

env:
  TZ: UTC
  DO_NOT_TRACK: "1"
  E06_EXECUTOR: experiments/E06-cross-platform-parity/executor
  E06_CHECKOUT_PATHS: |
    experiments/E06-cross-platform-parity
    experiments/scenario-mappings
    manifests
    protocol
    schemas
    qualification/compatibility-smoke-sut01

jobs:
  prepare:
    name: E06 verification preparation (no measured output)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the executor (sparse, read only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ env.E06_CHECKOUT_PATHS }}
          sparse-checkout-cone-mode: true
      - name: Check the conditions file and the record class
        env:
          VERIFY_RECORD_CLASS_DRY_RUN: ${{ inputs.dry_run }}
          VERIFY_CONDITION: ${{ inputs.condition }}
        run: |
          set -euo pipefail
          python3 -c "import json; d=json.load(open('experiments/E06-cross-platform-parity/conditions-draft.json')); assert len(d['conditions'])==4 and d['n_per_condition']==50"
          echo "condition=${VERIFY_CONDITION} dry_run=${VERIFY_RECORD_CLASS_DRY_RUN} (non-measured; nothing is written under raw-data/)"
  verify-web-sut01:
    name: E06 verification E06-CS007-SUT01-WEB
    needs: prepare
    if: ${{ inputs.condition == 'all' || inputs.condition == 'E06-CS007-SUT01-WEB' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CONDITION_ID: E06-CS007-SUT01-WEB
      EXPECTED_IDENTITY_ORACLE: item_identity
      OUTPUT_DIR: ${{ github.workspace }}/e06-verification/E06-CS007-SUT01-WEB
      PROVENANCE_JSON: ${{ github.workspace }}/e06-provenance/ci-provenance.json
      RUNTIME_ENVIRONMENT_JSON: ${{ github.workspace }}/e06-provenance/runtime-environment.json
    steps:
      - name: Check out the executor (sparse, read only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ env.E06_CHECKOUT_PATHS }}
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Playwright and its browser
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes --only-binary :all: -r "$E06_EXECUTOR/requirements.txt"
          python3 -m playwright install --with-deps chromium
      - name: Write the provenance records
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PROVENANCE_JSON")"
          python3 -c "import json,os; json.dump({'record':'ci provenance (verification, non-measured)','condition':os.environ['CONDITION_ID'],'environment_type':'PUBLIC_HOSTED'}, open(os.environ['PROVENANCE_JSON'],'w'))"
          python3 -c "import json,os,platform; json.dump({'record':'runtime environment','python':platform.python_version()}, open(os.environ['RUNTIME_ENVIRONMENT_JSON'],'w'))"
      - name: Run the condition as a non-measured record
        env:
          ATTEMPT: "1"
          RECORD_CLASS: ${{ inputs.dry_run && 'DRY_RUN' || 'ENVIRONMENT_VERIFICATION' }}
        run: |
          set -euo pipefail
          bash "$E06_EXECUTOR/run-condition.sh"
      - name: Upload the verification bundle (never imported as measured data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E06-NON_MEASURED-E06-CS007-SUT01-WEB-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ github.workspace }}/e06-verification/E06-CS007-SUT01-WEB
          retention-days: 30
          if-no-files-found: warn
  verify-web-sut02:
    name: E06 verification E06-CS007-SUT02-WEB
    needs: prepare
    if: ${{ inputs.condition == 'all' || inputs.condition == 'E06-CS007-SUT02-WEB' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CONDITION_ID: E06-CS007-SUT02-WEB
      EXPECTED_IDENTITY_ORACLE: item_identity
      OUTPUT_DIR: ${{ github.workspace }}/e06-verification/E06-CS007-SUT02-WEB
      PROVENANCE_JSON: ${{ github.workspace }}/e06-provenance/ci-provenance.json
      RUNTIME_ENVIRONMENT_JSON: ${{ github.workspace }}/e06-provenance/runtime-environment.json
    steps:
      - name: Check out the executor (sparse, read only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ env.E06_CHECKOUT_PATHS }}
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Playwright and its browser
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes --only-binary :all: -r "$E06_EXECUTOR/requirements.txt"
          python3 -m playwright install --with-deps chromium
      - name: Write the provenance records
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PROVENANCE_JSON")"
          python3 -c "import json,os; json.dump({'record':'ci provenance (verification, non-measured)','condition':os.environ['CONDITION_ID'],'environment_type':'PUBLIC_HOSTED'}, open(os.environ['PROVENANCE_JSON'],'w'))"
          python3 -c "import json,os,platform; json.dump({'record':'runtime environment','python':platform.python_version()}, open(os.environ['RUNTIME_ENVIRONMENT_JSON'],'w'))"
      - name: Run the condition as a non-measured record
        env:
          ATTEMPT: "1"
          RECORD_CLASS: ${{ inputs.dry_run && 'DRY_RUN' || 'ENVIRONMENT_VERIFICATION' }}
        run: |
          set -euo pipefail
          bash "$E06_EXECUTOR/run-condition.sh"
      - name: Upload the verification bundle (never imported as measured data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E06-NON_MEASURED-E06-CS007-SUT02-WEB-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ github.workspace }}/e06-verification/E06-CS007-SUT02-WEB
          retention-days: 30
          if-no-files-found: warn
  verify-android-sut01:
    name: E06 verification E06-CS007-SUT01-ANDROID
    needs: prepare
    if: ${{ inputs.condition == 'all' || inputs.condition == 'E06-CS007-SUT01-ANDROID' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CONDITION_ID: E06-CS007-SUT01-ANDROID
      EXPECTED_IDENTITY_ORACLE: item_identity
      OUTPUT_DIR: ${{ github.workspace }}/e06-verification/E06-CS007-SUT01-ANDROID
      PROVENANCE_JSON: ${{ github.workspace }}/e06-provenance/ci-provenance.json
      RUNTIME_ENVIRONMENT_JSON: ${{ github.workspace }}/e06-provenance/runtime-environment.json
      APK_URL: https://github.com/gsanchezm/OmniPizza/releases/download/v1.1.8/omnipizza-release.apk
      BACKEND_ORIGIN: https://omnipizza-backend.onrender.com
      APK_SHA256: 1059e9468145761710c9884b37e9fbc76da8e75eb9666dc0867d82a546cda6a4
      APK_PATH: ${{ github.workspace }}/apk/omnipizza-release.apk
    steps:
      - name: Check out the executor (sparse, read only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ env.E06_CHECKOUT_PATHS }}
          sparse-checkout-cone-mode: true
      - name: Set up the pinned Node.js and Python
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Appium stack from the locked harness of the SUT-01 smoke (npm ci, the stack that passed the smoke)
        run: |
          set -euo pipefail
          ( cd qualification/compatibility-smoke-sut01/harness && npm ci --no-audit --no-fund --loglevel=error )
          test "$(node -p "require('./qualification/compatibility-smoke-sut01/harness/node_modules/appium/package.json').version")" = "3.7.0"
          test "$(node -p "require('./qualification/compatibility-smoke-sut01/harness/node_modules/appium-uiautomator2-driver/package.json').version")" = "8.7.0"
          echo "APPIUM_HOME=$GITHUB_WORKSPACE/qualification/compatibility-smoke-sut01/harness" >> "$GITHUB_ENV"
      - name: Download the pinned APK and verify its SHA-256 before any device action
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$APK_PATH")"
          curl --fail --location --silent --show-error --output "$APK_PATH" "$APK_URL"
          echo "$APK_SHA256  $APK_PATH" | sha256sum --check --strict
      - name: Write the provenance records
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PROVENANCE_JSON")"
          python3 -c "import json,os; json.dump({'record':'ci provenance (verification, non-measured)','condition':os.environ['CONDITION_ID'],'environment_type':'PUBLIC_HOSTED'}, open(os.environ['PROVENANCE_JSON'],'w'))"
          python3 -c "import json,os,platform; json.dump({'record':'runtime environment','python':platform.python_version()}, open(os.environ['RUNTIME_ENVIRONMENT_JSON'],'w'))"
      - name: Enable KVM for the Android emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the condition on the pinned emulator as a non-measured record
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: eus-e06-verify-sut01-pixel7-api35
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash "$E06_EXECUTOR/android-job.sh"
        env:
          ATTEMPT: "1"
          RECORD_CLASS: ${{ inputs.dry_run && 'DRY_RUN' || 'ENVIRONMENT_VERIFICATION' }}
          APPIUM_BIN: ${{ github.workspace }}/qualification/compatibility-smoke-sut01/harness/node_modules/.bin/appium
      - name: Upload the verification bundle (never imported as measured data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E06-NON_MEASURED-E06-CS007-SUT01-ANDROID-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ github.workspace }}/e06-verification/E06-CS007-SUT01-ANDROID
          retention-days: 30
          if-no-files-found: warn
  verify-android-sut02:
    name: E06 verification E06-CS007-SUT02-ANDROID
    needs: prepare
    if: ${{ inputs.condition == 'all' || inputs.condition == 'E06-CS007-SUT02-ANDROID' }}
