  smoke-android:
    name: E06 Compatibility Smoke SUT-01 Android
    # Sequential under the gate; there is no second platform job. Any outcome other than a recorded proposal stops the smoke (policy v3, 9.5).
    needs: gate
    if: ${{ needs.gate.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      proposed_result: ${{ steps.proposal.outputs.proposed_result }}
    env:
      SMOKE_PROMPT_VERSION_ID: ${{ needs.gate.outputs.prompt_version_id }}
      GATE_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Refuse anything but the first attempt
        run: |
          set -euo pipefail
          test "$GATE_RUN_ATTEMPT" = "1" || { echo "GitHub re-run refused: a repeat needs a new explicit human authorization"; exit 1; }
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up the pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Enable KVM for the Android emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute the SUT-01 Android smoke on the pinned emulator
        # ReactiveCircus/android-emulator-runner v2.38.0 pinned at a commit (manifests/toolchain-manifest.yaml, environments.android_emulator).
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: eus-compat-smoke-sut01-pixel7-api35
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash qualification/compatibility-smoke-sut01/run-smoke-android.sh
      - name: Read the Android proposed result
        id: proposal
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p = os.path.join('qualification/compatibility-smoke-sut01/formal', os.environ['SMOKE_INSTRUCTION_ID'], 'SUT-01-android', 'record.json')
          try:
              r = json.load(open(p))
              v = r.get('proposed_result') if r.get('outcome') == 'SUCCESS' or r.get('proposed_result') != 'PASS' else 'INCONSISTENT'
          except Exception:
              v = 'NO_RECORD'
          print('Android proposed result:', v)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'proposed_result={v}\n')
          PY
      - name: Upload the SUT-01 Android smoke record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E06-COMPATIBILITY_SMOKE-SUT-01-android-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: qualification/compatibility-smoke-sut01/formal/${{ inputs.instruction_id }}/SUT-01-android
          retention-days: 90
          if-no-files-found: warn
