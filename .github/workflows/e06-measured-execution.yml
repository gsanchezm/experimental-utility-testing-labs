          sparse-checkout: ${{ env.E06_CHECKOUT_PATHS }}
          sparse-checkout-cone-mode: true
      - name: Refuse any other SUT's raw-data in the checkout
        run: |
          set -euo pipefail
          test ! -e raw-data || { echo "raw-data is not part of the checkout of a measured job"; exit 1; }
      - name: Set up the pinned Node.js and Python
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Appium stack from the locked harness of the SUT-01 smoke (npm ci, the stack that passed the smoke)
        run: |
          set -euo pipefail
          ( cd qualification/compatibility-smoke-sut01/harness && npm ci --no-audit --no-fund --loglevel=error )
          test "$(node -p "require('./qualification/compatibility-smoke-sut01/harness/node_modules/appium/package.json').version")" = "3.7.0"
          test "$(node -p "require('./qualification/compatibility-smoke-sut01/harness/node_modules/appium-uiautomator2-driver/package.json').version")" = "8.7.0"
          echo "APPIUM_HOME=$GITHUB_WORKSPACE/qualification/compatibility-smoke-sut01/harness" >> "$GITHUB_ENV"
          test "$(node -p "require('$RUNNER_TEMP/appium/node_modules/appium-uiautomator2-driver/package.json').version")" = "8.7.0"
      - name: Download the pinned APK and verify its SHA-256 before any device action
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$APK_PATH")"
          curl --fail --location --silent --show-error --output "$APK_PATH" "$APK_URL"
          echo "$APK_SHA256  $APK_PATH" | sha256sum --check --strict
      - name: Download the provenance record
        uses: actions/download-artifact@v4
        with:
          name: E06-MEASURED_EXPERIMENT-${{ inputs.condition }}-provenance
          path: ${{ github.workspace }}/e06-provenance
      - name: Record the runtime environment
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, platform, subprocess
          def v(cmd):
              try:
                  return subprocess.run(cmd, capture_output=True, text=True, timeout=30).stdout.strip()
              except Exception as ex:
                  return f'unavailable: {ex.__class__.__name__}'
          rec = {'runner': {'os': os.environ.get('RUNNER_OS'), 'image': os.environ.get('ImageOS'), 'image_version': os.environ.get('ImageVersion'), 'arch': os.environ.get('RUNNER_ARCH'), 'platform': platform.platform()},
                 'runtime_versions': {'python': v(['python3', '--version']), 'node': v(['node', '--version']), 'npm': v(['npm', '--version']), 'git': v(['git', '--version'])},
                 'timezone': os.environ.get('TZ'), 'timestamp': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          os.makedirs(os.path.dirname(os.environ['RUNTIME_ENVIRONMENT_JSON']), exist_ok=True)
          json.dump(rec, open(os.environ['RUNTIME_ENVIRONMENT_JSON'], 'w'), indent=2)
          print(json.dumps(rec, indent=2))
          PY
      - name: Enable KVM for the Android emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the Appium server and the condition on the pinned emulator
        # ReactiveCircus/android-emulator-runner pinned at a commit (the runner action of the SUT-01 smoke, qualification/compatibility-smoke-sut01/README.md)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: eus-e06-measured-sut01-pixel7-api35
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash "$E06_EXECUTOR/android-job.sh"
        env:
          RECORD_CLASS: MEASURED_EXPERIMENT
          ATTEMPT: "1"
          APPIUM_BIN: ${{ github.workspace }}/qualification/compatibility-smoke-sut01/harness/node_modules/.bin/appium
      - name: Upload the bundle (imported by the ORCHESTRATOR after the digest check)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E06-MEASURED_EXPERIMENT-E06-CS007-SUT01-ANDROID-run${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ github.workspace }}/e06-measured/E06-CS007-SUT01-ANDROID
          retention-days: 90
          if-no-files-found: warn
