# E06-cross-platform-parity: measured-execution workflow (DRAFT, operation OP-PREP-E06-EXECUTOR). Not authorized, not dispatched.
# Study EUS-2026-001. Dispatch only (workflow_dispatch); never on push. A DRAFT: it refuses every dispatch until the E06 campaign START
# (protocol/change-control-v1.md, section 7), the locked "Campaign configuration" section of experiments/E06-cross-platform-parity/README.md,
# a dispatch authorization record of the assigned SUT (protocol/agent-governance-v6.md, Section 3.7), the frozen dispatch prompt, and,
# for the Android conditions, the study mobile-runner admissibility and the compatibility smoke PASS of the exact SUT x platform x runner
# (protocol/mobile-runner-policy-v3.md, sections 9.5 and 9.7.9 to 9.7.11). The mobile-runner admissibility block of the gate is generated
# by executor/tests/lift_g7.py from the G-7 block of e03-measured-execution.yml (operation OP-CI-14) between the BEGIN and END markers below,
# with a QUALIFIER allowlist of both SUT records and two added gates (executor/IMPLEMENTATION-NOTES.md, section 4.5); the rest of the gate is
# adapted from the E07 gate. A provenance job records every frozen-input hash, as the E07 workflow does.
#
# The gate job reads every dispatch input through the environment of its step (no expression inside a run script). The four condition
# jobs run one condition each, first attempt only, and upload their bundles as an artifact; the workflow writes nothing under raw-data/.
# The ORCHESTRATOR imports an artifact only after verifying it against its GitHub digest (protocol/agent-governance-v6.md, Section 3.5).
name: E06 Measured Execution

on:
  workflow_dispatch:
    inputs:
      condition:
        description: "The measured condition of CS-007 to execute (one per dispatch)"
        required: true
        type: choice
        options:
          - E06-CS007-SUT01-WEB
          - E06-CS007-SUT01-ANDROID
          - E06-CS007-SUT02-WEB
          - E06-CS007-SUT02-ANDROID
      dispatch_authorization_id:
        description: "Id of the dispatch authorization of the condition's SUT (E06-DISPATCH-SUT0N-AUTH-01 or as issued)"
        required: true
        type: string
      campaign_start_authorization_id:
        description: "Id of the E06 campaign START authorization (manifests/e06-campaign-start-v1.yaml)"
        required: true
        type: string
      executor_prompt_version:
        description: "Version id of the frozen dispatch prompt (prompts/frozen/ORCHESTRATOR-E06-cross-platform-parity-vN.md)"
        required: true
        type: string
      executor_implementation_sha256:
        description: "SHA-256 of experiments/E06-cross-platform-parity/executor/run-condition.sh as locked in the configuration"
        required: true
        type: string
      confirm:
        description: "Type EXECUTE-<condition> to confirm the dispatch"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: e06-measured-${{ inputs.condition }}
  cancel-in-progress: false

env:
  TZ: UTC
  DO_NOT_TRACK: "1"
  TIMEOUT_POLICY: "gate job 15 minutes; each measured job 360 minutes (the DRY_RUN durations decide the value before the START)"
  RETRY_POLICY: "none: first attempt only; a GitHub re-run is refused by the gate and by every measured job"
  CONCURRENCY_POLICY: "one dispatch per condition at a time (concurrency group e06-measured-<condition>, cancel-in-progress false)"
  ARTIFACT_RETENTION_DAYS: "90"
  E06_EXECUTOR: experiments/E06-cross-platform-parity/executor
  E06_CHECKOUT_PATHS: |
    experiments/E06-cross-platform-parity
    experiments/scenario-mappings
    manifests
    protocol
    prompts/frozen
    qualification/compatibility-smoke
    qualification/compatibility-smoke-sut01
    schemas

jobs:
  gates:
    name: E06 measured-execution gates (fail closed)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.gates.outputs.ready }}
      configuration_sha256: ${{ steps.gates.outputs.configuration_sha256 }}
      conditions_sha256: ${{ steps.gates.outputs.conditions_sha256 }}
      schema_v2_sha256: ${{ steps.gates.outputs.schema_v2_sha256 }}
      executor_prompt_sha256: ${{ steps.gates.outputs.executor_prompt_sha256 }}
      governance_sha256: ${{ steps.gates.outputs.governance_sha256 }}
      workflow_sha256: ${{ steps.gates.outputs.workflow_sha256 }}
      dispatch_authorization_sha256: ${{ steps.gates.outputs.dispatch_authorization_sha256 }}
      environment_type: ${{ steps.gates.outputs.environment_type }}
      canonical_source_commit: ${{ steps.gates.outputs.canonical_source_commit }}
    env:
      GATE_CONDITION_ID: ${{ inputs.condition }}
      GATE_CONFIRM: ${{ inputs.confirm }}
      GATE_DISPATCH_AUTHORIZATION_ID: ${{ inputs.dispatch_authorization_id }}
      GATE_CAMPAIGN_START_AUTHORIZATION_ID: ${{ inputs.campaign_start_authorization_id }}
      GATE_EXECUTOR_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
      GATE_EXECUTOR_IMPLEMENTATION_SHA256: ${{ inputs.executor_implementation_sha256 }}
      GATE_RUN_ATTEMPT: ${{ github.run_attempt }}
      GATE_REF: ${{ github.ref }}
      GATE_SHA: ${{ github.sha }}
    steps:
      - name: Check out the gate inputs (sparse, read only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ env.E06_CHECKOUT_PATHS }}
          sparse-checkout-cone-mode: true
      - name: Set up Python for the gate
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML for the gate
        run: python3 -m pip install --quiet pyyaml==6.0.2
      - name: Run the gates
        id: gates
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, hashlib, json, os, re, sys, yaml

          # Record names of this gate. The START record and the dispatch authorizations are proposed names for E06 (the names of the E07 gate with E06
          # in place of E07, which the E07 and E09 STARTs also used); a name that the START package decides differently is changed here before the
          # configuration lock names the hash of this workflow file. Gates of E07 that do not apply to E06, and why:
          #  - the further-attempt approval (G-E07-A2): this workflow admits attempt 1 only, so a further attempt needs a corrected workflow under its own
          #    approval (the precedent of OP-CI-18 for E02); the record is listed as an open item of the executor notes;
          #  - the controlled-instance status (G-6): CS-007 is read-only (it needs no controlled instance; protocol/study-design-v1.md, section 10.3 as classified
          #    by decision D-E06-2), SUT-01 is hosted on both surfaces and SUT-02 Android runs from the local database of the pinned build; the
          #    environment_type of each condition is the one in the conditions file and is recorded in the provenance;
          #  - the assigned-SUT input and the first-execution input: the condition names its SUT, and an E06 dispatch always runs executions 1 to 50.
          CAMPAIGN = 'E06-cross-platform-parity'
          README = 'experiments/E06-cross-platform-parity/README.md'
          CONDITIONS = 'experiments/E06-cross-platform-parity/conditions-draft.json'
          START_RECORD = 'manifests/e06-campaign-start-v1.yaml'
          IMPL = 'experiments/E06-cross-platform-parity/executor/run-condition.sh'
          GOV = 'protocol/agent-governance-v6.md'
          SCHEMA = 'schemas/run-manifest.schema.v2.json'
          MAPPING = 'experiments/scenario-mappings/CS-007.yaml'
          FREEZE_RECORD = 'manifests/cs-007-freeze-v1.yaml'
          SUT_MANIFEST = 'manifests/sut-manifest.yaml'
          STUDY = 'manifests/study-manifest.yaml'
          CHANGELOG = 'protocol/CHANGELOG.md'
          MEASURED = '.github/workflows/e06-measured-execution.yml'
          SUT_TAGS = {'SUT-01': 'sut01', 'SUT-02': 'sut02'}
          env = os.environ
          failures = []

          def gate(name, ok, detail=''):
              print(('PASS ' if ok else 'FAIL ') + name + ((': ' + str(detail)) if detail != '' else ''))
              if not ok:
                  failures.append(name)

          def sha(p):
              return hashlib.sha256(open(p, 'rb').read()).hexdigest() if os.path.isfile(p) else 'absent'

          def load(p):
              try:
                  return yaml.safe_load(open(p, encoding='utf-8')) or {}
              except Exception:
                  return {}

          def rd(p):
              return open(p, encoding='utf-8').read() if os.path.isfile(p) else ''

          cond = env.get('GATE_CONDITION_ID', '')
          auth = env.get('GATE_CAMPAIGN_START_AUTHORIZATION_ID', '')
          dauth = env.get('GATE_DISPATCH_AUTHORIZATION_ID', '')
          pv = env.get('GATE_EXECUTOR_PROMPT_VERSION', '')
          impl = env.get('GATE_EXECUTOR_IMPLEMENTATION_SHA256', '')

          # G-A: the inputs are self-consistent with the conditions file
          conds = {x.get('condition_id'): x for x in (load(CONDITIONS).get('conditions') or []) if isinstance(x, dict)}
          c = conds.get(cond) or {}
          sut, scn = c.get('sut_id'), c.get('canonical_scenario_id')
          gate('the condition is one of the four measured conditions of CS-007 in the conditions file', cond in conds and len(conds) == 4, cond)
          gate('the condition id has the form E06-CS007-<SUT>-<SURFACE> and agrees with the conditions file', len(cond.split('-')) == 4 and cond.split('-')[2] == str(sut).replace('-', '') and cond.split('-')[3] == c.get('surface') and c.get('surface') in ('WEB', 'ANDROID'), f"{sut} {c.get('surface')}")
          gate('the condition names the canonical scenario CS-007', scn == 'CS-007', str(scn))
          gate('explicit confirmation token of this condition', env.get('GATE_CONFIRM', '') == 'EXECUTE-' + cond)
          gate('first attempt only (a GitHub re-run never replaces an observation)', env.get('GATE_RUN_ATTEMPT') == '1', env.get('GATE_RUN_ATTEMPT'))
          gate('default branch only', env.get('GATE_REF') == 'refs/heads/main', env.get('GATE_REF'))
          gate('the repository commit and the workflow revision are recorded', re.fullmatch(r'[0-9a-f]{40}', env.get('GATE_SHA', '')) is not None, env.get('GATE_SHA'))
          gate('campaign START authorization id is present', bool(auth), auth)
          gate('executor implementation hash is a SHA-256 value', re.fullmatch(r'[0-9a-f]{64}', impl) is not None)
          pv_ok = re.fullmatch(r'ORCHESTRATOR-E06-cross-platform-parity-v[0-9]+', pv) is not None
          gate('executor prompt version is ORCHESTRATOR-E06-cross-platform-parity-v<N>', pv_ok, pv)

          # G-1 campaign START exists (protocol/change-control-v1.md, section 7, moment 1)
          st = {x.get('id'): x.get('status') for x in (load(STUDY).get('campaigns') or []) if isinstance(x, dict)}
          gate('E06 campaign status IN_PROGRESS', st.get(CAMPAIGN) == 'IN_PROGRESS', str(st.get(CAMPAIGN)))
          rows = [l for l in rd(CHANGELOG).splitlines() if README in l and 'campaign NOT_STARTED -> IN_PROGRESS' in l]
          gate('exactly one E06 campaign START change-log row', len(rows) == 1, str(len(rows)))
          gate('the START row carries the campaign START authorization id', len(rows) == 1 and bool(auth) and auth in rows[0])
          sr = load(START_RECORD)
          gate('START record exists and names the campaign and the authorization id', sr.get('record_class') == 'CAMPAIGN_START' and sr.get('campaign_id') == CAMPAIGN and bool(auth) and sr.get('authorization_id') == auth, START_RECORD)

          # G-2 locked configuration (the "Campaign configuration" section of the campaign README)
          m = re.search(r'\n## Campaign configuration\n(.*?)(\n## |\Z)', rd(README), re.S)
          gate('locked "Campaign configuration" record exists', m is not None)
          cfg = m.group(1) if m else ''
          gate('configuration names the condition', bool(cond) and cond in cfg)
          gate('configuration names run-manifest schema v2', 'run-manifest.schema.v2.json' in cfg)
          gate('configuration names the executor prompt version', bool(pv) and pv in cfg)
          gate('configuration names the executor implementation hash', bool(impl) and impl in cfg)
          gate('configuration names N = 50 executions of the condition', 'N = 50' in cfg)
          gate('configuration names the canonical scenario CS-007', 'CS-007' in cfg)
          cond_sha = sha(CONDITIONS)
          gate('configuration names the sha256 of the conditions file', cond_sha != 'absent' and cond_sha in cfg, cond_sha)
          comp = (((load(SUT_MANIFEST).get('suts') or {}).get(sut) or {}).get('components') or {}).get(str(c.get('platform') or ''))
          pin = comp if isinstance(comp, dict) and comp.get('commit_sha') else {}
          gate('the manifest pins a commit for the surface component of the condition', bool(pin), f"{sut} {c.get('platform')}")
          gate('configuration names the pinned commit of the surface component of the condition', bool(pin) and pin['commit_sha'] in cfg)
          gate('configuration names the pinned release of that component (where it has one)', bool(pin) and (not pin.get('release') or pin['release'] in cfg))

          # G-3 dispatch authorization of the condition's SUT (governance v6, Section 3.7; issued by the human research lead only)
          recs = []
          for p in sorted(glob.glob(f'manifests/e06-dispatch-authorization-{SUT_TAGS.get(sut, "none")}-v*.yaml')):
              d = load(p)
              if isinstance(d, dict) and d.get('authorization_id') == dauth:
                  recs.append((p, d))
          gate('exactly one dispatch authorization record of the SUT names the dispatch authorization id', bool(dauth) and len(recs) == 1, str(len(recs)))
          d = recs[0][1] if len(recs) == 1 else {}
          fi = d.get('frozen_inputs') or {}
          prompt_path = f'prompts/frozen/{pv}.md'
          prompt_sha = sha(prompt_path) if pv_ok else 'absent'
          gate('dispatch authorization is ISSUED, VALID, dispatch-eligible, not revoked, issued by the human research lead',
               d.get('status') == 'ISSUED' and d.get('record_validity') == 'VALID' and d.get('dispatch_eligibility') == 'ELIGIBLE'
               and d.get('revoked') is False and d.get('issued_by') == 'human research lead', str(d.get('status')))
          gate('dispatch authorization names the assigned SUT', bool(sut) and d.get('assigned_sut') == sut)
          gate('dispatch authorization names this condition', cond in (d.get('conditions') or []))
          gate('dispatch authorization names N = 50 executions per condition', d.get('n_executions') == 50, str(d.get('n_executions')))
          gate('dispatch authorization records attempt 1 and an authorization date', str(d.get('attempt')) == '1' and bool(d.get('authorization_date')), str(d.get('attempt')))
          gate('dispatch authorization names the campaign START authorization id', bool(auth) and d.get('campaign_start_authorization_id') == auth)
          gate('dispatch authorization records the executor implementation SHA-256 equal to the input', fi.get('executor_implementation_sha256') == impl)
          gate('dispatch authorization records the executor prompt SHA-256 equal to the frozen prompt file', prompt_sha != 'absent' and fi.get('executor_prompt_sha256') == prompt_sha)
          gate('executor prompt frozen file exists and names its version id', prompt_sha != 'absent' and pv in rd(prompt_path), prompt_path)

          # G-4 governance v6 in force, with its dispatch-authorization section
          gov = rd(GOV)
          gm = re.search(r'\| Protocol state \| ([A-Z-]+) \|', gov)
          gate('agent-governance-v6 is FROZEN-PRE-DATA or AMENDED', gm is not None and gm.group(1) in ('FROZEN-PRE-DATA', 'AMENDED'), gm.group(1) if gm else 'no header')
          gate('agent-governance-v6 names the per-SUT dispatch authorization of Section 3.7', re.search(r'^### 3\.7 Dispatch authorization', gov, re.M) is not None)

          # G-5 run-manifest schema v2
          schema = load(SCHEMA)
          gate('run-manifest schema v2 present with the v2 id', str(schema.get('$id', '')).endswith(':run-manifest:v2'))

          # G-7 the canonical scenario CS-007 FROZEN with its freeze record (protocol/equivalent-scenario-mapping-v1.md); the entry of the SUT is COMPARABLE
          mp = load(MAPPING)
          gate('the canonical scenario CS-007 is FROZEN', mp.get('mapping_status') == 'FROZEN', str(mp.get('mapping_status')))
          gate('the freeze record of CS-007 exists', os.path.isfile(FREEZE_RECORD), FREEZE_RECORD)
          gate('the mapping record carries the canonical_scenario_id CS-007', mp.get('canonical_scenario_id') == 'CS-007', str(mp.get('canonical_scenario_id')))
          entry = next((e for e in (mp.get('mappings') or []) if isinstance(e, dict) and e.get('sut_id') == sut), {})
          gate('the mapping entry of the SUT in CS-007 is COMPARABLE', entry.get('comparability') == 'COMPARABLE', str(entry.get('comparability')))

          # G-8 frozen implementation at the locked hash (run-condition.sh embeds the digest of every implementation file)
          gate('executor implementation exists and equals the locked hash', sha(IMPL) != 'absent' and sha(IMPL) == impl, sha(IMPL))

          # G-9 workflow revision: the locked configuration names the measured workflow file it was locked with
          gate('configuration names the sha256 of the measured workflow file (workflow revision)', sha(MEASURED) != 'absent' and sha(MEASURED) in cfg, sha(MEASURED))

          # The outputs of the gate (the provenance capture reads them). They are computed here, before the lifted block below, which reuses some short names.
          out = {
              'configuration_sha256': sha(README), 'conditions_sha256': cond_sha, 'schema_v2_sha256': sha(SCHEMA), 'executor_prompt_sha256': prompt_sha,
              'governance_sha256': sha(GOV), 'workflow_sha256': sha(MEASURED), 'dispatch_authorization_sha256': sha(recs[0][0]) if len(recs) == 1 else 'absent',
              'environment_type': str(c.get('environment_type') or 'UNKNOWN'),
              'canonical_source_commit': 'none (this repository is the canonical repository)',
          }

          # G-10 Android conditions: study mobile-runner admissibility and the smoke of the exact SUT x android x Appium 3 (policy v3, sections 9.5, 9.7.9 to 9.7.11)
          # BEGIN lifted G-7 block: generated by executor/tests/lift_g7.py from the G-7 block of e03-measured-execution.yml; never edited by hand
          # G-7 mobile runner for mobile cells (protocol/mobile-runner-policy-v3.md sections 1, 7, 8, 9, FROZEN-PRE-DATA and in force
          # since 2026-10-02, which carries sections 1-8 of v2 with non-substantive status corrections, 9.1-9.4 and 9.6 verbatim, one
          # substantive change in 9.5 (a bounded exception clause pointing to 9.7), and the new section 9.7; v2 AMENDED 2026-10-02,
          # under which both compatibility smokes were executed; v1 AMENDED 2026-09-26, under which the qualification gate ran and
          # the section 8 selection was made; citations re-pointed 2026-10-05, operation OP-CI-03, comments only). PROTO-U14
          # (2026-09-24, prospective correction before E03 START): the selected runner is determined first, then only
          # the lineage of that runner is checked. Admissible paths: (A) Mobilewright selected after PASSING the gate;
          # (B) Appium 3 selected by the section 8 switch after Mobilewright FAILED the gate. Both require the
          # selection to rest on exactly one VALID, ISSUED, dispatched gate authorization and the selected runner's own
          # recorded version equal to its pin. PROTO-U15 (2026-09-24): the compatibility smoke is checked per SUT x
          # platform x selected runner (policy section 9) from manifests/compatibility-smoke-status.yaml, the ORCHESTRATOR
          # mirror of the QUALIFIER-MOBILE-01 records under qualification/compatibility-smoke/; a result for another SUT,
          # platform, or runner never counts, and the study-level compatibility_smoke_status summaries of the toolchain
          # manifest are not read. Selected runner none or anything else, a smoke that is not PASS, or an absent version
          # fails closed. The provenance-only keys selection_kind, transcribed_by_role, and
          # values_before_this_transcription are never read.
          # OP-CI-14 (2026-11-03): the study-wide fallback rule below implements the effective-admissibility rule of v3 sections 9.7.9 to
          # 9.7.11 (the REQUIRED_IMPLEMENTATION_DEPENDENCY_OF_PROTO_U19): it reads the remediation lineage record when one exists and
          # verifies it clause by clause; the per-condition checks below are unchanged except for the mirror-authorization clause.
          surface = cond.split('-')[3]
          if surface in ('ANDROID', 'IOS'):
              try:
                  # The QUALIFIER records, one per assigned SUT: the only files a Smoke records row of E06 may come from (an exact allowlist, not a prefix).
                  QUALIFIER_RECORDS = {'SUT-01': 'qualification/compatibility-smoke-sut01/README.md', 'SUT-02': 'qualification/compatibility-smoke/README.md'}
                  tm = yaml.safe_load(open('manifests/toolchain-manifest.yaml'))['tools']
                  mp = tm['mobile_primary_candidate']; fb = tm['mobile_fallback']; sel = tm.get('mobile_runner_selection') or {}
                  runner = str(sel.get('selected_runner'))
                  gate('a mobile runner is selected: Mobilewright or Appium 3 (policy sections 1, 8)', runner in ('Mobilewright', 'Appium 3'), runner)
                  entry, qual_needed, pin = {}, None, None
                  if runner == 'Appium 3':
                      entry, qual_needed = fb, 'FAILED'
                      pin = str((fb.get('pinned_candidate_version') or {}).get('version'))
                      gate('Appium 3 path: fallback is Appium 3 pinned 3.7.0 and the selection names that pin', str(fb.get('candidate')) == 'Appium 3' and pin == '3.7.0' and str(sel.get('selected_version_pin')) == pin, f"{fb.get('candidate')} {pin} / {sel.get('selected_version_pin')}")
                      gate('Appium 3 path: selection basis is the frozen section 8 switch', 'protocol/mobile-runner-policy-v1.md section 8' in str(sel.get('basis')))
                  elif runner == 'Mobilewright':
                      entry, qual_needed = mp, 'PASSED'
                      pin = str((mp.get('pinned_candidate_version') or {}).get('version'))
                      gate('Mobilewright path: the primary candidate is Mobilewright and the selection names its pin', str(mp.get('candidate')) == 'Mobilewright' and str(sel.get('selected_version_pin')) == pin, f"{mp.get('candidate')} {pin} / {sel.get('selected_version_pin')}")
                  gate('Mobilewright qualification_status matches the selected-runner path (' + str(qual_needed) + ')', qual_needed is not None and mp.get('qualification_status') == qual_needed, str(mp.get('qualification_status')))
                  ga = str(sel.get('human_authorization'))
                  recs = [r for r in (yaml.safe_load(open(p)) for p in sorted(glob.glob('manifests/mobile-qualification-execution-auth-v*.yaml'))) if isinstance(r, dict) and r.get('authorization_id') == ga]
                  gate('the selection rests on exactly one VALID, ISSUED, dispatched gate authorization', len(recs) == 1 and recs[0].get('record_validity') == 'VALID' and recs[0].get('status') == 'ISSUED' and recs[0].get('dispatch_performed') is True, ga)
                  ver = str(entry.get('version') or '').strip()
                  gate('the version of the selected runner itself is recorded and equals its pin', bool(ver) and pin is not None and ver.split()[0] == pin, ver or '(absent)')
                  plat = surface.lower()
                  smk_path = 'manifests/compatibility-smoke-status.yaml'
                  smk = (yaml.safe_load(open(smk_path)) or {}) if os.path.isfile(smk_path) else {}
                  # PROTO-U18 (2026-09-26; IMPLEMENTATION_GAP_AGAINST_FROZEN_MOBILE_RUNNER_POLICY_V2) and OP-CI-14 (2026-11-03; the
                  # REQUIRED_IMPLEMENTATION_DEPENDENCY_OF_PROTO_U19): study-wide fallback rule of protocol/mobile-runner-policy-v3.md,
                  # section 9.5, with the effective-admissibility rule of its sections 9.7.9 to 9.7.11, checked for EVERY mobile
                  # condition before its own smoke. The selected runner stays admissible only if the study-level status (toolchain
                  # mobile_runner_selection.mobile_runner_status) is exactly SELECTED and no UNRESOLVED FAIL_RUNNER of the selected
                  # runner is recorded -- ORCHESTRATOR mirror or QUALIFIER-MOBILE-01 source table -- on ANY SUT x platform. A FAIL_RUNNER
                  # is unresolved unless it is the single historical FAIL_RUNNER named as the trigger by a VERIFIED remediation lineage
                  # record (manifests/mobile-runner-remediation-v1.yaml, 9.7.10): that row is retained, never edited, and no longer counted.
                  # The lineage is verified clause by clause (each a separate gate below, 9.7.9 requirements 1 to 12): the named row is
                  # checked by its authorization, run, result, and row SHA-256; the records it points to by SHA-256; the remediation by its
                  # single authorization, single dispatch, run attempt 1, successor lock, official PASS row, mirror entry, and restoration
                  # basis. The imported artifacts themselves are verified byte-exact against their import records by the validation
                  # workflow (step QUAL-U05, through the export manifest on a public snapshot), not re-hashed here: several are transformed by
                  # the publication-only classes, and every file hashed here is compared through same(), which on a public snapshot
                  # (PUBLIC-EXPORT-MANIFEST.yaml at its root) needs exactly one manifest entry and bridges only UNCHANGED or an alias class.
                  # A FAIL_RUNNER recorded after the lineage record (9.7.11) leaves the lineage valid and is itself unresolved (9.5 applies
                  # again); one that already existed when the status was restored invalidates the lineage (9.7.9, requirement 12). A
                  # source FAIL_RUNNER is verified by its own provenance (the import record of its authorization namespace and the
                  # attribution record of its SUT x platform); a mirror FAIL_RUNNER must match such a row, but the mirror need not show a
                  # historical one. Fallback state, in this order: PROVENANCE_INCONSISTENT_FAIL_CLOSED when a lineage record or restoration
                  # basis exists and does not verify, or when a PASS is recorded after an unresolved FAIL_RUNNER of the same SUT x platform
                  # (no valid lineage); ADMISSIBLE when no unresolved FAIL_RUNNER exists and the status is SELECTED; FALLBACK_EXHAUSTED_VERIFIED
                  # when every unresolved FAIL_RUNNER is verified and the status is UNRESOLVED_AFTER_FALLBACK_FAILURE; any other combination
                  # is PROVENANCE_INCONSISTENT_FAIL_CLOSED (no exhaustion is asserted until reconciled). Every non-admissible state blocks
                  # every mobile condition, including one whose own smoke passed.
