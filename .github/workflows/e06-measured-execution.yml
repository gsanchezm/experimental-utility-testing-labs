    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CONDITION_ID: E06-CS007-SUT01-WEB
      EXECUTOR_PROMPT_VERSION: ${{ inputs.executor_prompt_version }}
      EXPECTED_IDENTITY_ORACLE: item_identity
      OUTPUT_DIR: ${{ github.workspace }}/e06-measured/E06-CS007-SUT01-WEB
      PROVENANCE_JSON: ${{ github.workspace }}/e06-provenance/ci-provenance.json
      RUNTIME_ENVIRONMENT_JSON: ${{ github.workspace }}/e06-provenance/runtime-environment.json
      GATE_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Refuse anything but the first attempt
        run: |
          set -euo pipefail
          test "$GATE_RUN_ATTEMPT" = "1" || { echo "GitHub re-run refused: a repeat needs a new explicit authorization"; exit 1; }
      - name: Check out the executor (sparse, read only; no raw-data path)
        uses: actions/checkout@v4
        with:
          sparse-checkout: ${{ env.E06_CHECKOUT_PATHS }}
          sparse-checkout-cone-mode: true
      - name: Refuse any other SUT's raw-data in the checkout
        run: |
          set -euo pipefail
          test ! -e raw-data || { echo "raw-data is not part of the checkout of a measured job"; exit 1; }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Playwright and its browser
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes --only-binary :all: -r "$E06_EXECUTOR/requirements.txt"
          python3 -m playwright install --with-deps chromium
      - name: Download the provenance record
        uses: actions/download-artifact@v4
        with:
          name: E06-MEASURED_EXPERIMENT-${{ inputs.condition }}-provenance
          path: ${{ github.workspace }}/e06-provenance
