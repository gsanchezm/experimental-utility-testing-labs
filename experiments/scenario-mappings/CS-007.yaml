  DP-1 read-only in business state with reset SESSION_RESET; DP-2 the identifier CS-007; DP-3 the mobile oracle accepted with the static reading of the pinned source recorded before the freeze
  (experiments/E06-cross-platform-parity/static-reading-oracle-draft.md), with the fallback to arrival only for a surface where a non-measured DRY_RUN shows that the item identity cannot be read,
  recorded before the START and never after data; DP-4 the differing sign-in mechanisms of SUT-02 (Android and iOS accept any non-empty credential except the locked-out account, SUT02-EV-0007 and SUT02-EV-0010)
  disclosed as a permitted mechanism variation; DP-5 SUT-03 and SUT-04 COMPARABLE on WEB with their mobile cells not applicable (rule 1 of protocol section 5 as written), never skipped; DP-6 SUT-05 and SUT-06
  NOT_COMPARABLE as recorded (the 29 SUT-05 evidence rows were re-read at the freeze: none documents a post-sign-in catalogue or listing on the web surface); DP-7 the backend of SUT-01 hosted on both surfaces,
  environment_type PUBLIC_HOSTED with HOSTED_MAPPING_UNVERIFIED disclosed (D-E06-2 and D-E06-8); DP-8 WEB and ANDROID, iOS deferred and recorded untested; DP-9 one market with its default language and one account
  per ecosystem, fixed per condition in the campaign configuration (the market changes the language of the catalogue: SUT01-EV-0027, SUT01-EV-0028).
  Evidence gaps disclosed at the freeze (each is a configuration item or a DRY_RUN observation, not a mapping input): SUT-01: mobile catalogue item identifiers and rendering: not evidenced as an E01 row (DP-3; the static reading is the configuration item); Android arrival at the catalogue after btn-login: not evidenced as a row; default-behaviour account: not stated (SUT01-EV-0015, SUT01-EV-0018 to SUT01-EV-0021); backend endpoint of the release build: not stated in an E01 row (a compile-time constant of the pinned release, frontend-mobile/src/api/client.ts line 27; classification decided under DP-7); SUT-02: Android standard-account catalogue item name: not evidenced as a row (DP-3; the static reading is the configuration item); iOS sign-in accepts any credential (SUT02-EV-0010): disclosed; iOS deferred (DP-8); SUT-03: listing item identifiers: a configuration item, not a mapping input; SUT-04: the post-sign-in redirect target is named by SUT04-EV-0002 but the listing's visibility to the administrator is not restated in a row: observed by the DRY_RUN before the START; SUT-05: web post-sign-in catalogue or listing: no row among the 29 (full text scanned for product, catalog, catalogue, listing, browse, shop); SUT-06: none;
  Estimand: the SAP section 4.3 variable "parity presence proportion per canonical scenario" is decided in manifests/campaign-execution-decisions-v17.yaml (D-E06-7): paired per index, parity proportion per ecosystem
  with a Wilson 95% interval, the effect SUT-01 versus SUT-02 by risk difference and Fisher's exact test, descriptive in weight (one canonical scenario gives one scenario pair per comparison). Between-ecosystem comparisons are made only on canonical scenarios in which both
  ecosystems are COMPARABLE (protocol/statistical-analysis-plan-v1.md, section 4.1). Nothing in this record is a result, and no value in it is computed.
