# DRAFT - candidate canonical scenario for the E06 mobile suite (proposed file experiments/scenario-mappings/CS-007.yaml).
# Structure follows experiments/scenario-mappings/CS-003.yaml; order follows protocol/equivalent-scenario-mapping-v1.md, section 3
# (ecosystem-neutral canonical intent first, then the six mapping entries, then the design points).
#
# STATUS: DRAFT. Nothing here freezes, starts, authorizes, or dispatches anything. It is not an input to any campaign configuration,
# workflow, or run. A frozen record is never edited; a later change is a new version file (protocol/equivalent-scenario-mapping-v1.md, section 6).
#
# EVIDENCE BASIS: every evidence_id is a row of the E01 evidence files on the audit branches (audit/e01-sut0N-*:audits/SUT-0N-*/evidence.csv),
# read for this draft. The E01 adjudicated matrix under derived-data/ was NOT read (common rule 2 of the brief). No qualification record,
# Mobilewright realization, or smoke record is cited as evidence (protocol/mobile-runner-policy-v3.md, section 3). Where E01 has no row for a
# step, the step says "not evidenced" and is listed in evidence_gaps; nothing is borrowed from another record.
#
# IDENTIFIER: CS-007 is a candidate. CS-001 to CS-003 exist, and CS-002 is excluded and preserved. The human research lead confirms the identifier (DP-2).
#
# SCAFFOLDING: the keys provisional_reading, evidence_gaps, and design_points are DRAFT-only. At freeze they are removed or folded into
# notes (CS-003 kept its design points in notes). experiments/scenario-mappings/*.yaml is parsed by the validation workflow
# (.github/workflows/e03-validate.yml, line 82); its mapping checks are CS-001-specific, and no schema covers mapping records.
# MARKERS: "HUMAN DECISION" marks a design point with a recommended answer. Comparability is null (undecided) in DRAFT; "provisional_reading"
# gives the reading this draft would use if the human research lead accepts it.

version: 1
canonical_scenario_id: CS-007  # candidate; see DP-2
description: >
  An actor holding the standard identity that an ecosystem requires signs in on one surface and reaches the authenticated catalogue of that
  ecosystem's business objects. An observer verifies the arrival and the identity of the catalogue position fixed for the run. The scenario
  alters no business state; its only server-side effect is the session created by the sign-in, which the per-run reset ends.
precondition_class: CLEAN_SESSION
actor_state: AUTHENTICATED_STANDARD
business_intent: >
  An actor holding the standard identity signs in and reaches the authenticated catalogue of business objects, where the identity of one
  object is presented to the actor.
target_state_or_transition: >
  The actor's view is the authenticated catalogue of the ecosystem, and the object at the catalogue position fixed for the run presents the same
  identity on every surface of the same ecosystem, for the same account and the same market or locale parameter.
observable_oracle_class: UI_STATE
reset_requirement: SESSION_RESET
applicable_surfaces: [WEB, ANDROID, IOS]
allowed_domain_mapping: >
  The business object may vary (for example product, room, item, or basket). Vocabulary, selectors, the sign-in mechanism (documented account, form, or a login
  that accepts any credential), and the number of steps may vary; these differences are measured and disclosed. May NOT vary: the actor state
  (a standard identity presented through the scenario), the sign-in as the only server-side action, the target transition (arrival and identity),
  the observable oracle class (UI_STATE), reset SESSION_RESET, and the catalogue position, which is fixed per run. The market or locale parameter and the
  account are fixed per condition in the campaign configuration, never chosen per execution.
campaigns_using: [E06-cross-platform-parity]
mapping_status: DRAFT
frozen_at: null
approved_by: null
