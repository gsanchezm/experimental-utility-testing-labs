design_points:
  - id: DP-1
    question: "Read-only intent (reset SESSION_RESET, this draft) or a state-changing intent (one business object with a reset)?"
    options:
      - "read-only in business state, with reset SESSION_RESET (the per-run session end that the CLEAN_SESSION precondition requires; CS-003 DP-2 rejected NONE for the same reason); a controlled instance is not required by section 10.3 if the sign-in is classified as non-state-changing (DP-7)"
      - "state-changing: needs a controlled instance and the reset path; E01 has no add-to-cart row on SUT-02 Android or iOS (CS-003, SUT-02 justification), and SUT-01 mobile establishment is an API seed (SUT01-EV-0030), which the scenario would then have to contain"
    recommended: read-only
    status: HUMAN DECISION
  - id: DP-2
    question: "Confirm the identifier CS-007."
    options: ["CS-007 (next free number; CS-002 is excluded and preserved)", "another identifier"]
    recommended: CS-007
    status: HUMAN DECISION
  - id: DP-3
    question: "Mobile oracle: accept a provisional COMPARABLE for the Android cells with the item-level selector as a configuration item, or narrow the mobile oracle to arrival only?"
    options:
      - "accept, provided the selectors are read from the pinned source and recorded in the campaign configuration before the mapping freeze"
      - "narrow to arrival (screen-level), a weaker oracle that every mobile cell can support from E01 rows"
      - "commission new E01 evidence rows (a change under protocol/change-control-v1.md, section 5; E01 is FROZEN)"
    recommended: "accept, with the static reading recorded before the freeze; fall back to arrival only if the reading fails"
    status: HUMAN DECISION
  - id: DP-4
    question: "Disclose the differing sign-in mechanisms (SUT-02 Android and iOS accept any non-empty credential except the locked-out account, SUT02-EV-0007 and SUT02-EV-0010)?"
    options: ["disclose as a permitted mechanism variation", "exclude SUT-02 mobile cells"]
    recommended: "disclose as a permitted mechanism variation"
    status: HUMAN DECISION
  - id: DP-5
    question: "Comparability of web-only ecosystems (SUT-03, SUT-04): COMPARABLE on [WEB] with mobile cells not applicable, or NOT_COMPARABLE?"
    options:
      - "COMPARABLE on [WEB] (rule 1 of protocol section 5 as written), parity cells not applicable"
      - "NOT_COMPARABLE with a two-platform scenario constraint, added before the freeze (not after results)"
    recommended: "COMPARABLE on [WEB], parity cells recorded as not applicable"
    status: HUMAN DECISION
  - id: DP-6
    question: "SUT-05 provisional NOT_COMPARABLE on evidence grounds; SUT-06 NOT_COMPARABLE (NO_EQUIVALENT_INTENT)."
    options: ["keep both as drafted", "reopen SUT-05 only by an E01 evidence record under protocol/change-control-v1.md, section 5 (E01 is FROZEN; none of the 29 rows documents a web listing)"]
    recommended: "keep both; check the SUT-05 web rows once before the freeze"
    status: HUMAN DECISION
  - id: DP-7
    question: "Backend classification for SUT-01 mobile: the repository does not state where the release build's backend endpoint is configured."
    options:
      - "check first whether the endpoint is configurable without modifying the build; if yes, use the controlled SUT-01 backend (verified on GitHub Actions for web and API, experiments/E03-resetability/controlled-instance-status.yaml)"
      - "if not configurable: read-only sign-in classified by a human decision under protocol/study-design-v1.md, section 10.3, as non-state-changing, with environment_type PUBLIC_HOSTED recorded and disclosed, and the HOSTED_MAPPING_UNVERIFIED caveat of manifests/sut-manifest.yaml (SUT-01 web and api notes) stated as a version-provenance limit"
      - "drop SUT-01 mobile cells"
    recommended: "first option if the endpoint check succeeds; otherwise the second, with the classification recorded"
    status: HUMAN DECISION
  - id: DP-8
    question: "Platforms in the first wave."
    options: ["WEB and ANDROID; iOS deferred", "WEB, ANDROID, and IOS"]
    recommended: "WEB and ANDROID; iOS deferred"
    status: HUMAN DECISION
  - id: DP-9
    question: "Market or locale and account per condition (the market changes the language of the catalogue: SUT01-EV-0027, SUT01-EV-0028)."
    options: ["one market with its default language, one account per ecosystem", "several markets"]
    recommended: "one market with its default language, one account per ecosystem"
    status: HUMAN DECISION

notes: >
  Estimand (the SAP section 4.3 variable "parity presence proportion per canonical scenario") is not defined in this draft; it is decided in the
  brief (decision HD-12). Between-ecosystem comparisons are made only on canonical scenarios in which both ecosystems are COMPARABLE
  (protocol/statistical-analysis-plan-v1.md, section 4.1). Nothing in this draft is a result, and no value in it is computed.
