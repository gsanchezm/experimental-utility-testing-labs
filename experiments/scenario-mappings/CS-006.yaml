notes: >
  FROZEN 2026-11-19 (E07-CS006-FREEZE-AUTH-01). This record is the WEB -> API direction of the E07 pair; CS-005.yaml is the API -> WEB direction. Design points DP-1 to DP-9, each decided by the human research lead before the freeze as recorded in
  manifests/campaign-execution-decisions-v10.yaml to -v14.yaml and manifests/cs-006-freeze-v1.yaml (a frozen record is never edited; a change after the freeze is a new version file).
  DP-1 CLEAN_SESSION, DP-2 AUTHENTICATED_STANDARD, DP-3 one record per direction, DP-4 strict: DECIDED 2026-11-18.
  DP-5 identity keys and oracle. DECIDED 2026-11-18 (D-E07-9): SUT-01 = the sid claim of the login token and the cart line (pizza_id p02, quantity 1); SUT-04 = the run-unique guest names and the check-in and check-out dates
    of room 1; declared in the campaign configuration before the first attempt; a key that is not observable on the API layer is not used. VERIFIED requires every declared key and attribute to match. The oracle stays OTHER, with the free text above.
  DP-6 reset. DECIDED 2026-11-18 (D-E07-8): DATA_RESET between attempts, outside the measured scenario and not counted, as CS-003 DP-2. The reset
    realizations are those of the entries above (SUT-01: session clear through the API and a new browser context per execution; SUT-04: deletion through the booking API of the bookings that carry the condition's guest names).
  DP-7 evidence sufficiency for the establishment surface. SUT-05: decided NOT_COMPARABLE (D-E07-3). SUT-01 (the add-to-cart reaching
    the server cart) was an open cell; it is decided COMPARABLE, to be measured (D-E07-11, 2026-11-19). SUT-04 is not a gap in this direction (SUT04-EV-0028).
  DP-8 continuity proportion. The denominator is not defined in the SAP. DECIDED 2026-11-18 (D-E07-10): VERIFIED / all valid measured attempts is the
    primary proportion, with the conditional version reported apart, both with a Wilson interval; fixed in the campaign configuration before the first attempt. With DP-4
    strict no CONFIRMATORY H4 continuity comparison is evaluable, so the proportions are descriptive with Wilson intervals (D-E07-5).
  DP-9 scope. The E07 README lists API -> Android, API -> iOS and Web -> API. This record covers WEB and API only, as the human research
    lead decided on 2026-11-05 for the minimum campaign set; a later mobile record needs the compatibility smoke and the mobile policy
    (protocol/mobile-runner-policy-v3.md). The scope note is added to the E07 README (decision D-E07-7).
  Not decided here: the condition list, the sample size, the exclusion and attribution rules, and the CONFIRMATORY list (empty under DP-4 strict).
    These belong to the campaign configuration of E07 (experiments/E07-cross-layer-continuity/README.md, "Campaign configuration", once the campaign starts).
  Lifecycle: a frozen mapping record is never edited; a change is a new version file and one mapping-record row in the change log
    (protocol/equivalent-scenario-mapping-v1.md, section 6).
