version: 1
canonical_scenario_id: CS-006
description: >
  Starting from a clean session, an actor authenticates, establishes one unit of session-scoped or resource-scoped business
  state through the user-interface (WEB) layer, and the same unit is then verified through the programmatic (API) layer by a
  read-only observation that matches the identity keys and the declared attributes recorded at establishment. The business
  object varies by ecosystem (cart, basket, or booking). The semantic intent (an actor establishes a unit of business state
  through one layer and observes that same unit through another layer) does not vary.
precondition_class: CLEAN_SESSION  # DP-1 DECIDED 2026-11-18 (D-E07-4): CLEAN_SESSION, as in CS-003 DP-1 and CS-005.
actor_state: AUTHENTICATED_STANDARD  # DP-2 DECIDED 2026-11-18 (D-E07-4): AUTHENTICATED_STANDARD, as in CS-003 DP-5 and CS-005.
business_intent: >
  An actor holding the standard identity that the ecosystem requires establishes one purchasable or reservable unit in a
  session- or resource-scoped business object through the user interface, and verifies through the programmatic interface
  that the same unit, with the same identity, is present.
target_state_or_transition: >
  After establishment: the user interface reports the declared unit as established (for example the cart badge, the basket view,
  or the booking confirmation). After verification: the same unit, with the same identity keys and attributes, is observed on the
  programmatic layer by a read-only observation that changes no state.
observable_oracle_class: OTHER
observable_oracle_class_text: >
  Cross-layer consistency check (protocol/equivalent-scenario-mapping-v1.md, section 3, OTHER with free text): the identity
  keys and declared attributes recorded from the WEB establishment are observed unchanged on the API layer. The check passes only
  when every declared key and attribute is observed and matches.
reset_requirement: DATA_RESET  # Restored between attempts by the campaign harness, outside the measured scenario (as CS-003 DP-2 and CS-005).
applicable_surfaces: [WEB, API]  # ANDROID and IOS are outside the web/API scope of this record (see notes, DP-9).
allowed_domain_mapping: >
  The business object may vary (cart, basket, booking). Vocabulary, endpoint names, selectors, identifier formats and the number
  of steps may vary. The establishment layer (WEB) and the verification layer (API) are fixed for this record. May NOT vary:
  (1) the actor must be authenticated for establishment; (2) the unit must be established by the actor through the user
  interface of the ecosystem, not referenced as a pre-existing fixture (DP-4, decided strict on 2026-11-18, D-E07-1);
  (3) the verification must be read-only and must observe the same unit whose identity keys were recorded at establishment;
  (4) the clean starting state must be checked before establishment and restored between attempts. Scenario-specific constraint:
  the identity keys and the declared attributes of each ecosystem are fixed in the campaign configuration before the first attempt.
campaigns_using: [E07-cross-layer-continuity]
mapping_status: FROZEN
frozen_at: "2026-11-19"
approved_by: gilbertosanchez
