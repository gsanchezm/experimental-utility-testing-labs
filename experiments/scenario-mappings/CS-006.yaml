    surfaces_used: [WEB, API]
    domain_object: "cart (pizza order items)"
    precondition_realization: "Clean session of the declared controlled instance; the session cart is checked empty on the API layer before establishment and the web client's persisted cart is empty. Session identity: the JWT claim sid of the login token (SUT01-EV-0002, SUT01-EV-0007)."
    actor_realization: "Documented standard test account; the actor authenticates inside the scenario (CLEAN_SESSION) and the web client receives the token (SUT01-EV-0002, SUT01-EV-0007)."
    entry_and_steps:
      - "[API, precondition, not counted] POST /api/auth/login with the documented standard account; record the token and its sid claim (SUT01-EV-0007); GET /api/session reads the empty cart (SUT01-EV-0006)."
      - "[WEB, precondition] inject the token and the username into client storage before the first authenticated load (documented 'Web atomic entry', SUT01-EV-0001, SUT01-EV-0002)."
      - "[WEB, establishment] on the catalog, click the add-to-cart control of one catalog line, selected by its data-testid (SUT01-EV-0003); record the line shown in the UI."
      - "[API, verification] GET /api/session with the same token reads the server cart; read-only (SUT01-EV-0006). The check passes only if the line of the establishment is present with the declared keys and attributes."
    oracle_realization: "On the API layer: GET /api/session (SUT01-EV-0006) shows the line established through the UI. No E01 row states whether the user-interface add-to-cart writes the server cart: that is what E07 measures (D-E07-11). The audit's cross-layer text is an architectural inference (audit section 4, Cross-layer State Continuity), and the E03 realization records a client-persisted web cart (experiments/E03-resetability/executor/README.md, section 4.2: the cart is persisted in the client and the README of the SUT states a fallback to the client-side cart)."
    reset_realization: "POST /api/session/reset clears the caller's session cart and resets the profile to its empty default between attempts, outside the scenario (SUT01-EV-0006; as the SUT-01 entry of CS-001.yaml); the web client's persisted cart is cleared by the harness as in the E03 realization. The reset is partial: it does not clear order history (SUT01-EV-0006 notes)."
    environment_type: "PENDING (campaign configuration). For the same ecosystem E03 used SELF_HOSTED instances on GitHub Actions (experiments/E03-resetability/controlled-instance-status.yaml). Not a freeze prerequisite."
    not_comparable_reason: null
