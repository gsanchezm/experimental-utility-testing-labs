notes: >
  DRAFT. Design points DP-1 to DP-9 are decided by the human research lead, not by this draft. The recommended answers are
  given so that the decision can be taken quickly.
  DP-1 precondition_class. Options: CLEAN_SESSION (login inside the measured scenario, as CS-003) or AUTHENTICATED_SESSION
    (login as provisioning, as CS-001). Recommendation: CLEAN_SESSION. Continuity depends on the session identity that the login
    creates, so the login belongs to the scenario. HUMAN DECISION.
  DP-2 actor_state. Recommendation: AUTHENTICATED_STANDARD, the CS-003 DP-5 choice, which keeps the SUT-04 administrator account.
    HUMAN DECISION.
  DP-3 direction. Options: (a) one record per direction (CS-005 API -> WEB, CS-006 WEB -> API); (b) one record with the direction
    as an independent variable. Option (b) needs a per-direction field that the mapping template (section 7) does not have.
    Recommendation: (a). HUMAN DECISION.
  DP-4 established-state standard (decisive for SUT-03). Options: (a) strict: the unit must be created by the actor through the
    programmatic interface, as CS-001 and CS-003 require for the business object; (b) referenced: a pre-existing entity
    selected by a fixed identifier also counts as established state. The E07 README (Required evidence, "created or referenced
    during establishment") reads toward (b). Under (b), SUT-03 would be decided by the fixed-account identifiers of SUT03-EV-0006
    to SUT03-EV-0008, and any "continuity" would hold by construction. Recommendation: (a). Under (a), SUT-03 is NOT_COMPARABLE
    for this record and for CS-006, so no CONFIRMATORY continuity comparison of SUT-01 against SUT-03 is evaluable. HUMAN DECISION.
  DP-5 identity keys and oracle. Recommendation: each ecosystem declares, before the first attempt, the identity keys (for example
    the session sid, the run-unique guest names and check-in date, the basket id) and the attributes that the WEB check must
    match. VERIFIED requires every declared key and attribute to match. The oracle stays OTHER, with the free text above. HUMAN DECISION.
  DP-6 reset. Recommendation: DATA_RESET between attempts, outside the measured scenario and not counted, as CS-003 DP-2.
    The reset realizations are those of CS-001.yaml. HUMAN DECISION.
  DP-7 evidence sufficiency for the verification surfaces. Gaps: SUT-04 has no E01 row for the admin booking listing; the cookie
    injection of option (b) of the SUT-04 precondition is not evidenced; SUT-05 has no E01 row for the web basket. Options:
    (a) a new E01 evidence supplement under protocol/change-control-v1.md; (b) source-line citations in the campaign configuration (not E01 evidence,
    and a departure from the mapping rule's "E01 evidence" wording); (c) leave the entry NOT_COMPARABLE with reason OTHER until
    the gap closes. Recommendation: (a) for SUT-04 only if the human research lead wants the specialist's continuity profile,
    otherwise (c); (c) for SUT-05. HUMAN DECISION.
  DP-8 continuity proportion. The denominator is not defined in the SAP. Options: (A) VERIFIED / all valid measured attempts
    (establishment failures count as not verified); (B) VERIFIED / attempts whose establishment succeeded. Recommendation: A as
    the H4 variable, with B reported descriptively. Both are fixed in the campaign configuration before the first attempt. HUMAN DECISION.
  DP-9 scope. The E07 README lists API -> Android, API -> iOS and Web -> API. This draft covers WEB and API only, as the human research
    lead decided on 2026-11-05 for the minimum campaign set. A later mobile record needs the compatibility smoke and the mobile policy
    (protocol/mobile-runner-policy-v3.md). The README's candidate pair list needs a scope note; this draft does not edit it. HUMAN DECISION.
  Not decided here: the identity key list per ecosystem, the condition list, the sample size, the exclusion and attribution rules,
    and the CONFIRMATORY list. These belong to the E07 campaign configuration (campaign-configuration-draft.md).
  Lifecycle: a frozen mapping record is never edited; a change is a new version file and one mapping-record row in the change log
    (protocol/equivalent-scenario-mapping-v1.md, section 6).
