# Proposed repository path when promoted: experiments/scenario-mappings/CS-005.yaml
# Prepared 2026-11-05 for the E07-cross-layer-continuity design brief (web and API layers only).
# Structure: protocol/equivalent-scenario-mapping-v1.md, sections 3, 4 and 7.
# Order (section 6): the canonical intent below is ecosystem-neutral and is written first; the six mapping entries follow.
# Scope of this record: direction API -> WEB only (establishment through the API layer, verification through the WEB layer).
#   The reverse direction (WEB -> API) is proposed as CS-006 in design-brief-draft.md, section 5, and is not drafted here.
# CS-005 is the next unused identifier: CS-001 FROZEN, CS-002 EXCLUDED_FROM_CAMPAIGN and preserved, CS-003 FROZEN (E02).
# Evidence: E01 rows are read from the SUBMITTED audit branches audit/e01-sut0N-* (the audits/ directories on the main branch
#   are templates, as stated in the header of experiments/scenario-mappings/CS-001.yaml, PROTO-U07).
#   The E01 adjudicated matrix was NOT consulted (the task's common rule 2 forbids reading derived-data); the confirmed_score
#   values quoted in design-brief-draft.md are the auditors' SUBMITTED values and must be checked against the adjudicated matrix
#   by the ORCHESTRATOR before any freeze.
# Values marked HUMAN DECISION are null in this DRAFT. The comment beside each one gives the recommendation.

version: 1
canonical_scenario_id: CS-005
description: >
  Starting from a clean session, an actor authenticates, establishes one unit of session-scoped or resource-scoped business
  state through the programmatic (API) layer, and the same unit is then verified through the user-interface (WEB) layer by a
  read-only observation that matches the identity keys and the declared attributes recorded at establishment. The business
  object varies by ecosystem (cart, basket, or booking). The semantic intent (an actor establishes a unit of business state
  through one layer and observes that same unit through another layer) does not vary.
precondition_class: CLEAN_SESSION  # DP-1 (HUMAN DECISION). Recommendation: CLEAN_SESSION, as in CS-003 DP-1.
actor_state: AUTHENTICATED_STANDARD  # DP-2 (HUMAN DECISION). Recommendation: AUTHENTICATED_STANDARD, as in CS-003 DP-5.
business_intent: >
  An actor holding the standard identity that the ecosystem requires establishes one purchasable or reservable unit in a
  session- or resource-scoped business object through the programmatic interface, and verifies through the user interface
  that the same unit, with the same identity, is visible.
target_state_or_transition: >
  After establishment: the business object holds exactly the declared unit, with its declared identity keys and attributes,
  as read back on the programmatic layer. After verification: the same unit, with the same identity keys and attributes, is
  observed on the user-interface layer by a read-only observation that changes no state.
observable_oracle_class: OTHER
observable_oracle_class_text: >
  Cross-layer consistency check (protocol/equivalent-scenario-mapping-v1.md, section 3, OTHER with free text): the identity
  keys and declared attributes recorded from the establishment response or read-back on the API layer are observed unchanged
  on the WEB layer. The check passes only when every declared key and attribute is observed and matches.
reset_requirement: DATA_RESET  # Restored between attempts by the campaign harness, outside the measured scenario (as CS-003 DP-2).
applicable_surfaces: [WEB, API]  # ANDROID and IOS are outside the web/API scope of this draft (see notes, DP-9).
allowed_domain_mapping: >
  The business object may vary (cart, basket, booking). Vocabulary, endpoint names, selectors, identifier formats and the number
  of steps may vary. The establishment layer (API) and the verification layer (WEB) are fixed for this record. May NOT vary:
  (1) the actor must be authenticated for establishment; (2) the unit must be established by the actor through the ecosystem's
  documented programmatic interface, not referenced as a pre-existing fixture (DP-4); (3) the verification must be read-only
  and must observe the same unit whose identity keys were recorded at establishment; (4) the clean starting state must be
  checked before establishment and restored between attempts. Scenario-specific constraint: the identity keys and the declared
  attributes of each ecosystem are fixed in the campaign configuration before the first attempt.
campaigns_using: [E07-cross-layer-continuity]
mapping_status: DRAFT
