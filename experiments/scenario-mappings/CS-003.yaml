# experiments/scenario-mappings/CS-003.yaml
# Canonical experimental intent + per-ecosystem mapping, per protocol/equivalent-scenario-mapping-v1.md, for the campaign E02-state-establishment.
# Author: ORCHESTRATOR. Prepared 2026-11-02 on the human research lead's approval of the same day (item 2 of the answer "1 y 2 sí cada uno y actualiza el tablero,
# además de proponer nueva fecha"), after the ORCHESTRATOR's finding that experiments/scenario-mappings/CS-001.yaml is scoped to E03-resetability (campaigns_using),
# is FROZEN, and cannot be reused or edited by E02 (a frozen record is never edited, protocol/equivalent-scenario-mapping-v1.md, section 6).
#
# STATUS: FROZEN 2026-11-02, approved by gilbertosanchez (authorization id E02-CS003-FREEZE-AUTH-01, assigned by the ORCHESTRATOR to the approval recorded in
# manifests/cs-003-freeze-v1.yaml). The five design points DP-1 to DP-5 in `notes` were decided by the human research lead as the ORCHESTRATOR had recommended them. A frozen mapping
# record is never edited (protocol/equivalent-scenario-mapping-v1.md, section 6); a change is a new version file, CS-003-v2.yaml, with its own mapping-record row of protocol/CHANGELOG.md.
# Freeze history: created as a DRAFT on 2026-11-02; at the freeze only the status fields, this block, `notes`, and the wording "this draft" in four places of the mapping entries (now
# "this record") changed. It is not an input to any campaign configuration, workflow, or run until the campaign configuration of E02 names it.
#
# Order of writing (section 6): the canonical record below was written first, in ecosystem-neutral terms, by restating the establishing half of the already frozen
# canonical intent of CS-001 (itself written independently of any ecosystem implementation); it names no ecosystem. The six mapping entries follow. Every entry cites
# E01 evidence by evidence_id, read from each SUT's own audit branch (audit/e01-sut0N-*; the audits/ directories on main are unmerged templates, PROTO-U07). The
# micro-steps, selectors, and counts of a realization are fixed by the campaign configuration of E02 when it is locked, not by this record; the counts quoted below
# are indicative under protocol/setup-effort-v2.md, section 5, rules 1, 3, and 8, and are not predeclared counts.

version: 1
canonical_scenario_id: CS-003
description: >
  Starting from a clean session, an actor obtains the identity that the ecosystem requires and establishes one unit of session-scoped or resource-scoped business
  state beyond the clean starting state (for example one item placed in a cart or basket, or one booking created), and the attainment of that state is verified by
  an observation of the declared oracle class. The business object varies by ecosystem (cart, basket, or booking); the semantic intent -- an actor establishes a unit of
  business state and verifies that it holds -- does not (protocol/equivalent-scenario-mapping-v1.md, section 2). It is the establishing half of the intent that
  experiments/scenario-mappings/CS-001.yaml (FROZEN, E03-resetability) restores from; the reset is not part of this scenario.
precondition_class: CLEAN_SESSION
actor_state: AUTHENTICATED_STANDARD
business_intent: >
  An actor holding the standard (non-privileged-by-design) identity that the ecosystem requires adds a purchasable or reservable item to a session- or
  resource-scoped business object (a cart, basket, or booking) and verifies that the object holds it.
target_state_or_transition: >
  Before the actor acts: the clean starting state of the declared controlled instance, with no business state attributable to the actor. After the scenario: the actor's
  business object holds exactly the item(s) established, and that is verified by an observation of the declared oracle class, independently of the action that
  established it.
observable_oracle_class: BUSINESS_STATE
reset_requirement: DATA_RESET
applicable_surfaces: [WEB, API, ANDROID, IOS]
allowed_domain_mapping: >
  Business object may vary: cart (SUT-01, SUT-02, SUT-03), booking (SUT-04), basket (SUT-05). Vocabulary, endpoint names, selectors, and number of steps may vary.
  The mechanism class used to establish the state may vary (UI flow, API seed, direct route, predefined account, client-state injection, per the establishment_mechanisms
  vocabulary of protocol/setup-effort-v1.md, section 10) -- the mechanism itself is part of what E02 measures, not a constraint on equivalence. May NOT vary: the
  actor must reach the target state through the ecosystem's own documented mechanisms; the established state must be a business object the actor established
  (not a fixture the study seeds out-of-band as the target); the verification must observe that same business object. Scenario-specific constraint: the established
  item(s) must be attributable to the specific actor's own action (rule 5, comparability). The reset requirement is met by the campaign harness between runs, outside
  the measured scenario, with the realization recorded for CS-001 where one exists (it is not counted in the Required Actions of E02).
campaigns_using: [E02-state-establishment]
mapping_status: FROZEN
frozen_at: "2026-11-02"
approved_by: gilbertosanchez
mappings:
