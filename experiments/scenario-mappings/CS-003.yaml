    comparability: COMPARABLE
    surfaces_used: [WEB, API]
    domain_object: "cart (pizza order items)"
    precondition_realization: >
      A clean session of the declared controlled instance; no authenticated session exists before the actor acts. The API login of SUT01-EV-0007 starts the session
      (a fixed TEST_USERS account, SUT01-EV-0005 for the documented accounts and endpoints).
    actor_realization: "Standard documented test account authenticated through POST /api/auth/login, which returns a JWT (SUT01-EV-0007); on the web surface the token is carried into the client through the documented 'Web atomic entry' injection (SUT01-EV-0001, SUT01-EV-0002)."
    entry_and_steps:
      - "[api surface] [API] POST /api/auth/login with the documented standard account -- returns the token (SUT01-EV-0007). Authentication counts (setup-effort-v2 section 5, rule 3)."
      - "[api surface] [API] POST /api/cart with one catalog line -- seeds the caller's session cart server-side (SUT01-EV-0004, SUT01-EV-0005)."
      - "[api surface] [API, verification] GET /api/session (or GET /api/cart) -- confirms the cart holds exactly the line (SUT01-EV-0005; rule 8, A2). Indicative Required Actions -- establish (api): 3."
      - "[web surface] [API] POST /api/auth/login as above (SUT01-EV-0007)."
      - "[web surface] [state/configuration] inject the auth token and username into the browser's client storage (the documented 'Web atomic entry', SUT01-EV-0001, SUT01-EV-0002), so the client treats the session as authenticated without replaying the login UI."
      - "[web surface] [API] POST /api/cart with one catalog line (SUT01-EV-0004)."
      - "[web surface] [navigation] open the Checkout route -- it hydrates the cart from GET /api/cart on mount (SUT01-EV-0004)."
      - "[web surface] [UI, verification] read the Checkout view for the established order line (SUT01-EV-0004). Indicative Required Actions -- establish (web): 5 or more; the exact micro-steps (for example a first load that gives the client storage an origin) are fixed by the campaign realization and may add navigation actions."
    oracle_realization: >
      GET /api/cart or GET /api/session (the server-side session cart, SUT01-EV-0004, SUT01-EV-0005), or the Checkout view rendering the seeded items on mount (SUT01-EV-0004,
      'Cart Hydration').
    reset_realization: >
      As experiments/scenario-mappings/CS-001.yaml, SUT-01 entry (POST /api/session/reset, SUT01-EV-0006); used only to return to the declared clean starting state between runs;
      not counted in E02.
    environment_type: "PENDING -- not a mapping-freeze prerequisite (protocol/study-design-v1.md section 10.3); fixed per condition in the campaign configuration of E02. For reference only: E03 verified controlled instances for this ecosystem (experiments/E03-resetability/controlled-instance-status.yaml); that is E03 evidence, not E02 evidence."
    not_comparable_reason: null
    evidence_ids: [SUT01-EV-0001, SUT01-EV-0002, SUT01-EV-0004, SUT01-EV-0005, SUT01-EV-0006, SUT01-EV-0007]
