notes: >
  FROZEN 2026-11-02 (E02-CS003-FREEZE-AUTH-01). Design points DP-1 to DP-5, each decided by the human research lead before the freeze as recorded in manifests/cs-003-freeze-v1.yaml (a frozen record is never edited; a change after the freeze is a new version file).
  DP-1 (precondition_class CLEAN_SESSION, so authentication is inside the measured scenario): rule 3 of protocol/setup-effort-v2.md counts every login, and the declared starting state of
  rule 6 decides whether the login is counted. Decided: CLEAN_SESSION, because the effort to obtain the required identity is part of the effort to establish a state and differs by
  mechanism (a login form, a token request, a client-storage injection); the alternative is AUTHENTICATED_SESSION as in CS-001, with the login in provisioning and not counted, which gives
  smaller and more similar counts but removes that difference from the measurement.
  DP-2 (reset_requirement DATA_RESET): the reset is needed only between runs and is not counted; the alternative NONE would hide that each run needs a restored starting state. Decided: DATA_RESET.
  DP-3 (observable_oracle_class BUSINESS_STATE, with SUT-03 realized as UI_STATE): the deviation is the one CS-001 froze. Decided: keep.
  DP-4 (surfaces): only surfaces with E01 evidence of the establishment itself are mapped (SUT-01 web and api, SUT-02 web, SUT-03 web, SUT-04 web and api, SUT-05 api); the mobile surfaces
  and the web surface of SUT-05 carry no E01 row for the establishment and are left unmapped rather than inferred. Decided: keep, and add a surface only by a new version with its evidence.
  DP-5 (actor_state AUTHENTICATED_STANDARD for every ecosystem): SUT-04 creates a booking without authentication, so its login is an action the ecosystem does not require for the target
  state, and the seeded account is an administrator; CS-001 froze the same choice for its reset. Alternatives: OTHER with the explanation 'the identity the ecosystem requires', which would
  let SUT-04 establish a booking as a guest and count fewer actions, at the cost of a less uniform actor. Decided: AUTHENTICATED_STANDARD, for continuity with CS-001 and comparability with E03.
  Not decided here: which mechanisms (UI_FLOW, API_SEED, DIRECT_ROUTE, PREDEFINED_ACCOUNT, and the others) E02 compares per ecosystem, the starting-state declaration, the predeclared counts, the
  controlled-instance determination per condition, and the sample size; those belong to the campaign configuration of E02. The E03 executor (experiments/E03-resetability/executor/README.md, section 4)
  documents an executed establishment procedure for SUT-01 to SUT-05 as a reference for the realization; it is implementation, not evidence for this record. No claim is made that the mechanisms
  listed here are the lightest, the most natural, or the ones E02 will measure.
