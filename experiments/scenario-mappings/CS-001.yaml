    comparability: COMPARABLE
    surfaces_used: [WEB, API]
    domain_object: "booking (room reservation)"
    precondition_realization: "Cookie-token login via POST /auth/login with the seeded admin/password account (SUT04-EV-0008)."
    actor_realization: "Deterministic seeded admin account, SUT04-EV-0003 (cited by SUT04-EV-0008), token-based authorization."
