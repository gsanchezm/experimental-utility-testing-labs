      - "[API, verification] GET /booking/{bookingid} -- returns 404 NOT_FOUND, confirming removal (SUT04-EV-0006)."
      - "Required Actions -- reset: 2 (1 reset action + 1 API action)."
    oracle_realization: >
      GET /booking/{bookingid} (SUT04-EV-0006); the Home page availability listing also reflects
      the seeded/current room state (SUT04-EV-0004).
    reset_realization: >
      DELETE /booking/{bookingid} removes the specific booking the actor created; a subsequent
      GET /{bookingid} returns 404 NOT_FOUND (SUT04-EV-0006) -- an experimenter-triggered,
      on-demand, per-resource reset. Distinct from, and preferred over for this scenario's per-run
      reset, the periodic env-var-scheduled resetDB() (SUT04-EV-0027, audit.md "Resetability"),
      which is explicitly NOT an on-demand, HTTP-exposed action ("not exposed as an HTTP route in
      any Controller.java") and resets far more than this scenario's own altered state (it wipes
      and reseeds the entire service). reset_mechanisms candidate: [API_RESET].
    environment_type: "PENDING -- not a mapping-freeze prerequisite (section 10.3; PROTO-U08 resolved). Source-inspection candidate only: explicitly self-hostable via docker-compose (manifests/sut-manifest.yaml notes); not execution-verified."
    not_comparable_reason: null
    evidence_ids: [SUT04-EV-0003, SUT04-EV-0004, SUT04-EV-0006, SUT04-EV-0008, SUT04-EV-0027]
    justification: >
      Full CRUD on the booking resource, with an on-demand, per-resource DELETE serving as a clean,
      experimenter-triggered reset of exactly the state this scenario establishes -- SOURCE_VERIFIED
      and directly on point.
  - sut_id: SUT-05
    comparability: COMPARABLE
    surfaces_used: [API]
    domain_object: "basket"
    precondition_realization: >
      POST /rest/user/login with a documented deterministic account issues a JWT (SUT05-EV-0006,
      citing the account set of SUT05-EV-0002).
    actor_realization: "Deterministic named account (admin/jim/bender/etc., SUT05-EV-0002/0006)."
    entry_and_steps:
      - "[state/configuration] POST /basket (or basketItems, SUT05-EV-0008) adds item(s) to the authenticated actor's basket -- route/model existence SOURCE_VERIFIED (SUT05-EV-0008, SUT05-EV-0027); not individually execution-verified by E01. Establish-side; recorded here for completeness of the intent, not counted into the reset-side total below."
      - "[reset] Restart the SUT-05 process -- `sequelize.sync({force: true})` runs on every start, dropping and recreating the entire database and reloading static seed data (SUT05-EV-0003). One experimenter-initiated operation (starting the process) with an observable effect on the whole datastore; classified reset action by purpose (protocol/setup-effort-v2.md section 4), regardless of its ENVIRONMENT_RESTART mechanism."
      - "[API, verification] GET on the basket resource -- confirms the basket is empty post-restart (route existence per SUT05-EV-0008)."
      - "Required Actions -- reset: 2 (1 reset action + 1 API action). This reset mechanism is a full-datastore process restart, not a scoped basket-only reset -- the heaviest mechanism of the six ecosystems in this record; a real RQ2/H2-relevant finding, not a mapping defect (protocol/equivalent-scenario-mapping-v1.md, section 8; setup-effort-v2.md counting rule 7: differing mechanisms between realizations are the measurement)."
    oracle_realization: "GET on the basket resource (route existence per SUT05-EV-0008; not individually execution-verified by E01)."
    reset_realization: >
      Explicitly, no in-session HTTP reset endpoint exists for this ecosystem (audit's own finding,
      SUT05-EV-0003: "no in-session HTTP reset endpoint was found"). The only confirmed reset
      mechanism is a full application restart: `sequelize.sync({force: true})` on every process
      start drops and recreates all tables, then reloads the static seed data (SUT05-EV-0003).
      reset_mechanisms candidate: [ENVIRONMENT_RESTART] -- explicitly heavier than every other SUT's
      mechanism in this record; this is itself a legitimate, disclosed RQ2/H2-relevant finding about
      relative setup effort, not a mapping defect (protocol/equivalent-scenario-mapping-v1.md,
      section 8, cites setup-effort-v1.md counting rule 7: differing step counts/mechanisms between
      realizations are the measurement, not a defect).
    environment_type: "PENDING -- not a mapping-freeze prerequisite (section 10.3; PROTO-U08 resolved). Source-inspection candidate only: Node.js app, documented self-host paths (npm, Docker; prebuilt per-platform archives, manifests/sut-manifest.yaml); not execution-verified. Flagged for particular attention at campaign-configuration lock: this scenario's only reset mechanism requires restarting the process, so a PUBLIC_HOSTED-only instance would make the reset condition NOT_EXECUTABLE_WITHOUT_CONTROLLED_INSTANCE."
    not_comparable_reason: null
    evidence_ids: [SUT05-EV-0002, SUT05-EV-0003, SUT05-EV-0006, SUT05-EV-0008, SUT05-EV-0027]
    justification: >
      A defensible basket-establishment mechanism exists (API routes + models, SOURCE_VERIFIED
      route/model presence), and the reset mechanism, while the heaviest of the six ecosystems
      (full restart, not a scoped reset), is real, SOURCE_VERIFIED, and directly on point for
      reset_requirement DATA_RESET. Marked COMPARABLE rather than NOT_COMPARABLE because condition
      5 of the comparability rule ("the reset requirement can be met") is satisfied by
      ENVIRONMENT_RESTART -- the rule does not require a lightweight mechanism, only that one exists.
  - sut_id: SUT-06
    comparability: NOT_COMPARABLE
    surfaces_used: []
    domain_object: null
    precondition_realization: null
    actor_realization: null
    entry_and_steps: []
    oracle_realization: null
    reset_realization: null
    environment_type: null
    not_comparable_reason: >
      NO_EQUIVALENT_INTENT. This ecosystem is a native-UI-element demonstration app with no
      cart/basket/booking or other purchasable-item business-object concept: its only confirmed
      stateful mechanism is the Data Management screen's four independent, generic per-tier
      key/value storage slots (in-memory, AsyncStorage-tier SQLite, explicit SQLite,
      SecureStore/Keychain-Keystore), each with its own Save/Clear test-hook control
      (SUT06-EV-0007). There is no authenticated actor placing a purchasable item into a business
      object; forcing this scenario's business_intent onto a generic key/value Save/Clear action
      would substitute a different intent (a generic state-storage probe) for this scenario's actual
      intent (an actor-driven business-state establish/reset), which
      protocol/equivalent-scenario-mapping-v1.md, section 5, explicitly forbids ("If... the mapping
      would require... substituting a different intent, the ecosystem is marked NOT_COMPARABLE").
      SUT-06 is the mobile specialist baseline (protocol/study-design-v1.md, section 3); this
      NOT_COMPARABLE marking is not a penalty for narrow scope (rule 11, AGENT-INSTRUCTIONS.md) -- SUT-06's own
      generic per-tier Save/Clear mechanism (SUT06-EV-0007) remains directly relevant to a future,
      differently-scoped canonical scenario built around exactly that mechanism (a state-persistence
      resetability probe), which this record does not define and is not required to.
    evidence_ids: [SUT06-EV-0007]
    justification: >
      No defensible semantic equivalent of "an authenticated actor establishes a purchasable-item
      business state" exists in the evaluated version; the ecosystem's only relevant mechanism
      (generic per-tier Save/Clear) tests a materially different intent (raw persistence-tier
      behavior, not business-state establishment). Recorded with the same discipline used for every
      other ecosystem (protocol/equivalent-scenario-mapping-v1.md, section 5: "recorded with the
      same discipline for every ecosystem, including SUT-01").
