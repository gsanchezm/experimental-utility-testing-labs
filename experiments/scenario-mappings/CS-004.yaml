notes: >
  FROZEN 2026-11-06 (E02-CS004-FREEZE-AUTH-01). Design points DP-1 to DP-8, each decided by the human research lead before the freeze as recorded in manifests/cs-004-freeze-v1.yaml (a frozen record is never edited; a change after the freeze is a new version file).

  DP-1 precondition_class (the independence lever). Decided: SEEDED_BUSINESS_STATE, with the seeding and the authenticated session performed by the actor's own
  documented route before the declared starting state, and not counted (setup-effort-v2 section 5, rule 6). Alternative: CLEAN_SESSION, which counts the add step and the login
  again (setup-effort-v2 section 5, rules 1 and 3); CS-004 would then equal CS-003 plus a navigation, a shape that does not give an independent pair. Trade-off of the decision:
  CS-004 counts measure the checkout-entry problem only; the login and the add step, counted in CS-003 (CS-003 DP-1), are not counted here. Decided: that
  difference is accepted; it is the axis that makes the pair independent.

  DP-2 target_state_or_transition. Decided: checkout-ready, verified in the checkout entry point, with the committing step not performed. Reason: the target is the one
  that the E01 rows support on all three web surfaces (SUT-01: SUT01-EV-0001, SUT01-EV-0004; SUT-02: SUT02-EV-0018; SUT-03: SUT03-EV-0005). Alternative, not chosen: a committed order or booking. It needs an E01 row for the commit on SUT-02 (none exists; the completion page is not cited) and on SUT-01 (no row states the create
  request), it would persist a record that the reset must restore, and it would combine this scenario with CS-001's reset problem.

  DP-3 observable_oracle_class. Decided: UI_STATE for all mapped ecosystems. Reason: on SUT-02 and SUT-03 the cart exists only in the client, so BUSINESS_STATE cannot be
  observed; declaring BUSINESS_STATE would make SUT-02 and SUT-03 NOT_COMPARABLE under the observation rule (protocol/equivalent-scenario-mapping-v1.md, section 5, condition 5)
  and would leave H2 with no pair. This follows the precedent of CS-003 DP-3 (human decision, 2026-11-02). Decided: UI_STATE is confirmed for CS-004. It also raised
  the same question for CS-003, see the discrepancy below.

  DP-4 surfaces. Decided: map WEB only for SUT-01, SUT-02, and SUT-03, the H2 scope (protocol/statistical-analysis-plan-v1.md, section 4.3, paired on the WEB surface,
  per the E03 decision D2 of 2026-10-05; the E02 equivalent is confirmed by this decision). API for SUT-01 is not mapped: the seeding route is an API action, and an API checkout-ready
  observation is not evidenced. ANDROID and IOS are not mapped, as CS-003 DP-4 decided; SUT-03 has no mobile code (SUT03-EV-0010, SUT03-EV-0011).

  DP-5 actor_state. Decided: AUTHENTICATED_STANDARD with the standard accounts listed in each entry. The discrepancy noted in CS-003 DP-5 (its SUT-04 account is an
  administrator) does not arise here, because SUT-04 is NOT_COMPARABLE on this scenario.

  DP-6 reset_requirement. Decided: DATA_RESET, with the between-run restore performed by the harness and not counted. Alternative: NONE, which would hide that each run needs
  a restored starting state (the precedent of CS-003 DP-2). Decided: confirmed.

  DP-7 SUT-04. Decided: NOT_COMPARABLE (NO_EQUIVALENT_INTENT). Alternative: COMPARABLE, treating the reservation form before submission as the checkout-ready state; this
  requires the human research lead to accept that a single form is the equivalent of a container followed by a checkout entry. Not chosen without a new evidence row.

  DP-8 SUT-05. Decided (2026-11-06, as revised): NOT_COMPARABLE with the reason OTHER (EVIDENCE NOT SUFFICIENT FOR COMPARABLE), as the entry above states. The first DRAFT left
  comparability null, which the protocol does not allow at freeze (section 7, template: COMPARABLE or NOT_COMPARABLE is required in every entry at freeze; null is DRAFT only).
  Option not chosen: (a) first record a new, separately recorded source-verification row for the checkout route (not an E01 re-opening; a new evidence record under
  protocol/evidence-rules-v1.md) and map SUT-05 afterwards, which would have delayed the freeze. Chosen: (b) NOT_COMPARABLE with the stated reason, which the current rows cannot support as
  NO_EQUIVALENT_INTENT, and a later CS-004-v2 if the row is recorded.

  N-1 Independence and overlap. On SUT-01 WEB the final read of CS-003 (the Checkout view) and the read of CS-004 are the same observation. The two scenarios differ on the
  precondition and the target, but a SUT's two counts are not statistically independent observations. H2 pairs are per SUT and per scenario; the pairing is not a claim that
  the two counts are independent.

  N-2 Client-cart interplay (realization, not evidence). In the E03 development runs on SUT-01 WEB, the Checkout view showed the line from the client cart after the
  server reset, because the client copy persisted (E03 executor README, section 12, run DV0010). The E02 realization of CS-004 must fix whether the seeded state is
  server-side, client-side, or both, and must verify that the view reflects the intended layer. This is a configuration item, not an E01 claim.

  N-3 SUT-03 reset (realization, not evidence). The E03 executor README (section 11, finding on the SUT-03 mapping scope) records that the running client kept the
  in-memory cart after Sign-Out until a page load. The harness reset for CS-004 must verify the cleared starting state after a page load.

  DISCREPANCY IN THE FROZEN CS-003 (not changed by this record). CS-003 DP-3 declares the SUT-03 oracle a disclosed UI_STATE deviation. The SUT-02 oracle in
  CS-003 is also UI-rendered client state (its oracle_realization says so), but DP-3 does not name SUT-02. DECIDED 2026-11-06: the SUT-02 case is accepted as the same disclosed deviation
  by a recorded note (a non-substantive correction is not available for this, because the scenario class is substantive): manifests/campaign-execution-decisions-v2.yaml, CS-003-HD-8. CS-003-v2 is not defined;
  the E02 configuration cites CS-003 as frozen and the paper discloses the deviation.

  DISCREPANCY IN THE FROZEN CS-003 (second item). CS-003 DP-5 records that the SUT-04 seeded account is an administrator, while the canonical business intent says
  "standard (non-privileged-by-design) identity". The frozen text accepts this as a disclosed choice. DECIDED 2026-11-06: accepted and disclosed (manifests/campaign-execution-decisions-v2.yaml, CS-003-HD-8); CS-003-v2 is not defined.

  EXPOSURE JUDGMENT (PROTO-U09 class, disclosed in the header of this record). The drafter had read the E01 evidence rows before choosing the target. The human research lead judged this on
  2026-11-06 with the disclosure in front of the approval line (manifests/campaign-execution-decisions-v2.yaml, line C) and approved the freeze; the exposure is to be disclosed among the threats to validity of the paper.

  Evidence gaps that block COMPARABLE claims beyond the rows named above: (1) the order-creating request on SUT-01 (no E01 row); (2) the commit page on SUT-02 (no E01 row);
  (3) the basket checkout route on SUT-05 (no E01 row); (4) the line-level display of the checkout views on SUT-02 (no E01 row). Closing any of them is a new evidence
  record, not an edit of the E01 rows (protocol/evidence-rules-v1.md; E01 is FROZEN).
