# experiments/scenario-mappings/CS-004.yaml
# STATUS: FROZEN 2026-11-06, approved by gilbertosanchez (authorization id E02-CS004-FREEZE-AUTH-01, assigned by the ORCHESTRATOR to the approval recorded in
# manifests/cs-004-freeze-v1.yaml). The eight design points DP-1 to DP-8 in `notes` were decided by the human research lead as the ORCHESTRATOR had recommended them (DP-8 as revised).
# Second establish-side canonical scenario for E02-state-establishment (pairing for H2, protocol/statistical-analysis-plan-v1.md, section 4.3).
# A frozen mapping record is never edited (protocol/equivalent-scenario-mapping-v1.md, section 6); a change is a new version file, CS-004-v2.yaml, with its own mapping-record row of protocol/CHANGELOG.md.
# Freeze history: created as a DRAFT on 2026-11-05; the SUT-05 entry was corrected on 2026-11-06 before the approval (comparability null to NOT_COMPARABLE, commit 4b580d3f); at the freeze
# only this block, the three status fields, the wording "this draft" in two places (now "this record"), and `notes` (recommended to decided) changed. It is not an input to any
# campaign configuration, workflow, or run until the campaign configuration of E02 names it.
#
# PROVENANCE OF THE CANONICAL BLOCK (protocol/equivalent-scenario-mapping-v1.md, section 3 and section 6, order of writing).
# The canonical block is taken from the frozen, ecosystem-neutral illustrative pattern of section 2 of that document: "An authenticated user places one purchasable
# item into a cart and reaches a checkout-ready state." The pattern is split, not extended: the placing step becomes the precondition, and the checkout-ready state
# becomes the target. The canonical block was written before the mapping entries.
# DISCLOSURE (PROTO-U09 exposure, for the human research lead to judge): the drafter had read the E01 evidence rows of SUT-01, SUT-02, SUT-03, SUT-04, and SUT-05
# before writing this file. The choice of target (checkout-ready rather than a committed order or booking) was made after that reading and because of it: the rows
# support checkout entry on the three web surfaces and document no commitment on SUT-02. The split of the pattern is a choice made in the same way. The independence of
# the canonical block from the evidence is therefore a claim that cannot be proven from this file; it is the human research lead's judgment.
#
# RELATION TO CS-003 (FROZEN 2026-11-02, experiments/scenario-mappings/CS-003.yaml). The two differ on two named axes:
#   - precondition_class: CLEAN_SESSION in CS-003; SEEDED_BUSINESS_STATE here (DP-1).
#   - target_state_or_transition: the actor's business object holds the item, verified in the object's own container (CS-003); the business object is checkout-ready,
#     verified in the checkout entry point (CS-004). CS-004 performs no commit step, so it persists no order or booking.
# Overlap, stated, not hidden: on SUT-01 WEB the final read of CS-003 is already the Checkout view, so the two scenarios share that step. See notes.
#
# HYGIENE: no assistant or vendor names; the approver is not named; the agent-instructions file is referred to by its role only.

version: 1
canonical_scenario_id: CS-004
description: >
  An authenticated standard actor whose business object already holds one purchasable or reservable item reaches the ecosystem's checkout-ready state for that object,
  and an observation verifies that the checkout entry point presents the object and is ready for the actor's next, committing step. The committing step is not performed.
  The business object varies by ecosystem (cart or basket); the semantic intent -- reaching a checkout-ready state for a business object the actor already holds -- does not.
  The scenario poses a different establishment problem from CS-003 (which establishes presence of the item in its container): it establishes a state in which the object
  is presented to the actor at the point of commitment.
precondition_class: SEEDED_BUSINESS_STATE
actor_state: AUTHENTICATED_STANDARD
business_intent: >
  An authenticated standard actor, whose business object already holds one purchasable item, reaches the checkout-ready state for that object and verifies that the
  checkout entry point presents it, without committing the object.
target_state_or_transition: >
  Before the declared starting state: the actor's business object holds exactly the item(s) seeded for the run, placed by the actor's own documented route, and no commitment
  exists. After the scenario: the ecosystem's checkout entry point presents the object's item(s) and is ready for the committing step, which is not performed; the presentation
  is verified by an observation of the declared oracle class.
observable_oracle_class: UI_STATE
reset_requirement: DATA_RESET
applicable_surfaces: [WEB, API, ANDROID, IOS]
allowed_domain_mapping: >
  Business object may vary: cart (SUT-01, SUT-02, SUT-03); basket (SUT-05, if the evidence gap of SUT-05 is closed); reservation or booking is NOT admissible for this scenario
  (SUT-04 entry). Vocabulary, endpoint names, selectors, and number of steps may vary. The mechanism class used to seed the precondition and to reach the checkout entry point
  may vary (UI flow, API seed, direct route, predefined account; setup-effort-v2 section 10 vocabulary). May NOT vary: the seeding must be performed by the actor through the
  ecosystem's own documented route before the declared starting state is recorded, and is not a study fixture written into the business object out of band; the target
  must be reached without performing the committing step; the verification must observe the same business object that was seeded; the actor must be a standard identity
  (not privileged by design). Scenario-specific constraint: the committing step (order submission, payment, reservation confirmation) must not be performed on any reset-side
  or establish-side run of this scenario, so that no persisted commitment exists to be reset.
campaigns_using: [E02-state-establishment]
mapping_status: FROZEN
frozen_at: "2026-11-06"
approved_by: gilbertosanchez
