  - sut_id: SUT-06
    comparability: COMPARABLE
    surfaces_used: [ANDROID, IOS]
    domain_object: "generic per-tier key/value storage (in-memory; AsyncStorage-tier SQLite; explicit SQLite; SecureStore/Keychain-Keystore)"
    precondition_realization: >
      Navigate to the Data Management screen (navigation action; no authentication concept evidenced
