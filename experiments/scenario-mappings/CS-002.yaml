      - "[navigation] Navigate to the Data Management screen."
      - "[UI] Enter a known value into one tier's testID-tagged input, then tap that tier's testID-tagged 'Save' control (`data-<tier>-save`) -- establishes the known value; readout `data-<tier>-readout` shows exactly the saved text (SUT06-EV-0007 android, SUT06-EV-0015 ios: 'Same cross-platform mechanism... DataManagement.tsx has no platform branch')."
      - "[reset] Tap that tier's testID-tagged 'Clear' control (`data-<tier>-clear`; the SecureStore one literally labelled 'Clear (test hook)') -- resets the tier to its known empty state (SUT06-EV-0007, SUT06-EV-0015)."
