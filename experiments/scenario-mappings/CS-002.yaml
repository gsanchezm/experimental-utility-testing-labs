# experiments/scenario-mappings/CS-002.yaml
# Canonical experimental intent + per-ecosystem mapping, per protocol/equivalent-scenario-mapping-v1.md.
# Author: ORCHESTRATOR. Second canonical scenario for E03-resetability, completing the PRE-DATA
# canonical-scenario catalogue (experiments/E03-resetability/canonical-scenario-catalogue.md):
# CS-001 covers the business-object-establish-then-reset intent class (5/6 SUTs); this record covers
# the distinct, evidenced generic-application-tier-persistence intent class (1/6 SUTs). Created to
# avoid forcing SUT-06's evidenced Save/Clear mechanism into CS-001's business-object intent
# (protocol/equivalent-scenario-mapping-v1.md, section 5, forbids substituting a different intent).
#
# STATUS: FROZEN 2026-09-21, approved by gilbertosanchez (authorization id E03-CS002-FREEZE-AUTH-01).
#
# All `justification` and realization fields cite real E01 evidence_ids from the six SUBMITTED
# per-branch audits (audit/e01-sut0N-*; PROTO-U07). Unknown/unevidenced fields are null, never guessed.

version: 1
canonical_scenario_id: CS-002
description: >
  An actor establishes a known value in one of an application's own, purpose-built, generically
  named data-persistence tiers (for example an in-memory store, a local database tier, or a
  secure/keychain-backed store), exposed by the ecosystem itself as a discrete Save control per
  tier, and then triggers that same tier's own Clear control, which restores the tier to its
  declared empty/placeholder state. Unlike CS-001, no purchasable or reservable business object is
  involved: the intent is a generic, ecosystem-exposed persistence-tier probe, not a simulated
  end-user commerce/booking flow.
precondition_class: CONFIGURED_CONTEXT
actor_state: NOT_APPLICABLE
business_intent: >
  An actor establishes a known value in one of the application's own data-persistence tiers via a
  tier-specific Save control, then triggers that tier's own Clear control, which restores the tier
  to its declared empty/placeholder state.
target_state_or_transition: >
  Before reset: the tier's readout shows exactly the value the actor saved. After reset (Clear): the
  readout shows the tier's fixed, declared empty/placeholder text.
observable_oracle_class: UI_STATE
reset_requirement: DATA_RESET
applicable_surfaces: [ANDROID, IOS]
allowed_domain_mapping: >
  The number and identity of persistence tiers, their exact names, and the exact placeholder text
  may vary. May NOT vary: the mechanism must be an ecosystem-exposed, discrete, per-tier Save +
  Clear control pair (not an incidental end-user flow, and not a business-object simulation); the
  Clear action's effect must be independently observable via a defined readout. This scenario is
  scoped to ANDROID and IOS because no WEB or API component evidenced in this study exposes an
  analogous generic, discrete, per-tier persistence-probe control (as opposed to CS-001's
  business-object mechanisms, which several web/api components do expose) -- applicable_surfaces
  reflects what is realistically in scope for this study's evaluated population, not a theoretical
  superset.
campaigns_using: [E03-resetability]
mapping_status: FROZEN
frozen_at: "2026-09-21"
approved_by: gilbertosanchez
