      - "Required Actions -- reset: 2 (1 reset action + 1 UI action), per tier probed. No app-wide 'reset all tiers' action exists (SUT06-EV-0007); a run probing multiple tiers repeats this pattern once per tier, each a separate, independently countable reset."
    oracle_realization: >
      testID-tagged readout `data-<tier>-readout` (SUT06-EV-0007, SUT06-EV-0015): exact saved text
      after Save; fixed placeholder text after Clear.
    reset_realization: >
      Per-tier 'Clear' test-hook control (`data-<tier>-clear`), same cross-platform mechanism on
      Android and iOS (SUT06-EV-0007, SUT06-EV-0015; DataManagement.tsx has no platform branch).
      The evidence explicitly rejects reading this as merely "the end-user path" rather than an
      SUT-exposed experimental mechanism (audit note, SUT06-EV-0007: the SecureStore control is
      literally labelled "Clear (test hook)" and the in-screen help text names Appium/`mobile:
      clearApp` expectations directly). reset_mechanisms candidate: [APP_DATA_CLEAR].
    environment_type: "PENDING -- not a mapping-freeze prerequisite (protocol/study-design-v1.md section 10.3; PROTO-U08 resolved). Source-inspection candidate only: release APK/IPA artifacts pinned (manifests/sut-manifest.yaml); installable on Android emulator / iOS Simulator once the mobile runner passes qualification (protocol/mobile-runner-policy-v1.md); not execution-verified."
    not_comparable_reason: null
    evidence_ids: [SUT06-EV-0007, SUT06-EV-0015]
    justification: >
      A purpose-built, cross-platform, SOURCE_VERIFIED, per-tier Save/Clear test-hook mechanism
      exists identically on both Android and iOS (the app is one shared React Native/Expo codebase
      with no platform branch for this screen); the audit itself considered and rejected reading it
      as merely incidental, treating it as an SUT-exposed experimental mechanism. This is the
      evidenced mechanism this canonical scenario exists to capture.
notes: >
  Completes the PRE-DATA canonical-scenario catalogue for E03 alongside CS-001
  (experiments/E03-resetability/canonical-scenario-catalogue.md, stop rule). SUT-06 is COMPARABLE
  here and NOT_COMPARABLE on CS-001 — the exact inverse of every other SUT — which is the intended,
  symmetric outcome of using two distinct canonical scenarios rather than forcing one intent onto an
  ecosystem it does not fit (protocol/study-design-v1.md, section 11, rules 1 and 3: breadth and
  depth answer different questions; specialist ecosystems are not removed). Every
  `environment_type` field remains PENDING by design, for the same reason as in CS-001 (section
  10.3; PROTO-U08 resolved) — not a freeze blocker. This record additionally requires the
  Mobilewright/Appium 3 qualification gate (protocol/mobile-runner-policy-v1.md) to pass before its
  SUT-06 conditions may execute, since both realized surfaces are Android Native / iOS Native.
