rendering:
  method: >
    Position-tracked substitution: the frozen prompt was split into an alternating sequence of
    literal-text and placeholder-token spans using the pattern \{\{[A-Z_]+\}\}. Only the nine
    token spans were replaced with per-SUT values; every literal-text span was carried through
    byte-for-byte unchanged, so fidelity outside the substitution points is guaranteed by
    construction rather than asserted after the fact. Script: not committed (ad hoc, run from an
    isolated scratch location outside this repository); its output and validation are what is
    committed here.
  actual_token_set_in_frozen_prompt_equals_documented_nine: true
  documented_tokens:
    [AGENT_ID, SUT_ID, SUT_NAME, AUDIT_BRANCH, AUDIT_DIRECTORY, SOURCE_WORKSPACE, COMPONENTS,
     PINNED_PROVENANCE, ORCHESTRATION_BASELINE]
  per_package_detail_and_hashes: render-report.json
  worktree_availability: >
    Rendered packages were committed to main (this operation's commit), not pushed into the six
    audit worktrees/branches: this operation's instructions prefer keeping the six worktrees at
    the frozen baseline (82b7a26) until each auditor is actually launched, rather than moving
    audit branches during launch preparation. Consequence: as of this commit, none of the six
    worktrees (../eus-2026-001-worktrees/e01-sut0N-*) contains its launch package on disk; an
    auditor would read its package from the main working tree, or a launch-time step would fast-
    forward/merge the relevant audit branch to this commit first -- a launch-time decision, not
    one this operation made. "ready_to_launch" below means rendering and isolation validated, not
    that a package is present in its worktree or that starting is authorized (see
    campaign_start_state_transition).
  source_workspace_caveat: >
    SOURCE_WORKSPACE values point to ../e01-sut-sources/<SUT-dir>/, the layout already documented
    in manifests/e01-capability-audit.yaml (source_workspaces.layout). No clone exists yet at any
    of these paths (manifests/e01-capability-audit.yaml, source_workspaces.note: "No clone was
    made for this orchestration task"); an auditor will need one created, read-only, before
    SOURCE_WORKSPACE-dependent steps (SOURCE_VERIFIED evidence, execution verification) can begin.
    This is an existing, already-documented gap, not something this operation introduced or
    resolved.
  frozen_prompt_self_description_observation: >
    prompts/frozen/e01-capability-auditor-v1.md still opens with "Status: WORKING. Not yet frozen.
    Do not use this prompt for a data-producing run" (its title also still reads "working prompt
    v1"), inherited byte-for-byte from prompts/working/ at freeze time per
    manifests/e01-prompt-freeze.yaml (byte_equivalence_verified: true) -- so it now propagates,
    unchanged, into all six rendered packages below. The file is frozen and authoritative
    regardless of this internal self-description (manifests/e01-prompt-freeze.yaml status: FROZEN
    is what governs); this operation did not and must not edit it. Flagged here for the human as a
    candidate non-substantive correction (protocol/change-control-v1.md, section 2) at their
    discretion, not acted on by this operation.

