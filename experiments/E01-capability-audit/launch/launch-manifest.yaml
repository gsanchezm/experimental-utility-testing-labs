campaign_start_state_transition:
  requested_by_this_operation:
    - "manifests/study-manifest.yaml: data_collection_started false -> true"
    - "manifests/e01-capability-audit.yaml: data_collection_started false -> true"
    - "manifests/e01-capability-audit.yaml: campaign_status PREPARED_NOT_STARTED -> RUNNING"
  performed: false
  blocked_because: >
    protocol/change-control-v1.md, section 7, is the frozen protocol's only defined procedure for
    a campaign's NOT_STARTED -> IN_PROGRESS transition, and its campaign status vocabulary is
    exactly NOT_STARTED -> IN_PROGRESS -> FROZEN; RUNNING is not a token defined anywhere in the
    frozen protocol. That procedure requires the ORCHESTRATOR to record a "Campaign configuration"
    section in experiments/E01-capability-audit/README.md (pinned SUT versions -- already recorded
    in manifests/sut-manifest.yaml and reusable here; toolchain versions; the frozen prompt version
    id; conditions and environment_type; sample size per condition; exclusion and attribution
    rules; and the list of CONFIRMATORY comparisons -- already recorded at the study level in
    manifests/study-manifest.yaml, comparison_classification.confirmatory_pairs, and reusable
    here), followed by a `campaign NOT_STARTED -> IN_PROGRESS` row in protocol/CHANGELOG.md and
    the corresponding transition of manifests/study-manifest.yaml campaigns[].status. None of that
    record exists yet, and section 7 states "Both moments are proposed by the ORCHESTRATOR and
    approved by a human" -- an approval this operation's instructions do not supply for that
    specific record (they supply approval only for the narrower three-field transition listed
    above). Performing the narrower transition anyway would leave the repository asserting E01 has
    started while failing the frozen protocol's own start procedure, and would introduce a second,
    undocumented campaign-status vocabulary (RUNNING) alongside the frozen one (IN_PROGRESS) for
    the same fact -- exactly the "operation would require a methodological decision" and "do not
    introduce a parallel state representation" conditions this operation's own instructions name
    as reasons to stop. No repository state was changed to work around this.
  not_a_scenario_mapping_blocker: >
    The frozen auditor prompt itself notes E01 does not require a frozen equivalent-scenario
    mapping record to assess capability (its rubric decision procedure is per-ecosystem). The
    blocker above is the missing Campaign configuration record, changelog row, and study-manifest
    transition required by protocol/change-control-v1.md section 7 -- not a missing scenario
    mapping.
  requires_before_start:
    - "The 'Campaign configuration' section written into experiments/E01-capability-audit/README.md per protocol/change-control-v1.md section 7, reusing the pinned SUT versions and CONFIRMATORY-comparison list already on record, and recording sample size / exclusion-attribution rules as N/A for E01 if that is the human's decision (E01 is a one-time structured audit per ecosystem, not a repeated-trial measurement -- protocol/repeatability-determinism-v1.md and protocol/setup-effort-v1.md do not apply to it), or with whatever else the human decides those fields mean for an audit-type campaign."
    - "A protocol/CHANGELOG.md row: campaign NOT_STARTED -> IN_PROGRESS."
    - "manifests/study-manifest.yaml campaigns[].status (E01-capability-audit): NOT_STARTED -> IN_PROGRESS."
    - "A human decision on the token for manifests/e01-capability-audit.yaml's own campaign_status field: RUNNING is not defined anywhere in the frozen protocol; IN_PROGRESS is the protocol's own vocabulary and would keep one status representation instead of two, but that choice belongs to the human, not to this operation."
  current_state_unchanged:
    study_manifest_data_collection_started: false
    e01_capability_audit_yaml_data_collection_started: false
    e01_capability_audit_yaml_campaign_status: PREPARED_NOT_STARTED
    study_manifest_campaigns_E01_capability_audit_status: NOT_STARTED

notes: |
  This file and the six rendered prompts plus render-report.json under
  experiments/E01-capability-audit/launch/ are the only artifacts this operation produced. No
