  The iOS evidence does not meet the positive-demonstration threshold required for NOT_EXECUTED.

  Therefore record:

  `SUT-02 × iOS = FAIL_RUNNER`

  under:

  `CONSERVATIVE_TIE_BREAK`

  and reference:

  `protocol/mobile-runner-policy-v2.md §9.4`.

