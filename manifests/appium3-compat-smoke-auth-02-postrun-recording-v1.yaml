  ## 6. STUDY-AUTHORED CLIENT DEFECT EXISTS

  Record separately as an implementation fact that:

  `qualification/compatibility-smoke/harness/wd.mjs`

  uses Node built-in:

  `globalThis.fetch`

  and its own AbortController-based request timeout.

  The implementation does not explicitly coordinate the underlying HTTP dispatcher timeout with the larger declared session timeout.

  It also records only:

  `e.message`

  for non-AbortError fetch failures and therefore does not preserve the underlying:

  `e.cause`.

  Thus the exact lower-level reason for:

  `fetch failed`

  is unavailable from the formal artifacts.

  This is a real study-authored observability/transport defect.

  ## 7. DO NOT CLAIM THAT DEFECT CAUSED THIS RUN

  Do NOT record that the client timeout defect positively caused the observed iOS failure.

  Reasons:

  - the exact underlying fetch error was not preserved;
  - `e.cause` is unavailable;
  - the observed total duration does not directly identify a specific underlying HTTP timeout;
  - the artifacts do not directly demonstrate the exact event that closed the client-side transport.

  The defect may be relevant, but the causal attribution remains uncertain.

  ## 8. APPLY POLICY V2 §9.3 / §9.4 EXACTLY

  Frozen policy v2 says:

  - NOT_EXECUTED is allowed only when artifacts positively demonstrate an allowed outside-runner cause;
  - if the evidence cannot distinguish a study-authored harness defect from a selected-runner-stack failure, attribution uncertainty resolves to FAIL_RUNNER;
