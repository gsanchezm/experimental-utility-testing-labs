  The operating decisions of 2026-10-24 and 2026-10-25 (one agent, the ORCHESTRATOR, does all the work; no second executor session) also replace the launch of EXECUTOR-E03-RESETABILITY sessions at the E03 campaign START (decision D5 of 2026-10-05). The package states the consequences of yes: the working prompt is rewritten for dispatch by the ORCHESTRATOR; agent_role in executor/common.py changes, so the implementation hash is re-derived and the new revision is exported and run once as a hosted DRY_RUN before the START; Section 3.5 of protocol/agent-governance-v3.md needs a governance successor (a protocol version change with its own approval); the package is re-issued as version 2. A recorded waiver of the isolation of Section 3.5 without a successor is not an option. The reply of 2026-10-27T03:50:13Z listed the rewrite of the prompt under yes and also asked, separately and under every answer, for a one-line approval to correct the status line of the working prompt (the proposal P-1); no separate answer to that request came. This operation reads the rewrite that yes entails as subsuming that correction (prompts/working/ is not frozen and no rule requires an approval for it) and states that reading to the human research lead in its report.
