  question_as_delivered_to_the_human: |
    La pregunta principal es **OPEN-1** (sí o no): ¿la decisión del 24 de octubre de trabajar sin otro agente ejecutor reemplaza también el lanzamiento de sesiones EXECUTOR-E03-RESETABILITY cuando se haga el START de E03 (D5)?
    - **No:** nada cambia, salvo corregir la línea de estado del prompt de trabajo.
    - **Sí:** reescribo el prompt, cambio la línea `agent_role` del executor (hash nuevo, nuevo export y DRY_RUN antes del START), añado un sucesor de gobernanza (sección 3.5) y hago el paquete v2.
