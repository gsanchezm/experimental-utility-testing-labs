    exact_text: "Your questions have been answered: \"E05-SUT02-WEB-02 (visual_user, sin marcador visual definido en ninguna fuente; solo existe el precio aleatorio). ¿Qué hacemos antes del START?\"=\"Retirarla antes del START (Recomendado)\", \"E05-SUT04-API-02: el ejecutor puede devolver dos etiquetas fuera de su conjunto declarado (conteo de mensajes ilegible; conteo que cambia en más de uno) y hoy el análisis falla cerrado ante ellas. ¿Agregamos categoría comodín?\"=\"Agregar S_OTHER, k = 5 (Recomendado)\", \"Valores propuestos para confirmar en el START: (a) timeout de cliente de SUT01-API-04 = 30 s (10 veces el retraso fijo de 3,0 s); (b) categorías esperadas: SUT01-API-05 = S_MODE_MISSING_NAME (arbitraria entre tres modos equiprobables, no cambia H(Y)), SUT01-API-06 = S_ORDER_CREATED, SUT04-API-02 = S_MESSAGE_RECORD_PRESENT (la instancia usa el servicio de mensajes real, no un doble); (c) nombre S_NO_CONFIRMATION_SHOWN para SUT04-WEB-01. ¿Los confirmas?\"=\"Confirmar los cuatro (Recomendado)\", \"Mecánica del workflow medido y del START: (a) timeout del job 60 min en lugar de 330; (b) pins de referencia con los valores observados en los bundles de la ronda 2 (la deriva de la imagen del runner se registra en cada job, sin bloquear); (c) congelar el prompt de despacho copiando el de trabajo al START; (d) mecanismo de intento adicional como el de E02 (solo bajo aprobación registrada). Todo entra en un export v61 antes del START. ¿Lo apruebas?\"=\"Sí a los cuatro (Recomendado)\". You can now continue with these answers in mind."
decisions:
- id: E05-SUT02-WEB-02-RETIRED
  question: "what to do before the START with E05-SUT02-WEB-02 (visual_user), whose category set rests on a visual marker that no recorded source defines"
  chosen: "Retirarla antes del START (Recomendado)"
  effect: "the condition is retired before the START, before any measured datum, with the reason F23; it is removed from the conditions file, from the choices of both E05 workflows and from the START package. The design becomes 13 conditions, N = 50 each, 650 executions, 13 dispatches under 4 per-SUT authorizations (SUT-01 7 conditions, SUT-02 1, SUT-04 3, SUT-05 2). H3 is unchanged (stochastic conditions are excluded from H3 by class); stochastic coverage remains with SUT01-API-05, SUT01-API-06 and SUT05-API-02. The executor code is not changed (the module keeps its unreferenced stub; the configuration no longer lists the condition, so the entry point refuses it as unknown); the implementation hash of the second DRY_RUN round stays the candidate hash for the START."
- id: E05-SUT04-API-02-CATCH-ALL
  question: "whether E05-SUT04-API-02 declares a catch-all category, given that its realization can return two labels outside its declared set (message count unreadable; message count changed by more than one) and that an undeclared label is returned unchanged, so that the analysis fails closed on it"
  chosen: "Agregar S_OTHER, k = 5 (Recomendado)"
  effect: "the stimulus categories of E05-SUT04-API-02 become S_MESSAGE_RECORD_PRESENT (expected), S_MESSAGE_RECORD_ABSENT, S_BOOKING_NON_2XX, S_OTHER and INTERRUPTED_ (k = 5); the two labels map to S_OTHER by the existing catch-all rule of the executor and the original label stays in the note of the attempt. Only the conditions file changes."
- id: E05-START-VALUES-CONFIRMED
  question: "confirmation of the four values that the configuration draft proposed for the START package"
  chosen: "Confirmar los cuatro (Recomendado)"
  effect: "confirmed: (a) the client timeout of E05-SUT01-API-04 is 30 s (ten times the fixed 3.0 s delay; the second DRY_RUN measured 3.01 s per execution); (b) the expected categories are S_MODE_MISSING_NAME for E05-SUT01-API-05 (an arbitrary choice among three equiprobable modes that changes no H(Y) value), S_ORDER_CREATED for E05-SUT01-API-06 and S_MESSAGE_RECORD_PRESENT for E05-SUT04-API-02 (the measured instance runs the real message service, not a double); (c) the name of the E05-SUT04-WEB-01 category is S_NO_CONFIRMATION_SHOWN."
- id: E05-WORKFLOW-AND-START-MECHANICS
  question: "approval of four mechanics of the measured workflow and of the START: job timeout, reference pins, frozen dispatch prompt, further-attempt mechanism"
  chosen: "Sí a los cuatro (Recomendado)"
  effect: "(a) the job timeout of the measured workflow is 60 minutes instead of 330 (the longest job of the second round took 168 s for 3 executions; the projection of 50 executions is at most about 10 minutes per job); (b) reference pins are the values recorded in the bundles of the second round, with the drift of the runner image recorded in every job and no gate on it: runner image ubuntu24 20261111.370.1, system Python 3.12.3, executor Python 3.12.16, Node v22.23.4, Playwright for Python 1.63.0, Chromium 153.0.8010.12; read afterwards by the ORCHESTRATOR on 2026-11-14 and also reference values: the JDK build of SUT-04 is Temurin-26.0.2.1+1 (job log of run 43579847658, job E05-SUT04-API-01), and the validation step of the measured workflow resolves ajv-cli@5 to 5.0.0 and ajv-formats@3 to 3.0.1 (npm registry, 2026-11-14; the verification workflow does not run ajv); the analysis runtime is recorded in the START package; (c) the dispatch procedure prompt is frozen at the START by copying prompts/working/ORCHESTRATOR-E05-determinism-v1.md byte-identical to prompts/frozen/, on the human research lead's approval of the START; (d) the measured workflow admits a further attempt only under a recorded further-attempt approval of the human research lead (protocol/agent-governance-v6.md, Section 3.7, the E02 precedent of OP-CI-18), naming the condition, the first execution to repeat and the attempt; attempt 1 starts at execution 1. All four enter the corrected workflow and records of export v61 before the START, so that the workflow hash that gate G-9 reads from the locked configuration is that of the corrected file."
