  ## 2. REMOVE THE INVENTED "IN THEIR OWN WORDS" REQUIREMENT

  The repository must NOT establish a new requirement that a valid human authorization must be composed personally by the human or written "in their own words."

  PROTO-U10 established a different rule:

  A proposed/drafted/relayed authorization is not an authorization UNTIL the human explicitly adopts/issues/approves it.

  The origin of the wording does not invalidate an otherwise explicit human issuance.

  Therefore, in:

  `manifests/mobile-qualification-execution-auth-v3-prepared.yaml`

