correction:  # the only substantive change relative to lock v3 (9.7.4); nothing else is authorized by the existence of policy v3
  defect: "lock v3 used the Node.js built-in globalThis.fetch with its own AbortController timer; the built-in fetch applies its own HTTP-layer timeouts that this client neither set nor could align with the explicit session-start budget, and for a non-abort fetch failure it recorded only e.message, discarding e.cause (qualification/unresolved.md QUAL-U06)"
  transport: "wd.mjs: the default transport is node:http (agent: false, one connection per request, no socket, header, or body timeout set), so the explicit per-request budget is the only limit: the session start keeps session_timeout_ms 1,200,000 and a shorter limit is never imposed silently (9.7.4 items 1 and 2); node:http is built into Node.js 22.23.2, so package.json and package-lock.json are byte-unchanged and no dependency is added"
  evidence: "WebDriverError.transport carries error {name, code, message}, cause {name, code, message} where available, timed_out, timeout_ms, and elapsed_ms; smoke.mjs copies it to attribution.transport_error and states the settings in the record field transport (9.7.4 item 3)"
  unchanged_by_construction: [appium_and_driver_pins, sut_build, ios_simulator_and_xcode_substrate, smoke_capability_definition, ios_realization, webdriveragent_launch_and_connection_limits, endpoints_payloads_locators_and_waitfor_of_the_client, the_step_sequence_both_platforms_run]  # 9.7.4 items 4 to 9
  not_claimed: "that the former transport caused the AUTH-02 failure (its causal role is NOT_ESTABLISHED) or that Appium 3 would pass on iOS; the correction lets the client wait up to the declared budget and records why a transport fails"
  shared_client_note: "wd.mjs is shared with the Android platform, which is not executed again; the AUTH-02 Android PASS stays valid on the basis of 9.7.12, which android_preservation below makes mechanically verifiable"
android_preservation:  # policy v3, 9.7.12, condition 5: the successor lock must show that the Android realization and the Android command sequence are byte-unchanged
  realization_android: "REALIZATION.android of qualification/compatibility-smoke/harness/smoke.mjs is covered by harness_realization_sha256 (the whole REALIZATION constant), equal to its lock-v3 value; the gate recomputes it by importing smoke.mjs"
  command_sequence:
    extraction: >-
      UTF-8 text of qualification/compatibility-smoke/harness/smoke.mjs from the first character of the line "  try {" that is followed by the line
      "    await step('install and launch the pinned build (MC-01)'" up to, and excluding, the first character of the line "  } catch (e) {" that is followed by the line
      "    failed = e.step"; SHA-256 of that string encoded as UTF-8. It is the step sequence that both platforms run through runSmoke.
    sha256: 6e92f486261eb7d0fe84f874379a3464cf9184fc5bf088965437a8d0223a1f77
    sha256_in_lock_v3_smoke_mjs: 6e92f486261eb7d0fe84f874379a3464cf9184fc5bf088965437a8d0223a1f77  # computed from the committed lock-v3 smoke.mjs blob when this lock was prepared
    equal: true
  argument_of_9_7_12: "the Android PASS consists of the runner's answers to W3C WebDriver commands whose endpoints, payloads, locators, realization, and oracle this correction does not change; the recorded Android session request completed in 24.9 s and every recorded Android command received a normal response, so no transport limit bore on any recorded Android exchange"
  disclosure: "the client library behind the shared WebDriver client changes from the built-in fetch to node:http, which sends the same method, path, content-type header, and body bytes (checked by the static tests) but not the same default request headers of the former library; this is the only way to remove the HTTP-layer timeouts without a new dependency, and it is put to the human research lead with the authorization"
