publication_integrity: >-
  At lock time no locked file and not the README contains any string the public export rewrites (the export's
  PROVIDER_NEUTRAL_PATH_ALIAS and PROVIDER_NEUTRAL_METADATA_REWRITE classes) or any token-like remnant, so every locked
  file is exported byte-identical (UNCHANGED). In a published checkout the gate additionally requires the
  PUBLIC-EXPORT-MANIFEST.yaml entry of each locked file, the README, this lock, and the frozen launch prompt to be UNCHANGED.
  The preserved artifacts of earlier authorizations are verified byte-exact by the gate itself (import record, archive
  digest, archive members) and must therefore be exported UNCHANGED as well.
attribution_implementation:  # protocol/mobile-runner-policy-v3.md, 9.1-9.5 (carried from v2) and 9.7.6; every value is a proposal recorded in record.json -- the ORCHESTRATOR records the result (protocol/agent-governance-v5.md, Section 3.4)
  record_fields: [transport, outcome, proposed_result, attribution.proposed_category, attribution.basis, attribution.failure_kind, attribution.failed_phase, attribution.failed_capabilities, attribution.description, attribution.runner_action_started, attribution.transport_error, attribution.harness_exception, attribution.evidence, recording_role, automatic_repeat]
  before_any_runner_action:
    BUILD_ACQUISITION, BUILD_VERIFICATION: NOT_EXECUTED / SUT_BUILD (download, digest, unpack, bundle identity, simulator platform)
    SUBSTRATE, HOST_RUNTIME: NOT_EXECUTED / INFRASTRUCTURE (device count, emulator serial, emulator boot, API level, Xcode, simulator, Node.js)
    HARNESS_STARTUP: NOT_EXECUTED / HARNESS_ORCHESTRATION (harness exception before the session request; the runner was never contacted)
  pinned_appium_stack_outside_the_harness:
    TOOLCHAIN_INSTALL, TOOLCHAIN_VERIFY, SERVER_START: FAIL_RUNNER / CONSERVATIVE_TIE_BREAK (npm ci log, installed versions, server log preserved; NOT_EXECUTED / INFRASTRUCTURE only on demonstrated registry or network outage)
    HARNESS_PROCESS: FAIL_RUNNER / CONSERVATIVE_TIE_BREAK (the harness ended without a record)
  after_the_session_request: FAIL_RUNNER for every failure, basis from the WebDriverError kind (RUNNER_ANSWERED_WITH_AN_ERROR, RUNNER_ANSWER_WITHOUT_REQUIRED_REFERENCE, REQUIRED_ELEMENT_OR_STATE_NOT_REACHED, NO_RUNNER_ANSWER_ATTRIBUTION_UNCERTAIN); a harness exception is attached as candidate HARNESS_ORCHESTRATION evidence for the QUALIFIER, never concluded by the harness
  no_repeat: no step, platform, or smoke is retried or repeated by the harness, the scripts, or the workflow; the exit code is 0 only for outcome SUCCESS
  topology: a single iOS job after the gate; there is no Android job, no Android result is produced or implied, and no platform order exists (policy v3, 9.7.3)
change_rule: >-
  Any change to a locked byte, the realization section, the governing policy, a build pin, or a toolchain pin requires a
  new lock version (a new file; this one is never edited in place) and a new authorization record that names it, with
  the single-attempt rule of policy v3, 9.7.5. A change made after observing any outcome is outcome-responsive and is not
  admissible for the same authorization. No second remediation attempt exists under policy v3: a FAIL_RUNNER or NOT_EXECUTED
  of this attempt is terminal (9.7.7).
