human_instruction_verbatim: |
  # EUS-2026-001 — MOBILE QUALIFICATION PRE-DISPATCH INTEGRITY CORRECTION

  I, gilbertosanchez, human research lead for EUS-2026-001, explicitly authorize the following **PRE-DISPATCH CORRECTION OPERATION ONLY**.

  This is a direct human instruction.

  It is NOT authorization to execute the Mobilewright qualification gate.

  Do NOT dispatch QUALIFICATION.
  Do NOT dispatch DEVELOPMENT.
  Do NOT execute Appium.
  Do NOT execute a compatibility smoke.
  Do NOT select a mobile runner.
  Do NOT start E03.

  The purpose of this operation is to correct the pre-dispatch execution-integrity and provenance defects discovered before any protocol-valid qualification execution occurred.

  ## 1. CURRENT SCIENTIFIC STATE

  Preserve the following facts:

  * MOBILE-QUALIFICATION-EXEC-AUTH-02 was validly issued by the human research lead.
  * AUTH-02 was NEVER dispatched.
  * No protocol-valid Mobilewright qualification execution exists.
  * The 2026-09-22 AUTH-01 executions remain HISTORICAL_UNAUTHORIZED_EXECUTION.
  * PREQUALIFICATION_OUTCOME_EXPOSURE remains TRUE.
  * Mobilewright 0.0.60 remains the primary candidate.
  * Appium 3.7.0 remains the fallback.
  * No mobile runner is selected.
  * E03 remains NOT_STARTED.

  Do not reinterpret or re-adjudicate any historical Mobilewright observation.

  ## 2. HUMAN DECISION ON THE DISCOVERED DEFECTS

  I explicitly accept the following pre-dispatch findings:

  ### DEFECT A — FORMAL/QUARANTINE OUTPUT COLLISION

  The existing QUALIFICATION implementation writes into a repository path already containing the quarantined AUTH-01 executions.

  A future formal execution MUST NOT read, append to, overwrite, scan, package, import into, or otherwise inherit those historical files as part of its formal execution lineage.

  The quarantined files themselves must remain preserved unchanged.

  ### DEFECT B — CROSS-PLATFORM PARALLELISM

  The frozen policy requires measured executions to be sequential.

  Android and iOS must therefore NOT execute concurrently against the shared qualification account.

  The formal workflow must preserve:

  one workflow_dispatch
  +
  platform = both
  +
  Android qualification first
  +
  iOS qualification only after the Android job has completed.

  Do NOT solve this by authorizing two formal workflow dispatches.

  ### DEFECT C — ACTIVE PROMPT-VERSION MISLABELLING

  Formal records produced under the next valid authorization must identify the actual frozen QUALIFIER-MOBILE-01 prompt used for that authorization.

  Historical comments accurately stating that implementation code was originally authored under v1 may remain historical.

  However, active execution-provenance fields must not falsely label a future formal run as executed under v1.

  A global textual replacement is prohibited.

  Only fields representing the active execution prompt/version may change.

  ## 3. CLASSIFICATION

  Record these defects through the next available protocol escalation id after PROTO-U10.

  Classify them as:

  PRE-DISPATCH EXECUTION-INTEGRITY / PROVENANCE DEFECTS

  They are:

  * discovered before any protocol-valid qualification run;
  * non-methodological;
  * prospective corrections;
  * not changes to any observed outcome;
  * not changes to the runner under qualification;
  * not changes to the SUT;
  * not changes to the experimental population;
  * not changes to MQ1/MQ2/MQ3 semantics;
  * not changes to MC-01..MC-10;
  * not changes to N;
  * not changes to warm-up rules;
  * not changes to exclusion/attribution rules;
  * not changes to the pass criteria;
  * not changes to the switch rule.

  Explicitly record:

  PREQUALIFICATION_OUTCOME_EXPOSURE = TRUE

  and explain why every correction below is required by execution isolation, the already-frozen sequential-execution rule, or provenance correctness independently of whether Mobilewright passes or fails.

  ## 4. AUTH-02 DISPOSITION

  Do NOT delete AUTH-02.

  Do NOT create a duplicate AUTH-02 record.

  Preserve its historical fact:

  AUTH-02 was genuinely human-issued but was never dispatched.

  Create the minimum additive correction/supersession record needed to establish that AUTH-02 must no longer be used for dispatch because the implementation/package against which it was issued contains pre-dispatch integrity/provenance defects.

  The record must distinguish:

  AUTHORIZATION_PROVENANCE:
  VALID

  from:

  DISPATCH_ELIGIBILITY_AFTER_PRE_DISPATCH_DEFECT_DISCOVERY:
  SUPERSEDED / RETIRED BEFORE EXECUTION

  Use the repository's existing lifecycle vocabulary where one already exists rather than inventing an incompatible status.

  Ensure the workflow cannot subsequently accept AUTH-02 accidentally.

  Do not rewrite history.

  ## 5. QUARANTINE IS IMMUTABLE

  The existing files under the AUTH-01 quarantine lineage must remain byte-identical.

  Do not:

  * delete them from canonical history;
  * overwrite them;
  * move them destructively;
  * reinterpret them;
  * import them into the future formal result;
  * use their outcomes in any future gate tally.

  Their hashes and quarantine classification must remain auditable.

  ## 6. FORMAL OUTPUT ISOLATION

  Design the minimum deterministic formal-output namespace that gives a future authorization a completely independent execution lineage.

  The namespace must be authorization-specific or otherwise unambiguously formal-lineage-specific.

  It must prevent all of the following by construction:

  * reuse of old execution directories;
  * old `failure.png` or other residual files surviving beside new records;
  * append to historical execution-log CSV/JSONL;
  * historical records entering capability tally scans;
  * historical Android records entering iOS summaries or vice versa;
  * GitHub artifacts containing quarantined files;
  * import collisions with AUTH-01 files.

  The GitHub Actions checkout may use an ephemeral clean workspace, but the final design must also provide a durable non-colliding canonical import location for the future formal artifacts.

  Do not solve the problem merely by filtering contaminated files after observing outcomes.

  Isolation must occur BEFORE execution.

  If satisfying this requires a successor to `manifests/mobile-qualification-package-v1.yaml`, create a new version rather than editing v1 in place.

  The successor package may change only the operational artifact/provenance representation required for isolation.

  It must preserve unchanged:

  * qualification SUT/build;
  * Mobilewright version;
  * Android/iOS substrates;
  * MQ definitions;
  * capabilities;
  * N;
  * warm-up semantics;
  * execution semantics;
  * acceptance criteria;
  * attribution/exclusion rules;
  * switch rule.

  ## 7. SINGLE-DISPATCH SEQUENTIAL WORKFLOW

  Correct `.github/workflows/e03-mobile-qualification.yml` so that the future formal operation still uses exactly:

  one workflow_dispatch

  with:

  platform:
  both

  but the platform execution order is structurally:

  gate
  →
  Android
  →
  iOS

  There must be no Android/iOS overlap.

  If Android experiences an ordinary measured runner failure, that failure must be preserved and must not be converted into a workflow failure merely to prevent iOS execution.

  If the Android workflow job itself becomes incomplete due to infrastructure outside the frozen replacement mechanism, preserve the evidence and fail closed according to the existing rules.

  Do not add a retry mechanism.

  Do not add automatic reruns.

  Do not change runner images, versions, scenario order inside a platform, N, warm-ups, timeout semantics, or attribution semantics.

  ## 8. SUCCESSOR IMPLEMENTATION LOCK

  Because one or more currently locked artifacts must change for output isolation and/or active prompt-version provenance, do NOT edit `manifests/mobile-qualification-implementation-lock-v1.yaml` in substance.

  Create a successor lock record.

  The successor must enumerate every changed locked artifact and provide:

  * old SHA-256;
  * new SHA-256;
  * exact semantic delta;
  * classification of that delta;
  * proof that scenario realization is unchanged;
  * proof that runner interaction semantics are unchanged;
  * proof that the deep-link mechanism remains the runner's own existing mechanism;
  * proof that no known Mobilewright outcome was repaired.

  The successor must explicitly state that implementation-lock v1 remains immutable historical provenance.

  ## 9. ACTIVE PROMPT PROVENANCE

  Do not silently reuse the AUTH-02 frozen prompt for a new authorization id.

  Prepare the next prompt version following `prompts/README.md`.

  Because AUTH-02 will not be dispatched after these corrections, prepare the lineage for:

  MOBILE-QUALIFICATION-EXEC-AUTH-03

  AUTH-03 must initially remain:

  PREPARED
  NOT ISSUED
  NOT DISPATCHABLE

  The human will issue it separately after reviewing this correction package.

  Prepare, but do not treat as issued, the corresponding QUALIFIER-MOBILE-01 prompt version for AUTH-03.

  Do not freeze/activate it as an actually used execution prompt prematurely if repository rules reserve that transition for issuance/use.

  If a frozen pre-execution copy is required by the existing repository procedure, record explicitly that freezing the file does NOT constitute human issuance or dispatch authorization.

  Every active execution-provenance field in the successor implementation must resolve to the prompt version actually intended for AUTH-03.

  Historical authoring comments referring to v1 must not be falsified.

  ## 10. READINESS HARDENING

  The future readiness gate must fail closed if any of the following is true:

  * submitted authorization is not the uniquely valid issued authorization;
  * the selected authorization is superseded/retired;
  * active prompt version does not match the authorization;
  * implementation-lock successor hashes do not match;
  * formal output namespace is not isolated from the AUTH-01 quarantine;
  * formal output namespace is non-empty before the first execution except for explicitly allowed structural metadata;
  * platform=both would permit Android and iOS execution overlap.

  Do not add any check that depends on the observed outcome of a qualification execution.

  ## 11. STATIC VERIFICATION ONLY

  After the corrections, perform only read-only/static verification.

  Verify at minimum:

  * old quarantined artifact hashes unchanged;
  * no outcome-bearing historical artifact modified;
  * frozen policy unchanged;
  * MQ realization unchanged;
  * Mobilewright version unchanged;
  * OmniPizza build unchanged;
  * N unchanged;
  * pass criteria unchanged;
  * attribution unchanged;
  * runner deep-link mechanism unchanged;
  * workflow is single-dispatch but cross-platform sequential;
  * future formal output starts isolated;
  * active prompt provenance is internally consistent;
  * old AUTH-02 cannot dispatch;
  * AUTH-03 is not yet issued;
  * no workflow dispatch occurred.

  Do NOT use DEVELOPMENT mode to test the changes.

  Do NOT execute the harness against the SUT.

  ## 12. PUBLIC EXPORT

  If repository changes are required, produce the normal clean provider-neutral public export and verify its provenance.

  Return:

  * correction commit SHA(s);
  * successor implementation-lock path and SHA-256;
  * successor qualification-package path/hash if one was required;
  * AUTH-02 supersession/correction record path;
  * AUTH-03 prepared record path;
