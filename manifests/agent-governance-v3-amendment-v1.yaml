- '| 2026-10-03 | protocol/agent-governance-v3.md | none | v3 | DRAFT -> FROZEN-PRE-DATA | Explicit human approval of the post-data successor resolving protocol/unresolved.md PROTO-U20 (decision package manifests/agent-governance-v3-amendment-proposal-v1.yaml; record manifests/agent-governance-v3-amendment-v1.yaml) at DRAFT content SHA-256 c8f423ad4365891a205e50d241d69c3bdf086ab6ff5679db6dee1390cfc7d2f6; frozen text SHA-256 41429f2ccb7201da4ad55c2cd27df4057c9de41b43834d76cf6b943bd27922d4 after the enumerated freeze rendering. Changes: the ORCHESTRATOR''s .github/workflows/** permission covers E03-resetability (E03-CI-WRITE-AUTH-01) and E02, E04–E12 (CAMPAIGN-CI-WRITE-AUTH-01, applied to the agent-instructions file in the same operation); E02 and E04–E12 are executed under ORCHESTRATOR coordination without an executor role (Section 3.6); the orchestration-review channel is described (Section 2.1); every other line carried from v2 byte for byte apart from the header, the notice, the change note, the Section 3.1 opening label, the Section 4 introduction, rule 6 of Section 2, two clauses of Section 3.5, and Section 7. Prior data: nothing collected under v1 or v2 is invalidated, re-collected, or reinterpreted. References re-pointed to v3 by this recorded change: the agent-instructions file (rule 16; the governance reference of its E03 CI/CD section; the agent-roles paragraph; where-the-rules-live; the current-phase protocol-state and governance sentences), README.md, protocol/README.md, manifests/README.md, manifests/study-manifest.yaml (dated note), experiments/E03-resetability/README.md, and prompts/README.md (re-pointed to v3); experiments/E03-resetability/ci-cd-execution-model.md (its 2026-09-22 decision table kept as dated history, with pointers to v3 and to CAMPAIGN-CI-WRITE-AUTH-01); experiments/README.md and raw-data/README.md state the E02 and E04–E12 execution rule; the full path, line, before, and after list is in manifests/agent-governance-v3-amendment-v1.yaml; not re-pointed: frozen protocol documents (resolved by v2''s Superseded-by row), gate G-6 of .github/workflows/e03-measured-execution.yml and its wording in experiments/E03-resetability/controlled-instance-status.yaml (a separate CI operation; G-6 reads the v2 header and accepts AMENDED), the qualification READMEs owned by QUALIFIER-MOBILE-01, frozen and working prompts, schemas, locks, authorization, evidence, and historical operation records, the decision package, and the dashboard. | E02-state-establishment, E04-repeatability, E05-determinism, E06-cross-platform-parity, E07-cross-layer-continuity, E08-performance, E09-accessibility, E10-visual, E11-security, E12-localization-i18n prospectively (workflow-authoring scope and execution model); every campaign prospectively (orchestration-review channel), E01-capability-audit included without effect on its frozen data; none of E02–E12 has collected campaign data; E03-resetability execution rules unchanged | gilbertosanchez (approval 2026-10-03) |'
