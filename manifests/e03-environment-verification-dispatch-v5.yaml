import_rules_fixed_before_the_run:  # verbatim from the instruction; applied by operation OP-ENV-12, issued separately and adopted by the human research lead separately
  R1: |-
    Each condition's github_actions_verification.status is the verification_result of the condition's ENVIRONMENT_VERIFICATION record (the status file's own definition, header comment lines 9-10, wrapped there: "a VERIFIED GitHub Actions record for the condition"); github_job_conclusion is transcribed as observed. When a job concludes failure after its verify step wrote a VERIFIED record (a later step failed, for example the DRY_RUN step or an upload), the condition is VERIFIED, the job conclusion is transcribed as failure, and the failed step is named; nothing is hidden.
  R2: |-
    Latest-run rule (the status file, defined 2026-10-04): this run runs a job for every condition, so it governs all nine conditions, including the two mobile ones; a NOT_VERIFIED of this run replaces a VERIFIED of record; the earlier values stay in their import directories and import records.
  R3: |-
    reverification_required: the import that transcribes this run removes the entry from E03-CS001-SUT04-WEB and -SUT04-API (the status file's rule, header comment lines 11-14, wrapped there: "the import that transcribes the condition's next verification run removes it"; each entry's removed_by); the status itself follows R1, and gate G-8 then refuses a SUT-04 condition only if its status is not VERIFIED.
  R4: |-
    Only the seven ENVIRONMENT_VERIFICATION artifacts are imported, byte-exact, under github-actions/run<run id>-a1/<job directory>/. The DRY_RUN bundles are downloaded to your scratchpad, verified against their GitHub digests, read, and never imported anywhere; only values read from them (numbers, statuses, quoted lines) and their digests enter tracked records.
  R5: |-
    Any private-path, vendor-term, or secret-like hit inside a member of an ENVIRONMENT_VERIFICATION artifact (for example in a SUT log that carries DRY_RUN traffic): STOP and report before any import; publication handling then follows the OP-ENV-05 precedent, and the canonical import stays byte-exact either way.
  R6: |-
    A DRY_RUN finding (a non-zero executor exit status, a failed validation, an outcome other than SUCCESS, an action count other than the predeclared 2, a settle that reached its bound, a missing file) is a DRAFT revision item of the executor before START (new digests, new commit), never a SUT finding; the README items P1 and O1 are corrected once, after the import, with the values this run observes.

expected_under_test:  # hypotheses to be observed in this run, never results; verbatim from the instruction (WHAT THE RUN TESTS)
  H1: |-
    The first execution on GitHub of workflow revision a18c56f1: target=all runs the seven jobs (sut-01-web-api, sut-02-web, sut-02-android, sut-02-ios, sut-03-web, sut-04-web-api, sut-05-api; job timeouts 30, 30, 45, 45, 30, 45, 60 minutes).
  H2: |-
    sut-04-web-api: the first GitHub verification of the route of the SUT's README (human decision of 2026-10-06; OP-CI-06 / OP-CI-06b): the six Spring services from their -exec jars with the dev profile and the web app by npm start (next start -p 3003), each in its own session and process group, readiness bound 300 s; VERIFIED requires every service's actuator health and the web reads GET /, GET /api/room/1, and GET /api/branding through port 3003 at 200, the unauthenticated DELETE /api/booking/999999 through the web app below 500, and a defined status on each of the four api checks (no SUT configuration variable may be set). This is the run whose import removes reverification_required from E03-CS001-SUT04-WEB and -SUT04-API.
  H3: |-
    The DRY_RUN step of the five web/api jobs, which runs only after a successful verify step: a venv from /usr/bin/python3 with requirements.txt installed under --require-hashes and Playwright Chromium; instance.json written by the step; for each condition of the job, run-condition.sh checked against the sha256 of its committed blob, then run with RECORD_CLASS DRY_RUN, EXECUTION_ID DR0001, ATTEMPT 1, EXECUTOR_PROMPT_VERSION EXECUTOR-E03-RESETABILITY-E03-resetability-v1; the run manifest validated with ajv-cli 5 and ajv-formats 3 against schemas/run-manifest.schema.v2.json plus the E03 conventions; the step fails at its end if any validation failed; each condition's bundle is uploaded as E03-DRY_RUN-<condition>-DR0001-A1 (seven: SUT01-API, SUT01-WEB, SUT02-WEB, SUT03-WEB, SUT04-API, SUT04-WEB, SUT05-API), retention 90 days. It is the first execution of the pre-DRY_RUN revision of the shared modules (operation OP-PREP-E03-REV-01b: the bounded network-quiet settle before every web read; Set-Cookie values registered with the scrubber before any transcript is written) against the instances, and the first execution ever of the E03-CS001-SUT05-API realization (never run locally); the SUT-05 instance.json names the process group that the verification step restarted (pid2.txt, pgid2.txt).
  H4: |-
    The two mobile jobs: installation, launch, and mechanism presence as in run 37265782721 (no DRY_RUN step, no mobile test runner).
  H5: |-
    Expected artifacts: seven ENVIRONMENT_VERIFICATION artifacts (one per job) and up to seven DRY_RUN bundles (a bundle is uploaded only when its job's verify step succeeded).
  H6: |-
    Capture order: each web/api job scrubs and uploads its ENVIRONMENT_VERIFICATION artifact at the end of the job, after the DRY_RUN step, so the SUT logs kept in that artifact also hold the log lines that the SUT wrote during the DRY_RUN executions.
  H7: |-
    What the run is not: not a MEASURED_EXPERIMENT, not E03 data, not a mobile qualification, not a SUT finding; no gate of the measured workflow runs; E03 stays NOT_STARTED.

