notes: |
  campaign_status PREPARED_NOT_STARTED is distinct from NOT_STARTED (manifests/study-manifest.yaml,
  experiments/E01-capability-audit): NOT_STARTED means nothing has been prepared; PREPARED_NOT_STARTED means
  orchestration metadata, provenance pins, agent identities, and now a frozen prompt exist, but no auditor
  has been instructed to begin and data_collection_started is still false. The campaign becomes data
  collection only when the first auditor begins gathering capability evidence under the frozen prompt
  (prompts/frozen/e01-capability-auditor-v1.md), which required: (1) explicit human review and approval of
  the working prompt — done; (2) the prompt-freeze operation copying it to prompts/frozen/ with a version id
  and checksum (manifests/e01-prompt-freeze.yaml) — done, 2026-09-17; (3) an explicit human instruction to
  begin, relayed by the ORCHESTRATOR — not yet given. Freezing the prompt does not, by itself, start data
  collection or change campaign_status.
  (3) was given 2026-09-17: explicit human approval and instruction to perform the protocol-compliant E01
  campaign start (protocol/change-control-v1.md, section 7), relayed by the ORCHESTRATOR. campaign_status
  and data_collection_started above reflect that administrative/protocol-state transition -- the campaign
  configuration is now locked (experiments/E01-capability-audit/README.md) and protocol/CHANGELOG.md carries
  the campaign NOT_STARTED -> IN_PROGRESS row. This is distinct from any auditor actually executing: no
  auditor has been instructed to begin gathering evidence, and each of the six independent audits still
  requires its own separate explicit instruction before it starts reading this file to begin work
  (protocol/agent-governance-v1.md, section 2, rule 6; AGENT-INSTRUCTIONS.md, rule 15). RUNNING was considered and
  rejected as a campaign_status token: it is not defined in protocol/change-control-v1.md's campaign-status
  vocabulary (NOT_STARTED -> IN_PROGRESS -> FROZEN), and IN_PROGRESS was used instead so this file and
  manifests/study-manifest.yaml carry a single, consistent representation.
