  - {from: "UNRESOLVED_AFTER_FALLBACK_FAILURE", event: "v3 approved and frozen (v2 -> AMENDED)", to: "UNRESOLVED_AFTER_FALLBACK_FAILURE", effect: "unchanged; the single 9.7 remediation becomes eligible but needs the corrected implementation, lock v4, static validation, a new authorization id, human issuance, publication of the frozen baseline, and a separate human dispatch"}
  - {from: "UNRESOLVED_AFTER_FALLBACK_FAILURE", event: "remediation PASS (SUT-02 × iOS × Appium 3)", to: "SELECTED", effect: "restored prospectively for campaigns governed by v3, with the basis 'restored under mobile-runner-policy-v3 after one successful post-fallback remediation qualification'; the AUTH-02 iOS FAIL_RUNNER stays preserved; the AUTH-02 Android PASS may satisfy its platform requirement if every provenance and G-7 check holds"}
