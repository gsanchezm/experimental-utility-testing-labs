instruction_verbatim: |
  # EUS-2026-001 — PREPARE MOBILE-RUNNER-POLICY-V3 AFTER APPIUM FALLBACK EXHAUSTION

  I, gilbertosanchez, human research lead for EUS-2026-001, have reviewed the canonical post-run recording of:

  `APPIUM3-COMPAT-SMOKE-AUTH-02`

  formal run:

  `36539790536`

  attempt:

  `1`

  The currently recorded results remain binding under mobile-runner-policy-v2:

  - SUT-02 × Android = PASS
  - SUT-02 × iOS = FAIL_RUNNER
  - iOS attribution = CONSERVATIVE_TIE_BREAK_ATTRIBUTION_UNCERTAIN
  - mobile_runner_status = UNRESOLVED_AFTER_FALLBACK_FAILURE
  - fallback exhausted = YES
  - all mobile-dependent experimental execution blocked

  I authorize preparation only of a prospective post-data protocol amendment:

  `protocol/mobile-runner-policy-v3.md`

  THIS INSTRUCTION DOES NOT APPROVE OR FREEZE POLICY V3.

  It does not authorize:

  - changing any AUTH-01 or AUTH-02 result;
  - changing the v2 FAIL_RUNNER;
  - restoring mobile_runner_status;
  - fixing the harness;
  - creating implementation lock v4;
  - creating another execution authorization;
  - dispatching Appium;
  - introducing Appium 2;
  - introducing another runner;
  - starting E03;
  - publishing a new public export.

  The purpose is to prepare a scientifically defensible amendment package for human review.

  ## 1. VERIFY CURRENT POST-RUN STATE

  Verify canonical state exactly:

  AUTH-01:
  `ISSUED_VALID_CONSUMED`

  AUTH-01 Android:
  `NOT_EXECUTED / HARNESS_ORCHESTRATION`

  AUTH-02:
  `ISSUED_VALID_CONSUMED`

  AUTH-02 Android:
  `PASS`

  AUTH-02 iOS:
  `FAIL_RUNNER`

  iOS attribution:
  `CONSERVATIVE_TIE_BREAK_ATTRIBUTION_UNCERTAIN`

  mobile_runner_status:
  `UNRESOLVED_AFTER_FALLBACK_FAILURE`

  fallback exhausted:
  `YES`

  G-7 mobile:
  `BLOCKED_STUDY_WIDE`

  lock v3:
  historical execution provenance, unchanged

  PROTO-U16:
  OPEN

  E03:
  NOT_STARTED

  Verify no third compatibility-smoke run and no attempt 2.

  If anything differs:

  STOP.

  ## 2. PRESERVE POLICY V2

  Do not substantively edit:

  `protocol/mobile-runner-policy-v2.md`

  It remains the exact policy under which AUTH-02 was adjudicated.

  During preparation:

  - do NOT mark v2 AMENDED yet;
  - do NOT add the successor pointer yet unless repository rules require it only at final freeze;
  - do NOT reinterpret any historical observation.

  Policy v2 becomes AMENDED only if and when policy v3 is explicitly approved and frozen by a later human instruction.

  ## 3. OPEN THE PROTOCOL-LEVEL DECISION

  Use the next available PROTO issue id.

  Expected if free:

  `PROTO-U19`

  Topic:

  `Mobile-runner strategy after Appium 3 fallback exhaustion under policy v2`

  Classify as:

  `SUBSTANTIVE_POST_DATA_PROTOCOL_DECISION`

  Record the factual trigger:

  - Mobilewright failed its formal qualification;
  - Appium 3 was selected under the frozen fallback;
  - AUTH-01 was NOT_EXECUTED / HARNESS_ORCHESTRATION;
  - AUTH-02 Android subsequently PASSed;
  - AUTH-02 iOS was recorded FAIL_RUNNER under §9.4 because attribution remained uncertain;
  - policy v2 therefore exhausted the fallback and blocked mobile execution;
  - post-run review also identified QUAL-U06, a real study-authored WebDriver transport/diagnostic defect whose causal role in AUTH-02 was insufficiently demonstrated to change the §9.4 result.

  Keep PROTO-U19:

  `OPEN`

  during this preparation.

  ## 4. PREPARE MOBILE-RUNNER-POLICY-V3 AS DRAFT

  Create:

  `protocol/mobile-runner-policy-v3.md`

  State:

  `DRAFT`

  It must clearly say near the top:

  - it is a proposed successor to v2;
  - it is being prepared after data collection began;
  - it does not reinterpret observations collected under v1 or v2;
  - it exists to define prospective behavior after the already-recorded fallback exhaustion;
  - no execution may occur under it while DRAFT.

  Do not freeze it.

  ## 5. PRINCIPLE OF THE PROPOSED AMENDMENT

  The proposed amendment may introduce exactly one narrow mechanism:

  `POST-FALLBACK REMEDIATION QUALIFICATION`

  This mechanism exists because the historical FAIL_RUNNER was produced by the mandatory conservative tie-break while a post-run study-authored implementation defect was also identified.

  It must NOT state that the historical FAIL_RUNNER was wrong.

  It must NOT state that Appium actually passed iOS.

  It must NOT remove fallback exhaustion from the v2 record.

  Instead:

  the v2 result remains historically valid and a new prospective observation may be collected under v3.

  ## 6. ELIGIBILITY FOR REMEDIATION

  The proposed remediation mechanism may be used only when all of the following hold:

  1. the selected fallback runner produced FAIL_RUNNER under the previous policy;
  2. the FAIL_RUNNER remains immutable;
  3. attribution was resolved through the previous policy's conservative tie-break;
  4. post-run preserved evidence identified a concrete study-authored implementation or observability defect relevant to fair runner exercise;
  5. that defect was insufficiently demonstrated as the historical run's cause, so the historical result was NOT reclassified;
  6. the affected campaign(s) have not yet collected experimental measurements requiring the proposed repaired execution path;
  7. explicit human approval of the post-data amendment occurs before any new qualification execution.

  Tie this eligibility explicitly to the existing AUTH-02 record and QUAL-U06.

  Do not make it a generic unlimited retry mechanism.

  ## 7. EXACT SCOPE OF THE REMEDIATION

  The proposed remediation qualification is:

  `SUT-02 × iOS × Appium 3 only`

  Android must NOT execute again.

  Reason:

  Android already has an official PASS compatibility observation under AUTH-02.

  Per-platform independence remains binding.

  The proposed new qualification is not:

  - a rerun of AUTH-02;
  - a continuation of AUTH-02;
  - a repeat of Android;
  - a Mobilewright comparison;
  - a new research question.

  ## 8. EXACT IMPLEMENTATION DEFECT ALLOWED TO BE CORRECTED

  Any future implementation correction under v3 must be narrowly restricted to QUAL-U06.

  The corrected study-authored WebDriver transport must:

  1. coordinate the effective HTTP transport timeout with the predeclared iOS session-start budget;
  2. ensure the transport layer cannot silently impose a shorter timeout than the explicit session timeout;
  3. preserve the underlying transport error cause in formal evidence, including where available:
     - error name;
     - error code;
     - error message;
     - cause name;
     - cause code;
     - cause message;
  4. leave the Appium/XCUITest runner pins unchanged;
  5. leave the SUT build unchanged;
  6. leave the iOS simulator/Xcode substrate unchanged;
  7. leave the smoke capability definition unchanged;
  8. leave the semantic iOS realization unchanged;
  9. leave the WDA launch/connection limits unchanged unless an independent pre-execution compatibility reason requires otherwise and is separately approved.

  No other execution-critical change is authorized merely because the amendment exists.

  ## 9. EXACTLY ONE REMEDIATION QUALIFICATION ATTEMPT

  The proposed v3 rule must authorize at most:

  `ONE`

  formal remediation qualification attempt for the affected iOS compatibility requirement.

  That future attempt requires separately:

  - corrected implementation;
  - successor implementation lock v4;
  - static validation;
  - a new authorization id;
  - explicit human issuance;
  - public publication of the frozen baseline;
  - separate explicit human dispatch.

  No GitHub rerun.

  No automatic retry.

  No second remediation attempt under v3.

  ## 10. PROPOSED OUTCOME SEMANTICS

  The remediation qualification must retain the existing result vocabulary:

  - PASS
  - FAIL_RUNNER
  - NOT_EXECUTED

  No new execution-result category.

  ### If remediation result = PASS

  The historical AUTH-02 iOS FAIL_RUNNER remains preserved under v2.

  The new v3 observation records iOS PASS.

  Policy v3 may then prospectively restore:

  `mobile_runner_status = SELECTED`

  with explicit provenance equivalent to:

  `restored under mobile-runner-policy-v3 after one successful post-fallback remediation qualification`

  This restoration applies only prospectively to campaigns governed by v3.

  It does not alter prior v2 records.

  ### If remediation result = FAIL_RUNNER

  Keep:

  `mobile_runner_status = UNRESOLVED_AFTER_FALLBACK_FAILURE`

  Mobile execution remains blocked.

  No second remediation qualification under v3.

  ### If remediation result = NOT_EXECUTED

  Keep:

  `mobile_runner_status = UNRESOLVED_AFTER_FALLBACK_FAILURE`

  Mobile execution remains blocked.

  Do NOT automatically retry.

  A further attempt would require another explicit post-data protocol amendment.

  This single-attempt terminal behavior must be explicit.

  ## 11. NO THIRD RUNNER

  Policy v3 must NOT silently introduce:

  - Appium 2;
  - Mobilewright again;
  - Maestro;
  - Detox;
  - another third-party runner.

  The selected technical runner remains:

  `Appium 3.7.0`

  for this proposed remediation.

  Choosing another runner would require its own separate protocol decision and is not part of this amendment.

  ## 12. EFFECT ON ANDROID

  Preserve the official observation:

  `SUT-02 × Android × Appium 3 = PASS`

  Do not recollect it.

  Do not rerun it merely to pair it with iOS.

  If v3 remediation succeeds and the study-level status becomes SELECTED again, the existing Android PASS may satisfy its platform-specific compatibility requirement prospectively, provided all provenance and G-7 checks remain valid.

  ## 13. POST-DATA IMPACT MATRIX — ALL E01–E12

  Because `data_collection_started = true`, comply exactly with:

  `protocol/change-control-v1.md §5`.

  Prepare an explicit table covering every campaign:

  E01
  E02
  E03
  E04
  E05
  E06
  E07
  E08
  E09
  E10
  E11
  E12

  For EACH campaign state:

  - whether policy v3 affects it;
  - whether it requires mobile execution;
  - current campaign state;
  - whether any raw experimental data has already been collected;
  - whether existing raw data remains valid;
  - whether any data must be recollected;
  - whether data must remain analyzed under its old protocol version;
  - which protocol version would govern future collection.

  Do not infer mobile dependency from campaign names alone.

  Inspect the actual campaign configuration/protocol references.

  Expected principle:

  already-collected evidence is never retroactively reinterpreted under v3.

  E01 must remain valid under its historical governing protocol.

  Formal Mobilewright and Appium qualification observations remain historical records under the versions that governed them.

  ## 14. E03 SPECIFIC IMPACT

  E03 remains:

  `NOT_STARTED`

  No measured E03 observation exists.

  Prepare the v3 impact statement so that, if the remediation qualification eventually PASSes and all independent blockers are resolved, E03 may start prospectively under the explicitly selected protocol version.

  PROTO-U16 remains an independent blocker.

  Do not resolve it now.

  ## 15. OTHER MOBILE-DEPENDENT CAMPAIGNS

  Identify exactly which of E04–E12 depend on mobile execution.

  For every such NOT_STARTED campaign:

  - state that no raw campaign data needs recollection;
  - state that future mobile execution may occur only under the new policy if v3 is eventually approved and its remediation succeeds.

  Do not broaden v3 to campaigns that do not require mobile execution.

  ## 16. PRIOR DATA VALIDITY

  The draft amendment must explicitly state that it does NOT invalidate or recollect:

  - E01;
  - H1;
  - formal Mobilewright qualification;
  - AUTH-01;
  - AUTH-02;
  - Android AUTH-02 PASS;
  - iOS AUTH-02 FAIL_RUNNER.

  The new remediation observation, if later authorized, is a separate prospective record under v3.

  ## 17. G-7 IMPACT ANALYSIS

  Do not change G-7 yet.

  Prepare an implementation-impact note only.

  Determine whether existing G-7 can support the proposed v3 outcome by restoring:

  `mobile_runner_status = SELECTED`

  after a successful remediation PASS.

  Prefer reuse of existing G-7 semantics rather than introducing a new status vocabulary unless technically impossible.

  Verify conceptually:

  Android existing PASS + iOS future remediation PASS + status SELECTED
  → platform compatibility checks can pass.

  Before remediation:

  status UNRESOLVED_AFTER_FALLBACK_FAILURE
  → every mobile condition remains blocked.

  Do not modify `.github/workflows/e03-measured-execution.yml` during this preparation.

  ## 18. CHANGE-CONTROL PACKAGE

  Prepare a formal amendment decision package containing:

  - proposed policy-v3 path;
  - exact substantive diff from v2;
  - rationale;
  - PROTO-U19;
  - E01–E12 impact matrix;
  - prior-data-validity statement;
  - proposed runner-state transitions;
  - proposed single-remediation rule;
  - expected implementation changes if later approved;
  - risks to internal validity;
  - risks of outcome-responsive methodology;
  - mitigation explaining why historical v2 observations remain immutable;
  - alternatives considered.

  ## 19. ALTERNATIVES CONSIDERED

  The decision package must explicitly compare at least:

  ### A. Stop all mobile experimentation permanently

  Effect on RQs/campaigns and information loss.

  ### B. Introduce a third mobile runner

  Additional methodological variability and qualification burden.

  ### C. One prospective Appium 3 remediation qualification under policy v3

  Historical FAIL_RUNNER preserved; known study-authored defect corrected prospectively; exactly one new iOS attempt.

  Do not select an alternative on the agent's own authority.

  The draft may identify consequences and tradeoffs only.

  ## 20. QUAL-U06

  Leave QUAL-U06 OPEN during amendment preparation.

  Do not mark its correction resolved because no implementation fix has been made.

  Reference it from the v3 rationale.

  ## 21. QUAL-U07 PUBLICATION HYGIENE

  Leave canonical AUTH-02 evidence unchanged.

  Prepare, but do not apply, a publication-hygiene resolution proposal for QUAL-U07.

  The proposal should determine whether the already-existing deterministic provider-neutral path transformation can safely cover:

