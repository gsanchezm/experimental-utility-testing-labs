rationale: >-
  Policy v2, 9.5, ends every mobile-dependent campaign after one FAIL_RUNNER of the selected fallback runner until a new
  explicit protocol amendment decides the mobile-runner strategy, and deliberately gives no repeat. The recorded FAIL_RUNNER
  of SUT-02 × iOS was reached by the mandatory conservative tie-break (9.4), not by a demonstrated runner-stack failure, and
  the same post-run review identified a concrete study-authored WebDriver transport and diagnostic defect (QUAL-U06) that
  limits what any artifact of that run can show. The draft proposes the narrowest decision that could lift the block without
  touching the historical record: one prospective Appium 3 observation of that one requirement, after a correction limited
  to QUAL-U06, judged by the unchanged 9.1-9.4 rules, with terminal single-attempt effects. The v2 result stays valid; the
  remediation observation, if any, is a separate record under v3. Whether this is preferable to stopping mobile
  experimentation (A) or introducing a third runner (B) is a human decision (alternatives below).

