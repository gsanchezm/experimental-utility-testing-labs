qual_u07_publication_hygiene_proposal:  # PREPARED, NOT APPLIED; no export is authorized; QUAL-U07 stays OPEN (publication only)
  question: "can the already-existing deterministic provider-neutral path transformation cover (a) the verified host-path occurrences in the AUTH-02 SUT-02 iOS appium-server.log and (b) any non-artifact metadata or operation-record occurrence that matches the same path pattern?"
  answer: "no. PROVIDER_NEUTRAL_PATH_ALIAS (PUBLIC-EXPORT-MANIFEST.yaml, export_procedure.transformation_classes) renames the canonical agent-instructions file and its references only; QUALIFICATION_TOKEN_FRAGMENT_REDACTION matches token spans only; no existing class matches host paths"
  occurrences_matching_the_scan_pattern:  # the tracked-file private-path pattern of .github/workflows/e03-validate.yml, verified on the canonical tree at HEAD 1882113
    - {path: qualification/compatibility-smoke/formal/APPIUM3-COMPAT-SMOKE-AUTH-02/SUT-02-ios/appium-server.log, lines: "2191-2277 (56 lines)", kind: raw imported artifact}
    - {path: manifests/appium3-compat-smoke-auth-02-postrun-recording-v1.yaml, lines: "599 (1 line)", kind: "verbatim human instruction (section 19 quotes the path prefix)"}
  candidate_new_class:  # candidate -- not frozen
    name: QUALIFICATION_HOST_PATH_REDACTION
    nature: "publication-only, non-scientific; canonical files never modified"
