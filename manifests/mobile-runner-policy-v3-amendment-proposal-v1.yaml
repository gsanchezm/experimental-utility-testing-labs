  - any non-artifact metadata/operation-record occurrence that matches the same path pattern.

  Requirements:

  - canonical bytes unchanged;
  - ZIP unchanged;
  - transformation publication-only;
  - exact canonical/export hashes recorded;
  - no scientific value changed.

  Do not publish yet.

  ## 22. NO IMPLEMENTATION CHANGE

  Do NOT modify:

  - wd.mjs;
  - smoke.mjs;
  - shell scripts;
  - compatibility-smoke workflow;
  - lock v3;
  - G-7;
