  - ".github/workflows/e03-validate.yml regression checks adapted to the v3 gate and G-7 changes"

g7_impact_analysis:  # implementation-impact note only; G-7 is not modified by this preparation
  current_logic: "for every ANDROID or IOS condition G-7 requires mobile_runner_status exactly SELECTED; that no FAIL_RUNNER of the selected runner is recorded for any SUT × platform in the mirror or in ANY row of the QUALIFIER Smoke records table (src_fail scans every row, not only the latest per SUT × platform); a fallback state ADMISSIBLE; exactly one mirror entry for its own SUT × platform × runner with result PASS and runner_version equal to the pin; a PASS row in the QUALIFIER table; and the selected runner's own recorded version equal to its pin (tools.mobile_fallback.version)"
  before_remediation: "status UNRESOLVED_AFTER_FALLBACK_FAILURE: every mobile condition fails closed (verified statically at HEAD 1882113: FALLBACK_EXHAUSTED_VERIFIED; E03-CS001-SUT02-ANDROID fails despite its own PASS)"
  simulation: "static run of the unchanged gate script on a scratch clone with a HYPOTHETICAL post-remediation fixture (status SELECTED; mirror SUT-02 ios PASS; one PASS row appended after the preserved AUTH-02 iOS FAIL_RUNNER row): both conditions still fail -- 'no FAIL_RUNNER ... recorded' and 'the selected runner remains admissible' FAIL with PROVENANCE_INCONSISTENT_FAIL_CLOSED, because the preserved v2 FAIL_RUNNER row is still counted; 'the version of the selected runner itself is recorded' FAIL (pre-existing null version); every per-platform check passes (mirror entry PASS, runner_version pin, QUALIFIER PASS row) for both android and ios. The fixture existed only in the scratch clone"
  conclusion: "restoring mobile_runner_status = SELECTED alone would NOT re-admit mobile conditions: the existing G-7 cannot express 9.7.8 (a preserved FAIL_RUNNER row superseded by a later 9.7 PASS row). The status vocabulary itself can be reused (SELECTED); no new status value is needed"
  minimal_change_if_approved: "evaluate each SUT × platform's source FAIL_RUNNER on its latest Smoke-records row (as e03-validate.yml's mirror check and G-7's own verified() already do), and accept an earlier FAIL_RUNNER row only when a later PASS row for the same SUT × platform exists under a v3 remediation authorization and the toolchain carries the 9.7.7 restoration basis with policy v3 FROZEN; every other FAIL_RUNNER keeps blocking. Separately, the null Appium 3 version must be recorded or its gate re-decided"
  conceptual_check: "Android existing PASS + iOS remediation PASS + status SELECTED + the change above -> the per-platform checks pass for both SUT-02 conditions (every other G-1..G-11 gate still applies); before remediation -> every mobile condition stays blocked"

risks_internal_validity:
  - "a second observation of the same requirement after an unfavorable result is a forking path: the study now has two SUT-02 × iOS observations under two policy versions, and reporting only the second would bias the runner-suitability record"
  - "the correction changes the measurement instrument (the harness transport), so the remediation observation is not a replication of AUTH-02; any comparison of the two is confounded by the harness change"
  - "a PASS would restore admissibility of the same runner for every mobile campaign on the basis of one additional execution of one ecosystem × platform"
  - "the remediation remains exposed to the same host variability (CI runner load, WebDriverAgent build time); a FAIL_RUNNER or NOT_EXECUTED is terminal"
risks_outcome_responsive_methodology:
  - "the amendment is prepared after the unfavorable outcome is known; a rule written after the outcome can be tailored to reach a preferred result (PREQUALIFICATION_OUTCOME_EXPOSURE-type risk)"
  - "the defect was found by the post-run review of the failure it may be relevant to"
mitigations:
  - "the historical v2 observations and the fallback exhaustion are immutable and are never reinterpreted, re-labelled, or replaced; the remediation is appended as a separate v3 record, and both are reported"
  - "the rule is narrow and non-generic: one ecosystem × platform, one attempt, one runner (Appium 3.7.0), one defect class (QUAL-U06), and terminal outcomes in every direction; it is not a retry mechanism"
  - "the correction is restricted to QUAL-U06 and fixed before execution (9.7.4); runner pins, SUT build, substrate, capability definition, semantic realization, and WebDriverAgent limits are unchanged"
  - "the result vocabulary and the conservative tie-break are unchanged, so an uncertain outcome is again FAIL_RUNNER"
  - "explicit human approval of the amendment, then a successor lock, a new authorization, publication, and a separate dispatch, each separately, before any execution"
  - "no campaign has collected data, so no measured result can be selected or discarded in response"

alternatives:  # consequences and trade-offs only; no alternative is selected here (instruction section 19)
  A_stop_mobile_permanently:
    description: "keep v2 in force and end all mobile experimentation"
    consequences: "the Android Native and iOS Native modalities receive no campaign data: E03 loses its two SUT-02 mobile conditions (seven CS-001 conditions remain), and the mobile parts of E02, E04, E06, E07, E11, and E12 (and E05 or E10 if they would have included mobile) are not executed; RQ4 (cross-platform and cross-layer) loses its Android and iOS evidence, RQ2 and RQ3 lose mobile conditions, and RQ5 and E12 lose mobile cells; E01's mobile capability scores stay valid but unconfirmed experimentally; lowest methodological risk, largest information loss; the SUT-02 Android PASS would remain an unused observation"
  B_third_runner:
    description: "a new protocol decision introducing a third mobile runner (neither Appium 2, which is prohibited, nor a re-qualification of Mobilewright without its own decision)"
    consequences: "requires selecting and pinning a runner, a new qualification gate or equivalent, new compatibility smokes for every mobile-capable ecosystem × platform, new harnesses and locks; adds runner variability to the study and a further post-data change; the SUT-02 Android PASS under Appium 3 would not transfer; largest qualification burden and time cost; the runner comparison must still not become a research question (Section 10)"
  C_single_appium3_remediation:
    description: "policy v3 as drafted: one prospective Appium 3 remediation qualification of SUT-02 × iOS after a QUAL-U06-restricted correction"
    consequences: "historical FAIL_RUNNER preserved; known study-authored defect corrected prospectively; exactly one new iOS observation; if PASS, the Android PASS can be reused and the study keeps one runner; if FAIL_RUNNER or NOT_EXECUTED, the study is back at A with one more preserved record; carries the forking-path and outcome-responsive risks listed above, mitigated by the narrow single-attempt design"
  selection: "none -- the human research lead decides (approve, reject, or revise)"

