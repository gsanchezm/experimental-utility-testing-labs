prior_data_validity: >-
  Policy v3 would not invalidate, re-collect, or reinterpret: E01 (FROZEN, protocol v1) and its evidence; the H1 analysis;
  the formal Mobilewright qualification under MOBILE-QUALIFICATION-EXEC-AUTH-03 and the quarantined 2026-09-22 execution;
  the Section 8 selection of Appium 3; APPIUM3-COMPAT-SMOKE-AUTH-01 (SUT-02 android NOT_EXECUTED / HARNESS_ORCHESTRATION);
  APPIUM3-COMPAT-SMOKE-AUTH-02 (SUT-02 android PASS; SUT-02 ios FAIL_RUNNER, 9.4 tie-break); and the v2 fallback exhaustion.
  No campaign of E02-E12 has raw data. A remediation observation, if later authorized, is a separate prospective record under
  v3 and is appended, never substituted.

