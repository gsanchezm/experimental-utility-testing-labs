multi_run_rule: "experiments/E03-resetability/controlled-instance-status.yaml, github_actions_runs (multi-run semantics of operation OP-ENV-05): an entry is never removed or rewritten; the latest run that ran a job for a condition governs gate G-8; with target all this run runs a job for all nine conditions and governs them all (R2)"
why_target_all: "Only target=all runs the four web conditions in one dispatch and the two mobile verification jobs and sut-05-api; this run therefore governs all nine conditions under the latest-run rule (R2), as the run of the previous dispatch did. It is the first hosted run of the revision that follows the review of that run: the capture-time scrub of private network addresses and the numbering of the DRY_RUN bundles by the run (operation OP-CI-09), and the executor whose embedded digests equal the exported bytes (operation OP-CI-10)."
expected_under_test:  # hypotheses to be observed in this run, never results
  H1: "All seven jobs run (target all): sut-01-web-api (ubuntu-24.04, timeout 30 minutes), sut-02-web (ubuntu-24.04, 30), sut-02-android (ubuntu-24.04, 45), sut-02-ios (macos-15, 45), sut-03-web (ubuntu-24.04, 30), sut-04-web-api (ubuntu-24.04, 45), and sut-05-api (ubuntu-24.04, 60); each provisions and verifies its instance and writes its ENVIRONMENT_VERIFICATION record; the run's conclusion is failure if any job fails. The runner images are those GitHub provides on the day: their versions are recorded, not pinned."
  H2: "The DRY_RUN step of the five jobs that have one (sut-01-web-api, sut-02-web, sut-03-web, sut-04-web-api, sut-05-api; the two mobile jobs have none) runs only after a successful verify step: a venv from /usr/bin/python3 with requirements.txt installed under --require-hashes and Playwright Chromium; instance.json written by the step; run-condition.sh checked against the sha256 of its committed blob; each condition run once with RECORD_CLASS DRY_RUN, EXECUTION_ID DR0008, ATTEMPT 1, EXECUTOR_PROMPT_VERSION EXECUTOR-E03-RESETABILITY-E03-resetability-v1; each run manifest validated with ajv-cli 5 and ajv-formats 3 against schemas/run-manifest.schema.v2.json plus the E03 conventions; the step fails at its end if any validation failed."
  H3: "The first hosted exercise of the repair of operation OP-CI-10: run-condition.sh verifies the 13 embedded digests against the checked-out (exported) bytes before anything else, and no condition stops at 'digest mismatch' (the stop that the mismatch between the canonical and the exported common.py would have caused); a condition that stops there is a defect of the exported bytes, not a SUT finding."
  H4: "The first hosted exercise of the numbering of the DRY_RUN bundles (operation OP-CI-09): the step with id dryrun of each of the five jobs writes execution_id DR0008 (the run number is 8) and attempt 1, so the seven bundles are named E03-DRY_RUN-E03-CS001-<SUT01-API, SUT01-WEB, SUT02-WEB, SUT03-WEB, SUT04-API, SUT04-WEB, SUT05-API>-DR0008-A1 and differ from the bundles of the earlier DRY_RUN runs (DR0001-A1); each run manifest carries run_id E03-CS001-<condition>__DR0008__A1."
  H5: "The first hosted exercise of the capture-time scrub of private network addresses (operation OP-CI-09): the start-up banner of the SUT-04 web application prints the private network address of the runner (line 7 of sut04-web.log in the imported artifacts of runs 38270815417 and 39316211051); in this run's ENVIRONMENT_VERIFICATION artifact of the job sut-04-web-api and in the evidence copies of the two SUT-04 DRY_RUN bundles that line is expected to carry the marker <private-address> instead, and no kept text file of any artifact is expected to carry an IPv4 literal of the three private ranges of RFC 1918. A residual address is a defect of the scrub, reported before any import (R5)."
  H6: "The earlier hosted outcomes of the DRY_RUN executions (run 39316211051; manifests/e03-environment-verification-import-v7.yaml, dry_run_review) are observations under the realization as ruled: E03-CS001-SUT01-API SUCCESS (2 actions); E03-CS001-SUT01-WEB FAILURE (empty_cart_view false; order line order-item-p02 after the reset and the reload; 3 actions against the predeclared 2); E03-CS001-SUT02-WEB SUCCESS (3 actions against the predeclared 2); E03-CS001-SUT03-WEB FAILURE (bag_quantity 1 after Logout; 2 actions); E03-CS001-SUT04-API SUCCESS (2 actions); E03-CS001-SUT04-WEB SUCCESS (2 actions; refetch chain 308, 200); E03-CS001-SUT05-API SUCCESS (2 actions). A repeated value is reported as a repetition; nothing is changed in response to an outcome, and the executor is not edited."
  H7: "The SUT-04 job: its third hosted run of the route of the SUT's README and of the Maven 3.9.14 pin (runs 38270815417 and 39316211051 were the first and the second); the fourteen checks of its verify step as in those runs."
  H8: "Capture order: each job scrubs and uploads its ENVIRONMENT_VERIFICATION artifact at its end, after its DRY_RUN step, so the SUT logs kept in those artifacts also hold the log lines that the SUTs wrote during the DRY_RUN executions."
  H9: "Expected artifacts: seven ENVIRONMENT_VERIFICATION artifacts, E03-ENVIRONMENT_VERIFICATION-<SUT-01-web-api, SUT-02-web, SUT-02-android, SUT-02-ios, SUT-03-web, SUT-04-web-api, SUT-05-api>-run<run id>-a1, each when its job reaches its upload step, and up to seven DRY_RUN bundles."
  H10: "What the run is not: not a MEASURED_EXPERIMENT, not E03 data, not a mobile qualification or compatibility smoke, not a SUT finding; no gate of the measured workflow runs; E03 stays NOT_STARTED; gate G-7 keeps both mobile conditions blocked whatever their verification result. The measured-execution workflow is not dispatched and keeps 0 runs; only the environment-verification workflow, one of the two workflows that operation OP-CI-09 changed, runs here."

import_rules_fixed_before_the_run:  # applied by the import operation of this run, separately; R1 to R4 and R6 as in manifests/e03-environment-verification-dispatch-v7.yaml with the run references updated, R5 replaced
  R1: "Each condition's github_actions_verification.status is the verification_result of its job's ENVIRONMENT_VERIFICATION record (the status file's own definition, header comment lines 9-10: a VERIFIED GitHub Actions record for the condition); github_job_conclusion is transcribed as observed. When a job concludes failure after its verify step wrote a VERIFIED record (a later step failed, for example the DRY_RUN step or an upload), its conditions are VERIFIED, the job conclusion is transcribed as failure, and the failed step is named; nothing is hidden. When a job's record is NOT_VERIFIED or missing, its conditions are NOT_VERIFIED, with the failing step named."
  R2: "Latest-run rule (the status file's github_actions_runs comment; multi-run semantics defined 2026-10-04): with target all this run runs a job for all nine conditions, so it governs all nine, whatever its result; the import appends an eighth entry to github_actions_runs and updates the comments that name run 39316211051; the earlier values stay in their import directories and import records. A condition whose job does not verify becomes NOT_VERIFIED at the import (gate G-8 then refuses it) and needs a further dispatch under its own approval."
  R3: "reverification_required: no condition carries the entry (summary reverification_required: []); the import adds none and removes none."
  R4: "Only the seven ENVIRONMENT_VERIFICATION artifacts are imported, byte-exact, under experiments/E03-resetability/environment-verification/github-actions/run<run id>-a1/<job id>/ (sut-01-web-api, sut-02-web, sut-02-android, sut-02-ios, sut-03-web, sut-04-web-api, sut-05-api), as in the earlier imports. The DRY_RUN bundles are downloaded outside the repository, verified against their GitHub digests, read, and never imported anywhere; only values read from them (numbers, statuses, quoted lines) and their digests enter tracked records."
  R5: "Every archive is first verified against its GitHub digest. Any private network address (the pattern of PUBLIC-EXPORT-MANIFEST.yaml, environment_verification_private_address_redaction.pattern), private path, vendor term, or secret-like token in any member of any ENVIRONMENT_VERIFICATION artifact or DRY_RUN bundle: STOP and report before any import; its publication handling then needs a decision, and the canonical import stays byte-exact either way. The capture-time scrub of this run is expected to have replaced the runner's address already (H5)."
  R6: "A DRY_RUN finding (a non-zero executor exit status, a failed validation, an outcome or action count other than that of the condition's earlier hosted DRY_RUN, a settle that reached its bound, a missing file) is a DRAFT revision item of the executor before the lock (new digests, new commit), never a SUT finding; it is reported, not fixed, in the import operation."

