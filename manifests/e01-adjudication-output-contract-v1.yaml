rationale: >
  prompts/working/e01-adjudicator-v1.md left the adjudication output record format undefined
  (protocol/agent-governance-v1.md, section 3.3 requires recording, for every examined cell, whether it
  is CONFIRMED, DISPUTED, or UNSUPPORTED, referenced by evidence_id, never by CSV row or line number).
  The only pre-existing candidate -- the DRAFT adjudication object in schemas/sut-audit.schema.json -- is
  incomplete relative to that requirement (no field records a cell examined and found CONFIRMED or
  UNSUPPORTED; no evidence_id-pattern field) and resides under audits/<SUT>/, a path ADJUDICATOR-EU-01
  cannot write to (protocol/agent-governance-v1.md, section 3.3). protocol/unresolved.md, row PROTO-U01,
  records the full discovery and the human ruling on the schemas/ freeze-status ambiguity underlying this
  record; row PROTO-U02 records a separate, unresolved write-authority gap (audit_status: ADJUDICATED)
  that this record does not address.
