  ### Toolchain versions

  - Web runner: Playwright for Python 1.63.0, with the runtime dependencies pyee 13.0.1, greenlet 3.5.6, typing-extensions 4.16.0, each pinned by exact version with sha256 hashes in `experiments/E03-resetability/executor/requirements.txt` (sha256 `a88067fa0f79f0b2a92f5a3aca79908d5b6436db3c961f3836b8e9551df7a4ed`), installed with `--require-hashes --only-binary :all:`; Chromium is the build that this Playwright version names (chromium-1243, Chrome for Testing 153.0.8010.12), downloaded by `playwright install chromium`, not hash-pinned by the study, and its observed version is recorded per run (`manifests/toolchain-manifest.yaml`, `tools.web_runner`).
  - API client: the Python 3 standard library (`urllib.request`) of the runner's python3 (3.12 series on ubuntu-24.04); the observed version is recorded per run in the run manifest `toolchain` (`tools.api`).
  - Execution substrate: GitHub Actions, ubuntu-24.04 GitHub-hosted runners, through `.github/workflows/e03-measured-execution.yml` only; the SUT provisioning tools are those installed by that workflow at the pinned revision, and the workflow file sha256, the repository SHA, and the runner image are captured per run as gate and provenance outputs. For SUT-04 they are Temurin JDK 26, Apache Maven 3.9.14 (the version the SUT's README lists at the pinned commit; verified by its published SHA-512), and Node.js 24.21.0 (the version of the SUT-04 provisioning record); the SUT's README lists Node.js 24.14.1 and npm 11.11.0 as 'known to work with', and the study keeps 24.21.0 by the human decision of 2026-10-10 (sha256 `952750cd30bfeaf0ecd6f507c9f46106e311949d9f52b4de795b6bb6313a028f`), a difference documented here and not an operation of its own.
  - Mobile runner: not used (the two mobile conditions are blocked, below).

  ### Dispatch procedure prompt, implementation, schema

  - Dispatch procedure prompt version id (the `executor_prompt_version` input of the measured-execution workflow and the `prompt_version` of every run manifest): `ORCHESTRATOR-E03-resetability-v1` (frozen copy `prompts/frozen/ORCHESTRATOR-E03-resetability-v1.md`, sha256 `{PROMPT_SHA256}`); the working copy is written to be byte-identical to the frozen copy, which is written once, at the START (prompts/README.md, rule 2).
  - Executor implementation: `experiments/E03-resetability/executor/run-condition.sh`, sha256 `9662bd5c0b8cf4a9230f6b51a6abb78c2e167782fa2ff5d2aef51e0fd9a32e44` (3764 bytes); the digests embedded in that file cover every other implementation file (`executor/*.py`, `requirements.txt`), so this single hash locks the whole implementation (executor README, section 9); the run manifests record `agent_role` ORCHESTRATOR.
  - Run-manifest schema: `schemas/run-manifest.schema.v2.json` (sha256 `9a86cf37c4ccd2abe3368866309e18a9f9554a2330f5dceeacda6d02a2932757`); `actions[].outcome` is mandatory on every emitted action record by campaign convention.
  - Agent governance: `protocol/agent-governance-v4.md` (sha256 `d01011cf85dfdbed3dda7acef45927a4b1e1155a52bbddc1863a4d051e6a7e83` of the canonical file; the public repository holds the provider-neutral export of that file, bridged to it by `PUBLIC-EXPORT-MANIFEST.yaml`), FROZEN-PRE-DATA since 2026-10-27, whose section 3.5 governs the execution of this campaign under ORCHESTRATOR coordination with one dispatch authorization per assigned SUT; `protocol/agent-governance-v3.md` is AMENDED.

  ### Conditions

  Nine conditions, all on CS-001, one per COMPARABLE SUT x surface used, reset direction only (establishing a state belongs to a different campaign). Seven are executable and are the conditions of this campaign (human decision D4 of 2026-10-05); two are recorded and blocked, not omitted.

  | Condition id | SUT | Surface | Reset mechanism | Predeclared reset-side Required Actions | environment_type | N per condition | Status at START |
  |---|---|---|---|---|---|---|---|
  | E03-CS001-SUT01-WEB | SUT-01 | WEB | API_RESET / SESSION_RESET (realization W-A of the executor README, section 4.2) | 2 | SELF_HOSTED (GitHub-hosted runner; verified by run 40628631086) | 50 (EX0001 to EX0050) | EXECUTABLE: CONTROLLED and VERIFIED on GitHub Actions |
  | E03-CS001-SUT01-API | SUT-01 | API | API_RESET / SESSION_RESET | 2 | SELF_HOSTED (GitHub-hosted runner; verified by run 40628631086) | 50 (EX0001 to EX0050) | EXECUTABLE: CONTROLLED and VERIFIED on GitHub Actions |
  | E03-CS001-SUT02-WEB | SUT-02 | WEB | APP_DATA_CLEAR | 2 | SELF_HOSTED (GitHub-hosted runner; verified by run 40628631086) | 50 (EX0001 to EX0050) | EXECUTABLE: CONTROLLED and VERIFIED on GitHub Actions |
  | E03-CS001-SUT03-WEB | SUT-03 | WEB | SESSION_RESET | 2 | SELF_HOSTED (GitHub-hosted runner; verified by run 40628631086) | 50 (EX0001 to EX0050) | EXECUTABLE: CONTROLLED and VERIFIED on GitHub Actions |
  | E03-CS001-SUT04-WEB | SUT-04 | WEB | API_RESET | 2 | SELF_HOSTED (GitHub-hosted runner; verified by run 40628631086) | 50 (EX0001 to EX0050) | EXECUTABLE: CONTROLLED and VERIFIED on GitHub Actions |
  | E03-CS001-SUT04-API | SUT-04 | API | API_RESET | 2 | SELF_HOSTED (GitHub-hosted runner; verified by run 40628631086) | 50 (EX0001 to EX0050) | EXECUTABLE: CONTROLLED and VERIFIED on GitHub Actions |
  | E03-CS001-SUT05-API | SUT-05 | API | ENVIRONMENT_RESTART | 2 | SELF_HOSTED (GitHub-hosted runner; verified by run 40628631086) | 50 (EX0001 to EX0050) | EXECUTABLE: CONTROLLED and VERIFIED on GitHub Actions |
  | E03-CS001-SUT02-ANDROID | SUT-02 | ANDROID | APP_DATA_CLEAR | 3 | EMULATED | none | BLOCKED, not executed (see below) |
  | E03-CS001-SUT02-IOS | SUT-02 | IOS | APP_DATA_CLEAR | 3 | SIMULATED | none | BLOCKED, not executed (see below) |

  The two blocked conditions are blocked from START and measurement by the study mobile-runner state (`mobile_runner_status` UNRESOLVED_AFTER_FALLBACK_FAILURE; `protocol/mobile-runner-policy-v2.md`, section 9.5, carried by `protocol/mobile-runner-policy-v3.md`); the remediation path of that policy's section 9.7 is not pursued before the planned manuscript's DATA FREEZE (human decision of 2026-10-20, `manifests/mobile-path-disposition-v1.yaml`); gate G-7 of the measured workflow refuses both. The controlled instance of E03-CS001-SUT02-IOS is VERIFIED on GitHub Actions (run 40628631086), which does not unblock it. They have no sample size and are not executed; this section does not decide the mobile path.

  ### Sample size per condition

  N = 50 per executable condition (human decisions D2 of 2026-10-05 and Q7 of the executor README, section 11): execution ids EX0001 to EX0050, attempt 1 each, one dispatch per execution; 350 planned executions in all. Required Actions (reset) statistics are computed over the attempts that reached the reset action; ABORTED and ERROR attempts are reported beside them, never dropped.

  ### Exclusion and attribution rules

  None beyond the frozen E03 and setup-effort discipline: no run is excluded after the fact; an attempt keeps its recorded outcome; a further attempt (attempt + 1) is dispatched only on an explicit human instruction that names the condition and the execution; the first attempt of an execution is immutable; no attribution rule is introduced (the deferred issue (xix) belongs to other campaigns).

  ### CONFIRMATORY comparisons

  H2 (`protocol/statistical-analysis-plan-v1.md`, section 4.3): SUT-01 versus SUT-02 and SUT-01 versus SUT-03, on Required Actions (reset) per COMPARABLE canonical scenario, paired on the WEB surface (human decision D2 of 2026-10-05); this campaign contributes the reset side only. No comparison involving SUT-04 or SUT-05 is pre-registered CONFIRMATORY; they stay EXPLORATORY.

  ### Execution

  Every MEASURED_EXPERIMENT runs only through `.github/workflows/e03-measured-execution.yml` on the default branch of the PUBLIC repository (GitHub Actions reads the public tree, so the dispatches follow the publication of the START state), one condition, one execution, one attempt per dispatch, first attempt only, no GitHub re-run. The runs are dispatched by the ORCHESTRATOR under `protocol/agent-governance-v4.md`, section 3.5 ("Dispatch"), and the frozen dispatch procedure `ORCHESTRATOR-E03-resetability-v1`, with the frozen inputs of this record; no agent session is instantiated per SUT. The ORCHESTRATOR dispatches only within a dispatch authorization that the human research lead issued, one per assigned SUT, naming that SUT's executable conditions and the number N of executions per condition; a dispatch authorization is not issued by this section, by a prepared record, or by the START, and the human may revoke it at any time. Within it each execution is dispatched in the order below without a further approval of each exact dispatch: exactly one dispatch per execution, never cancelled, re-run, or repeated, and never a second run of a condition while one is in progress; a further attempt is a new dispatch under its own explicit approval naming the condition and the execution.

  ### Order of dispatches and dispatch record

  Order (fixed here, before the first dispatch; protocol/agent-governance-v4.md, section 3.5, "Execution without cross-SUT adaptation"): within a dispatch authorization, the conditions of the assigned SUT are dispatched in the order of the Conditions table above, a condition being completed (EX0001 to EX0050, in ascending order, each only after the run before it concluded) before the next condition of the same SUT starts; no order across SUTs is fixed by this record, the dispatches under different dispatch authorizations are independent of each other, and no decision whether, when, or how to dispatch an execution depends on a measured output of any SUT. Dispatch record: the append-only record is one file per condition, `manifests/e03-measured-dispatch/<condition id>.jsonl`, one line per event; the line of a dispatch (condition id, execution id, attempt, inputs, the UTC clock reading, and the revisions of the public repository and of the workflow file that are dispatched) is committed before the dispatch is made, and the line of its run identity (run id, run number, run attempt, head sha, creation time) is committed no later than the dispatch line of the next execution of that condition, or at the close of the condition. The stop conditions are those of the frozen dispatch procedure.
