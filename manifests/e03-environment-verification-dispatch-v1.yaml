instruction_verbatim: |
  EUS-2026-001 — OP-ENV-01 — ONE DISPATCH OF THE E03 ENVIRONMENT VERIFICATION ON GITHUB ACTIONS (NON-MEASURED)

  Role for this operation: ORCHESTRATOR (protocol/agent-governance-v2.md).
  Classification: gated action (a workflow dispatch that clones or downloads the pinned SUT sources). Record class ENVIRONMENT_VERIFICATION only; nothing is measured, nothing enters raw-data/.

  HUMAN APPROVAL
  Given by gilbertosanchez, human research lead, on 2026-10-02T22:04:07Z, to the study's independent orchestration reviewer, and relayed by that reviewer in this instruction.
  Decision item as presented to him (verbatim):
  "3. **Verificación de entorno:** un dispatch de `e03-environment-verification.yml` sobre el `main` público. No mide nada, pero clona los SUT (regla 15). Sería el run 39."
