  "3. Vamos por tu recomendación"
  Scope of the approval as relayed: exactly ONE workflow_dispatch of .github/workflows/e03-environment-verification.yml on the default branch of the public repository gsanchezm/experimental-utility-testing-labs, with input target=all. Nothing else.

  THIS APPROVAL DOES NOT COVER
  - a second dispatch, or a re-run of the run or of any job;
  - any other workflow; any measured execution; E03 START;
  - importing the artifacts into the repository or transcribing anything into experiments/E03-resetability/controlled-instance-status.yaml (a separate bounded operation after the independent audit of this run);
  - any change to a workflow, the SUT manifest, a pin, a gate, or any other tracked file except the two records named below;
  - any export or push.

  1. EXPECTED BASELINE (STOP on any mismatch and change nothing)
  - canonical main HEAD 041b907d8c4bc70c3ac7280ffcc69614db471b15; tracked tree and index clean.
  - public repository: default branch main at 34c0453053a29492a34b6a20676bd8f1f046738b, tree 9f3fd811fbace7243fc3daacf0db56eacfccc671.
  - GitHub Actions: 38 runs in total; 0 runs of e03-environment-verification.yml; nothing queued or in progress.
  - the public copies of .github/workflows/e03-environment-verification.yml and manifests/sut-manifest.yaml carry the canonical bytes (verify through the PUBLIC-EXPORT-MANIFEST.yaml of public main: UNCHANGED, or bridged by its canonical and exported hashes).
  - the workflow starts no mobile test runner: confirm by reading the file that the SUT-02 android and ios jobs use only the platform tools. If any job would start Appium, Mobilewright, or another runner, STOP.

  2. RECORD BEFORE DISPATCH
  Create manifests/e03-environment-verification-dispatch-v1.yaml: record class; the approval above verbatim with its sha256; the statement that it was given to the independent orchestration reviewer and relayed (this instruction verbatim with its sha256); the exact dispatch inputs (repository, workflow file and its sha256, ref main, head commit, target all); retry policy none; the list of what is not covered; the results of the baseline checks. Commit it alone, staged by explicit path, with the existing git identity and no trailers. Do not push.

  3. DISPATCH — exactly once
  gh workflow run e03-environment-verification.yml --repo gsanchezm/experimental-utility-testing-labs --ref main -f target=all
  If the command errors or its effect is uncertain, do NOT repeat it: first establish from the Actions API whether a run was created.

  4. RUN IDENTITY
  Record run id, run number, run attempt (must be 1), event, head SHA, and created_at in manifests/e03-environment-verification-run-v1.yaml; commit it alone under the same rules. The inventory then holds 39 runs.

  5. WAIT — never cancel, never re-run
  When the run completes: list every job with its conclusion and times; download every artifact into your session scratchpad outside the repository; verify each archive's sha256 against its GitHub digest; read each environment-verification.json.

  6. RETURN PACKAGE, THEN HARD STOP
  - the two commits (SHA, parent, paths) and git status before and after;
  - run identity and the attempt-2 lookup result (expected: not found);
  - one table per job with three separate layers: the GitHub job conclusion; the record's own verification_result; what the record demonstrates and what it does not (the reset itself is not exercised);
  - artifact names, ids, sizes, digests, expiry dates;
  - which of the nine E03 conditions each job covers;
  - anything surprising (for example stale wording written by the published workflow), and what you did not verify;
  - the run inventory by workflow after the run.
  Import nothing into the repository and do not edit controlled-instance-status.yaml. If a job fails or reports NOT_VERIFIED, record nothing beyond the run identity and report it: a further dispatch needs a new approval.

