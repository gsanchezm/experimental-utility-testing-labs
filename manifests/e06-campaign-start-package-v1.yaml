findings_before_the_start_question:
- id: F1
  severity: BLOCKING for the START question (the first dispatch would be refused by gate G-9)
  status: RESOLVED
  resolution: 'corrected on canonical main in commit 63d4b1f4 (workflow only: .github/workflows added to E06_CHECKOUT_PATHS; implementation hash and conditions file unchanged); the lock values of this package
    are those of the corrected workflow file; it reaches the public repository with the next export'
  what: The gate job of .github/workflows/e06-measured-execution.yml checks out only the sparse paths of its env E06_CHECKOUT_PATHS in cone mode (experiments/E06-cross-platform-parity, experiments/scenario-mappings,
    manifests, protocol, prompts/frozen, qualification/compatibility-smoke, qualification/compatibility-smoke-sut01, schemas) and the files at the root; .github/workflows is not among them. Gate G-9 and
    the output workflow_sha256 read sha256(.github/workflows/e06-measured-execution.yml), which is "absent" on the runner, so "configuration names the sha256 of the measured workflow file" fails on every
    dispatch of every condition. The E04, E05 and E07 workflows list .github/workflows among their sparse paths.
  evidence: 'the apply script rehearsal of the gate on a scratch tree shaped like the runner checkout (the sparse paths of the workflow plus the root files): workflow_sha256 = absent and G-9 FAIL, with
    the same tree plus .github/workflows the gate reads the real hash; the tests and the v77 export rehearsal run the gate on full trees (a git clone or fixture trees with the workflow file), so they cannot
    see it'
  proposed_fix: 'workflow only: add the line .github/workflows to E06_CHECKOUT_PATHS (the E04, E05 and E07 precedent); the executor implementation hash, the conditions file and the digests do not change;
    the measured workflow sha256 changes, so the package is rebuilt (build_package_e06.py), the fix is published by an export, and the gate is rehearsed again on the sparse tree'
  files:
  - .github/workflows/e06-measured-execution.yml
  verified_fix_on_a_scratch_copy: true
- id: F2
  severity: RECOMMENDED before the START (data provenance of the raw data; not a gate)
  status: RESOLVED
  resolution: 'corrected on canonical main in commit 63d4b1f4 (workflow only: a step in each of the four measured jobs copies the two provenance records into every run directory; implementation hash unchanged);
    it reaches the public repository with the next export, and the first measured dispatch is its first execution on GitHub Actions'
  what: 'The run manifests of the executor list, for every execution, the files ci-provenance.json and runtime-environment.json under the run directory (artifacts entries with the sha256 of the source files),
    and the executor note says the workflow copies them; the measured workflow copies nothing: the provenance job uploads ci-provenance.json as its own artifact, and the runtime-environment.json of each
    measured job is written in the job workspace outside the uploaded directory, so it is never uploaded. The E07 and E05 executors copy both files into every run directory, and the E07 workflow also copies
    them to the output directory. The DRY_RUN bundles of rounds 1 and 2 hold neither file.'
  effect: after an import, every run manifest would reference two files that are not in its run directory; runtime-environment.json (runner image, tool versions) would not be preserved at all, only its
    sha256
  proposed_fix: 'workflow only (no executor change, so the implementation hash is unchanged): in each of the four measured jobs, before the upload step, copy ci-provenance.json and runtime-environment.json
    from the provenance directory into every run directory of the output directory (a loop over the directories of OUTPUT_DIR); the copies are byte-identical to the files whose sha256 the manifests record.
    Alternative: accept the gap and have the import place the provenance artifact beside the job files, with the two per-run references disclosed as unresolved'
  files:
  - .github/workflows/e06-measured-execution.yml
  verified_fix_on_a_scratch_copy: true
- id: F3
  severity: INFORMATION (asked as Q6)
  status: OPEN
  what: The measured job limit is 360 minutes and there is no per-execution watchdog (E07 has 600 s); the per-execution bounds are the budgets of the executor (web 90, 90, 60 and 60 s; Android 180 s in
    the harness, 900 s process limit, 120 s adb limit). The workflow text TIMEOUT_POLICY still reads "the DRY_RUN durations decide the value before the START" and is recorded in every provenance record
    with that wording.
  evidence: 'DRY_RUN round 2 durations per execution: SUT-01 web 1.7 to 28.7 s, SUT-02 web 15.6 to 15.7 s, SUT-01 Android 16.3 to 31.0 s, SUT-02 Android 23.0 to 37.2 s; the job of SUT-02 Android took 198
    s for 3 executions (about 115 s of setup)'
  files: []
- id: F4
  severity: INFORMATION (asked as Q8)
  status: OPEN
  what: 'The conditions file is locked by its hash with its preparation text: status DRAFT_NOT_LOCKED, executor_implementation_sha256 and executor_prompt_version null, open_items 2 to 4 and 7 to 11 now
    decided or verified (the SUT-01 web surface calls https://omnipizza-backend.onrender.com, the same backend as the release APK). Changing the file changes the implementation digests and the implementation
    hash, so the Campaign configuration states that the section supersedes those statements.'
  files: []
- id: F5
  severity: SUGGESTION
  status: OPEN
  what: A workflow test that every path the gate script reads lies under the sparse paths of the same workflow (or the root) would have caught F1; the E07, E05 and E04 workflow tests do not have it either.
  files: []
