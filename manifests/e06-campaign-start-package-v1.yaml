  - E06-CS007-SUT01-WEB, surface component SUT-01-web: https://github.com/gsanchezm/OmniPizza at commit 9ca37674d374e9303912e259641ee86baf3aabe1 (no release) (hosted endpoint https://omnipizza-frontend.onrender.com)
  - E06-CS007-SUT01-ANDROID, surface component SUT-01-android: https://github.com/gsanchezm/OmniPizza at commit 3cdbe6596a1ab5ef2058ba4259c44da96a0fa03a (release v1.1.8)
  - E06-CS007-SUT02-WEB, surface component SUT-02-web: https://github.com/saucelabs/sample-app-web at commit 60fdd634bb111c092282fa07977513a0a7765593 (no release) (hosted endpoint https://www.saucedemo.com/)
  - E06-CS007-SUT02-ANDROID, surface component SUT-02-android: https://github.com/saucelabs/my-demo-app-android at commit 36b012eecdf6a2b488b9504e16b3d0c3ca9a0e7b (release 2.2.0)
  - Source: manifests/sut-manifest.yaml, sha256 7f954c958f5558729ff9be23b9bea1471d205e43baf0f461ccb08f7984cf2d58. The hosted deployments of SUT-01 web, SUT-01 Android (its backend) and SUT-02 web are not independently mapped to the pinned commits (HOSTED_MAPPING_UNVERIFIED, disclosed in the conditions file and in every run manifest). The SUT-01 web surface calls the same hosted backend as the release APK (DRY_RUN round 2: https://omnipizza-backend.onrender.com).
  - Android builds: SUT-01 omnipizza-release.apk of release v1.1.8, sha256 1059e9468145761710c9884b37e9fbc76da8e75eb9666dc0867d82a546cda6a4 (https://github.com/gsanchezm/OmniPizza/releases/download/v1.1.8/omnipizza-release.apk); SUT-02 mda-2.2.0-25.apk of release 2.2.0, sha256 318ef64bdcaff18e576d962ab1f557e0a2683b9b5210a6bb6b25cb0caeef62b4 (https://github.com/saucelabs/my-demo-app-android/releases/download/2.2.0/mda-2.2.0-25.apk). Each is downloaded by the job and verified by SHA-256 before any device action.
  - Android runner: Appium 3.7.0 with appium-uiautomator2-driver 8.7.0 (the stack that passed the SUT-01 and SUT-02 compatibility smokes), installed by npm ci from the lockfile of qualification/compatibility-smoke-sut01/harness (package.json sha256 0c7807598f7b5a2e80aed27a8bdf7aed71b23d0ab3a21a48a764c8b347770242, package-lock.json sha256 8a4a02cafa1edec0e8eb7704cec107ab6a2c398dd1e0c8e8a9df3dcb9ac3b3f5), Node.js 22.23.2, on the emulator API 35 google_apis x86_64 pixel_7 started by ReactiveCircus/android-emulator-runner at commit a421e43855164a8197daf9d8d40fe71c6996bb0d. The study mobile-runner status and the compatibility smoke PASS of the exact SUT x android x Appium 3 are checked by gate G-10 at every dispatch (protocol/mobile-runner-policy-v3.md, sections 9.5 and 9.7.9 to 9.7.11).
  - Web runner: Playwright for Python 1.63.0 with the hashed requirements of experiments/E06-cross-platform-parity/executor/requirements.txt, sha256 589b920c552fae45dbc4c9507e42a21344d250abb2573c5412e2aea8cca62de2; executor Python 3.12 (GitHub setup-python). Browser: the Chromium build named by Playwright 1.63.0, not hash-pinned by the study; web viewport 1280 x 800, time zone UTC, locale en-US.
  - Run-manifest schema: schemas/run-manifest.schema.v2.json, sha256 9a86cf37c4ccd2abe3368866309e18a9f9554a2330f5dceeacda6d02a2932757. The schema enum has no E06 modality: each execution takes the enum value of its platform (Web UI Functional or Android Native) and records the scenario CS-007 in the scenario field; the reset mechanism is SESSION_RESET, the establishment mechanism UI_FLOW, and the actions list is empty (no Required Actions class names the sign-in steps of this scenario).

  ### Prompt version and implementation

  - Dispatch procedure prompt: ORCHESTRATOR-E06-cross-platform-parity-v1. Working copy: prompts/working/ORCHESTRATOR-E06-cross-platform-parity-v1.md, sha256 ed5c08561856f657c8bc310d361c05f5e359c4d1560b91cbb8093abfe39128ee. The frozen copy prompts/frozen/ORCHESTRATOR-E06-cross-platform-parity-v1.md is written once at the START as a byte-identical copy of the working copy (prompts/README.md, rules 1 to 3); it is not written by this text.
  - Implementation hash (sha256 of experiments/E06-cross-platform-parity/executor/run-condition.sh, which embeds the digests of the 15 implementation files and refuses an unlisted executor file): 632f3ba400263c3d8e448cd4f3f3d633cf293a1d8a7163cb94253ef14e02a2bd. The files are the executor modules and requirements.txt of the executor, the Android job script, the Node harness (e06-android.mjs and wd.mjs), the conditions file, and the package.json and package-lock.json of the locked Appium stack.
  - Conditions file: experiments/E06-cross-platform-parity/conditions-draft.json, sha256 b97c492af7c9be1f5716b05cf29666b7b7dff6588f9788b63499203dfa3a1fcd (four conditions; read by the executor and part of the implementation digests; hashed here at the START). The fields status, note, open_items, executor_implementation_sha256 and executor_prompt_version inside it are the text of its preparation (DRAFT_NOT_LOCKED, null values, open items now decided or verified); the hash locks its bytes, and this section supersedes those statements.

  ### Outcome categories, pairing and the parity proportion

  - Outcome categories (declared before any execution in the conditions file; D-E06-5 to D-E06-9 and D-E06-12 to D-E06-15): ARRIVED_IDENTITY_READ (status SUCCESS: the authenticated catalogue was reached and the identity of the first position was read); ARRIVED_ARRIVAL_ONLY (SUCCESS: reached, identity oracle arrival_only; not used); ARRIVED_IDENTITY_UNREADABLE (INCONCLUSIVE: reached, identity not readable, recorded with its reason); NOT_ARRIVED_INFRASTRUCTURE (ABORTED: the backend refused or did not answer, or the device did not answer in time; reasons INFRA_USER_LIMIT_429, INFRA_BACKEND_5XX, INFRA_BACKEND_NO_RESPONSE, INFRA_CATALOGUE_TIMEOUT); NOT_ARRIVED_SUT (FAILURE: the system answered and did not let the actor through; reasons SUT_SIGN_IN_REFUSED, SUT_CATALOGUE_NOT_REACHED_AFTER_SIGN_IN); NOT_ARRIVED_RUNNER (ERROR: a fault of the executor, the browser, the WebDriver client or the Appium session; reason RUNNER_FAULT). The expected outcome of every condition is ARRIVED_IDENTITY_READ.
  - Pairing and parity (decisions D-E06-7 and D-E06-15; computed only by the analysis, never by an execution, a dispatch or the condition summary): execution k of the WEB condition of an ecosystem is paired with execution k of its ANDROID condition (same account, same market, same index), k = 1 to 50. Parity is present for pair k when both executions reach the authenticated catalogue and the identity of the first catalogue position is the same on both surfaces. An execution that did not arrive is recorded with its category and reason and is a non-parity, never excluded after the fact and never retried inside the same execution record. An execution that arrived with an unreadable identity is a non-parity as this rule is written, and the analysis reports it as its own category beside the parity counts, never merged silently and never excluded. The pairing is by index, not simultaneous: the two conditions of an ecosystem are separate dispatches (see "Sample size, order and dispatch model").
  - Primary variable and estimand: the parity proportion per ecosystem, pairs with parity over 50, with a Wilson 95 percent interval; the effect SUT-01 versus SUT-02 by risk difference with an interval and Fisher's exact test (protocol/statistical-analysis-plan-v1.md, section 4.3). Descriptive in weight, because one canonical scenario gives one scenario pair per comparison.

  ### Attribution and exclusion rules

  - No attempt is excluded from any denominator. A non-arrival is data: a backend refusal such as the user limit answer HTTP 429 (INFRA_USER_LIMIT_429) is recorded with its message, never repaired and never excluded (D-E06-8).
  - Attribution is mechanical, declared before the run and never applied after seeing a result pattern (as implemented in experiments/E06-cross-platform-parity/executor/executor/classify.py; confirmed by the human research lead's approval of this text at the START): NONE for an execution that arrived; SUT for NOT_ARRIVED_SUT; INFRASTRUCTURE for NOT_ARRIVED_INFRASTRUCTURE; TOOLING for NOT_ARRIVED_RUNNER; UNDETERMINED for ARRIVED_IDENTITY_UNREADABLE (the cause is not assigned mechanically, and the record says so). The reason of a non-arrival is decided by a fixed precedence (the first matching rule wins): the user limit, a 5xx answer, no answer within the budget or the sign-in page never shown, a refused sign-in or an unestablished session, a catalogue that was reachable and not shown, a catalogue that never answered, and, last, a sign-in that was never submitted (RUNNER_FAULT). The Android applications cannot report backend answers, so a sign-in with no refusal shown within the budget is INFRA_CATALOGUE_TIMEOUT there, and is disclosed as such.
  - Any exception inside an execution (browser, executor, WebDriver client, Appium session) is NOT_ARRIVED_RUNNER with attribution TOOLING and the message recorded, and the job goes on with the next execution; an exception that leaves the loop ends the condition with the summary of the executions already run and a non-zero exit, which is a failure of the measured job and a stop of the procedure. A runner cancelled or lost by the workflow leaves an incomplete bundle; the ORCHESTRATOR records such an execution at import as TOOLING of that execution (not implemented by the executor; confirmed by the human research lead's approval of this text at the START).
  - The executor scrubs host paths and private network addresses from every kept text file; no secret is recorded.

  ### Sample size, order and dispatch model

  - N = 50 executions per condition (protocol/repeatability-determinism-v1.md, section 3, standard target; no reduction): 50 times the number of conditions (200 for the four conditions above); one dispatch per condition, one job per dispatch, attempt 1; one clean state for each execution.
  - Dispatch order (fixed here before the first dispatch): SUT-01: E06-CS007-SUT01-WEB, then E06-CS007-SUT01-ANDROID; SUT-02: E06-CS007-SUT02-WEB, then E06-CS007-SUT02-ANDROID. The conditions of one SUT run one at a time, a dispatch only after the previous run of its authorization has concluded and been imported, so the WEB and the ANDROID condition of an ecosystem are dispatched back to back; the chains of SUT-01 and SUT-02 are independent and may run concurrently. The pairing of execution k of the two conditions is made by the analysis; the two conditions of an ecosystem are not read at the same time: the second condition starts only after the run of the first has concluded and been imported, so the two members of a pair are executed minutes apart (disclosed; a drift of the item data of a hosted deployment between the two dispatches would appear as a non-parity that the record explains, D-E06-8).
  - Dispatch records (append-only, committed before each dispatch; the run identity is appended after it starts): manifests/e06-measured-dispatch/e06-sut01.jsonl and e06-sut02.jsonl, created at the first dispatch of each SUT, not at the START.
  - Identifiers: execution_id EX0001 to EX0050; attempt A1; run_id <condition_id>__<execution_id>__A<attempt>.
  - Bundle and import: the measured job uploads one bundle E06-MEASURED_EXPERIMENT-<condition_id>-run<run id>-a<run attempt>, and the provenance job one artifact E06-MEASURED_EXPERIMENT-<condition_id>-provenance. Import is byte-exact under raw-data/E06-cross-platform-parity/<SUT>/ after the verification of every archive against its GitHub digest: each <run_id>/ directory of the bundle becomes raw-data/E06-cross-platform-parity/<SUT>/<run_id>/ (the path its run manifest lists); the job-level files of the bundle (condition-summary.json; for an Android condition appium-server.log; for E06-CS007-SUT01-ANDROID backend-probe.json and backend-health.body) and the provenance artifact are kept in raw-data/E06-cross-platform-parity/<SUT>/<condition_id>__job__A<attempt>/.
  - Time budgets (the timeout policy of the workflow is recorded in every provenance record, with the wording of its preparation): gate job 15 minutes; provenance job 10 minutes; each measured job 360 minutes (the GitHub maximum); per execution: web navigation 90 s, screen 90 s, sign-in 60 s, catalogue 60 s; Android a budget of 180 s inside the harness, a harness process limit of 900 s and an adb command limit of 120 s. There is no other per-execution watchdog.
  - Stop conditions: the frozen dispatch procedure (prompts/frozen/ORCHESTRATOR-E06-cross-platform-parity-v1.md, section 4) applies: the gate job of a run fails; a run's conclusion is other than success or a failure of the measured job; an artifact does not hold exactly the 50 run manifests of its condition and its condition summary; an input differs from this text, the authorization or the public repository; a boundary of the procedure would be crossed; the authorization is revoked or the human research lead stops the campaign. On a stop nothing further is dispatched in this campaign under any authorization until the human research lead instructs otherwise.

  ### Dispatch authorization and further attempts

  - One dispatch authorization per SUT, issued separately by the human research lead under protocol/agent-governance-v6.md, Section 3.7: E06-DISPATCH-SUT01-AUTH-01 (SUT-01: the two conditions in the order above) and E06-DISPATCH-SUT02-AUTH-01 (SUT-02: the same). Each names its conditions, N = 50, attempt 1, the implementation hash and the prompt hash above, and the authorization id of this START (records manifests/e06-dispatch-authorization-sut01-v1.yaml and manifests/e06-dispatch-authorization-sut02-v1.yaml, record class E06_DISPATCH_AUTHORIZATION). The START authorizes no dispatch authorization.
  - Further attempt (attempt 2 or more, executions from a first execution named by the approval to 50): only under a further-attempt approval of the human research lead that names the condition, the first execution and the attempt (gate G-E06-A2, decision D-E06-14; the approval record is manifests/e06-further-attempt-approval-sut0N-v1.yaml, record class E06_FURTHER_ATTEMPT_APPROVAL, created only when approved). Nothing is re-run; the failed or interrupted executions of the first attempt keep their recorded outcomes.

  ### Environments and verification basis

  - CS-007 is read-only in business state (the sign-in creates a session and no business state), so it is outside the list of protocol/study-design-v1.md, section 10.3, that requires a controlled instance (deterministic reset, fault activation, active security testing, significant load, state-changing operations); the environment type of each condition is fixed here, per condition and by the same rule for every ecosystem, as that section requires: PUBLIC_HOSTED for E06-CS007-SUT01-WEB, E06-CS007-SUT01-ANDROID and E06-CS007-SUT02-WEB, EMULATED for E06-CS007-SUT02-ANDROID (the pinned build on the GitHub-hosted emulator with the local database of the build). Shared-instance interference on the hosted deployments is a limitation of the affected measurements. The environment_type is recorded in every run manifest. No controlled-instance status record exists for E06 and no gate reads one.
  - Verification basis: the non-measured DRY_RUN round 2 of .github/workflows/e06-environment-verification.yml (run 44961904993, dispatched 2026-11-21T23:27:45Z on public main becd70d0ba0e9713f71a8873b0551bdfc6fc71ff, 3 executions per condition, every one of the 12 executions recorded ARRIVED_IDENTITY_READ; record manifests/e06-environment-verification-rounds-v1.yaml, sha256 ba01e49c7957dd2fa3101621fabe9bf381774b7b97a011aa9aa6a287b6b43af1). It ran after the decisions D-E06-12 to D-E06-15 were implemented. Round 1 (run 44931436092, head 12d587d591f190224d2050403ddfbc96b34a87aa) ran before them and is history, not a basis. The DRY_RUN bundles are never measured and never imported.

  ### Analysis and what is not computed

  - Per ecosystem: the counts of the six categories per condition, the pairs with parity over 50 with the Wilson 95 percent interval, the non-arrival and unreadable-identity counts beside the parity counts, and the attributed counts beside the raw proportion. SUT-01 versus SUT-02 by risk difference with an interval and Fisher's exact test. Descriptive in weight. SUT-03 and SUT-04 have no mobile data and SUT-05 and SUT-06 no condition: not estimable, reported with their reasons.
  - Not computed, not compared, not pooled: no pooled rate across ecosystems or surfaces; no composite score; no latency; no result for iOS.
  - The analysis is run only on a separate instruction of the human research lead, after the campaign is frozen, with its own derived dataset (derived-data/README.md; analysis/README.md).

  ### Gates the measured workflow enforces

  The measured job starts only if the gate step of .github/workflows/e06-measured-execution.yml passes: the inputs agree with the conditions file; the campaign status is IN_PROGRESS in manifests/study-manifest.yaml; exactly one START row of protocol/CHANGELOG.md names this campaign README and the START authorization id; the START record manifests/e06-campaign-start-v1.yaml names the campaign and the authorization id; this section names the condition, the schema, the prompt version, the implementation hash, the conditions-file hash, the measured workflow hash (G-9), N = 50, CS-007, and the pinned commit and release of the surface component of the condition; the dispatch authorization of the assigned SUT is ISSUED, VALID, ELIGIBLE, not revoked, issued by the human research lead, and names the condition, N = 50, attempt 1, the START id and the two hashes; the frozen prompt file exists and matches its hash; the further-attempt approval (G-E06-A2) when the attempt is above 1; agent-governance-v6 is in force with Section 3.7; the run-manifest schema v2 is present; CS-007 is FROZEN with its freeze record and a COMPARABLE entry for the assigned SUT; the executor implementation equals the locked hash; for an Android condition, the mobile-runner admissibility and the compatibility smoke PASS of its exact SUT x android x Appium 3 (gate G-10). The job also refuses a GitHub re-run (github.run_attempt must be 1) and any branch other than the default branch.

  ### Change log

  - None at the time of this text. Any change after the START is a change-control row (protocol/change-control-v1.md) recorded before the affected execution; results collected before a change are analyzed under the configuration in force when they were collected.
