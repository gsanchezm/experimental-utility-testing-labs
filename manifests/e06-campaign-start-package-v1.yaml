candidate_configuration_section: |
  ## Campaign configuration

  This record is the "Campaign configuration" of E06-cross-platform-parity. It is locked at the campaign START (protocol/change-control-v1.md, section 7, moment 1) under the human authorization named below, and it is immutable from then on; a change after the START is a change-control row recorded before the affected execution. It authorizes no dispatch: each dispatch authorization (protocol/agent-governance-v6.md, Section 3.7) is issued separately by the human research lead. The design records are experiments/E06-cross-platform-parity/design-brief-draft.md and the decisions records manifests/campaign-execution-decisions-v16.yaml to -v18.yaml (D-E06-1 to D-E06-15); the executor is experiments/E06-cross-platform-parity/executor/. Every hash below was computed from the recorded file at the START and not typed. A system under test (SUT) is one of the evaluated ecosystems of README.md. The statements of this file outside this section that name variables or categories as candidate, not frozen, or TBD before freeze are the text of the preparation and are left unedited; this section supersedes them for the four executable conditions.

  ### Identity and START

  - Campaign: E06-cross-platform-parity. Scope: the WEB and the ANDROID surface of SUT-01 and of SUT-02 (four conditions). SUT-03 and SUT-04 are COMPARABLE on WEB only in the frozen mapping record and have no mobile surface, so they have no condition; SUT-05 and SUT-06 are NOT_COMPARABLE and have none; iOS is deferred and recorded untested (decision D-E06-5, DP-8). Design: one canonical scenario, CS-007: from a clean session an actor signs in through the user interface, arrives at the authenticated catalogue, and the identity of the first catalogue position is read; the scenario is read-only in business state and its reset is SESSION_RESET. Hypothesis label: H4, cross-platform part (protocol/statistical-analysis-plan-v1.md, section 4.3); one canonical scenario gives one scenario pair per comparison, so every result is descriptive in weight (D-E06-7). See "Outcome categories, pairing and the parity proportion".
  - START authorization id: E06-START-AUTH-01 (the id of the human research lead's approval of this START). The START row of protocol/CHANGELOG.md names it.
  - Protocol: v1 FROZEN-PRE-DATA (protocol/study-design-v1.md; protocol/statistical-analysis-plan-v1.md, sections 4 and 5; protocol/equivalent-scenario-mapping-v1.md; protocol/repeatability-determinism-v1.md; protocol/mobile-runner-policy-v3.md for the Android conditions). Agent governance: protocol/agent-governance-v6.md, sha256 c890a9d004b2989aa9ae33a54bc68b000c47fc9e3f79d60ad0051de78b3f2a4a, FROZEN-PRE-DATA since 2026-11-06, Sections 3.6 and 3.7.
  - Execution: GitHub Actions only (CAMPAIGN-CI-WRITE-AUTH-01), through .github/workflows/e06-measured-execution.yml, dispatched by the ORCHESTRATOR under dispatch authorizations. Attempt 1 only under the authorization; a further attempt only under a recorded further-attempt approval (gate G-E06-A2, decision D-E06-14); default branch only; no GitHub re-run.
  - Measured workflow file sha256 41cbba741e05d519e2af61f2841a30ca853f8d3dc0c4bc8efa8e95bfeec6f3b6 (gate G-9 reads this hash from this record). Verification workflow file sha256 b3b39582fc97e2465b12ded468e7999b8ccbb44b785098460860446dcd6eaada (provenance only; the verification workflow has no START gate, as in E04, E05 and E07).

  ### Scenario mapping

  - Canonical scenario CS-007: experiments/scenario-mappings/CS-007.yaml, sha256 bc07f153e702bc969d5ae3653bb31d308e3a859555dbb01c1e184fb14377e85d, mapping_status FROZEN on 2026-11-21, authorization id E06-CS007-FREEZE-AUTH-01 (record manifests/cs-007-freeze-v1.yaml, sha256 b22eb7706ec6a22ac627a444126665f7e4b8ab8e74cdcc8a00eabf5f24ee9307). Comparability in the frozen record: SUT-01 COMPARABLE and SUT-02 COMPARABLE (WEB and ANDROID, the surfaces of the four conditions), SUT-03 COMPARABLE and SUT-04 COMPARABLE (WEB only), SUT-05 NOT_COMPARABLE and SUT-06 NOT_COMPARABLE.
  - The comparability recorded in the frozen mapping record is the one used: each of the four conditions below has a COMPARABLE entry. SUT-03 and SUT-04 (no mobile surface), SUT-05 and SUT-06 have no condition and are reported as no data with their reasons, never as a zero or a failure (protocol/statistical-analysis-plan-v1.md, section 5). SUT-01 versus SUT-03 has no mobile data and is not estimable.

  ### Conditions

  All conditions: N = 50 executions, EX0001 to EX0050, attempt 1, identity oracle item_identity (the DP-3 fallback arrival_only is recorded and not used: the identity was read on all four conditions in both DRY_RUN rounds), one clean state for each execution. The conditions, their order within a SUT and their environment types are fixed here; the per-step realizations are those of the conditions file and of the executor README (experiments/E06-cross-platform-parity/executor/README.md).

  | Condition | Surface | Account | Environment type | Identity key | Market and language | Clean state of each execution (not counted) |
  |---|---|---|---|---|---|---|
  | E06-CS007-SUT01-WEB | WEB (Playwright, Chromium, viewport 1280 x 800) | standard_user | PUBLIC_HOSTED | pizza_id (the card heading; the -desktop suffix is stripped and the raw identifier is recorded) | US, en | a new browser context (SESSION_RESET); the sign-in is inside the scenario, no token is injected |
  | E06-CS007-SUT01-ANDROID | ANDROID (Appium 3.7.0, emulator) | standard_user | PUBLIC_HOSTED | pizza_id (the card label card-pizza-<id>) | US, en | adb uninstall, then a new Appium session that installs the SHA-256 verified APK |
  | E06-CS007-SUT02-WEB | WEB (Playwright, Chromium, viewport 1280 x 800) | standard_user | PUBLIC_HOSTED | product_title (the first inventory item name, default sort az) | none (the sources define none) | a new browser context (SESSION_RESET) |
  | E06-CS007-SUT02-ANDROID | ANDROID (Appium 3.7.0, emulator) | standard_user (decision D-E06-12: the account of SUT-02 web, the same on both surfaces) | EMULATED | product_title (the first titleTV, default sort NAME_ASC) | none (the sources define none) | adb uninstall, then a new Appium session that installs the SHA-256 verified APK |

  The credentials of every condition are those recorded in the conditions file (the documented standard accounts of the pinned sources). On SUT-02 Android the arrival needs two signals (decision D-E06-13): the login screen gives way to the catalogue landing screen, and, after the titles are read, the drawer row Logout Menu Item is present; an absent row is NOT_ARRIVED_SUT with the reason SUT_SIGN_IN_REFUSED, and a session lost while the row is searched is a runner fault (NOT_ARRIVED_RUNNER).

