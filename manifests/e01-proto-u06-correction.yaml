# manifests/e01-proto-u06-correction.yaml
# Post-data-collection change-control record for PROTO-U06 (protocol/unresolved.md), EUS-2026-001.
# Corrects three representation/provenance defects in the PROTO-U05 E01 adjudicated capability matrix
# artifacts, discovered by an independent semantic/provenance audit of commit
# 77216f610a341fe87fb3c90c4035de73d66ca29d. Prospective correction only: does not revisit any of the 54
# scientific cell determinations, does not revisit E01-HR-01 or E01-HR-02, does not perform H1-H5 analysis,
# and does not relaunch ADJUDICATOR-EU-01. Editable by ORCHESTRATOR only (protocol/agent-governance-v1.md).
change_id: PROTO-U06
study_id: EUS-2026-001
discovery_point: >
  An independent semantic/provenance audit of the E01 adjudicated capability matrix (commit
  77216f610a341fe87fb3c90c4035de73d66ca29d, PROTO-U05) found zero scientific score errors, zero
  human-ruling errors, and zero methodological defects, but three non-scientific representation/provenance
  defects that block authorizing the matrix as H1 input.
