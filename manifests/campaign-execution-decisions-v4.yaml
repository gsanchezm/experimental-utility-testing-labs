decisions:
- id: D-20-E04-DISPOSITION
  question: "whether and when E04-repeatability runs, given that H3 is computed from E05 alone (experiments/E05-determinism/design-brief-draft.md, sections 9 and 11, D-20)"
  chosen: "E04 mínimo después de E05 (Recomendado)"
  note_on_label: the label "(Recomendado)" on the chosen option followed section 9 of the brief ("(a) or (b)"); section 11, D-20, of the brief marks (a) as its recommendation. The human research lead chose (b) from the options as offered; the decision is (b).
  effect: "option (b) of D-20. E04 stays within the resumption of 2026-11-02 (manifests/campaign-resumption-v1.yaml, unchanged) and outside the H3 critical path. Its minimum content (establishment-only attempts, no stimulus, N = 50 per condition, same reset and target states as E05) is designed only after E05 has run, and no E04 file is written before then. The wording gap of protocol/statistical-analysis-plan-v1.md, section 4.3 (it lists E04 and E05 for H3 although its criteria are E05 quantities) stays flagged and is not amended here. The START of E04 still needs its own explicit human authorization."
- id: D-16-ISSUE-XIX-ATTRIBUTION
  question: "the attribution rule of issue (xix) for deviations caused by the runner, driver, device, or infrastructure rather than by the SUT in E04 and E05 (protocol/study-design-v1.md, section 13, row (xix); protocol/repeatability-determinism-v1.md, section 6)"
  chosen: "B: etiquetas mecánicas junto a las tasas crudas (Recomendado)"
  effect: "option B of the brief, rules 1 to 5 of its section 6, adopted as the rule that the campaign configurations of E05 and E04 are to lock at their START. The raw primary rates count every attempt; an attempt is labeled TOOLING only on mechanical, harness-level records (a runner or client exception before the stimulus request is sent, a browser or client crash or disconnect before the stimulus request is sent, a runner cancelled or lost as recorded by the workflow); any response received from the SUT after the stimulus request is sent, and any attempt whose cause cannot be assigned mechanically, is labeled SUT; attribution is never made after seeing the pattern of results; a secondary table reports the TOOLING-labeled counts per category, and no attempt leaves any denominator. Option C (exclusion) stays rejected by protocol/repeatability-determinism-v1.md, section 5, rules 4 and 5. NOT decided by this answer, and still open: D-16b (whether a TOOLING interruption after establishment counts as an INTERRUPTED outcome category against H3, which the brief recommends; rule 6 of its section 6). The protocol is not amended, issue (xix) stays DEFERRED-BEFORE-CAMPAIGN in the Open-Issue Register until a campaign configuration locks the rule at its START (protocol/change-control-v1.md, section 7), and `open_issue_register` of manifests/study-manifest.yaml is unchanged."
- id: D-02-E05-DISPATCH-MODEL
  question: "whether the N = 50 attempts of an E05 condition share one instance (experiments/E05-determinism/design-brief-draft.md, section 2.2, D-02)"
  chosen: "B: instancia compartida, reinicio entre intentos (Recomendado)"
  effect: "model B for E05. N sequential attempts per condition on one controlled instance, with the declared reset between attempts, and the starting-state check of step 2 of each attempt recorded as an observation (an attempt whose check fails is ABORTED with its cause, the E03 convention). The residual-state list of the brief, section 4.4, is fixed in the configuration and is not decided here (D-03 stays open). No E05 executor, workflow, or prompt exists, and none is started by this answer."
- id: HD-16-E09-AXE-CORE-PIN
  question: "whether to pin axe-core 4.14.0 for E09-accessibility (experiments/E09-accessibility/axe-core-pin-proposal-draft.md; experiments/E09-accessibility/design-brief-draft.md, section 12, HD-16)"
  chosen: "Sí: pin axe-core 4.14.0 (Recomendado)"
  effect: "the pin is recorded in manifests/toolchain-manifest.yaml, `tools.accessibility` (version 4.14.0, npm integrity sha512-9WTZ..., pinned_by ORCHESTRATOR, pinned_at 2026-11-12; install_date and platform stay null because nothing is installed). On the pin date the npm registry showed dist-tag latest = 4.14.0 and the same integrity and shasum as the proposal, with no deprecation and no gitHead (source_commit stays null). The version, integrity, tarball URL, and member digest equal the constants of experiments/E09-accessibility/executor/executor/scanner.py, which is what gate G-7 of .github/workflows/e09-measured-execution.yml compares. The same operation corrected the stale wording that called governance v6 a DRAFT in the E09 executor README, its implementation notes, and the header comment of the E09 measured workflow (representation only; no hashed executor file and no gate logic changed; gate G-4 passes on the real governance v6 file, checked directly). The pin decides no other HUMAN DECISION of the E09 brief."
