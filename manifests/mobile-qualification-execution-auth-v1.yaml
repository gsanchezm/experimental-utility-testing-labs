# Modeled on manifests/issue-xviii-ruling-v1.yaml and manifests/e01-campaign-start-v1.yaml. Editable by
# ORCHESTRATOR only (protocol/agent-governance-v2.md, section 4).
# This is a TOOL-QUALIFICATION authorization. It produces no evidence about any system under test (SUT),
# starts no campaign, authorizes no measured E03 execution, and authorizes no compatibility smoke.
