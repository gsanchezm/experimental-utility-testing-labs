    - copy the frozen pins verbatim into qualification/mobilewright/README.md
    - realize MQ1-MQ3 concretely before the first run (screens, identifiers, seed request, deep link, terminal UI state)
    - author qualification/mobilewright/run-gate-android.sh and run-gate-ios.sh (and their harness) under qualification/**
    - record the realization and implementation under qualification/**
  publication: "the qualification inputs are published through the existing clean reproducibility-export mechanism (PUBLIC-EXPORT-MANIFEST.yaml) so that the authorized GitHub Actions workflow can execute them"
  execution_path: ".github/workflows/e03-mobile-qualification.yml (workflow_dispatch: instruction_id = MOBILE-QUALIFICATION-EXEC-AUTH-01, runner_candidate = Mobilewright, platform = both, confirm = EXECUTE-QUALIFICATION-GATE), on the pinned substrates of manifests/toolchain-manifest.yaml environments"
  recording: "warm-ups, measured executions, exclusions with attribution records, artifacts, capability support MC-01..MC-10 per platform, durations (secondary), and the runner decision, exactly as protocol/mobile-runner-policy-v1.md sections 7-8 require"
  record_class: QUALIFICATION  # tool qualification; never SUT evidence; never E03 raw-data; never H2 input

not_authorized:
  - E03 campaign START
  - E03 measured experimental execution
  - EXECUTOR-E03-RESETABILITY launch
  - compatibility smoke execution after runner selection (requires a separate human authorization once the runner decision is known)
  - E04/E05 execution
  - H2 analysis
  - modification of frozen scientific results
  - Appium 2 under any circumstance

