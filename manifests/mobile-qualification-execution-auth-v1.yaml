authorization_text_verbatim: |
  I authorize MOBILE_QUALIFICATION_EXECUTION for EUS-2026-001.

  Authorization ID:

  MOBILE-QUALIFICATION-EXEC-AUTH-01

  Scope:

  Execute the frozen mobile-runner qualification gate defined by
  protocol/mobile-runner-policy-v1.md using:

  Primary candidate:
  Mobilewright 0.0.60

  Qualification SUT:
  OmniPizza (SUT-01), pinned qualification build v1.1.8

  Platforms:
  Android Emulator
  iOS Simulator

  Scenarios:
  MQ1
  MQ2
  MQ3

  Measured qualification executions:
  N = 10 per scenario × platform combination
  6 combinations
  60 measured qualification executions total

  This authorization includes the necessary QUALIFIER-MOBILE-01 pre-run
  preparation required by the frozen policy:

  * recording this instruction;
  * copying frozen pins;
  * concretely realizing MQ1–MQ3 before the first run;
  * authoring the Android and iOS qualification gate implementations
    inside qualification/**;
  * recording the realization and implementation under the authorized
    QUALIFIER-MOBILE-01 workspace;
  * publishing those qualification inputs through the existing clean
    reproducibility-export mechanism;
  * executing the Mobilewright qualification gate through the authorized
    GitHub Actions workflow;
  * recording warm-ups, measured qualification executions, exclusions,
    artifacts, capability support, durations, and the runner decision
    exactly as required by the frozen policy.

  The qualification work remains TOOL QUALIFICATION.

  It produces no evidence about OmniPizza or any other SUT and must never
  enter E03 raw-data or H2 analysis.

  If Mobilewright fails under the frozen switch rule, the runner decision
  must switch to the pinned Appium 3 fallback exactly as specified by
  protocol/mobile-runner-policy-v1.md.

  This authorization does NOT authorize:

  * E03 campaign START;
  * E03 measured experimental execution;
  * EXECUTOR-E03-RESETABILITY launch;
  * compatibility smoke execution after runner selection;
  * E04/E05 execution;
  * H2 analysis;
  * modification of frozen scientific results;
  * Appium 2 under any circumstance.

  Compatibility smoke requires a separate human authorization after the
  mobile-runner qualification decision is known.
