    exact_text: "Your questions have been answered: \"DRY_RUN R1 de E06 salió 12 de 12 ARRIVED_IDENTITY_READ (SUT-01 p01 en web y Android; SUT-02 Sauce Labs Backpack en web y Android). Antes del START hay 4 puntos que son tuyos. 1) Cuenta de SUT-02 Android: el DRY_RUN usó bod@example.com / 10203040 (par de ejemplo del layout), pero la regla de emparejamiento dice misma cuenta en ambas superficies y SUT-02 web usa standard_user / secret_sauce; la app Android acepta cualquier par no vacío salvo la cuenta bloqueada. ¿Qué cuenta usa SUT-02 Android?\"=\"standard_user / secret_sauce en ambas (Recomendada)\", \"2) Señal de sesión autenticada en SUT-02 Android: la pantalla de catálogo (productRV) ya se muestra ANTES de iniciar sesión, así que 'llegó al catálogo' no prueba que el login funcionó (el ejecutor registra sign_in_state null). ¿Se lee la fila 'Logout Menu Item' del menú lateral como segunda señal de que hubo sesión?\"=\"Sí, leer Logout Menu Item (Recomendada)\", \"3) Reintentos: hoy el workflow admite solo el intento 1 de las ejecuciones 1 a 50 por condición; un job interrumpido (como los 3 HTTP 502 de E02) dejaría esa condición sin bundle y no se podría completar sin corregir el workflow después del START (precedente OP-CI-18, que cambia el hash bloqueado). ¿Añado ahora el mecanismo de E07 (aprobación registrada de intento adicional, con tu aprobación por caso)?\"=\"Sí, añadir el mecanismo ahora (Recomendada)\", \"4) Regla de análisis para ARRIVED_IDENTITY_UNREADABLE (llegó al catálogo pero no se pudo leer la identidad): la regla de paridad dice que paridad exige misma identidad en ambas superficies. Se fija ahora, antes de datos. ¿Cómo se cuenta?\"=\"No paridad, categoría propia (Recomendada)\". You can now continue with these answers in mind."
decisions:
  - id: D-E06-12
    subject: "account of SUT-02 Android"
    decision: "standard_user with secret_sauce on both surfaces of SUT-02 (the recommended option): the same account as SUT-02 web, as the pairing rule of D-E06-7 says (same account, same market, same index). The Android application accepts any non-empty pair except the locked-out account (SUT02-EV-0007), so the choice is realized by the harness filling the login fields. The DRY_RUN round 1 ran SUT-02 Android with the first quick-pick pair of the layout; SUT-02 Android is therefore verified again with the decided account before the START."
  - id: D-E06-13
    subject: "second signal of the authenticated state on SUT-02 Android"
    decision: "Yes, the drawer row Logout Menu Item is read as a second signal (the recommended option). The catalogue landing screen of SUT-02 Android is displayed before any sign-in, so the arrival needs two signals: the login screen gone with the catalogue landing displayed, and, after the titles are read, the Logout Menu Item row in the drawer (read with a scroll fallback). When the row is absent the execution is NOT_ARRIVED_SUT with the reason SUT_SIGN_IN_REFUSED (the system answered and did not establish a session); a session that is lost while the row is searched is a RUNNER fault, never an absent row. The selector is verified by a DRY_RUN before the START."
  - id: D-E06-14
    subject: "further attempts"
    decision: "Yes, the mechanism of the E07 gate is added to the measured workflow before the START (the recommended option): the dispatch inputs attempt and first_execution (default 1), and the gate G-E06-A2, under which a further attempt (attempt 2 or more, executions first_execution to 50) is admitted only under a further-attempt approval record of the human research lead that names the condition, the first execution and the attempt (manifests/e06-further-attempt-approval-sut0N-v1.yaml; protocol/agent-governance-v6.md, Section 3.7, further attempts). Each further attempt still needs the approval of the human research lead; the non-measured records are attempt 1 only. The executor digest and the workflow revision are locked at the START with this mechanism in them."
  - id: D-E06-15
    subject: "analysis rule for ARRIVED_IDENTITY_UNREADABLE"
    decision: "A non-parity with its own category (the recommended option): an execution that arrived but whose identity could not be read is a non-parity as the parity rule of D-E06-7 is written, and the analysis reports it as its own category beside the parity counts, so that its count is visible; it is never excluded after the fact. The rule is written into the parity_rule of the conditions file."
not_decided_in_this_round: "The environment_type of the SUT-02 conditions (PUBLIC_HOSTED for SUT-02 web and EMULATED for SUT-02 Android are the values recorded by the DRY_RUN round 1 and proposed for the START package), the pairing disclosure (paired by index; the dispatches of the two conditions of an ecosystem back to back), the START of E06 and its configuration, any E06 dispatch authorization, any dispatch, the E06 freeze, any public export or push: each needs its own explicit human approval."
