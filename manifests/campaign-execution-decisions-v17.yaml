    note: the answer of the question dialog, whole, extracted byte-exact from the session transcript (never retyped); the chosen options are the decisions
    exact_text: "Your questions have been answered: \"E06-D-1: puntos de diseño DP-1 a DP-9 de CS-007 (escenario: iniciar sesión y llegar al catálogo autenticado; identidad del primer elemento del catálogo). ¿Los cierro como están redactados en el borrador? DP-1 solo lectura con reset SESSION_RESET; DP-2 identificador CS-007; DP-3 oráculo móvil aceptado con la lectura estática de la fuente (si una DRY_RUN muestra que no se lee, vuelta a 'solo llegada' registrada antes del START); DP-4 se declara la diferencia de mecanismo de inicio de sesión de SUT-02; DP-5 SUT-03 y SUT-04 COMPARABLE solo en WEB (celdas móviles 'no aplica'); DP-6 SUT-05 y SUT-06 NOT_COMPARABLE; DP-7 backend de SUT-01 hospedado, PUBLIC_HOSTED con HOSTED_MAPPING_UNVERIFIED declarado (ya decidido en D-E06-2); DP-8 WEB y ANDROID, iOS diferido; DP-9 un mercado con su idioma por defecto y una cuenta por ecosistema.\"=\"Como están redactados (Recomendada)\", \"E06-D-2 y E06-D-4: condiciones medidas y estimando. ¿Cuatro condiciones (SUT-01 y SUT-02, cada una en WEB y ANDROID), N = 50 por condición, 200 ejecuciones, intento 1; emparejadas por índice (la ejecución k WEB con la k ANDROID, misma cuenta, mismo mercado)? Paridad del par k = ambas llegan al catálogo autenticado y la identidad del primer elemento coincide; si una no llega, es no-paridad con su razón (nunca se excluye después). Estimando: proporción de paridad por ecosistema = pares con paridad / 50, intervalo de Wilson 95 %; efecto SUT-01 vs SUT-02 por diferencia de riesgos con intervalo y prueba exacta de Fisher (SAP 4.3); SUT-01 vs SUT-03 sin datos móviles (no estimable).\"=\"Cuatro condiciones, N=50, emparejado por índice (Recomendada)\", \"E06-D-3 y E06-D-5: backend de SUT-01 y clave de identidad. SUT-01 en ambas superficies sobre el despliegue hospedado (web https://omnipizza-frontend.onrender.com y el backend fijo del APK https://omnipizza-backend.onrender.com; mismo backend sirve ambas, así que una diferencia de datos no se confunde con una diferencia de plataforma; PUBLIC_HOSTED, HOSTED_MAPPING_UNVERIFIED declarado; riesgos: datos no fijados entre días, límite de usuarios 429 users_limit del backend → se registra como no-llegada de infraestructura, nunca se repara ni se excluye en silencio). Clave de identidad: SUT-01 id de pizza (web pizza-name-<id>; Android card-pizza-<id>); SUT-02 título del primer producto en orden ascendente por nombre (web nombre del ítem; Android titleTV).\"=\"Hospedado en ambas + clave propuesta (Recomendada)\", \"E06-D-6 y E06-D-7: verificación y autorizaciones. ¿Al menos una ronda de DRY_RUN no medida en GitHub Actions por condición antes del START (cada ronda con tu sí a su línea exacta; nunca entra a raw-data/) y dos autorizaciones de despacho (SUT-01: condiciones WEB y ANDROID; SUT-02: las mismas), emitidas por ti bajo la Sección 3.7 de governance v6? SUT-02 Android ya tiene su PASS (AUTH-02) y SUT-01 Android el de AUTH-04 (hoy).\"=\"DRY_RUN por condición + dos autorizaciones (Recomendada)\". You can now continue with these answers in mind."
decisions:
  - id: D-E06-5
    brief_id: E06-D-1
    subject: "design points DP-1 to DP-9 of CS-007"
    decision: "As drafted (the recommended option). DP-1 read-only in business state with reset SESSION_RESET; DP-2 the identifier CS-007; DP-3 the mobile oracle accepted with the static reading of the pinned source (experiments/E06-cross-platform-parity/static-reading-oracle-draft.md), with the fallback to arrival only for a surface where a non-measured DRY_RUN shows that the item identity cannot be read, recorded before the START and never after data; DP-4 the differing sign-in mechanisms of SUT-02 disclosed as a permitted mechanism variation; DP-5 SUT-03 and SUT-04 COMPARABLE on WEB with their mobile cells recorded not applicable; DP-6 SUT-05 and SUT-06 NOT_COMPARABLE as drafted; DP-7 the backend of SUT-01 hosted, environment_type PUBLIC_HOSTED with HOSTED_MAPPING_UNVERIFIED disclosed (as already decided by D-E06-2); DP-8 WEB and ANDROID, iOS deferred and recorded untested; DP-9 one market with its default language and one account per ecosystem. The freeze of CS-007 is not decided here."
  - id: D-E06-6
    brief_id: E06-D-2
    subject: "measured conditions and N"
    decision: "Four measured conditions, E06-CS007-SUT01-WEB, E06-CS007-SUT01-ANDROID, E06-CS007-SUT02-WEB and E06-CS007-SUT02-ANDROID, N = 50 each, 200 executions, attempt 1."
  - id: D-E06-7
    brief_id: E06-D-4
    subject: "estimand and pairing"
    decision: "Paired per index: execution k of the WEB condition of an ecosystem is paired with execution k of its ANDROID condition (same account, same market, same index). Parity is present for pair k when both executions reach the authenticated catalogue and the identity of the first catalogue position is the same on both surfaces; an execution that did not arrive is recorded with its reason and is a non-parity, never excluded after the fact. Estimand: the parity proportion per ecosystem, pairs with parity over 50, with a Wilson 95% interval; the effect SUT-01 versus SUT-02 by risk difference with an interval and Fisher's exact test (protocol/statistical-analysis-plan-v1.md, section 4.3); SUT-01 versus SUT-03 has no mobile data (not estimable, no mobile surface). One canonical scenario gives one scenario pair per comparison, so any between-ecosystem result is descriptive in weight."
  - id: D-E06-8
    brief_id: E06-D-3
    subject: "backend of SUT-01 for both surfaces"
    decision: "Hosted on both surfaces (the recommended option): the web at https://omnipizza-frontend.onrender.com and the release APK on its fixed origin https://omnipizza-backend.onrender.com, the same backend serving both, environment_type PUBLIC_HOSTED, HOSTED_MAPPING_UNVERIFIED disclosed. Risks accepted and to be disclosed: item data of an unpinned deployment may change between executions or days (a drift is visible as a non-parity that the record explains), and the backend user limit that answers 429 users_limit is recorded as an infrastructure-caused non-arrival with its message, never repaired and never excluded silently. SUT-02: web on the hosted sample site (HOSTED_MAPPING_UNVERIFIED), Android on the local database of the pinned build."
  - id: D-E06-9
    brief_id: E06-D-5
    subject: "identity key"
    decision: "As proposed, with arrival only as the recorded fallback (the recommended option). SUT-01: the pizza id (web pizza-name-<id>, SUT01-EV-0003; Android card identifier card-pizza-<id> with the name as accessibility label). SUT-02: the product title of the first entry in the default ascending name order (web inventory item name, SUT02-EV-0013; Android titleTV text)."
  - id: D-E06-10
    brief_id: E06-D-6
    subject: "non-measured DRY_RUN rounds"
    decision: "At least one non-measured DRY_RUN round on GitHub Actions per condition before the START, each round on its own approval of the exact line; a DRY_RUN never enters raw-data/."
  - id: D-E06-11
    brief_id: E06-D-7
    subject: "dispatch authorizations"
    decision: "Two dispatch authorizations, one per assigned SUT (SUT-01: the WEB and ANDROID conditions; SUT-02: the same), issued by the human research lead under protocol/agent-governance-v6.md, Section 3.7. The Android conditions are admitted only with the smoke PASS recorded in the mirror for the exact SUT, platform and runner (SUT-02 android AUTH-02; SUT-01 android AUTH-04) and the study-level mobile-runner status SELECTED."
not_decided_in_this_round: "The freeze of CS-007 (E06-CS007-FREEZE-AUTH-01), the E06 executor and workflows, any DRY_RUN, the E06 START and its configuration, any E06 dispatch authorization, any dispatch, the E06 freeze, any public export or push: each needs its own explicit human approval."
