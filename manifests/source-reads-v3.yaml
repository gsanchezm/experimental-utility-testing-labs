findings:  # statements read from the files above; evidence status SOURCE_VERIFIED; line numbers are those of the files at the pinned commit
- {id: F16, statement: "The checkout totals of SUT-01 for market MX follow calculate_order_total: unit price = round(base_price * 17.55, 2) plus the size and topping upcharges converted at the same rate (small 0, topping 1 USD), subtotal = unit price * quantity, tax = round(subtotal * 0.16, 2), tip = round(subtotal * tip% / 100, 2), delivery fee = round(2.0 * 17.55, 2) = 35.1, total = round(subtotal + delivery fee + tax + tip, 2). For one p02 line (base price 14.99), quantity 1, size small, no toppings, tip 0, the arithmetic of the source gives subtotal 263.07, delivery fee 35.1, tax 42.09, tip 0.0 and total 340.26 MXN (tests/test_attempt.py pins these values; they are computed from the constants, not from a run).", where: "backend/database.py lines 11-17, 23-40, 308-359; backend/constants.py lines 90-100, 171-172, 342-348", bears_on: "D-12; E05-SUT01-API-01 expected total (config s.15, item 2)"}
- {id: F17, statement: "GET /api/pizzas requires the X-Country-Code header and reads X-Language with the default en; the response is {pizzas: [...], country_code, currency}; each item carries id, name, description, price (round(base_price * rate, 2) for MXN), currency and currency_symbol. Without X-Language the names and descriptions are the English ones.", where: "backend/routers/catalog.py lines 43-79; backend/database.py lines 267-306; backend/middleware.py lines 10-26", bears_on: "E05-SUT01-API-02 and -04 projections and their expected catalog"}
- {id: F18, statement: "For behavior a11y_glitch each GET /api/pizzas call draws one mode with random.choice over [missing_name, wrong_lang, extreme_text]: missing_name makes every name an empty string (descriptions unchanged); extreme_text makes every name and description the language text repeated 15 times; wrong_lang makes every name and description (each drawn separately) the text of a randomly chosen other language of [es, de, fr, ja, ar] when the pizza has that language. A wrong_lang draw whose every name equals the English one cannot be told from the standard catalog.", where: "backend/database.py lines 57-77, 280-289; backend/constants.py lines 69-70 (A11Y_GLITCH_MODES, A11Y_GLITCH_LANGS)", bears_on: "E05-SUT01-API-05 categories and their classification rule"}
- {id: F19, statement: "POST /api/auth/login for locked_out_user answers HTTP 403 with the JSON detail 'Sorry, this user has been locked out.' (backend/auth.py lines 25-29); an unknown user or a wrong password answers 401 with the detail 'Invalid username or password'.", where: "backend/auth.py lines 18-29; backend/routers/auth.py lines 20-50", bears_on: "E05-SUT01-API-03 expected category S_LOCKOUT_403_EXACT_MESSAGE"}
- {id: F20, statement: "The documented test accounts standard_user, locked_out_user, problem_user, performance_glitch_user, error_user, a11y_glitch_user and security_glitch_user all carry the password pizza123.", where: "backend/constants.py lines 21-61", bears_on: "accounts of the SUT-01 conditions"}
- {id: F21, statement: "The checkout request requires country_code, items, name (2 to 100 characters), address (5 to 200) and phone (8 to 20); for MX colonia is required, propina is a percentage from 0 to 100 and zip_code, when given, has five digits; payment_method defaults to card. The response of a successful checkout is an order summary with order_id, status, subtotal, delivery_fee, tax_rate, tip_percentage, tax, tip, total, currency, currency_symbol, items and timestamp.", where: "backend/models.py lines 92-135; backend/routers/checkout.py lines 41-125", bears_on: "E05-SUT01-API-01 and -06 stimulus body and projection"}
- {id: F22, statement: "In the SUT-01 Checkout page the test identifiers of the full name, address, phone and place-order controls are built by tid(...), a function that comes from the hook useResponsive (src/hooks/useResponsive, not read), so their exact values on the desktop viewport are not established by the files read; the colonia input has the data-testid colonia, the cash payment control payment-method-cash, the confirmation modal confirm-order-modal and its control confirm-order-yes; the inputs have the ids field-full-name, field-address, field-phone and field-colonia. The executor locates the tid controls by a contains selector, and the DRY_RUN confirms them.", where: "frontend/src/pages/Checkout.jsx lines 124, 410-432, 563-598, 630-661, 1105-1177", bears_on: "E05-SUT01-WEB-01 stimulus (open item)"}
- {id: F23, statement: "In the files read at the SUT-02 pin the only branch specific to visual_user is the random price (randomPrice, Inventory.jsx line 31; used at line 122 under isVisualFailure; Credentials.js line 104 tests the session username). No file read defines a 'visual marker', and the SUT-02 audit has no row SUT02-EV-0015, so the category set of E05-SUT02-WEB-02 has no observable defined by a recorded source.", where: "src/pages/Inventory.jsx lines 31 and 122; src/utils/Credentials.js lines 99-104; audits/SUT-02-saucelabs/evidence.csv (no such row)", bears_on: "E05-SUT02-WEB-02 (not configured; decision of the START package)"}
