effective_admissibility_rule:  # policy v3 draft 9.7.9; DEFINED, NOT IN FORCE
  historical_observation: "the immutable result produced under the protocol version that governed its execution; never deleted, overwritten, downgraded, or reclassified (the AUTH-02 iOS FAIL_RUNNER stays permanently present as a valid v2 observation)"
  current_prospective_admissibility_state: "the state allowed to govern future campaign admission, including after a protocol-authorized remediation"
  effective_compatibility_observation: "per ecosystem x platform: a PASS is an effective PASS; a NOT_EXECUTED is a non-result superseded by the result of any later authorized attempt of the same ecosystem x platform (already v2 9.5 behaviour: AUTH-01 android NOT_EXECUTED -> AUTH-02 android PASS); a FAIL_RUNNER is never superseded by a later row or by table order and ceases to block only under the conditions below"
  conditions:  # all required; any absent or unverifiable -> fail closed
    - "1. it is the exact FAIL_RUNNER named as the trigger of the approved v3 remediation (APPIUM3-COMPAT-SMOKE-AUTH-02, run 36539790536, SUT-02 x iOS)"
    - "2. policy v3, approved and frozen, explicitly authorizes remediation of that exact observation (9.7.2)"
    - "3. exactly one remediation execution exists (one authorization, one dispatch, run attempt 1)"
    - "4. the remediation uses a new authorization id"
    - "5. the remediation uses the approved successor implementation lock"
    - "6. the remediation targets only the affected ecosystem x platform"
    - "7. its official QUALIFIER-MOBILE-01 result is PASS"
    - "8. its artifact provenance is complete and valid (imported byte-exact, digests equal to the recorded digests)"
    - "9. its mirror transcription is PASS"
    - "10. the restoration record (the lineage record) references the historical FAIL_RUNNER, the remediation authorization, the remediation run id, protocol v3, the implementation lock, and the PASS source record; its verification includes that the named historical FAIL_RUNNER still exists unchanged (its smoke-record row with the recorded authorization, run, and result, and its imported artifacts byte-exact against their import record)"
    - "11. mobile_runner_status is explicitly restored to SELECTED under v3"
    - "12. no other unresolved FAIL_RUNNER exists for the selected runner on any ecosystem x platform"
  when_all_hold: "the named historical FAIL_RUNNER is retained but no longer counted as an unresolved current blocker; every other FAIL_RUNNER keeps blocking; admission evaluates each ecosystem x platform's effective compatibility observation"
  after_restoration: "any later FAIL_RUNNER of the selected runner applies 9.5 again (UNRESOLVED_AFTER_FALLBACK_FAILURE); no second v3 remediation; the lineage record never extends (9.7.11)"

remediation_lineage_record:  # policy v3 draft 9.7.10; DEFINED, NOT CREATED; path and restoration-basis field fixed by the freeze-readiness correction (2026-09-29)
