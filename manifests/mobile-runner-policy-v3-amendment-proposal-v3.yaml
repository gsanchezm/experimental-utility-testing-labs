qual_u07_publication_hygiene_proposal:  # PREPARED, NOT APPLIED; QUAL-U07 stays OPEN (publication only); supersedes the first-draft package's QUAL-U07 section
  objective: "neither the extracted public files nor any exported archive may carry the host-path strings"
  finding_unchanged: "no existing export transformation class covers host paths (PROVIDER_NEUTRAL_PATH_ALIAS renames the agent-instructions file only); the candidate class QUALIFICATION_HOST_PATH_REDACTION replays the frozen harness scrub rule (dry run: appium-server.log 7d09fc74... -> 13a53afb..., 56 lines; the operation-record line 599, a7bec417... -> 70400531...)"
  zip_facts: "only the iOS archive (github-artifact/E03-COMPATIBILITY_SMOKE-SUT-02-ios-run36539790536-a1.zip, sha256 677e5c8f...) contains the 56 lines, deflate-compressed; the Android archive is clean; the GitHub artifacts expire 2026-12-28, after which the canonical archives are the only raw copies. Redacting only the extracted log while publishing the unchanged iOS ZIP does NOT meet the objective"
  public_validation_fact: "the public validate step 'Assert the imported compatibility-smoke evidence is stored byte-exact (QUAL-U05)' compares on-disk files with IMPORT-RECORD sha256, archives with their GitHub digest, and files with archive members, with no bridge through PUBLIC-EXPORT-MANIFEST.yaml"
  options:  # none selected
    - option: "A. transformed extracted files + deterministic sanitized archive"
      description: "export the transformed appium-server.log and a deterministically re-packed iOS archive whose appium-server.log member is transformed identically; the Android archive exported UNCHANGED"
      reproducibility_impact: "the public iOS archive digest differs from the GitHub digest; the members stay byte-identical to canonical except the transformed log; verification of the original archive and GitHub digest possible only canonically"
      canonical_immutability: "canonical files and archives unchanged (publication-only)"
      public_validation_changes: "QUAL-U05 step must bridge: for a transformed file compare its canonical_sha256 (manifest) with IMPORT-RECORD and the canonical archive member, and its exported bytes with the transform of that member; for the re-packed archive compare with the deterministic re-pack instead of the GitHub digest"
      hash_bridge: "per-file canonical and exported sha256 for the log, the iOS archive, and the operation record in PUBLIC-EXPORT-MANIFEST.yaml; IMPORT-RECORD github_digest cited as canonical under hash_citation_rule"
      implementation_complexity: "high -- a byte-reproducible archive needs fixed member order, timestamps, permissions, compression method and level, and a pinned zlib behaviour, re-derivable by the verifier"
    - option: "B. transformed extracted files, raw iOS archive excluded"
      description: "export the transformed appium-server.log; do not export the iOS github-artifact archive (EXCLUDED, canonical digest recorded); the Android archive may stay UNCHANGED"
      reproducibility_impact: "the public cannot re-derive the iOS members from the original archive; member hashes are checkable only through the manifest's canonical_sha256; asymmetric Android/iOS publication"
      canonical_immutability: "unchanged"
      public_validation_changes: "QUAL-U05 step must skip archive checks for an archive the manifest marks EXCLUDED and bridge the transformed log as in A"
      hash_bridge: "manifest entries for the transformed log (canonical and exported sha256), the excluded archive (canonical sha256 and GitHub digest), and the operation record"
      implementation_complexity: "medium"
    - option: "C. exclude the complete AUTH-02 formal namespace"
      description: "do not export qualification/compatibility-smoke/formal/APPIUM3-COMPAT-SMOKE-AUTH-02/ (EXCLUDED_INTERNAL_ORCHESTRATION)"
      reproducibility_impact: "largest loss: the AUTH-02 Android PASS and iOS FAIL_RUNNER are not publicly verifiable; README rows, the mirror, and the attribution record point to absent public files"
      canonical_immutability: "unchanged"
