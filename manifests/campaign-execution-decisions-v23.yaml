    decision: "Option A: the four web conditions only (E08-SUT01-WEB-DELAY, E08-SUT02-WEB-BLOCK, E08-SUT03-WEB-LCP, E08-SUT03-WEB-CLS); counts SUT-01 1, SUT-02 1, SUT-03 2. SUT-01's random latency spike (SUT01-EV-0016) and SUT-03's 2G view (SUT03-EV-0015) are not conditions of E08, for the same reason (the instrument measures page loads of a web surface), and neither is excluded for being unfavorable to any SUT; the limit is stated in every report of E08."
