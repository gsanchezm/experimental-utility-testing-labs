    exact_text: "Your questions have been answered: \"E08-D-17 (alcance de condiciones que mueven el conteo de H5): el borrador mide 4 condiciones web (conteo SUT-01 1, SUT-02 1, SUT-03 2). El brief también admite el pico aleatorio de latencia de SUT-01 (endpoint de API GET /api/debug/latency-spike, SUT01-EV-0016) y la vista 2G de SUT-03 (SUT03-EV-0015, requiere emulación de red CDP en Chromium). Ninguno es una carga de página de una superficie web, que es lo que mide el instrumento. ¿Cuáles cuentan en E08?\"=\"A: solo las 4 web (Recomendada)\", \"E08-D-8 (CLS de SUT-03): la lectura estática de pages/sut/ui/high-cls.jsx predice que la página NO produce desplazamiento de diseño (el bloque #shift-target crece después de #target-text y es el último bloque, así que ningún elemento visible se mueve). Eso contradice el registro E01 SUT03-EV-0012 (E01 no se toca) y es una predicción por código, no una observación. ¿Mantengo la condición E08-SUT03-WEB-CLS con la expectativa del registro E01?\"=\"Mantener (Recomendada)\", \"Defaults restantes, para reconfirmar con texto exacto: E08-D-1 a D-7 del brief (SUT-01/02/03 web; unidad de conteo; condiciones; Playwright con APIs de rendimiento del navegador; regla y tolerancias de 500 ms; N = 50; resultados casi seguros = evidencia de controlabilidad, no poder discriminante) y los nuevos D-9 (3 cargas por ejecución en contextos nuevos, orden rotatorio, falso positivo línea base contra línea base), D-10 (sin escenario canónico), D-12 (ventana de 8000 ms), D-13 (presupuestos de tiempo, se fijan con los DRY_RUN), D-14 (INCONCLUSIVE_EXTERNAL_IMAGE_NOT_LOADED con atribución EXTERNAL), D-15 (verificación de entorno propia en GitHub Actions), D-16 (prompt congelado y lock de implementación propios), D-18 (denominadores: detección sobre DETECTED + NOT_DETECTED; falso positivo sobre ejecuciones con ambas líneas base válidas) y D-19 (línea base de LCP = /sut/ui/zero-cls). ¿Los aceptas todos tal cual están en campaign-configuration-draft.md?\"=\"Sí, todos como recomendados (Recomendada)\", \"E08-D-11 (instrumento): Playwright for Python 1.63.0 (el pin de tools.web_runner) con el Chromium que esa versión instala (no fijado por digest; su versión queda en cada run), el script de medición e08-probe-v1 y el esquema run-manifest v2; la entrada tools.performance del manifiesto de herramientas se escribe solo después de tu aprobación. Para poder pedirte el primer DRY_RUN, los workflows deben estar en el repositorio público, así que hace falta un export (v90). ¿Apruebas el pin y construyo ahora el export v90 localmente (sin push)? El push y el despacho del DRY_RUN serían preguntas aparte, cada una con su línea exacta.\"=\"Pin como está y construir export v90 local (Recomendada)\". You can now continue with these answers in mind."
