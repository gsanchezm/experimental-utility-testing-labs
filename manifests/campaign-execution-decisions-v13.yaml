    exact_text: "Your questions have been answered: \"E07, celda abierta 1: SUT-01 Web a API (CS-006). Resultado de la ronda DRY_RUN (no medida, no es evidencia E01): las 3 ejecuciones dieron NOT_VERIFIED; el control de la UI se confirmó, el carrito persistido del cliente quedó con la línea p02, el sid coincide en ambas capas y el carrito del servidor devolvió 0 líneas. El protocolo (equivalent-scenario-mapping, sección 5) exige decidir la comparabilidad desde el registro canónico y la evidencia E01, nunca desde un resultado, y no revisar un mapeo porque un ecosistema leó bien o mal. Las seis condiciones de comparabilidad tienen filas E01 para SUT-01: superficies web y API (SUT01-EV-0001, -0006), precondición y actor (-0002, -0007), objeto de negocio y estado alcanzable por la UI (-0003, -0004), observación del oráculo por GET /api/session (-0006) y reset (-0006). Lo que ninguna fila establece es si el estado cruza de capa, y eso es la variable dependiente de E07, no un requisito de comparabilidad. ¿Cómo queda la celda?\"=\"COMPARABLE, medirla (Recomendada)\", \"E07, celda abierta 2: SUT-04, listado admin de reservas (CS-005, API a Web). El DRY_RUN lo ejecutó 3 de 3 en VERIFIED (la fila del admin coincide en nombres y fecha de entrada), pero eso tampoco decide comparabilidad. Evidencia E01 para la condición 5 (observación del oráculo en la capa web): SUT04-EV-0028 (SOURCE_VERIFIED) dice que un registro creado por una llamada directa a la API es visible en la Web UI, y SUT04-EV-0002 que el login admin muestra los listados admin; ninguna fila nombra la página concreta del listado de reservas, que se cita del código en el texto de E03 (sección 4.6) y no como fila E01. Es distinto del caso de SUT-05, donde ninguna fila E01 cubre el flujo web de la cesta. ¿Cómo queda la celda?\"=\"COMPARABLE (Recomendada)\". You can now continue with these answers in mind."
