expected_under_test:  # hypotheses to be observed in this run, never results; verbatim from the instruction (WHAT THE RUN TESTS)
  H1: "All seven jobs run (target all): sut-01-web-api (ubuntu-24.04, timeout 30 minutes), sut-02-web (ubuntu-24.04, 30), sut-02-android (ubuntu-24.04, 45), sut-02-ios (macos-15, 45), sut-03-web (ubuntu-24.04, 30), sut-04-web-api (ubuntu-24.04, 45), and sut-05-api (ubuntu-24.04, 60); each provisions and verifies its instance and writes its ENVIRONMENT_VERIFICATION record; the run's conclusion is failure if any job fails. The runner images are those GitHub provides on the day: their versions are recorded, not pinned."
  H2: "The DRY_RUN step of the five jobs that have one (sut-01-web-api, sut-02-web, sut-03-web, sut-04-web-api, sut-05-api; the two mobile jobs have none) runs only after a successful verify step: a venv from /usr/bin/python3 with requirements.txt installed under --require-hashes and Playwright Chromium; instance.json written by the step; run-condition.sh checked against the sha256 of its committed blob; E03-CS001-SUT01-API and -SUT01-WEB (job sut-01-web-api), -SUT02-WEB, -SUT03-WEB, -SUT04-API and -SUT04-WEB (job sut-04-web-api), and -SUT05-API, each run once with RECORD_CLASS DRY_RUN, EXECUTION_ID DR0001, ATTEMPT 1, EXECUTOR_PROMPT_VERSION EXECUTOR-E03-RESETABILITY-E03-resetability-v1; each run manifest validated with ajv-cli 5 and ajv-formats 3 against schemas/run-manifest.schema.v2.json plus the E03 conventions; the step fails at its end if any validation failed; the seven bundles E03-DRY_RUN-E03-CS001-<condition>-DR0001-A1 (retention 90 days) are uploaded only after a successful verify step."
  H3: "EXECUTION_ID DR0001 and ATTEMPT 1 are fixed in the workflow (the env of the five DRY_RUN steps, lines 150-151, 563-564, 1149-1150, 1562-1563, 2152-2153), so this run's seven bundles carry the names of the bundles of run 38018788066 (five conditions) and run 38270815417 (the two SUT-04 conditions). Artifacts are run-scoped, each bundle's provenance stub carries the run id and run number, and DRY_RUN bundles are never imported, so no record in the repository collides; the fixed id is stated as a workflow item for the lock and START, not changed here."
  H4: "The first hosted execution of the web-settle revision (executor README, section 12, item 8) in the four web conditions: when the main frame commits a new document after a navigation request, the requests that the replaced document still has in flight leave the wait and are written to the network log file (in_flight_at_navigation, with navigated_to); at the 15 s bound the settle result adds in_flight_requests; when the run closes the browser, every request still in flight is written as in_flight_at_close. The earlier hosted settle results, before the revision: E03-CS001-SUT01-WEB {\"network_quiet\": false, \"quiet_ms\": 500, \"elapsed_s\": 15.038, \"in_flight\": 3}, E03-CS001-SUT02-WEB {\"network_quiet\": true, \"quiet_ms\": 500, \"elapsed_s\": 0.51}, and E03-CS001-SUT03-WEB {\"network_quiet\": true, \"quiet_ms\": 500, \"elapsed_s\": 0.508} (run 38018788066; manifests/e03-environment-verification-import-v5.yaml, dry_run_review); E03-CS001-SUT04-WEB {\"network_quiet\": false, \"quiet_ms\": 500, \"elapsed_s\": 15.005, \"in_flight\": 6}, with the re-fetch chain [308, 200] and the quiet wait {\"quiet_500ms\": true, \"elapsed_s\": 0.507} (run 38270815417; -import-v6.yaml, dry_run_review). Item 8 states that a settle after such a navigation is no longer held to the bound by the requests of the replaced document, so a read can come earlier than in those runs."
  H5: "The earlier hosted outcomes are observations under the realization as ruled (executor README, section 12, after item 8): E03-CS001-SUT01-WEB FAILURE (an order line after the reset and the reload) and E03-CS001-SUT03-WEB FAILURE (the closed-cart bag 1 after Logout); 3 actions against the predeclared 2 for E03-CS001-SUT01-WEB and -SUT02-WEB (the navigation actions of rows 4.2 and 4.3); SUCCESS for the five other conditions. A repeated value is reported as a repetition; nothing is changed in response to an outcome."
  H6: "The SUT-04 job: its second hosted run of the route of the SUT's README and of the Maven 3.9.14 pin (run 38270815417 was the first); the fourteen checks of its verify step as in that run."
  H7: "Capture order: each job scrubs and uploads its ENVIRONMENT_VERIFICATION artifact at its end, after its DRY_RUN step, so the SUT logs kept in those artifacts also hold the log lines that the SUTs wrote during the DRY_RUN executions."
  H8: "The start-up banner of the SUT-04 web application in sut-04-web-api/sut04-web.log is expected to carry the runner's private network address, as line 7 of the run-38270815417 import does (the line that decision B covers); see R5."
  H9: "Expected artifacts: seven ENVIRONMENT_VERIFICATION artifacts, E03-ENVIRONMENT_VERIFICATION-<SUT-01-web-api, SUT-02-web, SUT-02-android, SUT-02-ios, SUT-03-web, SUT-04-web-api, SUT-05-api>-run<run id>-a1, each when its job reaches its upload step, and up to seven DRY_RUN bundles."
  H10: "What the run is not: not a MEASURED_EXPERIMENT, not E03 data, not a mobile qualification or compatibility smoke, not a SUT finding; no gate of the measured workflow runs; E03 stays NOT_STARTED; gate G-7 keeps both mobile conditions blocked whatever their verification result."

import_rules_fixed_before_the_run:  # verbatim from the instruction (R1-R6); applied by operation OP-ENV-16, issued and adopted separately
  R1: "Each condition's github_actions_verification.status is the verification_result of its job's ENVIRONMENT_VERIFICATION record (the status file's own definition, header comment lines 9-10: \"a VERIFIED GitHub Actions record for the condition\"); github_job_conclusion is transcribed as observed. When a job concludes failure after its verify step wrote a VERIFIED record (a later step failed, for example the DRY_RUN step or an upload), its conditions are VERIFIED, the job conclusion is transcribed as failure, and the failed step is named; nothing is hidden. When a job's record is NOT_VERIFIED or missing, its conditions are NOT_VERIFIED, with the failing step named."
  R2: "Latest-run rule (the status file's github_actions_runs comment; multi-run semantics defined 2026-10-04): with target all this run runs a job for all nine conditions, so it governs all nine, whatever its result; the import appends a seventh entry to github_actions_runs and updates the comments that name run 38018788066 for seven conditions and run 38270815417 for the two SUT-04 conditions; the earlier values stay in their import directories and import records. A condition whose job does not verify becomes NOT_VERIFIED at the import (gate G-8 then refuses it) and needs a further dispatch under its own approval: the consequence that the reviewer's report presented and the human research lead's decision of 2026-10-18 accepted."
  R3: "reverification_required: no condition carries the entry (summary reverification_required: []); the import adds none and removes none."
  R4: "Only the seven ENVIRONMENT_VERIFICATION artifacts are imported, byte-exact, under experiments/E03-resetability/environment-verification/github-actions/run<run id>-a1/<job id>/ (sut-01-web-api, sut-02-web, sut-02-android, sut-02-ios, sut-03-web, sut-04-web-api, sut-05-api), as in OP-ENV-12. The DRY_RUN bundles are downloaded outside the repository, verified against their GitHub digests, read, and never imported anywhere; only values read from them (numbers, statuses, quoted lines) and their digests enter tracked records."
  R5: "The runner's private network address in the start-up banner of sut-04-web-api/sut04-web.log is expected: the canonical import stays byte-exact, the import record states its presence by member and line, and its publication handling is decision B as extended by the human research lead's decision of 2026-10-18 (applied by the operation of the next export, with its own adoption; this operation applies nothing). Any other private network address (the pattern of PUBLIC-EXPORT-MANIFEST.yaml, environment_verification_private_address_redaction.pattern), private path, vendor term, or secret-like token in any member of any ENVIRONMENT_VERIFICATION artifact (for example in a SUT log that carries DRY_RUN traffic): STOP and report before any import; its publication handling then needs a human decision, and the canonical import stays byte-exact either way."
  R6: "A DRY_RUN finding (a non-zero executor exit status, a failed validation, an outcome or action count other than that of the condition's earlier hosted DRY_RUN, a settle that reached its bound, a missing file) is a DRAFT revision item of the executor before the lock (new digests, new commit), never a SUT finding; option C is decided by the human research lead before the lock, within the corrections that follow the review of this run."

