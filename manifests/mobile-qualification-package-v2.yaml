# manifests/mobile-qualification-package-v2.yaml
# Successor of manifests/mobile-qualification-package-v1.yaml (which stays unchanged as immutable historical
# provenance), created by the ORCHESTRATOR on the explicit human instruction "MOBILE QUALIFICATION PRE-DISPATCH
# INTEGRITY CORRECTION" (2026-09-23), section 6 (PROTO-U12). Scope of the change, exhaustively: the operational
# artifact/provenance representation required for formal output isolation, sequential platform execution in one
# dispatch, and active prompt-version provenance -- every other field is copied from v1 byte-for-byte.
# Changed relative to v1 (and nothing else): package_version, prepared_at, the provenance header, supersedes,
# launch_prompt_working_copy, status, implementation_baseline_lock (new), execution_plan.artifact_paths,
# execution_plan.platform_execution_order (new), gate_implementation.workflow_contract,
# gate_implementation.formal_output_namespace (new), gate_implementation.active_prompt_version_provenance (new).
# Unchanged: qualification SUT/build, backend, runner and fallback pins, platforms/substrates, scenario definitions,
# capabilities, N, warm-ups, clean-execution definition, record fields, execution-id convention, acceptance criteria,
# exclusions/attribution, switch rule, compatibility smoke. PREPARATION ONLY: no qualification run; nothing here is
# evidence about any system under test (SUT). Execution requires a separate explicit human instruction.
study_id: EUS-2026-001
package_version: v2
supersedes: manifests/mobile-qualification-package-v1.yaml  # v1 immutable historical provenance (the AUTH-01 / AUTH-02 lineages were prepared against it)
prepared_by: ORCHESTRATOR
prepared_at: "2026-09-23"
governing_policy: protocol/mobile-runner-policy-v1.md  # FROZEN-PRE-DATA
governance_in_force: protocol/agent-governance-v2.md  # FROZEN-PRE-DATA (2026-09-22); QUALIFIER-MOBILE-01 unchanged from v1 (section 3.4): writes qualification/** only
executing_role: QUALIFIER-MOBILE-01
launch_prompt_working_copy: prompts/working/qualifier-mobile-01-mobilewright-gate-v3.md  # for MOBILE-QUALIFICATION-EXEC-AUTH-03 (PREPARED, NOT ISSUED); frozen to prompts/frozen/ at issuance, no later than the first run (prompts/README.md, rules 2-5)
implementation_baseline_lock: manifests/mobile-qualification-implementation-lock-v2.yaml  # MOBILE-QUALIFICATION-IMPLEMENTATION-LOCK-02 (successor of LOCK-01)
status: READY_FOR_HUMAN_AUTHORIZATION  # every input below is pinned or locked; the next authorization (MOBILE-QUALIFICATION-EXEC-AUTH-03) is PREPARED, NOT ISSUED

qualification_sut:
  sut_id: SUT-01
  ecosystem: OmniPizza
  neutrality: "policy section 3: qualification produces no evidence about SUT-01 or any other ecosystem, confers no familiarity advantage or privileged interpretation, and is disclosed as a study limitation in every report"
  build: "manifests/toolchain-manifest.yaml, tools.mobile_primary_candidate.qualification_build (release v1.1.8, tag commit 3cdbe6596a1ab5ef2058ba4259c44da96a0fa03a; omnipizza-release.apk sha256 1059e946...6a4; OmniPizza-Simulator.zip sha256 de2e8c21...eb1)"
  backend_for_mq3_seed:
    endpoint: https://omnipizza-backend.onrender.com  # manifests/sut-manifest.yaml, SUT-01 api endpoint
    environment_type: PUBLIC_HOSTED
    basis: "the pinned mobile release builds are wired to this hosted backend (SUT README: changing API_ORIGIN requires editing frontend-mobile source, which is a SUT modification and is not permitted, AGENT-INSTRUCTIONS.md rule 3); the seed is performed by the harness outside the runner (policy section 5) using only the documented session-scoped seeding interactions (POST /api/cart with a documented test account's token, SUT01-EV-0004), never a state change visible to other users"
    limitation: "HOSTED_MAPPING_UNVERIFIED (manifests/sut-manifest.yaml): the hosted backend's exact correspondence to the pinned commit is not independently verified; disclosed in every qualification record; a seed failure is attributed API_SEED or SUT_INSTANCE, never RUNNER (policy section 7.3)"

runner_under_qualification:
  candidate: Mobilewright
  pinned_version: "0.0.60"
  npm_package: mobilewright
  npm_integrity: "sha512-c+aIg0FtMI6226xoVwXiO8Guqk9v5rT81zohz2Rs4WuZEaOgJidHoX9yd5Sqjpx3nTVYfmkFtqHoMFKMGVOuCg=="
  source: "https://github.com/mobile-next/mobilewright, tag v0.0.60, commit 2046d2d95e7db6383183bb6b116f81b1236cae42"
  install: "npm install mobilewright@0.0.60 at gate start (Node.js 22.12 or newer per its engines); QUALIFIER-MOBILE-01 records the observed installed version, install date, and platform; the ORCHESTRATOR then transcribes them into manifests/toolchain-manifest.yaml"
fallback_runner:
  candidate: "Appium 3"
  pinned_version: "3.7.0"
  npm_package: appium
  npm_integrity: "sha512-2AWajtPbjYGTJmVqpavGctO7zK9M7Q74L3vK9lFKPs6qr3N3/xy3STHnkXJk/wgaZ+BDgeKD68zQQ5sAP6A/cA=="
  source_commit: b67de03966155ff052076c11c1c8f20cc2ba9134
  rule: "used only if the switch rule of policy section 8 fires; Appium 2 is never introduced"

platforms:
  android:
    environment_type: EMULATED
    identity: "manifests/toolchain-manifest.yaml environments.android_emulator: system-images;android-35;google_apis;x86_64, API 35, profile pixel_7"
    substrate: "GitHub-hosted ubuntu-24.04 runner (image 20260907.300.1 or later, KVM enabled), emulator via ReactiveCircus/android-emulator-runner v2.38.0 pinned at a421e43855164a8197daf9d8d40fe71c6996bb0d"
  ios:
    environment_type: SIMULATED
    identity: "manifests/toolchain-manifest.yaml environments.ios_simulator: iPhone 16, iOS 18.5 simulator runtime, Xcode 16.4 build 16F6 selected with xcode-select"
    substrate: "GitHub-hosted macos-15 runner (image 20260824.0482.1 or later that still ships Xcode 16.4 build 16F6 and iOS 18.5)"
  same_identities_for_every_execution: true  # policy section 6

scenarios:  # frozen definitions, policy section 4; the concrete realization (screens, identifiers, seed request, deep link, terminal UI state) is recorded by QUALIFIER-MOBILE-01 in qualification/mobilewright/README.md BEFORE its first run and is identical for every execution
  MQ1:
    definition: "Login -> Catalog: from the app's initial screen after a clean reset, log in with a documented test account, reach the catalog screen"
    purpose: "navigation and selector compatibility"
    e01_evidence_pointers: "SUT01-EV-0011 (testID/accessibilityLabel on every LoginScreen element: screen-login, input-username, input-password, ...); SUT01-EV-0008/0009 (omnipizza:// deep-link route table incl. login and catalog); documented test accounts (SUT README 'Test Users' table, SUT01-EV-0017 names one)"
  MQ2:
    definition: "Catalog -> Product Interaction: from the catalog screen, at least one scroll or swipe, open a product, interact with at least one native control so that a UI state change is observable"
    purpose: "native control interaction"
    e01_evidence_pointers: "SUT01-EV-0009 (routes catalog, pizza-builder); SUT01-EV-0011 (testID conventions)"
  MQ3:
    definition: "API State Seed -> Deep Link -> Target UI State: the harness seeds state through the SUT API (outside the runner), the app is opened through a deep link targeting the seeded state, the runner verifies the target UI state reflects the seed"
    purpose: "direct controlled mobile state establishment"
    e01_evidence_pointers: "SUT01-EV-0004 (POST /api/cart seeds the caller's session cart; GET /api/cart reads it); SUT01-EV-0008/0009/0010/0012 (omnipizza:// scheme, universal params accessToken and resetSession, cold and warm start handling, same scheme on iOS)"
  mandatory_capabilities: "MC-01 ... MC-10 (policy section 5), each exercised on both platforms by the scenarios above"

execution_plan:
  measured_executions_per_combination: 10  # N = 10, policy section 7.1
  combinations: 6  # MQ1, MQ2, MQ3 x android, ios
  total_measured_executions: 60
  warm_ups: "any number per combination before its first measured execution; recorded, never counted toward N; a runner-caused warm-up failure counts under criterion 7.2.3"
  clean_execution: "starts from the declared reset state (MC-09 performed; MQ3 seed applied and verified by the harness); executed entirely by the runner under its scripted scenario; no manual intervention; ends with the pre-declared terminal UI state verified by the runner (MC-08)"
  execution_record_fields: [execution_id, combination, platform, attempt, timestamp, environment_type, runner_version, outcome, duration, artifact_paths, notes]
  execution_id_convention: "MQ<n>-<AND|IOS>-<WARMUP|MEASURED>-<nn>, zero-padded two-digit sequence per combination and kind (for example MQ3-IOS-MEASURED-07); QUALIFIER-MOBILE-01 applies it unchanged from the first run"
  artifact_paths: "qualification/mobilewright/formal/<authorization id>/<execution_id>/ (runner log; screenshot(s); for MQ3 the seed request/response record), plus formal/<authorization id>/environment/, execution-log-<platform>.csv/.jsonl, summary-<platform>.json; the namespace is absent or empty (only .gitkeep) before the first execution, is the only directory uploaded as the GitHub Actions artifact E03-QUALIFICATION-<platform>-Mobilewright-run<run_id>-a<attempt> (.github/workflows/e03-mobile-qualification.yml), and is the only canonical import destination (harness/import-artifacts.mjs); qualification/mobilewright/output/ holds only the quarantined HISTORICAL_UNAUTHORIZED_EXECUTION records of 2026-09-22 (PROTO-U10) and is never read, written, packaged, or imported into by a formal run (PROTO-U12); qualification artifacts are never placed under raw-data/, derived-data/, or audits/"
  platform_execution_order: "one workflow_dispatch with platform both: readiness gate, then the Android job, then the iOS job only after the Android job has completed successfully; Android and iOS never execute concurrently against the shared qualification account (policy section 7.1, measured executions are sequential; PROTO-U12). An ordinary measured runner failure does not fail the Android job; an incomplete Android job leaves iOS unexecuted (fail closed); no retry, no automatic rerun"
  acceptance_criteria: "policy section 7.2, all four required: (1) 100% support of MC-01...MC-10 on both platforms; (2) 10 of 10 successful measured executions for every one of the six combinations; (3) no repeated runner-caused blocker of the same mandatory capability in two or more executions of any kind; (4) no manual intervention inside any measured execution. Duration is secondary evidence only (section 7.4)"
  exclusions_and_attribution: "policy section 7.3: infrastructure failures (emulator/simulator boot failure or crash, host resource exhaustion, SUT instance unavailability, API seed failure, network outage, pre-scenario operator error) are EXCLUDED with a complete attribution record (cause INFRASTRUCTURE, SUT_INSTANCE, API_SEED, OPERATOR, or OTHER — never RUNNER) and replaced; uncertain attribution is runner-caused; runner-caused failures are never excluded"
  fallback_trigger: "policy section 8: if the gate fails on an unsupported or unreliable mandatory capability, or criterion 7.2.3 or 7.2.4 is violated, the study runner switches to Appium 3 (pinned 3.7.0); recorded in qualification/mobilewright/README.md decision record, manifests/toolchain-manifest.yaml, and protocol/CHANGELOG.md; the compatibility smoke is then repeated with Appium 3; Appium 2 never"
  compatibility_smoke: "policy section 9, after runner selection: one clean execution per mobile-capable ecosystem x platform (MC-01, MC-02, MC-06, MC-04, MC-08, MC-10); required before E03 for SUT-02 (android, ios; conditions E03-CS001-SUT02-ANDROID, E03-CS001-SUT02-IOS); required for SUT-01 and SUT-06 before any campaign exercising their mobile modalities; recorded under qualification/compatibility-smoke/; produces no SUT evidence"

gate_implementation:
  path_android: qualification/mobilewright/run-gate-android.sh
  path_ios: qualification/mobilewright/run-gate-ios.sh
  authorized_author: QUALIFIER-MOBILE-01  # qualification/** is that role's exclusive write workspace (protocol/agent-governance-v2.md, section 4; v1 section 3.4); the ORCHESTRATOR never writes under qualification/ and has not authored these files
  lifecycle: "authored by QUALIFIER-MOBILE-01 in its own run, on the explicit human instruction relayed by the ORCHESTRATOR, before the first execution; they implement the frozen scenario realization and are treated as qualification tooling, not study tooling"
  workflow_contract: ".github/workflows/e03-mobile-qualification.yml executes them on the pinned substrates in the order gate -> Android -> iOS and uploads only the formal namespace; its gate refuses to run unless this package's pins, the recorded scenario realization, an issued and dispatch-ELIGIBLE human authorization (never AUTH-01 or AUTH-02), a frozen prompt declaring that authorization's prompt version, the implementation-lock v2 hashes, and an absent-or-empty formal namespace are all present"
  formal_output_namespace: "qualification/mobilewright/formal/<authorization id>/ (GATE_OUT in gate-common.sh, QUALIFICATION mode)"
  active_prompt_version_provenance: "every record's prompt_version_id is the authorization record's launch_prompt.prompt_version_id, passed by the workflow as QUALIFICATION_PROMPT_VERSION_ID; nothing in the implementation hardcodes it"

what_this_package_does_not_do:
  - execute any qualification run, warm-up, or smoke
  - install any runner
  - record any qualification_status, compatibility_smoke_status, or runner decision
  - produce evidence about any SUT
  - authorize E03 START or any measured execution
