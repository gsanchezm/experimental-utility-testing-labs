why:
  state_before: "since the restoration of the study-level mobile-runner status to SELECTED on 2026-11-02 (manifests/mobile-runner-remediation-v1.yaml), G-7 still counted the retained historical FAIL_RUNNER (APPIUM3-COMPAT-SMOKE-AUTH-02, run 36539790536, SUT-02 x iOS) as a blocker, classified the state PROVENANCE_INCONSISTENT_FAIL_CLOSED, and failed two clauses ('no FAIL_RUNNER of the selected runner recorded for any SUT x platform' and 'the selected runner remains admissible study-wide') for both SUT-02 mobile conditions"
  specification: "the approved decision package manifests/mobile-runner-policy-v3-amendment-proposal-v3.yaml, g7_prospective_semantics (the six-step algorithm) and the 16-case g7_static_matrix; policy v3, 9.7.9 (12 requirements), 9.7.10, 9.7.11; the amendment record left the change unmade and named it a separate implementation dependency"
design:  # what the corrected gate does, and the points where the implementation made a choice the specification leaves open
  lineage_in_play: "a restoration is claimed when manifests/mobile-runner-remediation-v*.yaml or tools.mobile_runner_selection.restoration_basis exists; only then are the lineage clauses evaluated (each a separate gate: record count and class, policy headers, the named historical block, the named README row and its SHA-256, the records of the historical observation, the remediation authorization, its scope, the single-remediation rule, the run identity, the lock, the official PASS row, the import and recording records, the mirror entry, the restoration basis and status, requirement 12). With no claim, nothing is retained"
  unresolved: "a FAIL_RUNNER of the selected runner is unresolved unless it is the single historical FAIL_RUNNER named by a VERIFIED lineage (lineage_valid); with no verified lineage the named row stays unresolved. A first draft of this block exempted the named row whenever no lineage was claimed, so a state with the FAIL_RUNNER row, status SELECTED, and no lineage or basis was admitted; the static matrix exposed it before any commit and two guard cases now pin it"
  source_row_verification: "a FAIL_RUNNER row of the README Smoke records is verified by its own provenance: the import record of its authorization namespace (same authorization, same run) and the attribution record of its SUT x platform (FAIL_RUNNER); a mirror FAIL_RUNNER must match such a row, and the mirror need not show a historical one (specification step 2); the former rule that every source FAIL_RUNNER be transcribed in the mirror is gone"
  state_order: "PROVENANCE_INCONSISTENT_FAIL_CLOSED when a claimed lineage does not verify, or when a PASS is recorded after an unresolved FAIL_RUNNER of the same SUT x platform (no valid lineage); ADMISSIBLE when no FAIL_RUNNER is unresolved and the status is SELECTED; FALLBACK_EXHAUSTED_VERIFIED when every unresolved FAIL_RUNNER is verified and the status is UNRESOLVED_AFTER_FALLBACK_FAILURE; otherwise PROVENANCE_INCONSISTENT_FAIL_CLOSED (specification step 5). A PASS recorded BEFORE a later FAIL_RUNNER is not 'beside' it: the later one applies 9.5 again (9.7.11)"
  requirement_12: "a FAIL_RUNNER of the selected runner (README row timestamp or mirror executed_at; an absent or unparsable time counts as earlier, fail closed) that is not later than the recorded_at of the lineage record invalidates the lineage (9.7.9, requirement 12); one later than it leaves the lineage valid and is itself unresolved (9.7.11): the status must then read UNRESOLVED_AFTER_FALLBACK_FAILURE, otherwise the state is PROVENANCE_INCONSISTENT_FAIL_CLOSED. A later FAIL_RUNNER of SUT-02 x iOS replaces the mirror entry, which the mirror clause accepts when its time is later than the lineage record"
  hashes_and_the_public_tree: "G-7 runs on the PUBLIC checkout. Every record hash it compares goes through same(): byte-exact in the canonical repository; on a public snapshot (PUBLIC-EXPORT-MANIFEST.yaml at the root) the path needs exactly one manifest entry, UNCHANGED is byte-exact, and only the two alias classes are bridged through canonical_sha256 and exported_sha256. A survey of the dry-run export of this commit showed every file G-7 hashes (the README, the lineage record, the mirror, the three authorization records, lock v4, the run-identity, import, attribution, and recording records) UNCHANGED; the policies, the change log, and the workflow itself are alias-transformed and are never hashed here (policy headers are read textually). The imported artifacts are not re-hashed: their byte-exactness against the import records is the job of the validation workflow, step QUAL-U05 (through the export manifest for the publication-only classes), which covers every formal import record, the AUTH-02 and AUTH-03 ones included"
  per_condition: "the existing clauses are unchanged (one mirror entry for the exact SUT x platform x runner, PASS, the pin, the QUALIFIER PASS row); one is added: the mirror entry names the authorization of a PASS row of that SUT x platform in the QUALIFIER record (membership, never table position: 9.7.8)"
  renamed_clause: "'no FAIL_RUNNER of the selected runner recorded for any SUT x platform ...' is 'no unresolved FAIL_RUNNER of the selected runner recorded for any SUT x platform ...' and the status clause cites policy v3, 9.5 and 9.7.9; the regression step of the validation workflow asserts the new strings and the new structure (lineage_valid, same(), the lineage class)"
  unchanged: "gates G-1 to G-6 and G-8 to G-11, the web and API conditions (the gate prints no G-7 clause for them), and the dispatch, provenance, and measured-execution jobs"
