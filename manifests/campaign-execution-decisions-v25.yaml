    note: the answer of the question dialog, whole; the chosen options are the decisions
    exact_text: "Your questions have been answered: \"E10-D-9 (SUT-02, condición E10-SUT02-WEB-VISUAL). El registro E01 SUT02-EV-0015 nombra cuatro elementos, pero el botón de checkout está en la página del carrito y el ícono de cerrar solo existe con el menú abierto. ¿Cuántas vistas capturo? Consecuencia que debes conocer: la regla exige que TODOS los elementos difieran, y dos son íconos rotados 3° (sus bordes se mueven menos de un píxel y los píxeles anti-alias se ignoran), así que esta condición puede salir NOT_DETECTED por su elemento más débil aunque el carrito y el botón cambien mucho; vistas, elementos y umbrales NO se cambian después de un DRY_RUN. El conteo H5 de SUT-02 es 1 en ambos casos.\"=\"Tres vistas (Recomendada)\", \"E10-D-10 y E10-D-11 (SUT-03, condición E10-SUT03-WEB-SHIFT). El brief comparaba la página zero-cls contra high-cls, pero son páginas distintas (tarjeta verde vs roja, otro texto) y diferirían aunque el temporizador de 4 s no hiciera nada, así que no prueba el mecanismo. Divulgación: E08 ya observó que #target-text NO se mueve a los 4000 ms; el elemento que el mecanismo de SUT03-EV-0012 dice que se muta es #shift-target (altura 0 → ~320 px con un banner), por lo que elegirlo se hace conociendo ese resultado. Conteo H5 de SUT-03: 2 si se mantiene la condición, 1 si se descarta. ¿Cómo la defino?\"=\"Misma página, 2000 vs 5500 ms, elemento #shift-target (Recomendada)\", \"E10-D-12, D-13 y D-14 (dependencia externa, instrumento y regla). (a) SUT-01 depende de hosts externos: las 12 imágenes estándar y el reemplazo de la imagen rota viven en upload.wikimedia.org; si alguna imagen esperada del estado A no carga, la ejecución es INCONCLUSIVE_EXTERNAL_IMAGE_NOT_LOADED (atribución EXTERNAL), nunca NOT_DETECTED, y no se intercepta ninguna petición (la SUT se evalúa tal como está). (b) Instrumento: Pixelmatch 8.0.0 de npm (módulo de referencia, tarball verificado por sha256 ab59d4c4ec73fbf456c72cbd8200b1529a76142fd9291de72a62ba6e3a845e75, ejecutado con el Node.js del runner, mínimo mayor 20) + Playwright 1.63.0; se anota en tools.visual del manifiesto de herramientas SOLO tras tu sí. (c) Regla: se detecta si R ≥ T_R y r(e) ≥ T_e para cada elemento esperado; T_R = máx(0.0005, 2×máx baseline) y T_e = máx(0.01, 2×máx baseline), calibrados solo con pares baseline-contra-baseline (A vs A2) de rondas DRY_RUN bajo el hash final de la implementación (≥ 6 pares por vista) más una ronda de confirmación; nunca se repite una ronda por ruido. Los pisos 0.0005 y 0.01 y el factor 2 son juicios fijados antes de cualquier captura; con el piso de T_e, un cambio menor al 1 % de la región de un elemento no se detecta.\"=\"Acepto (a), (b) y (c) (Recomendada)\", \"Confirmaciones y qué autorizas ahora (marca todas las que apliquen). Contexto: (1) el texto exacto de tu aceptación del 2026-11-24 de E10-D-1..D-8 no está registrado, por eso se re-ponen: D-1 medidas en SUT-01/02/03 web (los demás 'sin dato, sin condición de verdad de terreno'); D-2 cada condición cuenta una vez para H5 (SUT-01 1, SUT-02 1, SUT-03 2); D-3 las cuatro condiciones (corregidas por D-9..D-12); D-4 un viewport de escritorio 1280×800, primera pantalla; D-5 regla de detección = D-14; D-6 Playwright + Pixelmatch fijados; D-7 N = 50 por condición (200 ejecuciones); D-8 resultado de E10 aparte, sin tocar E01. Además por defecto: D-15 (falso positivo = R de A vs A2 ≥ T_R), D-16 (orden fijo A, B, A2, contexto nuevo por captura), D-17 (ajustes de captura), D-18 (denominadores como E08), D-21 (verificación de entorno propia), D-22 (esquema v2, prompt congelado ORCHESTRATOR-E10-visual-v1). D-19 (presupuestos de tiempo) y D-20 (retención de imágenes; SUT-02 solo da 15 PNG por ejecución) quedan ABIERTOS hasta la ronda 1. (2) Avisos: el tablero D31 dice 'v95: solo D31' y quedará desfasado porque v95 también llevará los borradores de E10 (no lo perseguiré); el START de E12 sigue abierto; ningún START ni DRY_RUN se hace sin tu sí posterior.\"=\"Confirmo D-1..D-8 y los defaults restantes, Construir en local el export v95 (sin push), Corregir la cláusula de AGENT-INSTRUCTIONS.md\". You can now continue with these answers in mind."
decisions:
  - id: E10-D-9
    subject: "views of E10-SUT02-WEB-VISUAL"
    decision: "Three views per state: inventory (cart icon container and burger icon), cart (checkout button) and menu_open (close icon), so that every element of SUT02-EV-0015 is in a capture. The rule is a conjunction over all the elements; two are icons rotated by 3 degrees, so the condition may be NOT_DETECTED because of its weakest element; views, elements and floors are not changed after a DRY_RUN. The H5 count of SUT-02 is 1."
  - id: E10-D-10
    subject: "states of E10-SUT03-WEB-SHIFT"
    decision: "State A and State B are the same page /sut/ui/high-cls captured 2000 ms and 5500 ms after the document commit; State A is captured again (A2) as the baseline-against-baseline control. The zero-CLS page is not State A."
  - id: E10-D-11
    subject: "expected element of E10-SUT03-WEB-SHIFT"
    decision: "#shift-target (the element that the mechanism of SUT03-EV-0012 names as mutated), chosen knowing that E08 observed that #target-text does not move at 4000 ms. The H5 count of SUT-03 is 2."
  - id: E10-D-12-D-13-D-14
    subject: "external dependency, instrument pin, detection rule and calibration"
    decision: "(a) SUT-01 is an external-dependency condition (upload.wikimedia.org, broken-image-url.com): an expected image of State A (A or A2) that did not load makes the execution INCONCLUSIVE_EXTERNAL_IMAGE_NOT_LOADED, attribution EXTERNAL, never NOT_DETECTED; no request is intercepted. (b) The instrument is Pixelmatch 8.0.0 (npm; the reference module taken from the registry tarball by sha256 ab59d4c4ec73fbf456c72cbd8200b1529a76142fd9291de72a62ba6e3a845e75, run by the runner's Node.js, minimum major 20) with Playwright for Python 1.63.0, recorded in tools.visual of manifests/toolchain-manifest.yaml on this approval (install_date and platform stay null). (c) A view is detected when R >= T_R and r(e) >= T_e for every expected element considered; T_R = max(0.0005, 2 x max R of A against A2) and T_e = max(0.01, 2 x max r(e) of A against A2), calibrated only from the baseline-against-baseline pairs of the DRY_RUN rounds under the final implementation hash (at least six pairs per view) plus one confirming round; a round is never repeated because of noise; the floors 0.0005 and 0.01 and the factor 2 are judgments fixed before any capture."
    toolchain_manifest_changed: true
  - id: E10-DEFAULTS
    subject: "E10-D-1 to E10-D-8 and the remaining defaults"
    decision: "Confirmed as recommended in experiments/E10-visual/campaign-configuration-draft.md, section 7: E10-D-1 to E10-D-8 (design brief, section 8, as made precise by E10-D-4 and E10-D-9 to E10-D-14), E10-D-15, E10-D-16, E10-D-17, E10-D-18, E10-D-21 and E10-D-22. E10-D-19 (time budgets) and E10-D-20 (retention of the images) stay open until DRY_RUN round 1."
  - id: E10-GO-1
    subject: "public export v95"
    decision: "Build the public export v95 locally and verify it (the E10 tests, the E10 digest check and the as-is gate on the exported tree included), with no push; the push of v95 and the dispatch of the first DRY_RUN round are separate questions, each with its exact line."
  - id: INSTRUCTIONS-FILE-CLAUSE
    subject: "one clause of the agent-instructions file"
    decision: "The clause 'the status lines of that analysis (commit 5cd141e84), the export-log entry 93 (f6ab00e50; the export log is not part of the export), the analysis and this update of this file are not yet public)' is replaced by the exact text offered in the question (publication of those items by export v94, and the export-log entries 93 and 94 not public); the edit is recorded in its own commit."
