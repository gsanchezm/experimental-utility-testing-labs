open_items:
- id: OPEN-1
  title: the CS-004 checkout selectors of SUT-02 and SUT-03 (HD-S) are unverified, so two of ten conditions are blocked
  kind: HUMAN_DECISION_AND_PRECONDITION
  detail: |-
    The executor implementation refuses E02-CS004-SUT02-WEB and E02-CS004-SUT03-WEB as not configured (executor README, section 5). Locking this implementation hash would lock that refusal and remove the CS-004 half of both H2
    pairs; only the CS-003 pair of each comparison (SUT-01 against SUT-02, SUT-01 against SUT-03) would be left, that is one pair per comparison. The selectors must be read from the pinned sources (SUT-02 commit 60fdd634,
    SUT-03 commit 7ab934d7) and verified by a DRY_RUN before the lock; nothing is guessed. Reading a pinned source tree is a download for reading, not a clone and not a run, and it needs the human research lead's
    instruction (rule 15 of the project instructions). Resolving it changes the implementation hash, so the lock values of this record change and the successor package version carries them.
  options:
  - 'A: START with eight executable conditions and two recorded and blocked (the default written in the candidate section); unblocking later needs a change-log row and a re-lock'
  - 'B: resolve it before the START (recommended): read the selectors, extend the executor, re-run the tests, verify by DRY_RUN together with the other conditions, then lock in package version 2'
  recommendation: B
- id: OPEN-2
  title: the E02 verification workflow cannot run before the START as installed
  kind: HUMAN_DECISION_AND_CI_CORRECTION
  detail: |-
    The gate of .github/workflows/e02-environment-verification.yml requires prompts/frozen/<version>.md to exist (line 140), while the frozen copy of the prompt is written once at the START (prompts/README.md, rule 2).
    The E03 verification workflow had no such requirement and ran nine times before the E03 START. As installed, no E02 DRY_RUN can run before the START, so the controlled instances cannot be verified before the
    configuration is locked.
  options:
  - 'A: a CI correction OP-CI-17 under CAMPAIGN-CI-WRITE-AUTH-01 that drops the frozen-file requirement from the DRY_RUN gate and checks the working prompt instead (the E03 precedent), together with the stale DRAFT wording of both headers (OPEN-3); recommended'
  - 'B: write the frozen prompt before the DRY_RUN (an earlier freeze, a human approval; the prompt is then immutable)'
  - 'C: START first and verify afterwards (inverts the E03 order; a failed verification could change provisioning after the lock)'
  recommendation: A
- id: OPEN-3
  title: stale DRAFT wording in both workflows
  kind: CI_CORRECTION
  detail: the headers and the name of both E02 workflows still say DRAFT and describe governance v6 and CS-004 as DRAFT (they were written before the freezes of 2026-11-06); cosmetic, but a workflow edit changes workflow_sha256, so it belongs before the lock and in the same operation as OPEN-2
  recommendation: include in OP-CI-17
- id: OPEN-4
  title: environment verification before or after the START
  kind: HUMAN_DECISION
  detail: 'verification before the START is recommended, because a failed verification can change provisioning, which the lock freezes (E03 verified nine times before its START); it needs OPEN-2 option A or B and the export v47'
  recommendation: before
- id: OPEN-5
  title: items of the executor that no test and no run has exercised
  kind: PRECONDITION
  detail: 'executor README, section 10: the SUT-01 unauthenticated session status, the SUT-04 booking list shape and date format, the SUT-05 BasketItems request and response shapes, the SUT-02 landing check, and the SUT-03 float-cart close; the first execution of every web realization is a DRY_RUN; a defect found there changes the implementation hash'
  recommendation: the DRY_RUN of every condition precedes the lock
- id: OPEN-6
  title: the execution-model record of E02
  kind: HUMAN_DECISION
  detail: 'governance v6, Section 3.6, expects "each campaign''s own execution-model record under experiments/<campaign-id>/ when its configuration is prepared"; none exists for E02; the working prompt refers to experiments/E03-resetability/ci-cd-execution-model.md for the import procedure and artifact classes, as Section 3.6 ("Import") does'
  options:
  - 'A: reuse the E03 document by reference (recommended; KISS, the import procedure is the same)'
  - 'B: write experiments/E02-state-establishment/ci-cd-execution-model.md'
  recommendation: A
- id: OPEN-7
  title: the START date and the START authorization id
  kind: HUMAN_DECISION
  detail: 'the id is the human research lead''s (proposal: E02-START-AUTH-01, mirroring E03-START-AUTH-01); the START and the configuration lock are one approval of the exact action (protocol/change-control-v1.md, section 7; governance v6, Section 3.6, Human-gated), asked with the exact line and recorded with its hash'
- id: OPEN-8
  title: the five dispatch authorizations
  kind: HUMAN_DECISION
  detail: 'after the START and the verification, one per SUT (dispatch_authorizations_to_issue); an authorization names a condition only if its gates hold at issuance; the SUT-02 and SUT-03 authorizations name only their CS-003 condition while OPEN-1 is unresolved; each is issued only by the human research lead'
- id: OPEN-9
  title: the H2 consequence of the default
  kind: DISCLOSURE
  detail: 'under option A of OPEN-1 the establish side of H2 has one pair per comparison (CS-003); with the CS-004 conditions it has two, and two pairs cannot reach significance in any case (smallest two-sided exact p-value 0.5 at n = 2, derived), so H2 is descriptive either way (HD-16); the paper states this'

sequence_after_the_human_answers:
- 'S1. the human research lead answers OPEN-1, OPEN-2, OPEN-4, OPEN-6 (one question dialog with the exact options)'
- 'S2. if OPEN-1 is B: read the two pinned source trees (download for reading), configure and test the two realizations, refresh the embedded digests, re-run the 37 tests; the hash changes'
- 'S3. OP-CI-17 if OPEN-2 is A (and the OPEN-3 wording): edit the two workflows, actionlint and shellcheck, the OP-CI-15 length check, the change-log row of the CI correction'
- 'S4. export v47 (built by the ORCHESTRATOR, pushed in person by the human research lead): publishes the executor, the workflows, governance v6, CS-004, the prompt, and this package; its validation run must pass and GitHub must accept both E02 workflows'
- 'S5. the environment-verification DRY_RUNs of the ten (or eight) conditions, each dispatch on the human research lead''s approval; bundles reviewed, never imported as measured data; the verification import writes controlled-instance-status.yaml'
- 'S6. package version 2: lock values recomputed, the rehearsal repeated on the exported tree, the open items closed or carried'
- 'S7. the START approval line offered verbatim; on approval the START edit set is applied in one commit; the frozen prompt is written'
- 'S8. export v48 (the START state), the gate step re-run on the exported tree, then the five dispatch authorizations, each on its own approval line, then the dispatches'

