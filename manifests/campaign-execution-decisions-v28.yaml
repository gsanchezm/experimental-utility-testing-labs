    exact_text: "Your questions have been answered: \"Resultado de la ronda 4 de DRY_RUN de E10 (corrida 46175822110, 3 min 27 s, todo DRY_RUN; nada medido). La ruta no provisional QUEDA CONFIRMADA: en las 12 ejecuciones los umbrales son T_R 0.0005 y T_e 0.01, provisional = false y fuente = registro de calibración; SUT-02, SUT-03 IMAGE y SUT-03 SHIFT dieron DETECTED 3/3 (el ícono de cerrar de SUT-02 sigue en 0.0103 frente al piso 0.01) y los 18 pares A vs A2 son idénticos. PERO apareció un defecto del arnés en SUT-01: en 2 de 3 ejecuciones la captura del estado B gastó sus 20 s de espera en el paso de imágenes (la propia SUT reintenta sin límite la imagen de reemplazo, cada petición bloqueada por ORB, así que sus 3 imágenes de la primera pantalla nunca están completas a la vez), el chequeo de estabilidad de diseño que viene después no llegó a correr y la ejecución quedó INCONCLUSIVE_READY_SIGNAL_MISSING con el motivo LAYOUT_NOT_STABLE, que no describe la causa (el diseño no se mostró inestable). En las rondas 2 y 3 esa misma captura se asentó siempre; en la ronda 4 solo 1 de 3. Si no se corrige, en la medición una fracción de las 50 ejecuciones de SUT-01 saldría inconclusa por el arnés (se excluye del denominador de detección y se reporta, E10-D-18), con menos información y un intervalo más ancho. La corrección no toca expectativas, vistas, elementos ni pisos: acotar la espera de imágenes (5 s) y correr siempre después la espera de estabilidad de diseño con su propio presupuesto; las imágenes de A/A2 siguen exigiendo carga (regla externa) y el estado de imágenes de B se registra. Cuesta: cambia el ejecutor, así que cambia su hash de implementación y las rondas 2 y 3 dejan de servir para la calibración (la regla pide rondas bajo el hash final). Camino propuesto: corrección + pruebas, export v98 (publicarlo requiere tu sí a su línea), dos rondas nuevas (cada una con su línea exacta; correrían ya con los umbrales del archivo de condiciones, que son los pisos, así que también sirven de ronda de confirmación), recalibración como registro v2 (el v1 es inmutable; hay que apuntar la compuerta G-11 al v2) y export v99; luego el paquete de START. ¿Qué hago?\"=\"Corregir el arnés y recalibrar (Recomendada)\". You can now continue with these answers in mind."
