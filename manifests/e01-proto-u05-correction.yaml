notes: |
  Single commit bundles contract and result (manifests/protocol/schema/script + the generated matrix and
  its sidecar), matching this repository's own established convention: PROTO-U03's commit (0fdbbab) bundled
  the frozen prompt v2 with its change-control record, and PROTO-U04's commit (1270bc1c) bundled the two
  human-ruling records with their change-control record. The operating task's preference for two separate
  commits (contract-freeze, then materialization) would break that established one-commit-per-change-control
  -event convention without a corresponding benefit here, since both halves are produced and verified in the
  same operation; the commit message itemizes which files are the representation contract and which are the
  deterministic result, as the minimum auditable alternative. No file under audits/**,
  derived-data/adjudication/**, or derived-data/adjudication-rulings/** was modified (only read and
  re-hashed for verification). ADJUDICATOR-EU-01 was not relaunched. schemas/adjudication.schema.json,
  schemas/sut-audit.schema.json, protocol/capability-rubric-v1.md, and protocol/evidence-rules-v1.md are
  unchanged. No H1-H5 analysis, ranking, or weighted score was computed anywhere in this record, the script,
  or the matrix output.
