change_id: PROTO-U03
study_id: EUS-2026-001
discovery_point: >
  During the ADJUDICATOR-EU-01 final pre-launch preflight, after all 17 enumerated preflight gates passed
  (direct hash/byte verification of prompts/frozen/e01-adjudicator-v1.md matched its recorded freeze values
  exactly). ADJUDICATOR-EU-01 was NOT_STARTED and had never executed. No auditor result commit or its
  scientific contents were read to make this discovery; it was found by direct textual review of the frozen
  prompt's own line 3, required as part of preflight due diligence.
issue: >
  prompts/frozen/e01-adjudicator-v1.md, line 3, reads: "Status: WORKING SKELETON. Not yet frozen, not yet
  complete, and not usable: this file states only what protocol/agent-governance-v1.md, section 3.3 and
  protocol/capability-rubric-v1.md already define for ADJUDICATOR-EU-01. It invents no methodology beyond
  the frozen protocol and is not a substitute for one. It is prepared here only so that the role exists in
  `prompts/working/`; it is not reviewed, not approved, and not to be used to adjudicate anything." This
  statement is unconditional and asserts the prompt's own content is incomplete and unusable, despite the
  prompt being formally FROZEN (manifests/e01-adjudicator-prompt-freeze.yaml, status: FROZEN, approved by
  gilbertosanchez, 2026-09-17T14:43:38Z). Because Section A of the launch procedure forbids any prefix,
  suffix, wrapper instruction, or hint around the frozen prompt text supplied to ADJUDICATOR-EU-01, a fresh
  executing agent's first instruction would be a document declaring itself unreviewed, unapproved, and "not
  to be used to adjudicate anything" -- undischargeable from the agent's authorized inputs alone. Distinct
  from the already-accepted staleness in prompts/frozen/e01-capability-auditor-v1.md's own header (logged
  commit 637abe7; experiments/E01-capability-audit/pre-adjudication-integrity.md, section 6): that header is
  a conditional ("do not use until copied to prompts/frozen/ with a recorded SHA-256") a reader can discharge
  in-band from the frozen copy plus manifests/e01-prompt-freeze.yaml; the adjudicator header is unconditional
  and asserts content insufficiency ("not yet complete... not usable") that no freeze record can satisfy from
  inside the prompt. Not caught by the prior freeze review (commit d7f0f25): that review's checklist
  evaluated and classified a different staleness (the "skeleton only" YAML comment in
  manifests/e01-capability-audit.yaml, HISTORICAL/NON-BLOCKING, "never parsed programmatically") but did not
  separately evaluate prompts/frozen/e01-adjudicator-v1.md's own line 3, which -- unlike that comment -- is
  parsed by the executing agent as its first instruction.
classification:
  category: PRE-EXISTING OPERATIONAL / PROVENANCE DEFECT
  temporal: DISCOVERED POST-DATA
  methodological: false
  blocking: BLOCKING ADJUDICATOR EXECUTION
  note: >
    The defect affects whether the already-defined adjudication instructions (assignment, responsibilities,
    "what the adjudicator never does," output-record binding to schemas/adjudication.schema.json) can be
    executed. It does not change how adjudication decisions are made.
human_ruling: >
  Classification ACCEPTED. ADJUDICATOR-EU-01 must remain NOT_STARTED; not launched by this record. Correction
  is PROSPECTIVE ONLY and must not modify or reinterpret any previously collected auditor evidence. Remedy:
  create prompts/frozen/e01-adjudicator-v2.md (prompts/README.md, rule 4 -- a frozen prompt is never edited
  in place) containing the minimum metadata/status correction only, replacing the disqualifying Status
  statement with: "Status: ADJUDICATION TASK PROMPT. Execution is authorized only from a formally frozen copy
  after the required pre-launch gates pass." No other prose rewritten, no stylistic or spelling correction
  made, no prompt-version identifier elsewhere in the file changed (evaluated: the file's own title, "working
  prompt skeleton v1," contains an embedded "v1" token; changing it was judged not mechanically required --
  no code, schema, or manifest parses that heading string to determine version identity; the file's path and
  this record establish it as E01-ADJUDICATOR-V2 -- so it was left untouched, keeping the diff to exactly one
  hunk). Approved by gilbertosanchez.
