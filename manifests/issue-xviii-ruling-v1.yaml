  source: "protocol/study-design-v1.md, section 13, row (xviii)"
  register_row_text_unchanged: true  # study-design-v1.md is FROZEN-PRE-DATA; its Register table text is not edited in place (not a non-substantive correction — the row's own status/resolution text would be a substantive change). Frozen as a historical snapshot per the existing AGENT-INSTRUCTIONS.md "Current phase" precedent (already used for the frozen study-design-v1.md section 14 status snapshot).
  live_status_recorded_in:
    - manifests/study-manifest.yaml (open_issue_register.resolved/deferred_before_campaign counts, updated below)
    - AGENT-INSTRUCTIONS.md ("Current phase" section, updated by this operation)
  resolution_note: >
    protocol/study-design-v1.md section 13's row (xviii) text ("DEFERRED-BEFORE-CAMPAIGN...
    requires_human_decision: yes") remains, unedited, as the frozen historical snapshot of the
    issue's state as of the 2026-09-16 protocol freeze. It is not authoritative for current status,
    exactly as AGENT-INSTRUCTIONS.md's "Current phase" section already establishes for other frozen snapshots
    (for example protocol/study-design-v1.md section 14's pre-data text). Current, authoritative
    status is RESOLVED, recorded here and in AGENT-INSTRUCTIONS.md.
