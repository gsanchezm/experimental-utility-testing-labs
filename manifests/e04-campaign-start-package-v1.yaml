open_items_for_the_human_research_lead:
- id: Q1
  question: Approve the START of E04-repeatability and the lock of its Campaign configuration (the text file named in lock_values, sha256 in lock_values), under the authorization id
    E04-START-AUTH-01 (proposed id).
  recommendation: Approve after Q2 to Q13 are decided; the START applies only the prepared edit set.
- id: Q2
  question: 'Confirm or change the working defaults of design-notes-draft.md section 2 that the configuration text fixes: the thirteen mirrors of E05 (2.1), the categories (2.2), the
    attempt rule and gate G-E04-A2 (2.4), and no comparison or pooled rate (2.5).'
  recommendation: Confirm all four.
- id: Q3
  question: 'Attribution: TOOLING for every interruption of a block (confirmed 2026-11-17). Decide the response-boundary clause of design default 3 (an exception after a response of
    the SUT is SUT).'
  recommendation: Do not adopt the clause in this configuration. Adopting it makes TOOLING almost unreachable, because each realization gets a response before its first block that can
    raise; the executor implements the TOOLING rule without it.
- id: Q4
  question: Keep the thirteen conditions as one-to-one mirrors of E05 although several share blocks (E04-SUT01-API-01 with API-06; API-02, -03, -04 and -05; E04-SUT05-API-01 with -02).
    Merging would change the conditions file (new hash) and the number of executions.
  recommendation: Keep the thirteen conditions as written.
- id: Q5
  question: 'E04-SUT04-API-02: keep the message-count read of the E05 verification block (the baseline of the E05 stimulus), or remove it.'
  recommendation: Keep it, as stated in the configuration text; removing it changes the target-state check of that condition.
- id: Q6
  question: Guest-name derivation salt E04| (names differ from E05) and the retained stimulus names in the SUT-04 reset (kept so that the reset is unchanged).
  recommendation: Confirm both.
- id: Q7
  question: 'Confirm the order of dispatch in the configuration: SUT-01 API-01 to API-06 then WEB-01; SUT-02 WEB-01; SUT-04 API-01, API-02, WEB-01; SUT-05 API-01, API-02; one condition
    at a time per SUT, the SUT chains concurrent.'
  recommendation: Confirm.
- id: Q8
  question: Freeze the dispatch procedure prompt ORCHESTRATOR-E04-repeatability-v1 at the same moment (its working copy sha256 in lock_values; the frozen copy is written byte-identical).
  recommendation: Approve.
- id: Q9
  question: 'Measured timeout: the 60-minute ceiling is inherited from E05 and is TBD for E04. Round 1 records no job durations.'
  recommendation: Keep 60 minutes. Before the START, a read-only look at the durations of run 44331428884 is advisable; the value is not raised.
- id: Q10
  question: 'Controlled-instance basis: the status VERIFIED rests on one DRY_RUN round (round 1, two executions per condition). E05 used three rounds.'
  recommendation: Accept round 1 if one round is judged adequate; otherwise run one more round (three executions) on an exact-line approval before the START.
- id: Q11
  question: environment_type SELF_HOSTED in the prepared controlled-instance content comes from the verification workflow provenance step; the round record does not state it.
  recommendation: Confirm it from one ci-provenance.json of the round 1 artifacts (a read-only download) before the START.
- id: Q12
  question: 'Reference values of the runner image, Python, Node.js and the browser build: not recorded in round 1.'
  recommendation: Leave them TBD, recorded per job and never gated, as E05 did.
- id: Q13
  question: The four dispatch authorizations and the further-attempt approval are issued only after the START state is exported, each by an explicit yes; the approval texts in this package
    are prepared, not issued.
  recommendation: Issue them later, one per SUT, after the START export.
findings_in_the_draft:
- id: F1
  finding: design-notes-draft.md section 2.1 and conditions-draft.json (pending field) name only E04-SUT01-API-02 and -03 and E04-SUT05-API-01 and -02 as identical-block conditions.
    The E05 conditions show E04-SUT01-API-01 and -06 (restart, cart line) and API-02, -03, -04 and -05 (session clear, cart line) as identical blocks, the accounts differing.
  action: Not changed here (the draft is an input to the START). The configuration text states the groups; the draft pending notes need the same correction before the START.
- id: F2
  finding: The measured workflow header comment says E04 is NOT_STARTED and has no controlled-instance verification. After the START this comment is stale.
  action: 'Not changed: the workflow hash is locked in the configuration text; a change would require a new text and hash.'
- id: F3
  finding: The measured gate reads experiments/E04-repeatability/controlled-instance-status.yaml, which does not exist before the START; the gate fails closed on it, as designed.
  action: None; the file is created at the START from the prepared content.
- id: F4
  finding: The round 1 record does not state environment_type, the runner reference values or the job durations.
  action: Open items Q9 to Q12.
- id: F5
  finding: The design notes (section 2.3) and the executor implement the TOOLING rule without the response clause; the configuration text follows the implementation.
  action: Open item Q3.
not_part_of_the_start:
- the four dispatch authorizations (issued separately, one per SUT, each by an explicit yes, after the START export)
- the export of the START state and of the authorizations (each with its own exact-line approval)
- any dispatch, any import of measured data, the freeze of the campaign and the analysis (each with its own approval)
