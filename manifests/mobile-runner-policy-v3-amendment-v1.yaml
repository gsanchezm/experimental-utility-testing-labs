  "- **APPROVE**
    - Autoriza solo el registro de change-control: header de v3 a FROZEN-PRE-DATA, header de v2 a AMENDED con fila `Superseded by`, dos filas en CHANGELOG y la decisión añadida a la fila PROTO-U19.
    - `mobile_runner_status` sigue UNRESOLVED_AFTER_FALLBACK_FAILURE y G-7 sigue bloqueando.
    - No autoriza corregir `wd.mjs`, cambiar G-7, lock v4, nueva AUTH, publicación, dispatch, restauración, PROTO-U16, E03 START, re-ejecutar Android ni un tercer runner.
    - Aceptas una enmienda post-data y outcome-responsive: habrá dos observaciones de SUT-02 × iOS bajo dos versiones de policy y ambas deben reportarse siempre. Si la remediación da FAIL_RUNNER o NOT_EXECUTED, es terminal bajo v3."
