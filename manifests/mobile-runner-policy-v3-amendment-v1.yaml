rationale: 'Under protocol/mobile-runner-policy-v2.md the Appium 3 fallback was exhausted on 2026-09-29 by the SUT-02 x iOS FAIL_RUNNER of APPIUM3-COMPAT-SMOKE-AUTH-02 (run 36539790536; conservative tie-break of 9.4, attribution uncertain between the study-authored WebDriver transport and the Appium 3 / XCUITest stack), which under 9.5 blocked every campaign requiring Android or iOS execution until a new explicit protocol amendment decided the mobile-runner strategy; the post-run review identified qualification/unresolved.md QUAL-U06, a study-authored WebDriver transport and diagnostic defect whose causal role was not demonstrated sufficiently to change the 9.4 result (protocol/unresolved.md PROTO-U19). The decision package compared three alternatives without selecting one (A: stop mobile experimentation; B: a third runner; C: one Appium 3 remediation qualification, the drafted v3). The human research lead approved the drafted v3 on 2026-10-02 against the decision item and the meaning of APPROVE quoted verbatim above.'
