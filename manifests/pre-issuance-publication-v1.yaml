    B. the compatibility-smoke records demonstrate a valid `FAIL_RUNNER` under selected Appium 3 but the study-level status has not yet been transcribed consistently.

    A provenance disagreement must block mobile execution, not admit it.

    ## 5. SOURCE-VERIFIED TERMINAL FAILURE

    Do not let a bare mutable mirror entry alone create scientific terminal state.

    For an Appium `FAIL_RUNNER` to be treated as an observed compatibility-smoke failure, require its normal provenance linkage to the QUALIFIER-owned compatibility-smoke record.

    The gate may nevertheless fail closed on inconsistent or incomplete provenance.

    In other words:

    - verified FAIL_RUNNER → terminal mobile block;
    - inconsistent FAIL_RUNNER representation → fail closed pending reconciliation;
    - NOT_STARTED / absent → no terminal-failure conclusion, but the individual condition remains blocked because its smoke is not PASS;
    - NOT_EXECUTED → no terminal runner failure, but that exact condition remains blocked.

    ## 6. PER-CONDITION PASS STILL REQUIRED

    When no study-wide fallback failure exists, preserve the current per-SUT × platform rule.

    For a mobile condition to pass G-7:

    1. selected runner lineage valid;
    2. selected runner exact version recorded;
    3. no terminal Appium fallback failure exists anywhere in the applicable smoke set;
    4. exact condition's SUT × platform × selected-runner smoke = PASS;
    5. QUALIFIER source record verifies that PASS.

    Thus:

    Android PASS / iOS NOT_STARTED:
    - Android may pass the smoke portion of G-7;
    - iOS fails.

    Android PASS / iOS FAIL_RUNNER:
    - both fail because fallback is exhausted.

