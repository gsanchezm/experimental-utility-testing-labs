    ## 3. G-7 STUDY-WIDE FALLBACK-EXHAUSTION RULE

    Correct G-7 prospectively before any Appium smoke outcome exists.

    For every ANDROID or IOS measured condition, G-7 must first verify that the selected study mobile runner remains experimentally admissible.

    If the selected runner is Appium 3 and a valid compatibility-smoke observation has produced:

    `FAIL_RUNNER`

    for ANY ecosystem × mobile platform governed by Section 9, then:

    ALL mobile measured conditions must fail G-7.

    This includes a condition whose own platform previously passed.

    Example:

    SUT-02 Android = PASS
    SUT-02 iOS = FAIL_RUNNER

    Result:

    - Android G-7 = FAIL
    - iOS G-7 = FAIL

    because Appium 3 is the study-level selected runner and its fallback has been exhausted.

    Do not permit Android merely because its individual smoke passed.

    ## 4. STUDY-LEVEL RUNNER STATUS

    Use the exact study-level status representation already introduced under policy v2, if one exists.

    The terminal state is conceptually:

    `UNRESOLVED_AFTER_FALLBACK_FAILURE`

    Do not invent a conflicting duplicate vocabulary.

    If an ORCHESTRATOR mirror/status field is required for CI, it must be a transcription of the QUALIFIER result and policy consequence, never a substitute for the underlying smoke record.

