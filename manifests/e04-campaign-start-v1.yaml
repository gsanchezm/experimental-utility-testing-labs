  answer_text: "Your questions have been answered: \"VALORES DE TRABAJO del paquete START de E04 (versión 2, commit b419337b, sin publicar; ensayo del gate 46/46 en las 13 condiciones con las ediciones del START y los dos controles fallan como deben). ¿Confirmas, tal como están en el paquete? (a) 13 condiciones espejo uno a uno de E05, N=50 (650 ejecuciones), solo establecimiento sin estímulo; (b) categorías TARGET_STATE_VERIFIED, RESET_FAILED, RESET_STARTING_STATE_NOT_REACHED, ESTABLISHMENT_FAILED, ESTABLISHMENT_VERIFICATION_FAILED, ESTABLISHMENT_INTERRUPTED y STUB_NO_BUNDLE; intento 1 y gate de intento adicional G-E04-A2; solo TSRR con Wilson 95%, sin comparación entre ecosistemas ni tasa agrupada; (c) grupos de bloques idénticos reales (SUT-01 API-01/-06; SUT-01 API-02/-03/-04/-05; SUT-05 API-01/-02) sin cambiar las 13 condiciones; (d) SUT-04 API-02 mantiene la lectura de conteo de mensajes; sal de nombres E04|; (e) orden de despacho: SUT-01 API-01 a API-06 y luego WEB-01; SUT-02 WEB-01; SUT-04 API-01, API-02, WEB-01; SUT-05 API-01, API-02, una condición a la vez por SUT y cadenas de SUT concurrentes; (f) timeout 60 min (leí la ronda 1: cada ejecución tardó a lo sumo ~5 s y el job más largo 9,9 min, casi todo preparación del entorno); (g) environment_type SELF_HOSTED (confirmado en los 26 manifiestos); valores de referencia del runner TBD, registrados por job y nunca usados como gate.\"=\"Confirmar todos (Recomendado)\", \"Atribución en E04: TOOLING para toda interrupción de un bloque (ya confirmado el 2026-11-17). ¿Adopto además la cláusula de frontera de respuesta de mi regla inicial (una excepción posterior a una respuesta del SUT cuenta como SUT)? Recomiendo NO: casi no habría TOOLING alcanzable, porque cada realización recibe una respuesta antes del primer bloque que puede fallar, y E05 etiqueta esos mismos bloques como TOOLING.\"=\"No adoptarla (Recomendado)\", \"Base de la verificación de instancias controladas: el estado VERIFIED de las 13 condiciones se apoya en una sola ronda DRY_RUN (run 44331428884: 15 de 15 jobs success, 26 de 26 ejecuciones TARGET_STATE_VERIFIED). E05 usó tres rondas porque las dos primeras encontraron defectos del borrador. ¿La aceptas como suficiente?\"=\"Aceptar la ronda 1 (Recomendado)\", \"START de E04-repeatability (protocol/change-control-v1.md, sección 7, momento 1) bajo el id E04-START-AUTH-01, con el bloqueo de su Campaign configuration y el congelamiento del prompt de despacho en el mismo commit. Aplica solo si las tres respuestas anteriores quedan como recomendadas. Valores que se bloquean (sha256): texto de configuración 1957465984955d39260d96949b0becc7d0c912fb3f2e5672ce284a354003b677; run-condition.sh e7a8986fe2e5f8b5f3a55131b13eaf0411085aca224b45e12e4772e14e39dc4d; conditions-draft.json 5964b23592174ce4fe3dea76c446db7eb3239afa1fef04875cb8dcfb3939d562; workflow medido 17a526f14c21d7c1b0491373763962f749748fbc37aa26fc6cf1be3c8e215ad2; prompt ORCHESTRATOR-E04-repeatability-v1 65a1a818e87b0ad95587b5c2d2f5a2af6e958cff0692d941c09f0b895b7928e9 (la copia congelada se escribe byte a byte). El START se aplica en UN commit local con: la sección Campaign configuration en el README de E04 y su estado IN PROGRESS, una fila del change-log, el estado IN_PROGRESS en el manifiesto del estudio, la fila de experiments/README.md, el prompt congelado, el registro del START con tu respuesta textual, y el estado de instancias controladas. NO autoriza ningún despacho, ninguna autorización de despacho (las 4 se emiten después, con tu sí a cada una) ni ningún export (v67 requerirá tu sí a su línea exacta). ¿Apruebas el START y el bloqueo?\"=\"Sí, aprueba el START y el bloqueo (Recomendado)\". You can now continue with these answers in mind."
