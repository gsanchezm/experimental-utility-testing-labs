decisions:
- id: HD-E09-A-GLITCH-ACCOUNT-PASSWORD
  question: "where the activation password of a11y_glitch_user comes from (experiments/E09-accessibility/executor/IMPLEMENTATION-NOTES.md, section 3, HD-E09-A)"
  chosen: "autorizo la lectura (message 1, item 1)"
  effect: "executor/executor/config.py ACCOUNTS now holds pizza123 for a11y_glitch_user, with the source (README at the pinned commit, blob sha256 9c49c616e0e2fb44f7d99adbf7c09653c66437fecbc62cd9038bc6f1cab53348) in the comment above it; run-condition.sh carries the re-embedded digests (only executor/config.py changed); the notes and the README of the executor record HD-E09-A as resolved. The tests of the executor ran 59, 0 failures, 15 skipped (no YAML or browser library installed). The gate regex of the measured workflow for a locked password passes on the real file. The environment-verification DRY_RUN is no longer blocked by this item; its own exact line, and the other E09 decisions HD-1 to HD-15 and HD-17 to HD-20, still need their own approval. No run, dispatch, START or freeze."
- id: D-03-E05-RESIDUAL-STATE
  question: "how the state that the reset does not clear (SUT-01 orders; SUT-04 bookings created by an accepted stimulus) is controlled in E05 (experiments/E05-determinism/design-brief-draft.md, sections 4.4 and 11, D-03)"
  chosen: "b para SUT-01, a para el resto (Recomendado)"
  effect: "SUT-01: a process-restart reset between attempts for the conditions that create orders (SUT01-API-01, SUT01-API-06, SUT01-WEB-01), a new realization that E03 does not contain and that the E05 executor has to implement and verify before any START; order identifiers stay excluded and the starting-state check does not depend on the order count (brief, section 4.4). SUT-04 and the other surfaces: stimuli that do not persist only (rejected-only for the booking conditions), no extended reset. Which draft conditions of SUT-04 stay as written and which are restricted or dropped is settled when the configuration is written, not here. The process-restart realization and its verification are preparation work and need no approval; the configuration lock, the START and every dispatch still do."
- id: D-09-E05-NO-BUNDLE-ATTEMPTS
  question: "how an attempt that fails before the executor runs, and so leaves no run manifest, is counted in E05 (brief, section 5 and 11, D-09)"
  chosen: "a: intento interrumpido dentro de T, con registro stub (Recomendado)"
  effect: "option (a). Such an attempt is an interrupted attempt in T, recorded by a stub record with its reason and its own attempt index (protocol/repeatability-determinism-v1.md, section 5, rules 5 and 6); it counts against TSRR and E2E-ROR and never against CEOR. The stub record format, and how it is told apart from a bundle in the import, are fixed in the E05 configuration and executor, which are not written yet."
- id: D-16B-H3-INTERACTION-OF-TOOLING-INTERRUPTIONS
  question: "whether a TOOLING-labeled interruption after the starting state is established counts as an INTERRUPTED_ category (brief, section 6, rule 6, D-16b)"
  chosen: "Contarla y reportarla con su etiqueta (Recomendado)"
  effect: "a TOOLING interruption after establishment counts as an INTERRUPTED_ category in S and in H(Y) (protocol section 5, rules 5 and 6) and is reported with its label in the secondary table; a tooling-labeled unexpected response stays an unexpected outcome. No attempt leaves any denominator. With D-16 option B of round 1 this completes the attribution rule that the configurations of E05 and E04 lock at their START; issue (xix) stays DEFERRED-BEFORE-CAMPAIGN until a configuration locks it. No protocol change."
