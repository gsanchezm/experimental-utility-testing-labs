  (experiments/E01-capability-audit/README.md, "Objective"), and no raw-data/E01-capability-audit/
  directory exists or was created by this record. No such directory is invented here.
statement: >
  From this freeze timestamp, E01's scientific inputs and results -- the six audits/<SUT>/ directories, the
  six derived-data/adjudication/<SUT>/adjudication.json first-run outputs, the two human rulings
  (E01-HR-01, E01-HR-02), the final corrected adjudicated matrix, and the H1 confirmatory result -- are
  closed to ordinary modification (protocol/change-control-v1.md, section 7). Any further change to any of
  them follows protocol/change-control-v1.md, section 5, in full (new version file, rationale, affected
  campaigns, change-log row), the same procedure already used for PROTO-U01 through PROTO-U06. This freeze
  does not authorize E02 or any later campaign (AGENT-INSTRUCTIONS.md, rule 15); it also does not perform, and is not,
  H2-H5 analysis.
notes: |
  E01 is an audit campaign with no repeated-execution sample size (experiments/E01-capability-audit/README.md,
  "Sample size per condition": N/A) -- the freeze trigger here is "every planned run... executed" read
  against E01's own campaign-configuration definition of what a "run" is: one audit per ecosystem (6),
  covering all nine modalities each (54 cells total), all now complete and adjudicated.
  Deferred issues (xviii) and (xix) do not apply to E01 (manifests/protocol-freeze-v1.yaml, deferred_issues)
  and are unaffected by this freeze. PROTO-U02 (audit_status: ADJUDICATED write authority) remains
  OPEN -- deferred and non-blocking; unaffected by this freeze.
  No campaign freeze tag was created: the one existing repository tag (eus-2026-001-protocol-v1-pre-data)
  is for the protocol freeze (protocol/change-control-v1.md, section 6), a different, once-per-study
  milestone; a single instance of tagging a different kind of freeze is not an established convention for
  per-campaign freezes, so none is invented here.
  E02-E12 remain NOT_STARTED. No campaign-configuration record exists yet for any of them
  (experiments/<campaign-id>/README.md carries only its placeholder). experiments/scenario-mappings/ does
  not exist at all (not merely empty); FROZEN mapping records are a hard prerequisite for E02-E07 before
  execution (experiments/README.md, "Common rules for all campaigns"), independent of this freeze.
