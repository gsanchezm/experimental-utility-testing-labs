    exact_text: "Your questions have been answered: \"Resultado de la ronda 1 de DRY_RUN de E10 (corrida 46148003422, duró 3 minutos; todo es DRY_RUN, nada medido, ninguna expectativa, vista, elemento ni piso se cambia). Trabajos: SUT-01, SUT-03 IMAGE y SUT-03 SHIFT en verde; SUT-02 en rojo. Observado: (1) SUT-03 IMAGE y SHIFT corrieron completos (3/3 cada uno, con los pisos provisionales); las capturas de A y A2 coinciden píxel a píxel (R = 0), un src vacío se ve como ícono de imagen rota con el texto alternativo, #shift-target mide 710×0 a los 2078 ms y 710×300 a los 5579 ms. (2) SUT-02 es un defecto del arnés: el clic en el ícono de hamburguesa lo intercepta un botón invisible (react-burger-menu-btn); la vista del menú abierto se interrumpió (el arreglo es hacer clic en ese botón; no cambia vistas ni elementos). La perturbación de SUT-02 sí es visible: el contenedor del carrito se mueve de (1220,10) a (1034,39), el ícono rotado 3° pasa de 20×20 a 21×21 px y el botón de checkout se mueve. (3) SUT-01: en 1280×800 las 3 imágenes de la primera fila caben (y 513–697) pero los precios quedan DEBAJO del borde (y 803–831), así que ningún precio cae entero en la primera pantalla y la ejecución sale INCONCLUSIVE; es un hecho de diseño de la página, independiente del estado B. Además, en B la imagen de reemplazo de Wikimedia falló (net::ERR_BLOCKED_BY_ORB, el manejador onError de la propia SUT reintenta 46 veces) y la imagen rota (broken-image-url.com) no resuelve: B queda con círculos en blanco, y las 12 imágenes estándar de A cargaron bien (E10-D-12: el estado de imagen de B se registra, no invalida). Tamaño: ~0.15–1.2 MB por ejecución (proyección ~175 MB para las 200); duración ~3–30 s por ejecución. Versiones: Playwright 1.63.0, Chromium 153.0.8010.12, Node.js v24.22.3 en los cuatro trabajos. ¿Qué viewport uso, dado que los precios de SUT-01 no caben en 1280×800? (Las rondas que cuentan para la calibración son las posteriores al hash final, así que cambiarlo ahora no cuesta rondas extra: hay que repetirlas por la corrección de SUT-02.)\"=\"1280×900 para toda la campaña (Recomendada)\", \"¿Qué autorizas ahora (marca las que apliquen)? Todo se queda en commits locales; publicar, y cada nueva ronda de DRY_RUN, son preguntas aparte con su línea exacta. Próximos pasos si lo autorizas: ronda 2 y ronda 3 (3 ejecuciones cada una) bajo el hash final para tener ≥ 6 pares baseline por vista, luego el registro de calibración (los pisos 0.0005 y 0.01 si todos los pares siguen en 0) y una ronda de confirmación; después te propongo D-19 (presupuestos de tiempo: ejecuciones de 3–30 s, trabajos de 1.5–3 min con 3 ejecuciones) y D-20 (conservar todas las imágenes, ~175 MB). Ningún START sin tu sí.\"=\"Corregir el ejecutor (clic de SUT-02 + viewport elegido), Construir en local el export v96 con esas correcciones (sin push)\". You can now continue with these answers in mind."
