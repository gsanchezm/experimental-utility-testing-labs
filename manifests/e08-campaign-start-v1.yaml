  answer_text: "Your questions have been answered: \"E08-D-13, presupuestos de tiempo de E08. Hoy: watchdog del ejecutor 420 s por ejecución y límite de 120 min para el job medido. La ronda 1 de DRY_RUN observó unos 7 s (SUT-01), 14 s (SUT-02) y 25 s (SUT-03) por ejecución; las 50 ejecuciones de la condición más lenta tardan unos 21 min, así que son techos, no parámetros medidos. Cambiar cualquiera de los dos cambia el hash de implementación o el workflow, exige otra ronda DRY_RUN y una versión 2 del paquete de START. ¿Los mantengo?\"=\"Mantener (Recomendada)\", \"START de la campaña E08-performance (protocol/change-control-v1.md, sección 7, momento 1). Qué haría yo si dices que sí, todo en el repositorio canónico y sin despachar nada: (1) bloqueo el texto de 'Campaign configuration' (experiments/E08-performance/campaign-configuration-start-text-draft.md, sha256 dd95d4b2…) como sección de experiments/E08-performance/README.md: 4 condiciones web (SUT-01 una, SUT-02 una, SUT-03 dos), N = 50 cada una, 200 ejecuciones, intento 1, hipótesis H5 descriptiva, ejecutor da24b132…, esquema v2 9a86cf37…, archivo de condiciones e4aaf356…, workflow medido 32696faf…, commits fijados de SUT-01 9ca37674…, SUT-02 60fdd634…, SUT-03 7ab934d7…, Playwright 1.63.0 y sonda e08-probe-v1; (2) escribo manifests/e08-campaign-start-v1.yaml con el id E08-START-AUTH-01 (propuesto por mí; al aprobarlo lo emites tú); (3) congelo prompts/frozen/ORCHESTRATOR-E08-performance-v1.md como copia idéntica del prompt de trabajo (sha256 eaa751fc…); (4) agrego la fila 'campaign NOT_STARTED -> IN_PROGRESS' en protocol/CHANGELOG.md y paso E08 a IN_PROGRESS en manifests/study-manifest.yaml. El START no autoriza ningún despacho: las autorizaciones de SUT-01, SUT-02 y SUT-03, cada despacho, el freeze y el análisis H5 son preguntas aparte. Ensayo del gate del workflow medido sobre una copia temporal con esas ediciones: 47 de 47 gates en cada una de las 4 condiciones; sobre el árbol actual falla cerrado; 6 mutaciones fallan donde deben; 58 pruebas del ejecutor pasan. Te divulgo tres cosas: (a) solo hubo UNA ronda de DRY_RUN (E09 tuvo tres, E11 dos), limpia en las 4 condiciones; si prefieres otra antes del START, di que no; (b) el workflow medido que se bloquearía difiere del público (export v90) por una sola cadena de entorno (TIMEOUT_POLICY) y GitHub aún no lo ha leído; se verá en el push del export; (c) corregí dentro de un commit nuevo (305c73a18) el paquete aún no publicado (quité la cita de una ruta local y narrow de una aserción de prueba) en vez de crear un paquete v2. Solo aplica si en la pregunta anterior eliges 'Mantener'. ¿Aplico el START?\"=\"Sí, aplica el START (Recomendada)\", \"Export público v91: ¿construyo ahora en local el export v91 y lo verifico, sin push? Contendría el estado START de E08 (si lo aplicas), el workflow medido corregido, el registro de la ronda 1, el estado VERIFIED de las 4 condiciones y los registros de decisiones. El push del v91 es otra pregunta con su línea exacta y espera tu sí; después vendrían las tres autorizaciones de despacho, que también son solo tuyas.\"=\"Sí, construye v91 en local (Recomendada)\". You can now continue with these answers in mind."
