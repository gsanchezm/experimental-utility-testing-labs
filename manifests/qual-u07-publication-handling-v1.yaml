instruction_verbatim: |
  EUS-2026-001 — OP-PUB-01 — IMPLEMENT THE QUAL-U07 PUBLICATION-HYGIENE DECISION, OPTION A (PUBLICATION-ONLY TRANSFORMATION; NO EXPORT)

  Roles: ORCHESTRATOR (PUBLIC-EXPORT-MANIFEST.yaml, the export tooling record, .github/workflows/e03-validate.yml under E03-CI-WRITE-AUTH-01, status files) and QUALIFIER-MOBILE-01 (the QUAL-U07 row of qualification/unresolved.md), in separate commits. Classification: publication-only transformation definition and validation adaptation; the human decision on the publication strategy is given below. It authorizes no export, push, dispatch, or change to any canonical evidence byte. Two phases with the reviewer's audit between them; serialize on a clean tracked tree after OP-U16-01 and OP-PREP-02.

  HUMAN DECISION
  Given by gilbertosanchez, human research lead, to the study's independent orchestration reviewer: at 2026-10-03T00:18:40Z "Ya pegué los textos al executor, y de la opción, vamos por: opción A"; the reviewer asked which option was meant (the QUAL-U07 publication option A — "log de iOS redactado + zip iOS re-empaquetado y saneado de forma determinista" — or the governance option A) and at 2026-10-03T00:19:41Z he answered "Ambas: A y A". Decision relayed: QUAL-U07 is resolved by option A of the decision package manifests/mobile-runner-policy-v3-amendment-proposal-v3.yaml ("transformed extracted files + deterministic sanitized archive"): the transformed appium-server.log and a deterministically re-packed iOS archive whose appium-server.log member is transformed identically are exported; the Android archive is exported UNCHANGED; canonical files and archives stay byte-identical (publication-only).

  WHAT TO PREPARE (Phase A, no commit)
  1. PUBLIC-EXPORT-MANIFEST.yaml (ORCHESTRATOR): define the publication-only transformation class QUALIFICATION_HOST_PATH_REDACTION — deterministic replacement of the GitHub-hosted runner home-path prefix in the 56 lines of qualification/compatibility-smoke/formal/APPIUM3-COMPAT-SMOKE-AUTH-02/SUT-02-ios/appium-server.log and in the one quoted line of manifests/appium3-compat-smoke-auth-02-postrun-recording-v1.yaml by a fixed marker (replay the frozen harness scrub rule as the decision package's dry run did; record the rule, the marker, and the expected canonical and exported sha256 of both files) — and the class DETERMINISTIC_SANITIZED_ARCHIVE for github-artifact/E03-COMPATIBILITY_SMOKE-SUT-02-ios-run36539790536-a1.zip: a re-packed archive with the same member names and order as the canonical archive, the transformed log as its appium-server.log member, every other member byte-identical, fixed timestamps, permissions, compression method and level (state them), re-derivable by a verifier; record the canonical archive digest (GitHub digest) and the exported archive sha256; the Android archive and every other formal file stay UNCHANGED. Record the decision provenance (verbatim texts, timestamps, sha256; given to the independent orchestration reviewer and relayed) in a new record manifests/qual-u07-publication-handling-v1.yaml modeled on the QUAL-U03 handling (manifests/pre-publication-corrections-v1.yaml), and reference it from public-export-v1.yaml.
  2. The export builder: locate the current builder (the export procedure and its stored script in the orchestration memory of the study, "Public export procedure + scripts"; if it is not in the repository, say where it lives and keep the implementation in the untracked orchestration layer or the scratchpad, never in the tracked tree unless the export procedure already tracks it); add the two classes; prove determinism by building the sanitized archive twice from the canonical archive and comparing sha256; prove that the exported log equals the transform of the canonical log and that the transformed tree contains no `/Users/` or `/home/` string in any file (run the validation hygiene scan over a scratch copy of the would-be public tree).
  3. .github/workflows/e03-validate.yml (ORCHESTRATOR, E03-CI-WRITE-AUTH-01): adapt the step "Assert the imported compatibility-smoke evidence is stored byte-exact (QUAL-U05)" so that it keeps the full byte-exact checks on a canonical checkout (no PUBLIC-EXPORT-MANIFEST.yaml) and, on a public checkout, bridges through the export manifest: a file listed under QUALIFICATION_HOST_PATH_REDACTION passes when its canonical_sha256 equals the IMPORT-RECORD sha256 and its on-disk sha256 equals the manifest's exported_sha256; an archive listed under DETERMINISTIC_SANITIZED_ARCHIVE passes when the manifest's canonical digest equals the IMPORT-RECORD github_digest, its on-disk sha256 equals the exported sha256, and every member equals the exported extracted file byte for byte; everything else stays byte-exact as today. Keep the step fail-closed on any missing manifest entry. Run actionlint (download it into the scratchpad as before) and the step's Python on (a) the canonical tree and (b) a scratch public-like tree built by the patched builder with a fixture manifest; report both.
  4. qualification/unresolved.md (QUALIFIER-MOBILE-01, own commit): QUAL-U07 row — append the human decision (option A, 2026-10-03, relayed) and its date; status "RESOLVED as to publication handling (option A; …); canonical bytes unchanged; applied by the next authorized export"; problem text unchanged.
  5. Status (ORCHESTRATOR): AGENT-INSTRUCTIONS.md "Current phase" text where QUAL-U07 is called OPEN (allowed under the standing clause: mirrors the committed row); README.md; manifests/README.md Files row for the record; study-manifest note; protocol/README.md escalation counts only if they list QUAL rows; experiments/E03-resetability/README.md if it names QUAL-U07. Report, do not fix: anything else stale.

  CHECKS: both YAML parsers; git diff --check; the proofs of items 2 and 3; hygiene scan over every touched file and over the scratch public-like tree; sha256 of every formal artifact under qualification/compatibility-smoke/formal/** unchanged (list them); no canonical evidence byte changed. Phase A return and HOLD: git status, diffs, the recorded hashes (canonical and exported) for the two files and the archive, the determinism proof, the validation-step results on both trees, actionlint, surprises, what you did not verify.

  PHASE B — only after "OP-PUB-01 PHASE A AUDIT: PASSED": commits in this order — ORCHESTRATOR (public-export-v1.yaml, the record, the validate workflow), QUALIFIER (the QUAL-U07 row), ORCHESTRATOR status; explicit paths, existing identity, no trailers, no push.

  NOT AUTHORIZED: export v30 or any export (a separate explicit human authorization), push, dispatch, any change to a canonical evidence byte, any change to the smoke workflow, G-7, the harness, locks or authorizations.
