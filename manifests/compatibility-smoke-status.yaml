# manifests/compatibility-smoke-status.yaml
# Machine-readable ORCHESTRATOR mirror of the per-SUT x platform compatibility-smoke results of
# protocol/mobile-runner-policy-v2.md, section 9 (v1 AMENDED 2026-09-26; one smoke per mobile-capable ecosystem x
# platform, with the selected runner). Created 2026-09-24 (PROTO-U15) so that gate G-7 of .github/workflows/e03-measured-execution.yml can check
# the smoke of a mobile condition's exact SUT, platform, and selected runner.
#
# Source of truth: the QUALIFIER-MOBILE-01 records under qualification/compatibility-smoke/ (the "Smoke records" table
# of qualification/compatibility-smoke/README.md: one row per ecosystem x platform, result PASS / FAIL_RUNNER /
# NOT_EXECUTED). This file only TRANSCRIBES status and provenance from those records and points back to them. It defines
# no smoke criterion, procedure, or result vocabulary of its own. NOT_STARTED means that no smoke has been executed for
# the entry. An entry is changed only after QUALIFIER-MOBILE-01 has recorded an executed smoke there, under a separate
# explicit human authorization, and only by transcription.
#
# Transcription rule (documented 2026-09-24 with the preparation of APPIUM3-COMPAT-SMOKE-AUTH-01, then PREPARED, NOT
# ISSUED; manifests/appium3-compat-smoke-preparation-v1.yaml). Only after QUALIFIER-MOBILE-01 has produced a valid
# executed smoke record -- a filled row of the README "Smoke records" table, backed by that platform's imported record
# under qualification/compatibility-smoke/formal/<authorization id>/ -- may the ORCHESTRATOR mirror that exact result into
# the matching entry. No mirror value may precede its QUALIFIER source observation; nothing is inferred or completed. Each
# platform entry is transcribed from its own row only: an Android result never fills the iOS entry, nor the reverse. A row
# whose result the QUALIFIER left unfilled (a stop that is none of PASS / FAIL_RUNNER / NOT_EXECUTED) is not transcribed.
# Field mapping: result = the row's result cell; runner_version = the observed Appium core version as its first
# whitespace-separated token (for example "3.7.0 appium-uiautomator2-driver 8.7.0"), because G-7 compares that first
# token with the selected pin; qualifier_record = qualification/compatibility-smoke/README.md; executed_at = the row's
# timestamp; authorization_id = the executing authorization id; transcribed_by / transcribed_at = ORCHESTRATOR and the
# transcription date. The ORCHESTRATOR never edits the QUALIFIER record, and preparation never changes any value below.
# Under policy v2 (2026-09-26) the entry's result must equal the pointed README row's result cell for the same SUT and
# platform (a NOT_EXECUTED or FAIL_RUNNER row never becomes PASS here; e03-validate.yml asserts it); a FAIL_RUNNER of the
# selected Appium 3 is transcribed together with the study-level status UNRESOLVED_AFTER_FALLBACK_FAILURE in
# manifests/toolchain-manifest.yaml (mobile_runner_selection.mobile_runner_status).
#
# Gate G-7 admits an ANDROID or IOS condition only if exactly one entry matches the condition's SUT, platform, and the
# selected runner, that entry's result is PASS with runner_version equal to the selected runner's pin, and its
# qualifier_record (a file under qualification/compatibility-smoke/) holds a PASS row for the same SUT and platform
# whose runner-version cell contains that pin. An entry for another SUT, another platform, or another runner never
# satisfies a condition. The study-level compatibility_smoke_status fields of manifests/toolchain-manifest.yaml are
# convenience summaries only and are not read by G-7.
#
# Editable by ORCHESTRATOR only. Unknown values are null, never a guess.
record_class: COMPATIBILITY_SMOKE_STATUS_MIRROR
study_id: EUS-2026-001
governing_policy: protocol/mobile-runner-policy-v2.md  # section 9; FROZEN-PRE-DATA (v1 AMENDED 2026-09-26)
source_of_truth: qualification/compatibility-smoke/README.md  # QUALIFIER-MOBILE-01 workspace
result_vocabulary: [NOT_STARTED, PASS, FAIL_RUNNER, NOT_EXECUTED]  # PASS, FAIL_RUNNER, NOT_EXECUTED as defined by the source template; NOT_STARTED = not executed yet
selected_runner_at_creation: "Appium 3"  # manifests/toolchain-manifest.yaml mobile_runner_selection (frozen section 8 switch, 2026-09-24)
scope_note: "entries exist for the ecosystem x platform pairs required by the current E03-resetability configuration (the two SUT-02 mobile conditions); entries for other mobile-capable ecosystems are added when a campaign requires them"
entries:
  - sut_id: SUT-02
    platform: android
    runner: "Appium 3"
    runner_version: "3.7.0 appium-uiautomator2-driver 8.7.0"  # observed core first (README Smoke records row of AUTH-02: Appium 3.7.0 + appium-uiautomator2-driver 8.7.0)
    result: PASS  # transcribed 2026-09-29 from the README Smoke records row of APPIUM3-COMPAT-SMOKE-AUTH-02 (recorded by QUALIFIER-MOBILE-01, commit 9128c97); satisfies the SUT-02 android compatibility requirement only; it does not keep the study mobile runner admissible after the fallback exhaustion (policy v2, 9.5). Previous value: NOT_EXECUTED (HARNESS_ORCHESTRATION) under APPIUM3-COMPAT-SMOKE-AUTH-01, executed_at 2026-09-27T18:30:49.040Z, transcribed 2026-09-27 (commit 1300cfd); that record is preserved unchanged in the README
    qualifier_record: qualification/compatibility-smoke/README.md  # "Smoke records": the last SUT-02 android row (AUTH-02, PASS), after the preserved AUTH-01 row
    executed_at: "2026-09-29T08:00:12.927Z"  # run 36539790536, attempt 1
    authorization_id: APPIUM3-COMPAT-SMOKE-AUTH-02
    transcribed_by: ORCHESTRATOR
    transcribed_at: "2026-09-29"
    e03_condition: E03-CS001-SUT02-ANDROID  # blocked nevertheless: the study-level mobile-runner status is UNRESOLVED_AFTER_FALLBACK_FAILURE (G-7)
  - sut_id: SUT-02
    platform: ios
    runner: "Appium 3"
    runner_version: "3.7.0 appium-xcuitest-driver 12.13.2"  # observed core first (README Smoke records row of AUTH-02: Appium 3.7.0 + appium-xcuitest-driver 12.13.2)
    result: FAIL_RUNNER  # transcribed 2026-09-29 from the README Smoke records row of APPIUM3-COMPAT-SMOKE-AUTH-02 (recorded by QUALIFIER-MOBILE-01, commit 9128c97): conservative tie-break of policy v2, 9.4 (attribution uncertain; not a demonstrated runner root cause); a FAIL_RUNNER of the selected Appium 3 exhausts the fallback (9.5): mobile_runner_status UNRESOLVED_AFTER_FALLBACK_FAILURE in manifests/toolchain-manifest.yaml. Previous value: NOT_STARTED
    qualifier_record: qualification/compatibility-smoke/README.md  # "Smoke records" row SUT-02 ios (AUTH-02); attribution in formal/APPIUM3-COMPAT-SMOKE-AUTH-02/ATTRIBUTION-SUT-02-ios.yaml
    executed_at: "2026-09-29T08:02:54.548Z"  # run 36539790536, attempt 1
    authorization_id: APPIUM3-COMPAT-SMOKE-AUTH-02
    transcribed_by: ORCHESTRATOR
    transcribed_at: "2026-09-29"
    e03_condition: E03-CS001-SUT02-IOS
