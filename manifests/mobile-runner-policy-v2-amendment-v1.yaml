human_instruction:
  title: RESOLVE PROTO-U17 THROUGH MOBILE-RUNNER-POLICY-V2 AND RE-LOCK THE APPIUM 3 COMPATIBILITY SMOKE
  issued_by: gilbertosanchez (human research lead; first-person instruction)
  approval_date: "2026-09-25"
  received: as a direct first-person message in the ORCHESTRATOR's working session, received on 2026-09-25 (session clock); recorded on 2026-09-26 (UTC)
  authorizes: [create and freeze protocol/mobile-runner-policy-v2.md as the successor of v1, record the post-data amendment under protocol/change-control-v1.md, resolve PROTO-U17 by the stated rules, adapt the prepared Appium 3 compatibility-smoke implementation to v2, create a successor compatibility-smoke implementation lock, update the still-PREPARED smoke authorization and WORKING prompt to reference only the new locked implementation]
  does_not_authorize: [compatibility-smoke execution, issuance of APPIUM3-COMPAT-SMOKE-AUTH-01, workflow_dispatch, Appium execution, SUT launch, E03 START, E03 measured execution, publication or push (unless validation absolutely requires a public snapshot -- it does not)]
  verbatim_sha256: 6aa7dcd9e72f9b062439568003e4306d0652724340d4a73cc760f6ee69fe211a
  verbatim: |
    EUS-2026-001 — RESOLVE PROTO-U17 THROUGH MOBILE-RUNNER-POLICY-V2 AND RE-LOCK THE APPIUM 3 COMPATIBILITY SMOKE

    I, gilbertosanchez, human research lead for EUS-2026-001, explicitly approve the following post-data protocol amendment decision for PROTO-U17.

    This instruction authorizes:

    1. creating and freezing protocol/mobile-runner-policy-v2.md as the successor of v1;
    2. recording the post-data amendment under protocol/change-control-v1.md;
    3. resolving PROTO-U17 according to the exact rules below;
    4. adapting the prepared Appium 3 compatibility-smoke implementation to v2;
    5. creating a successor compatibility-smoke implementation lock;
    6. updating the still-PREPARED smoke authorization and WORKING prompt so they reference only the new locked implementation.

    This instruction DOES NOT authorize:

    * compatibility-smoke execution;
    * issuance of APPIUM3-COMPAT-SMOKE-AUTH-01;
    * workflow_dispatch;
    * Appium execution;
    * SUT launch;
    * E03 START;
    * E03 measured execution.

    No compatibility-smoke outcome has yet been observed.

    1. CHANGE-CONTROL CLASSIFICATION

    data_collection_started is already true from E01.

    PROTO-U17 affects classification and consequences of compatibility-smoke failures.

    It is therefore SUBSTANTIVE.

    Do NOT resolve it as:

    * a non-substantive correction;
    * an informal README clarification;
    * an unresolved-log-only ruling.

    Create:

    protocol/mobile-runner-policy-v2.md

    The v1 file remains historical.

    Follow protocol/change-control-v1.md exactly for a post-data successor.

    2. PRIOR DATA VALIDITY

    The amendment changes ONLY compatibility-smoke handling in Section 9 and any directly necessary cross-reference/status wording.

    Explicitly record:

    * E01 Capability Audit: unaffected; all collected data/results remain valid.
    * H1 analysis: unaffected.
    * Mobilewright formal qualification AUTH-03: unaffected and remains valid under the v1 qualification criteria used for that execution.
    * No compatibility-smoke data exists under v1.
    * E03 is NOT_STARTED.
    * No experimental data requires recollection.

    Do NOT reinterpret the Mobilewright qualification through v2.

    3. PRESERVE SECTIONS 1–8 IN SUBSTANCE

    The following remain unchanged in methodological substance:

    * Mobilewright primary-candidate role;
    * Appium 3 fallback;
    * Appium 2 prohibition;
    * qualification SUT;
    * MQ1–MQ3;
    * MC-01…MC-10;
    * qualification N;
    * §7 qualification exclusions/attribution;
    * qualification pass gate;
    * §8 Mobilewright → Appium 3 switch that already selected Appium 3.

    The reason for v2 is the previously undefined terminal/failure behavior of §9 once Appium 3 itself is the selected fallback runner.

    4. SECTION 9 RESULT VOCABULARY REMAINS

    Per SUT × platform, compatibility-smoke result vocabulary remains:

    PASS

    FAIL_RUNNER

    NOT_EXECUTED

    Do not add a fourth execution-result value merely to solve PROTO-U17.

    Study-level state may separately describe that no acceptable mobile runner remains after fallback failure.

    5. PASS

    A SUT × platform smoke is PASS only when one clean execution using the selected runner successfully completes all frozen Section 9 capabilities:

    * MC-01 install and launch;
    * MC-02 stable-identifier location;
    * MC-06 navigation;
    * MC-04 native-control interaction;
    * MC-08 UI-state read;
    * MC-10 artifact capture.

    No change to this criterion.

    6. NOT_EXECUTED — EXPANDED EXPLICIT ATTRIBUTION

    A smoke is NOT_EXECUTED only when artifacts positively demonstrate that the selected runner was not fairly exercised because execution was prevented by a cause outside the runner.

    Allowed demonstrated causes:

    SUT_BUILD

    The pinned build cannot be obtained, verified, installed, or is not executable on the predeclared compatible target despite the pinned artifact provenance.

    This preserves the existing v1 rule.

    INFRASTRUCTURE

    Examples:

    * emulator/simulator fails to boot or crashes before the runner is exercised;
    * CI host/resource failure;
    * network or package-registry outage;
    * platform service outage;
    * host tool outside the selected runner fails before the selected runner can exercise the smoke.

    HARNESS_ORCHESTRATION

    A defect in study-authored workflow, shell script, WebDriver client/harness, artifact plumbing, or configuration prevents the selected runner from being fairly exercised.

    This classification requires positive artifacts demonstrating the harness/orchestration defect.

    A mere failed Appium command is NOT enough.

    Every NOT_EXECUTED record must include:

    * SUT;
    * platform;
    * timestamp;
    * failed phase;
    * attributed category;
    * concrete description;
    * artifact pointers;
    * recording role.

    If those artifacts do not demonstrate an allowed external cause, the attempt is NOT eligible for NOT_EXECUTED.

    7. RUNNER / TOOLCHAIN FAILURES

    FAIL_RUNNER applies when the failure belongs to the selected Appium 3 execution stack while attempting the frozen smoke capabilities.

    The selected Appium execution stack includes the pinned:

    * Appium 3 core;
    * platform driver;
    * WebDriver protocol behavior implemented by that runner stack.

    Examples include:

    * Appium server/driver cannot establish the required session on the otherwise valid pinned substrate/build;
    * required stable locator operation is unsupported or fails;
    * required navigation cannot be driven;
    * required native control cannot be driven;
    * required UI state cannot be read;
    * runner-side artifact capture required by MC-10 cannot be completed.

    A dependency/version incompatibility inside the pinned Appium execution stack is runner/toolchain evidence, not automatically infrastructure.

    8. CONSERVATIVE TIE-BREAK

    When attribution remains uncertain after inspecting the preserved artifacts:

    FAIL_RUNNER

    not NOT_EXECUTED.

    The study must never use uncertainty to exclude an unfavorable runner outcome.

    Record this rule explicitly in v2.

    9. EFFECT OF NOT_EXECUTED

    NOT_EXECUTED:

    * does NOT pass the smoke;
    * does NOT fail the selected runner;
    * does NOT trigger selection of another runner;
    * leaves that exact SUT × platform compatibility requirement unresolved;
    * therefore leaves G-7 blocked for that condition.

    A replacement attempt is NOT automatic.

    A further attempt requires:

    * preservation of the prior NOT_EXECUTED record/artifacts;
    * correction of the demonstrated external cause;
    * a new explicit human authorization.

    No GitHub-native rerun substitutes for that authorization.

    If correction changes execution-critical harness/workflow/code, create and approve a successor implementation lock before the new attempt.

    10. EFFECT OF FAIL_RUNNER WHILE MOBILEWRIGHT IS SELECTED

    Preserve the existing conceptual Section 9 behavior:

    If a compatibility smoke under Mobilewright returns FAIL_RUNNER, frozen §8 selects Appium 3 as fallback.

    Any Appium execution still requires its own proper preparation and authorization.

    This clause is historical/general and does not change the already-completed AUTH-03 selection.

    11. EFFECT OF FAIL_RUNNER WHILE APPIUM 3 IS SELECTED

    This resolves the core PROTO-U17 gap.

    If Appium 3 is already the selected runner under the §8 fallback and a compatibility smoke returns FAIL_RUNNER:

    * the fallback is EXHAUSTED;
    * do NOT apply §8 recursively to Appium 3;
    * do NOT execute Appium 3 again merely to seek another result;
    * do NOT introduce Appium 2;
    * do NOT silently select any other runner.

    Record study-level state equivalent to:

    MOBILE_RUNNER_STATUS: UNRESOLVED_AFTER_FALLBACK_FAILURE

    The affected SUT × platform smoke remains:

    FAIL_RUNNER

    Any experimental campaign requiring mobile execution remains blocked from START/measurement until a new explicit protocol amendment decides the mobile-runner strategy.

    The failure does not alter E01 evidence or capability scores and is not evidence about the SUT.

    12. PER-PLATFORM INDEPENDENCE

    Android and iOS smoke observations remain distinct.

    Example:

    * Android PASS does not make iOS PASS.
    * iOS PASS does not make Android PASS.
    * Android NOT_EXECUTED does not alter iOS.
    * Android FAIL_RUNNER is still sufficient to exhaust Appium 3 as a study-wide selected runner under the rule above because Section 9 defines a runner-caused mandatory-capability failure for any ecosystem in the experimental SUT set as a study-runner failure.

    Do not average, merge, or compensate outcomes.

    13. AFFECTED CAMPAIGNS

    In the post-data amendment record, state explicitly:

    Already collected:

    * E01: unaffected; remains valid.
    * Mobilewright qualification: unaffected; remains valid under the v1 rules used when executed.

    Not yet started:

    * E03: affected prospectively because it contains SUT-02 Android/iOS conditions whose G-7 readiness depends on compatibility smoke.
    * E06/E07 and any future campaign exercising Android Native or iOS Native: affected prospectively.

    No existing raw experimental data requires re-analysis or recollection.

    14. VERSION STATES

    Follow the exact lifecycle required by change-control-v1.

    Expected conceptual outcome:

    mobile-runner-policy-v1.md:
    historical predecessor, marked AMENDED only in the narrow header manner allowed by change control, with successor pointer.

    mobile-runner-policy-v2.md:
    new successor containing the full policy plus the PROTO-U17 Section 9 amendment.

    Because no data has been collected under v2 yet, freeze the exact approved v2 content according to the repository’s versioning semantics and record the human approval from this instruction.

    Do not edit v1’s methodological body.

    15. RESOLVE PROTO-U17

    Update the unresolved record using its existing append-only/edit rules.

    PROTO-U17 must become RESOLVED with:

    * human decision date;
    * reference to mobile-runner-policy-v2;
    * exact rationale;
    * statement that no compatibility-smoke outcome existed when the decision was made.

    Do not erase the original problem statement.

    16. REASSESS THE PREPARED SMOKE IMPLEMENTATION

    The currently prepared implementation was locked against v1 before PROTO-U17 was resolved.

    Do NOT execute it as-is.

    Review these canonical preparation commits:

    * 71a3195
    * 7da7b10
    * 62ff894
    * 80604f6

    Preserve them as historical pre-amendment preparation.

    Update only what is required to make the future smoke implement v2 exactly.

    In particular, the harness/workflow/result-writing logic must implement:

    * PASS;
    * FAIL_RUNNER;
    * NOT_EXECUTED with explicit cause;
    * conservative uncertain → FAIL_RUNNER;
    * no automatic replacement;
    * no Appium 3 recursive fallback;
    * no automatic second execution.

    17. HARNESS DEFECT HANDLING

    The study-authored harness/wd.mjs and smoke orchestration are not automatically treated as Appium.

    If preserved artifacts positively establish that a defect in this study-authored layer prevented fair Appium exercise:

    result:

    NOT_EXECUTED

    cause:

    HARNESS_ORCHESTRATION

    Then STOP.

    Do not patch and continue inside the same authorized smoke.

    A later corrected attempt requires:

    * corrected harness;
    * new lock;
    * new human authorization.

    If the evidence cannot distinguish harness failure from Appium failure:

    FAIL_RUNNER

    under the conservative rule.

    18. INFRASTRUCTURE FAILURE HANDLING

    If a future GitHub substrate fails before fair runner exercise:

    record:

    NOT_EXECUTED

    cause:

    INFRASTRUCTURE

    Preserve artifacts.

    Do not proceed to the next platform if doing so would violate the prepared execution topology or make provenance ambiguous.

    Do not use native rerun.

    A replacement needs new human authorization.

    19. RE-LOCK IMPLEMENTATION

    Create a successor compatibility-smoke implementation lock.

    Do not overwrite lock v1.

    Expected new artifact conceptually:

    manifests/compatibility-smoke-implementation-lock-v2.yaml

    Lock every execution-critical artifact again after v2 integration.

    Report:

    * every locked path;
    * every SHA-256;
    * lock canonical SHA-256;
    * concrete-realization SHA-256.

    The old lock remains historical and must never be described as the active execution baseline after the amendment.

    20. WORKFLOW AND STATIC TESTS

    Update the prepared:

    .github/workflows/e03-compatibility-smoke.yml

    only as necessary for the v2 attribution semantics.

    Still require:

    gate → Android → iOS sequentially.

    No execution.

    Static tests must additionally prove:

    * demonstrated infrastructure cause → NOT_EXECUTED path;
    * demonstrated harness cause → NOT_EXECUTED path;
    * ambiguous cause → FAIL_RUNNER;
    * Appium session/driver mandatory-capability failure → FAIL_RUNNER;
    * FAIL_RUNNER under selected Appium does not recursively invoke another runner;
    * Appium 2 never appears;
    * NOT_EXECUTED does not mark mirror PASS;
    * FAIL_RUNNER does not mark mirror PASS;
    * no automatic second attempt occurs;
    * no native rerun is accepted.

    Use fake/stubbed clients only.

    21. PREPARED AUTHORIZATION REMAINS UNISSUED

    APPIUM3-COMPAT-SMOKE-AUTH-01 remains the prepared id unless the repository lifecycle makes a successor draft id necessary because its frozen implementation reference changed before issuance.

    Preferred approach:

    update the still-PREPARED record in place to reference:

    * mobile-runner-policy-v2;
    * implementation-lock-v2;
    * updated working prompt.

    It must remain:

    PREPARED_AWAITING_EXPLICIT_HUMAN_AUTHORIZATION

    authorizes_execution: false

    dispatch_eligibility: NOT_ELIGIBLE_UNTIL_ISSUED

    issued_by: null

    issued_at: null

    Do not issue it.

    22. WORKING PROMPT

    Update the WORKING smoke prompt to encode v2 attribution exactly.

    It must explicitly require:

    * PASS / FAIL_RUNNER / NOT_EXECUTED semantics;
    * positive evidence for NOT_EXECUTED;
    * uncertainty → FAIL_RUNNER;
    * harness defect → preserve + STOP;
    * infrastructure failure → preserve + STOP;
    * Appium FAIL_RUNNER → fallback exhausted + STOP;
    * no repair-and-continue;
    * no rerun;
    * no E03 start.

    It remains WORKING / NOT DISPATCHABLE.

    Report its new SHA-256.

    23. PROTO-U16

    Do NOT conflate PROTO-U16 with this amendment.

    The stale sut-manifest.yaml presence: UNCONFIRMED issue remains separately tracked.

    The SUT-02 smoke scope remains grounded in the frozen E01 adjudicated matrix, which confirms Android Native and iOS Native.

    Do not silently rewrite all 24 presence values under this operation.

    Report whether PROTO-U16 blocks the future smoke; if not, explain why under existing authoritative E01 provenance.

    24. PUBLICATION

    Do NOT publish or push this amendment/preparation under this instruction unless repository validation absolutely requires a public snapshot.

    Preferred outcome:

    canonical amendment frozen,
    implementation lock v2 prepared,
    authorization still PREPARED,
    no execution.

    The issuance/publication sequence will be separately authorized after review.

    25. RETURN PACKAGE

    Return:

    1. v2 policy commit SHA;
    2. exact v1 lifecycle/header delta;
    3. exact v2 state;
    4. PROTO-U17 resolution record;
    5. affected-campaign statement;
    6. confirmation prior E01/Mobilewright data remain valid;
    7. updated smoke workflow SHA-256;
    8. implementation-lock-v2 path and SHA-256;
    9. exact locked artifact list;
    10. updated realization hash;
    11. updated working-prompt SHA-256;
    12. prepared authorization lifecycle/reference changes;
    13. static attribution test matrix;
    14. confirmation no Appium execution;
    15. confirmation no SUT launch;
    16. confirmation no workflow_dispatch;
    17. confirmation mirror remains NOT_STARTED / NOT_STARTED;
    18. PROTO-U16 status;
    19. E03 status.

    26. HARD STOP

    After completing the amendment and re-lock:

    STOP.

    Do not issue the smoke authorization.

    Do not dispatch.

    Do not install/execute Appium as a study operation.

    Do not launch SUT-02.

    Do not populate executed smoke results.

    Do not start E03.

    27. REQUIRED FINAL STATE

    End exactly:

    PROTO_U17:
    RESOLVED_BY_MOBILE_RUNNER_POLICY_V2

    MOBILE_RUNNER_POLICY_V1:
    AMENDED_HISTORICAL

    MOBILE_RUNNER_POLICY_V2:
    FROZEN_BEFORE_COMPATIBILITY_SMOKE_DATA

