rationale: >-
  PROTO-U17 (2026-09-24) showed that v1 section 9 left the terminal and failure behavior of the compatibility smoke undefined
  once Appium 3 itself is the selected fallback runner: v1 knew NOT_EXECUTED only for a build that cannot be obtained or
  installed, gave no result for an execution prevented by infrastructure or by a defect of the study-authored harness, and on
  a runner-caused failure required a repeat "with the fallback runner" although no further fallback exists after the section
  8 switch. The approved rules define attribution with positive evidence for every exclusion, a conservative tie-break so
  that uncertainty never excludes an unfavorable runner outcome, the effects of each result, and a terminal exhausted-fallback
  state, without a fourth execution result and without changing the qualification gate or the switch rule.
section_9_rules:
  vocabulary: [PASS, FAIL_RUNNER, NOT_EXECUTED]  # unchanged; no fourth execution result
  pass: one clean execution with the selected runner completes MC-01, MC-02, MC-06, MC-04, MC-08, MC-10 (unchanged)
  fail_runner: failure of the selected runner's execution stack (pinned core, platform driver, WebDriver-protocol behavior) while attempting the smoke capabilities; in-stack dependency or version incompatibility is runner/toolchain evidence
  not_executed: only on positively demonstrated SUT_BUILD, INFRASTRUCTURE, or HARNESS_ORCHESTRATION causes; record fields SUT, platform, timestamp, failed phase, attributed category, concrete description, artifact pointers, recording role; a failed runner command alone never demonstrates HARNESS_ORCHESTRATION
  tie_break: uncertain attribution after inspecting the preserved artifacts -> FAIL_RUNNER
  effect_not_executed: no pass, no runner failure, no runner selection; that SUT x platform stays unresolved and its conditions blocked (G-7); the authorized smoke stops; a further attempt needs the preserved record, the corrected cause, and a new explicit human authorization (successor lock if execution-critical code changes); no CI re-run
  effect_fail_runner_mobilewright: section 8 selects Appium 3 (general rule carried from v1; the completed AUTH-03 selection is not revisited)
  effect_fail_runner_appium3: fallback EXHAUSTED; no recursive section 8; no re-execution of Appium 3; Appium 2 never; no other runner; result stays FAIL_RUNNER; study-level mobile-runner status UNRESOLVED_AFTER_FALLBACK_FAILURE (SELECTED while usable), recorded by the ORCHESTRATOR in manifests/toolchain-manifest.yaml and the change log; every campaign requiring mobile execution blocked from START and measurement until a new explicit protocol amendment
  independence: per-platform results distinct, never averaged, merged, or compensated; a single FAIL_RUNNER on any ecosystem x platform suffices for the FAIL_RUNNER rules
