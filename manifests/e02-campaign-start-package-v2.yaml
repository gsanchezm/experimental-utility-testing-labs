open_items:
- id: OPEN-1
  title: the CS-004 checkout selectors of SUT-02 and SUT-03 (HD-S)
  kind: RESOLVED_AS_TO_THE_SOURCE_READING
  detail: 'resolved on the decision of 2026-11-06 (decisions-v3): the selectors were read from the pinned sources (SUT-02 commit 60fdd634, SUT-03 commit 7ab934d7) and the two realizations were configured (commit 896adcd6); the realizations were never run, so the environment-verification DRY_RUN of each is the only verification (OPEN-4, OPEN-5)'
- id: OPEN-2
  title: the E02 verification workflow could not run before the START
  kind: RESOLVED
  detail: 'resolved by OP-CI-17 (commit a9d19ea3): the DRY_RUN gate checks the working prompt, and a frozen copy, if one exists, must be byte-identical to it; on the repository as it stands the verification gate passes (9 of 9) and the measured gate refuses (16 pass, 17 fail, all belonging to the state before the START)'
- id: OPEN-3
  title: stale DRAFT wording in both workflows
  kind: RESOLVED
  detail: 'resolved in the same operation (OP-CI-17)'
- id: OPEN-4
  title: environment verification before the START
  kind: PRECONDITION_OF_THE_START
  detail: 'decided on 2026-11-06 (decisions-v3): the verification of the ten conditions on GitHub Actions precedes the START, because a failed verification can change provisioning, which the lock freezes (E03 verified nine times before its START). The push of export v47 is done (2026-11-09); it needs one approval per DRY_RUN dispatch (or one approval block with the exact lines, as for the E03 SUT-02 to SUT-05 authorizations); the bundles are reviewed and never imported as measured data; the import writes controlled-instance-status.yaml. The START approval line is not offered until all ten conditions are VERIFIED on GitHub Actions'
- id: OPEN-5
  title: items of the executor that no test and no run has exercised
  kind: PRECONDITION_OF_THE_START
  detail: 'executor README, section 10: the SUT-01 unauthenticated session status, the SUT-04 booking list shape and date format, the SUT-05 BasketItems request and response shapes, the SUT-02 landing check, the SUT-03 float-cart close, and every selector, route, and starting-state read of the two CS-004 realizations; the first execution of every web realization is a DRY_RUN. A defect found there changes the implementation hash (and gives a successor version of this package, with the DRY_RUNs repeated on the new bytes)'
- id: OPEN-6
  title: the execution-model record of E02
  kind: RESOLVED
  detail: 'resolved on 2026-11-06 (decisions-v3): the import procedure and artifact classes of experiments/E03-resetability/ci-cd-execution-model.md are used by reference, as the working prompt states; no E02 document is written'
- id: OPEN-7
  title: the START date and the START authorization id
  kind: HUMAN_DECISION
  detail: 'the id is the human research lead''s (proposal: E02-START-AUTH-01, mirroring E03-START-AUTH-01); the START and the configuration lock are one approval of the exact action (protocol/change-control-v1.md, section 7; governance v6, Section 3.6, Human-gated), asked with the exact line and recorded with its hash'
- id: OPEN-8
  title: the five dispatch authorizations
  kind: HUMAN_DECISION
  detail: 'after the START and the verification, one per SUT (dispatch_authorizations_to_issue); an authorization names a condition only if its gates hold at issuance; each is issued only by the human research lead'
- id: OPEN-9
  title: the H2 consequence of the ten conditions
  kind: DISCLOSURE
  detail: 'the establish side of H2 has two pairs per comparison (CS-003 and CS-004); two pairs cannot reach significance in any case (smallest two-sided exact p-value 0.5 at n = 2, derived), so H2 is descriptive (HD-16); the paper states this'
- id: OPEN-10
