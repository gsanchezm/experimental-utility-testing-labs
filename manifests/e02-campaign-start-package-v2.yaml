controlled_instance_status_template: |-
  # experiments/E02-state-establishment/controlled-instance-status.yaml -- written by the ORCHESTRATOR from the import of an environment-verification run; the schema that gate G-8 reads.
  # The status of a condition is that of the latest environment-verification run that covers it. An entry is VERIFIED only on the recorded result of a run; none exists today.
  conditions:
    E02-CS003-SUT01-WEB:
      status: CONTROLLED
      reverification_required: false
      github_actions_verification:
        status: VERIFIED
        environment_type: SELF_HOSTED
        run_id: null
        run_url: null
        import_record: null

