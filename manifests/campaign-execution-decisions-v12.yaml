    exact_text: "Your questions have been answered: \"E07, ronda 9, forma de la campaña (copia el modelo de E04): 4 condiciones web/API, cada una con 50 ejecuciones secuenciales en una instancia compartida (200 ejecuciones, un job por condición, intento 1): SUT-01 API a Web, SUT-01 Web a API, SUT-04 API a Web, SUT-04 Web a API. Reset entre intentos fuera del escenario (DP-6): SUT-01 limpia la sesión por la API y usa un contexto de navegador nuevo por ejecución; SUT-04 borra por la API las reservas con los nombres de la condición. SUT-03, SUT-05, SUT-02 y SUT-06 no tienen condición (NOT_COMPARABLE). ¿Apruebas esta forma?\"=\"Aprobar (Recomendada)\", \"E07, DP-5, claves de identidad que debe coincidir en la capa de verificación (VERIFIED exige todas las claves y atributos): SUT-01 = sid del JWT más la línea del carrito (pizza_id p02, cantidad 1); SUT-04 = nombres de huésped únicos por ejecución más fecha de entrada y salida de la habitación 1 (no el bookingid, que la web no muestra). ¿Las fijas?\"=\"Fijarlas (Recomendada)\", \"E07, categorías y atribución (X-2, X-3, DP-8): categorías VERIFIED, NOT_VERIFIED, ESTABLISHMENT_FAILED, INTERRUPTED (incluye reset fallido o estado inicial no alcanzado, con su causa) y RUNNER_ERROR; la proporción primaria es VERIFIED / todos los intentos válidos (opción A) y la condicional VERIFIED / intentos con establecimiento exitoso (opción B) se reporta aparte, ambas con intervalo de Wilson; atribución igual que E04 (TOOLING para interrupciones de bloque y excepciones del ejecutor, SUT para fallos registrados y lo no asignable mecánicamente). ¿Lo apruebas?\"=\"Aprobar (Recomendada)\". You can now continue with these answers in mind."
decisions:
  - id: D-E07-8
    subject: "shape of the campaign and DP-6 (reset)"
    decision: "Approved as proposed: four web/API conditions, N = 50 executions each, run sequentially on one shared instance per condition (one job per condition, attempt 1; 200 executions in all): SUT-01 API to WEB, SUT-01 WEB to API, SUT-04 API to WEB, SUT-04 WEB to API (the model B of E04 and E05). Reset between attempts, outside the scenario and not counted (DATA_RESET): SUT-01 clears the session through the API and uses a new browser context per execution; SUT-04 deletes through the API the bookings that carry the condition's guest names. SUT-03, SUT-05, SUT-02 and SUT-06 have no condition (NOT_COMPARABLE). The two open cells of D-E07-6 are measured in the non-measured DRY_RUN rounds and their comparability is decided by the human research lead before CS-005 and CS-006 are frozen."
  - id: D-E07-9
    subject: "DP-5, the identity keys"
    decision: "Fixed as proposed: SUT-01 = the sid claim of the JWT and the cart line (pizza_id p02, quantity 1); SUT-04 = the run-unique guest names and the check-in and check-out dates of room 1 (not the bookingid, which the web does not show). VERIFIED requires every declared key and attribute to match; a key that is not observable on the verification layer is not used. The keys are declared in the campaign configuration before the first attempt."
  - id: D-E07-10
    subject: "X-2, X-3, DP-8 and the attribution rule"
    decision: "Approved as proposed: the outcome categories are VERIFIED, NOT_VERIFIED, ESTABLISHMENT_FAILED, INTERRUPTED (it includes a failed reset or a starting state not reached, each with its cause) and RUNNER_ERROR; the primary proportion is VERIFIED / all valid measured attempts (option A); the conditional proportion VERIFIED / attempts whose establishment succeeded (option B) is reported apart; both with a Wilson interval; attribution as in E04 (TOOLING for an interruption of a block and for an exception of the executor, SUT for a recorded failure and for what cannot be assigned mechanically; the attributed counts are reported beside the raw rate and never recompute it)."
not_decided_in_this_round: "The freeze of CS-005 and CS-006 and the comparability of the two open cells (after the DRY_RUN rounds), the campaign START, the dispatch authorizations, the dispatches, the freeze of the campaign and every public export: each needs its own explicit human approval."
