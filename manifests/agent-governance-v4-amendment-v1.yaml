known_imprecisions_of_the_approved_text:
- id: KI-1
  text: |
    The section "What changed relative to v3, and why" lists the changes of Section 3.5 (the retired role, the constraints carried, two added paragraphs) and does not list the Dispatch paragraph of variant B, which differs from the Dispatch paragraph of Section 3.6. The operative text is the Dispatch paragraph of Section 3.5.
- id: KI-2
  text: |
    Section 3.6 carries unchanged the line "Human-gated", which says that each dispatch requires the human's explicit approval of that exact action. Section 3.6 is scoped to E02 and E04-E12; Section 3.5 says that E03 is executed by the model of Section 3.6 and under the rules of Section 3.5, and its Dispatch paragraph states that it modifies the Dispatch paragraph of Section 3.6. The ORCHESTRATOR therefore applies the Dispatch paragraph of Section 3.5 to E03: the dispatch authorization issued by the human research lead for an SUT is the human approval, and a dispatch outside it is not made. A reader could take the Human-gated line to require, for E03, an approval of each exact dispatch; the Dispatch paragraph of Section 3.5 says the opposite for E03, and the ORCHESTRATOR reads it as the specific rule that prevails; the human research lead can decide otherwise.
  how_handled: not corrected here (the approved bytes are frozen as approved); reported to the human research lead in the report of the freeze; a correction would be a successor version of the document, or a non-substantive correction under protocol/change-control-v1.md, section 2, if the human research lead so decides
