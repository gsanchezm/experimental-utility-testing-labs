findings:  # statements read from the files above; evidence status SOURCE_VERIFIED unless the finding says INFERRED; line numbers are those of the files at the pinned commit
- id: F01
  statement: "SUT-01 API checkout for a user whose behavior is neither error nor security_glitch has no random and no clock in its outcome: the totals depend only on the items, the market and the tip percentage (subtotal, tax, tip and total from the constants of the market; order id and timestamps are the only run-varying fields). Randomness exists only in should_trigger_error (probability 0.5, behaviors error and security_glitch) and in the a11y mode draw."
  where: "backend/database.py lines 308-348 (calculate_order_total), 361-364 (should_trigger_error), 151-153 (order id, timestamp); backend/routers/checkout.py"
  bears_on: "D-11 (no-evidence-row part of SUT01-API-01), D-12"
- id: F02
  statement: "Market MX requires the field colonia (name 2-100 characters, address at least 5, phone at least 8 are required for every market); tip field propina (percentages 0, 5, 10, 15 offered), optional zip_code (five digits when given); currency MXN, tax rate 0.16, delivery fee 2.0 USD converted by the rate table. A missing required field gives HTTP 400 with the detail \"Field 'colonia' is required for country MX\"."
  where: "backend/constants.py lines 89-100; backend/models.py lines 92-129; backend/routers/checkout.py (required-field loop)"
  bears_on: "D-12 (required MX fields); the expected total is to be computed from these constants and the catalog and rate tables before START, not from a run"
- id: F03
  statement: "For behavior error the checkout returns HTTP 500 with the JSON detail 'Random checkout error triggered for testing purposes' with probability 0.5 per call; for behavior security_glitch the detail is a random choice among the leak messages."
  where: "backend/routers/checkout.py (status 500 branch); backend/database.py lines 361-364"
  bears_on: "D-12 (500 body for behavior error; SUT01-API-06)"
- id: F04
  statement: "SUT-01 performance_glitch behavior sleeps 3.0 s on each call of an endpoint that applies apply_user_behavior (the checkout and catalog routes that depend on it), a fixed delay with no random or clock input."
  where: "backend/middleware.py (apply_user_behavior)"
  bears_on: "D-04 (SUT01-API-04 mechanism, already decided as deterministic by mechanism)"
- id: F05
  statement: "SUT-01 web checkout: the place-order control is the element with data-testid built by tid('place-order-btn'); activating it opens a confirmation modal (data-testid confirm-order-modal) whose control data-testid confirm-order-yes submits the form; the submit handler posts the order, clears the cart and navigates to /order-success; on failure it sets the error text of the key checkoutFailed. The outcome path has no Math.random or clock (the only random use in Checkout.jsx builds a client-side cart item id). Routes /catalog, /checkout and /order-success are under ProtectedRoute."
  where: "frontend/src/pages/Checkout.jsx lines 166, 323-343, 1105, 1137-1177; frontend/src/App.jsx lines 45-54; frontend/src/features/checkout/useCases/buildCheckoutPayload.js"
  bears_on: "D-11 (SUT01-WEB-01), D-12 (place-order control, order-success route)"
- id: F06
  statement: "SUT-01 catalog: the product heading is an h2 with data-testid built by tid('pizza-name-<id>') carrying only a data-testid and a class (no aria-label, no aria-labelledby, no title); the image alt is the product name; so under the missing_name mode both are empty. The route /catalog is declared. The catalog is fetched in a useEffect that runs on mount and again when the country code or the language changes, so a second fetch in one page load is possible."
  where: "frontend/src/components/ProductCard.jsx lines 24, 36; frontend/src/App.jsx line 51; frontend/src/features/catalog/hooks/useCatalogPizzas.js"
  bears_on: "E09 open verification items 2 and 6 of the brief, section 13 (the h2 has none of the three attributes that would prevent empty-heading; /catalog confirmed); item 1 (single fetch per load) stays for the probe"
- id: F07
  statement: "SUT-02 web cart path for a user that is neither problem_user nor error_user is deterministic: adding an item stores its id in localStorage under cart-contents (an id already present is not added twice), and the cart badge (data-test shopping-cart-badge) shows the number of stored ids. The add control has the data-test built as the label, a hyphen and the item name, lowercased with spaces turned into hyphens (for example add-to-cart-<item name>). The only Math.random of the inventory page is the price of visual_user (randomPrice), confirming the stochastic mechanism of E05-SUT02-WEB-02."
  where: "src/components/InventoryListItem.jsx lines 31-47, 87-90; src/utils/shopping-cart.js; src/components/CartButton.jsx lines 24-27; src/pages/Inventory.jsx lines 31, 122"
  bears_on: "D-11 (SUT02-WEB-01), D-12 (selectors)"
- id: F08
  statement: "SUT-04 DateCheckValidator.isValid compares only the two dates of the request (check-in strictly before check-out; a null date is invalid) and reads no clock. The booking conflict check (checkForBookingConflict) queries the stored bookings of the same room by the dates of the request; Calendar.getInstance is used only to add one day to the request's own check-in date. No wall-clock comparison exists in the booking create or conflict path."
  where: "booking/src/main/java/com/automationintesting/service/DateCheckValidator.java; booking/.../db/BookingDB.java lines 142-164"
  bears_on: "D-13 (the class of SUT04-WEB-01 and SUT04-API-01)"
- id: F09
  statement: "SUT-04 booking create: invalid dates or a conflict return HTTP 409 with no body; success returns 201 with the created booking; a message is posted to the message service only when both email and phone are present. The scheduled database reset reads the environment variable dbRefresh and does nothing when it is unset or 0."
  where: "booking/.../service/BookingService.java (createBooking); booking/.../api/BookingController.java (POST /); booking/.../service/DatabaseScheduler.java"
  bears_on: "D-12 (status of the API conflict), D-13; SUT04-API-01 and SUT04-API-02"
- id: F10
  statement: "SUT-04 web booking form: after the dates step, the details step posts to /api/booking; for a response that is not ok it parses the body as JSON and shows errors from it, and a failure to parse is caught and only logged to the console. A 409 has no body, so, INFERRED from this code (not observed), a conflict shows no message and no confirmation: the page stays on the form. The category S_CONFLICT_MESSAGE of E05-SUT04-WEB-01 therefore cannot be produced by a conflict; its expected observable has to be defined as the absence of the confirmation with the form still shown, to be confirmed in the environment verification. Whether the date selection of the page lets an overlapping range be chosen is not read here."
  where: "assets/src/components/reservation/BookingForm.tsx lines 120-134"
  bears_on: "D-12 (message text), D-13; E05-SUT04-WEB-01 categories"
- id: F11
  statement: "SUT-05 login with a wrong password returns HTTP 401 with the body 'Invalid email or password.' (translated text of the active language); the query has no random or clock input. The route is POST /rest/user/login."
  where: "routes/login.ts; server.ts line 615"
  bears_on: "D-12 (status for SUT05-API-01)"
- id: F12
  statement: "SUT-05 captcha: GET /rest/captcha returns JSON with captchaId, captcha (an expression built from Math.random terms and operators) and answer; captchaId comes from a counter in app.locals that increases on every call and persists until the process restarts, so it varies between calls even with the same operands excluded."
  where: "routes/captcha.ts; server.ts lines 172, 634"
  bears_on: "D-12 (CAPTCHA route path); E05-SUT05-API-02 projection must exclude captchaId as well as operands and answer"
resolutions:  # how each decision that waited for these reads is read under the rule the human research lead approved; each is open to the human research lead's objection until the configuration lock
- decision: D-11
  reading: "the rule 'source check first' was executed: F01 (SUT01-API-01), F05 (SUT01-WEB-01) and F07 (SUT02-WEB-01) show no random and no clock in the outcome path for the declared accounts, so the three classes are deterministic, now SOURCE_VERIFIED at the pinned commits instead of absence-based."
- decision: D-12
  reading: "the values marked TBD are taken from F02, F03, F05, F07, F09, F11 and F12; the expected total of SUT01-API-01 is computed from the constants before START; F10 changes the expected observable of E05-SUT04-WEB-01 and F12 adds captchaId to the exclusions of E05-SUT05-API-02."
- decision: D-13
  reading: "under the rule 'deterministic if the request dates only, time-dependent if any clock comparison', F08 gives deterministic for both SUT04-WEB-01 and SUT04-API-01; the E01 audit placed DateCheckValidator under its time-dependent bullet without an evidence row, and the source at the pin does not support that. The class counts of the brief, section 4.3, become deterministic 9, time-dependent 0, stochastic 4, external dependency 1. The class is declared before execution and is not revised from observed variance."
