  - "the shared-client disclosure of lock v4: the WebDriver client behind both platforms changes from the built-in fetch to node:http (same method, path, content-type, and body bytes; different default request headers); the Android PASS of AUTH-02 is combined under 9.7.12 on the strength of the unchanged realization hash and the unchanged command-sequence hash, both recomputed by the gate"
