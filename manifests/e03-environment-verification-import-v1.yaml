instruction_verbatim: |
  EUS-2026-001 — OP-ENV-02 — IMPORT THE OP-ENV-01 ENVIRONMENT_VERIFICATION ARTIFACTS AND TRANSCRIBE THE GITHUB ACTIONS VERIFICATION STATE (NON-MEASURED; NO DISPATCH)

  Role for this operation: ORCHESTRATOR (protocol/agent-governance-v2.md). Classification: import of non-measured verification evidence (class ENVIRONMENT_VERIFICATION, never raw-data/) and representation-only status transcription; not a human gate. Two phases with the reviewer's audit between them. Serialize with OP-U16-01: start Phase A only on a clean tracked tree.

  BASIS
  OP-ENV-01 (approved dispatch, run 37074152972, attempt 1; records 4f46950 and f738afd) and your return of 2026-10-02 (sha256 e15188898eeaa1065f1f980366830f35e4a10deb025b40332eea274f715b5b10), whose per-job findings the reviewer checked independently on the GitHub job logs.

  PHASE A — PREPARE, DO NOT COMMIT
  A1. Baseline: tracked tree clean; run 37074152972 still attempt 1 only; the six artifacts in your scratchpad equal their GitHub digests (re-verify); experiments/E03-resetability/controlled-instance-status.yaml unchanged since 2026-09-22 (github_actions_verification NOT_RUN for all nine).
  A2. Import the six artifacts byte-exact under experiments/E03-resetability/environment-verification/github-actions/run37074152972-a1/<job>/ (extracted members plus the downloaded archive and an IMPORT-RECORD.yaml with name, id, size, GitHub digest, sha256 of every member; apply the byte-exact pattern of qualification/compatibility-smoke/formal/.gitattributes if any text member could be end-of-line converted). Nothing goes to raw-data/.
  A3. Transcribe into controlled-instance-status.yaml, per condition, github_actions_verification: VERIFIED with run_id 37074152972, run_attempt 1, job id and record path for E03-CS001-SUT01-WEB, E03-CS001-SUT01-API, E03-CS001-SUT02-WEB, E03-CS001-SUT03-WEB; NOT_VERIFIED with the observed cause (workflow defect: emulator-runner script executed by sh, `set -o pipefail`) for E03-CS001-SUT02-ANDROID; NOT_VERIFIED (workflow defect: pip refused by PEP 668 on macos-15; empty provenance in the record) for E03-CS001-SUT02-IOS; NOT_VERIFIED, no record (compose build of rbp-branding requires a prior Maven build) for E03-CS001-SUT04-WEB and -API; NOT_VERIFIED, no artifact (npm postinstall exit 254; root cause not established) for E03-CS001-SUT05-API. Three layers kept distinct in every entry: GitHub job conclusion, the record's verification_result, what the verification demonstrates (reachability only; the reset is never exercised). measured_execution_readiness stays NOT_READY for all nine (other gates). Update the `updated` field and the summary (github_actions_verified: 4). While there, correct the representation-only staleness of the two mobile entries' mobile_qualification_status comments to the recorded state (Appium 3 selected; AUTH-02 android PASS, ios FAIL_RUNNER; study-level status UNRESOLVED_AFTER_FALLBACK_FAILURE; policy v3 in force since 2026-10-02) without changing any field a gate reads (`status`, `github_actions_verification`).
  A4. Records and status: manifests/README.md Files rows for manifests/e03-environment-verification-dispatch-v1.yaml, -run-v1.yaml and the import; one dated note in manifests/study-manifest.yaml; experiments/E03-resetability/README.md and controlled-instance-determination.md where they say the GitHub verification has not run; experiments/E03-resetability/environment-verification/README.md index of the new records. Report, do not fix: the four workflow/provisioning defects (a separate operation corrects the workflow); the stale sentence the published workflow writes into the mobile records.
  A5. Checks: YAML parses (both parsers); every imported member sha256 equals the import record and the archive member; the local validation steps (hygiene scan included: the records must contain no host paths — check the artifacts for `/Users/` or `/home/` strings before import and report any occurrence instead of importing a transformed copy); G-8 static evaluation for the four VERIFIED conditions and the five others, from the measured-execution gate script, reported per condition.
  A6. Return and HOLD: git status, diff statistics, the per-condition table, import record hashes, check results, surprises, what you did not verify.

  PHASE B — ONLY AFTER "OP-ENV-02 PHASE A AUDIT: PASSED": commit (import commit, then status commit), explicit paths, existing identity, no trailers, no push; return SHAs and final hashes.

  NOT AUTHORIZED: any dispatch or re-run; any workflow edit; any change to `status` fields or to raw-data/; E03 START; export.
