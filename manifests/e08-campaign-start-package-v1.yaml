rehearsal_of_the_gate:
  what: "the gate step of .github/workflows/e08-measured-execution.yml (extracted from the file) was run on a scratch copy of the working tree at the state of this package (protocol, manifests, experiments, schemas, prompts and .github) with the prepared edit set applied and SYNTHETIC dispatch authorizations named REHEARSAL-E08-DISPATCH-SUT0N that were never committed and are not authorizations; a negative control ran the same gate on the tree as it is; six single mutations of the rehearsal tree ran on the condition E08-SUT03-WEB-CLS"
  result: "ALL GATES PASSED for each of the four conditions (47 gates PASS, 0 FAIL, attempt 1, first execution 1); on the tree as it is the gate fails closed for each condition (22 PASS, 25 FAIL, with no START and no authorization); each of the six mutations failed on the gate it targets (the measured-workflow hash absent from the configuration, a changed conditions file, status NOT_STARTED, the frozen prompt missing, a tools.performance probe version that disagrees with the executor, a condition marked as awaiting re-verification). The 58 executor tests pass on the rehearsal tree after the START edits, with actionlint 1.7.12 and shellcheck 0.11.0 on PATH."
  rounds_of_environment_verification: "one (round 1, run 45878792738, clean in the four conditions); E09 ran three rounds before its START and E11 two; whether one round suffices is for the human research lead to decide at the START"
  limit: "the rehearsal proves that the prepared text and values satisfy the gate; it is not an authorization, and the scratch copies and the synthetic records were deleted after the run. The gate is read again on the public tree after the export and the authorizations, before the first dispatch."
