withdrawn_proposal: "the first-draft package's g7_impact_analysis.minimal_change_if_approved (evaluate each SUT x platform's FAIL_RUNNER on its latest Smoke-records row) is WITHDRAWN: a generic latest-row rule would let table order decide whether an immutable historical FAIL_RUNNER counts. It is replaced by the effective-admissibility rule and the normative lineage record below"

effective_admissibility_rule:  # policy v3 draft 9.7.9; DEFINED, NOT IN FORCE
  historical_observation: "the immutable result produced under the protocol version that governed its execution; never deleted, overwritten, downgraded, or reclassified (the AUTH-02 iOS FAIL_RUNNER stays permanently present as a valid v2 observation)"
  current_prospective_admissibility_state: "the state allowed to govern future campaign admission, including after a protocol-authorized remediation"
  effective_compatibility_observation: "per ecosystem x platform: a PASS is an effective PASS; a NOT_EXECUTED is a non-result superseded by the result of any later authorized attempt of the same ecosystem x platform (already v2 9.5 behaviour: AUTH-01 android NOT_EXECUTED -> AUTH-02 android PASS); a FAIL_RUNNER is never superseded by a later row or by table order and ceases to block only under the conditions below"
  conditions:  # all required; any absent or unverifiable -> fail closed
    - "1. it is the exact FAIL_RUNNER named as the trigger of the approved v3 remediation (APPIUM3-COMPAT-SMOKE-AUTH-02, run 36539790536, SUT-02 x iOS)"
    - "2. policy v3, approved and frozen, explicitly authorizes remediation of that exact observation (9.7.2)"
    - "3. exactly one remediation execution exists (one authorization, one dispatch, run attempt 1)"
    - "4. the remediation uses a new authorization id"
    - "5. the remediation uses the approved successor implementation lock"
    - "6. the remediation targets only the affected ecosystem x platform"
    - "7. its official QUALIFIER-MOBILE-01 result is PASS"
    - "8. its artifact provenance is complete and valid (imported byte-exact, digests equal to the recorded digests)"
    - "9. its mirror transcription is PASS"
    - "10. the restoration record (the lineage record) references the historical FAIL_RUNNER, the remediation authorization, the remediation run id, protocol v3, the implementation lock, and the PASS source record; its verification includes that the named historical FAIL_RUNNER still exists unchanged (its smoke-record row with the recorded authorization, run, and result, and its imported artifacts byte-exact against their import record)"
    - "11. mobile_runner_status is explicitly restored to SELECTED under v3"
    - "12. no other unresolved FAIL_RUNNER exists for the selected runner on any ecosystem x platform"
  when_all_hold: "the named historical FAIL_RUNNER is retained but no longer counted as an unresolved current blocker; every other FAIL_RUNNER keeps blocking; admission evaluates each ecosystem x platform's effective compatibility observation"
  after_restoration: "any later FAIL_RUNNER of the selected runner applies 9.5 again (UNRESOLVED_AFTER_FALLBACK_FAILURE); no second v3 remediation; the lineage record never extends (9.7.11)"

remediation_lineage_record:  # policy v3 draft 9.7.10; DEFINED, NOT CREATED
  candidate_path: manifests/mobile-runner-remediation-v1.yaml  # candidate -- not frozen
  written_by: ORCHESTRATOR, once, after a remediation PASS recorded by QUALIFIER-MOBILE-01, and only on an explicit human instruction
  normative_for: "G-7 of .github/workflows/e03-measured-execution.yml (the restoration is never inferred from table ordering alone)"
  schema:  # field: requirement
    record_class: "MOBILE_RUNNER_REMEDIATION_LINEAGE (constant)"
    prior_policy: "protocol/mobile-runner-policy-v2.md, state AMENDED at the time of writing"
    new_policy: "protocol/mobile-runner-policy-v3.md, state FROZEN-PRE-DATA, with its freeze sha256 and the CHANGELOG row that froze it"
    historical_failing_authorization: "APPIUM3-COMPAT-SMOKE-AUTH-02"
    historical_failing_run: "36539790536 (attempt 1)"
    historical_failing_platform: "SUT-02 x ios"
    historical_result: "FAIL_RUNNER"
    historical_attribution_basis: "CONSERVATIVE_TIE_BREAK_ATTRIBUTION_UNCERTAIN"
    historical_result_immutable: "true (constant)"
    historical_source_record: "qualification/compatibility-smoke/README.md smoke-record row plus formal/APPIUM3-COMPAT-SMOKE-AUTH-02/IMPORT-RECORD.yaml and ATTRIBUTION-SUT-02-ios.yaml, each with its sha256 at the time of writing"
    remediation_authorization_id: "a new id (never AUTH-01 or AUTH-02); its record ISSUED, VALID, CONSUMED_AFTER_DISPATCH, naming policy v3 section 9.7"
    remediation_run_id: "the single run id"
    remediation_run_attempt: "1 (constant)"
    remediation_dispatch_count: "1 (constant)"
    remediation_lock: "successor implementation lock path and sha256 (the approved lock v4)"
    remediation_target: "SUT-02 x ios only (no other platform recorded under the remediation authorization)"
    remediation_official_result: "PASS (QUALIFIER-MOBILE-01), with its smoke-record row, import record, and artifact digests"
    mirror_transcription: "manifests/compatibility-smoke-status.yaml SUT-02 ios entry: result PASS, authorization_id = the remediation authorization"
    restoration_eligibility: "each of the 12 conditions of 9.7.9 with its evidence pointer; all true"
    restored_runner_status: "SELECTED, with the basis 'restored under mobile-runner-policy-v3 after one successful post-fallback remediation qualification'"
    human_approval_provenance: "the instruction approving and freezing v3, the issuance and dispatch instructions of the remediation authorization, and the instruction authorizing the restoration (each verbatim with sha256 in its own record)"
  immutability: "written once, never edited; it never covers a second remediation"

g7_prospective_semantics:  # implementation note only; .github/workflows/e03-measured-execution.yml is NOT modified
  classification: REQUIRED_IMPLEMENTATION_DEPENDENCY_OF_PROTO_U19  # not a new protocol issue
  current_g7_statement: "the current G-7 correctly enforces policy v2 (9.5): every FAIL_RUNNER of the selected runner blocks every mobile condition; the dependency exists only in relation to the proposed v3 semantics"
  proposed_algorithm_if_v3_is_approved:
    - "1. selected runner, pin, and recorded runner version exactly as today (the version check stays unchanged; tools.mobile_fallback.version now holds the formally observed 3.7.0)"
    - "2. inventory every FAIL_RUNNER of the selected runner from the QUALIFIER-MOBILE-01 Smoke records rows (all rows, historical included); each is verified against its smoke-record row, its import record, and its attribution record; the mirror carries only the current effective observation of each ecosystem x platform and need not show a historical FAIL_RUNNER, but a mirror FAIL_RUNNER must match a verified row"
    - "3. load remediation lineage records; each is valid only if conditions 1-11 of 9.7.9 verify continuously (including history integrity for condition 10) and condition 12 held when the status was restored; an invalid or partial record is PROVENANCE_INCONSISTENT_FAIL_CLOSED. A FAIL_RUNNER that arises only after a valid restoration leaves the lineage valid and is itself unresolved (9.7.11)"
    - "4. unresolved FAIL_RUNNERs = the inventory minus the single historical FAIL_RUNNER named by a valid lineage record"
    - "5. fallback state, in this order: (a) a PASS row or PASS mirror entry exists for an ecosystem x platform whose FAIL_RUNNER is unresolved (no valid lineage) -> PROVENANCE_INCONSISTENT_FAIL_CLOSED whatever the status; (b) no unresolved FAIL_RUNNER and status SELECTED -> ADMISSIBLE (reused value; detail names the lineage record when one applies); (c) every unresolved FAIL_RUNNER verified under step 2 and status UNRESOLVED_AFTER_FALLBACK_FAILURE -> FALLBACK_EXHAUSTED_VERIFIED; (d) anything else -> PROVENANCE_INCONSISTENT_FAIL_CLOSED. Every state other than ADMISSIBLE blocks every mobile condition"
    - "6. per-platform: the condition's ecosystem x platform must have an effective compatibility observation PASS (9.7.9 effective-observation rule), with the mirror and the QUALIFIER row agreeing and the runner-version pin as today"
  status_vocabulary: "unchanged: SELECTED and UNRESOLVED_AFTER_FALLBACK_FAILURE; no new status value is introduced"
  history_integrity: "required property of the v3 implementation (case 10): the current gate admits a fixture in which the historical FAIL_RUNNER row was deleted and the status set to SELECTED; under v2 that deletion is excluded by the immutability of QUALIFIER records, which G-7 was never asked to police, but under v3 the lineage verification must detect it"
  static_matrix_method: "expected results under the proposed v3 semantics; current-G-7 results observed on 2026-09-29 by running the unchanged gate script of e03-measured-execution.yml (extracted from the file) on throwaway clones of canonical e77feb4 with hypothetical fixtures (cases 1, 3, 4, 5, 6a, 6b, 10, 11, 13, 16); cases 2, 7, 8, 9, 12, 14, 15 give the current gate the same inputs as the case named"

