instruction_verbatim: |
  # EUS-2026-001 — HARDEN MOBILE-RUNNER-POLICY-V3 DRAFT BEFORE HUMAN APPROVAL

  I, gilbertosanchez, human research lead for EUS-2026-001, have reviewed the prepared DRAFT of:

  `protocol/mobile-runner-policy-v3.md`

  and its decision package.

  I do NOT approve or freeze policy v3 yet.

  The draft is directionally acceptable, but two pre-freeze issues must be resolved in the draft/decision package before a human approval decision:

  1. the exact prospective G-7 semantics after a successful v3 remediation;
  2. the stale `tools.mobile_fallback.version` representation after formal Appium 3 execution.

  This instruction authorizes DRAFT hardening and one factual toolchain-provenance correction only.

  It does NOT authorize:

  - freezing policy v3;
  - marking v2 AMENDED;
  - changing any historical smoke result;
  - correcting wd.mjs;
  - creating lock v4;
  - creating AUTH-03;
  - modifying G-7 production code;
  - dispatching anything;
  - publishing/exporting;
  - starting E03.

  ## 1. VERIFY CURRENT STATE

  Verify canonical state:

  - policy v2 remains frozen/current;
  - policy v3 = DRAFT;
  - PROTO-U19 = OPEN;
  - AUTH-02 Android = PASS;
  - AUTH-02 iOS = FAIL_RUNNER;
  - iOS attribution = CONSERVATIVE_TIE_BREAK_ATTRIBUTION_UNCERTAIN;
  - mobile_runner_status = UNRESOLVED_AFTER_FALLBACK_FAILURE;
  - fallback exhausted = YES;
  - G-7 mobile execution blocked study-wide;
  - QUAL-U06 = OPEN;
  - QUAL-U07 = OPEN;
  - PROTO-U16 = OPEN;
  - E03 = NOT_STARTED.

  Verify public main remains public export v29 and no third compatibility-smoke run exists.

  If any unexpected execution occurred:

  STOP.

  ## 2. DO NOT USE A GENERIC "LATEST ROW WINS" RULE

  Revise the proposed v3 semantics.

  A generic rule that selects the latest row for a SUT × platform is NOT sufficient.

  Historical rows are immutable scientific observations.

  Specifically:

  AUTH-02 iOS:

  `FAIL_RUNNER`

  must remain permanently present as a valid v2 observation.

  A future v3 PASS may affect prospective runner admissibility only through an explicitly defined:

  `POST_FALLBACK_REMEDIATION`

  lineage.

  The historical FAIL_RUNNER is never deleted, overwritten, downgraded, or reclassified.

  ## 3. DEFINE AN EFFECTIVE-ADMISSIBILITY RULE

  Add a normative v3 rule distinguishing:

  ### Historical observation

  The immutable result produced under the protocol version that governed its execution.

  from:

  ### Current prospective admissibility state

  The result allowed to govern future campaign admission after a protocol-authorized remediation.

  A historical FAIL_RUNNER may cease to block future mobile execution ONLY when every requirement below holds:

  1. it is the exact FAIL_RUNNER named as the trigger for the approved v3 remediation;
  2. policy v3 explicitly authorizes remediation of that exact observation;
  3. exactly one remediation execution exists;
  4. the remediation uses a new authorization id;
  5. the remediation uses the approved successor implementation lock;
  6. the remediation targets only the affected SUT × platform;
  7. its official QUALIFIER result is PASS;
  8. its artifact provenance is complete and valid;
  9. its mirror transcription is PASS;
  10. the study-level restoration record references:
     - the historical FAIL_RUNNER;
     - the remediation authorization;
     - remediation run id;
     - protocol v3;
     - implementation lock;
     - PASS source record;
  11. `mobile_runner_status` is explicitly restored to SELECTED under v3;
  12. no other unresolved FAIL_RUNNER exists for the selected runner.

  If any condition is absent:

  fail closed.

  ## 4. DEFINE THE REMEDIATION LINEAGE RECORD

  The draft decision package must specify a future provenance record for a successful remediation.

  Do not create it now.

  Conceptually define a future record such as:

  `manifests/mobile-runner-remediation-v1.yaml`

  or an equivalent repository-consistent name.

  It must contain at minimum:

  - prior policy = v2;
  - new policy = v3;
  - historical failing authorization = AUTH-02;
  - historical failing run = 36539790536;
  - historical failing platform = SUT-02 × iOS;
  - historical result = FAIL_RUNNER;
  - historical result remains immutable = true;
  - remediation authorization id;
  - remediation run id;
  - remediation lock id/hash;
  - remediation official result;
  - restoration eligibility;
  - restored runner status;
  - human approval provenance.

  This record must be normative provenance for G-7.

  Do not rely solely on table ordering.

  ## 5. G-7 PROPOSED SEMANTICS

  Do NOT modify `.github/workflows/e03-measured-execution.yml` yet.

  Revise the v3 decision package to specify exactly how G-7 must behave if v3 is later approved.

  ### Before a successful remediation

  Historical Appium FAIL_RUNNER exists.

  Expected:

  `FALLBACK_EXHAUSTED_VERIFIED`

  All mobile conditions blocked.

  ### Historical FAIL_RUNNER + remediation PASS but no valid restoration lineage record

  Expected:

  `PROVENANCE_INCONSISTENT_FAIL_CLOSED`

  All mobile conditions blocked.

  ### Historical FAIL_RUNNER + valid v3 remediation PASS + complete restoration lineage + status SELECTED

  The exact historical FAIL_RUNNER named by that remediation is retained but no longer counted as an unresolved current blocker.

  Every other FAIL_RUNNER remains blocking.

  Then G-7 evaluates each platform's current effective compatibility observation.

  ### Any other unremediated FAIL_RUNNER

  Expected:

  study-wide blocked.

  ### Any subsequent FAIL_RUNNER after restoration

  Expected:

  `UNRESOLVED_AFTER_FALLBACK_FAILURE`

  again.

  No second v3 remediation.

  ## 6. STATIC G-7 DECISION MATRIX

  Prepare, but do not implement, a static acceptance matrix covering at least:

  1. v2 FAIL_RUNNER, no remediation → BLOCK.
  2. v2 FAIL_RUNNER + v3 DRAFT → BLOCK.
  3. v3 approved, no remediation → BLOCK.
  4. remediation NOT_EXECUTED → BLOCK.
  5. remediation FAIL_RUNNER → BLOCK.
  6. remediation PASS without restoration record → BLOCK.
  7. remediation PASS with wrong authorization lineage → BLOCK.
  8. remediation PASS with wrong lock → BLOCK.
  9. remediation PASS with wrong protocol version → BLOCK.
  10. remediation PASS with historical FAIL removed → FAIL CLOSED.
  11. remediation PASS + valid complete lineage + status SELECTED → eligible for per-platform evaluation.
  12. Android historical PASS + valid iOS remediation PASS → both platform-specific compatibility requirements can satisfy G-7.
  13. valid iOS remediation PASS but another SUT/platform has an unresolved FAIL_RUNNER → BLOCK STUDY-WIDE.
  14. more than one remediation execution → BLOCK.
  15. GitHub rerun attempt >1 → BLOCK.

  Return the exact expected result for every case.

  ## 7. TOOLCHAIN VERSION — FACTUAL TRANSCRIPTION REVIEW

  Inspect the semantics of:

  `tools.mobile_fallback.version`

  and all schemas/consumers.

  The existing manifest provenance stated that this field stayed null until Appium 3 was installed/observed during an explicitly authorized operation.

  That condition has now occurred.

  Formal AUTH-02 evidence records:

  Appium core:

  `3.7.0`

  on Android and iOS.

  Therefore determine whether the repository's existing semantics support the factual transcription:

  `tools.mobile_fallback.version: "3.7.0"`

  If yes, make that factual correction now.

