  install_date_platform: "LEFT NULL -- a single value would misrepresent ephemeral installs on two dates (2026-09-27, 2026-09-29) and two host platforms (Linux x86_64 ubuntu-24.04; Darwin arm64 macos-15). Repository convention followed: the Mobilewright formal gate's ephemeral installs are recorded as an observation block (tools.mobile_primary_candidate.formal_gate_observation_auth_03), so the Appium 3 observations are recorded in tools.mobile_fallback.compatibility_smoke_observations (three per-run entries). The top-level installed flag stays false with a comment"
  g7_version_check: "CAN REMAIN UNCHANGED -- its intended source is tools.mobile_fallback.version, which now holds the formally observed 3.7.0; the check passes on the canonical tree (verified statically after e77feb4) while every blocking check (status, FAIL_RUNNER, admissibility) still fails closed. The check was not removed or weakened to make any simulation pass"

android_pass_reuse_rationale:  # policy v3 draft 9.7.12
  statement: "the AUTH-02 SUT-02 android PASS remains an immutable valid compatibility observation; an iOS-only remediation does not re-run Android; a successful iOS remediation may combine prospectively with the recorded Android PASS for per-platform admission; AUTH-02 is not reinterpreted"
  basis:
    - "the object of the smoke is the runner's execution stack (9.2); the study-authored WebDriver client and harness are not the runner (9.3)"
    - "the QUAL-U06 correction changes no endpoint, payload, locator, realization, or oracle; it only lets the client wait up to the declared budget instead of a shorter implicit transport limit and records the underlying cause of transport failures"
    - "the recorded Android exchanges all completed normally: 18 HTTP responses, all 200 (formal/APPIUM3-COMPAT-SMOKE-AUTH-02/SUT-02-android/appium-server.log); POST /session 200 in 24920 ms (line 226); no transport limit bore on any of them, so a longer permitted wait and a richer failure record cannot change their classification"
    - "the Android PASS is evidence that Appium 3.7.0 + appium-uiautomator2-driver 8.7.0 exercises MC-01, MC-02, MC-06, MC-04, MC-08, MC-10 on the pinned build; the remediation exists to exercise iOS session establishment fairly, not to change the Android capability definition"
  conditions: "the successor lock must show REALIZATION.android of harness/smoke.mjs and the Android command sequence byte-unchanged (the shared realizationSha256 covers both platforms, so the Android block is compared explicitly); otherwise the Android PASS cannot be combined. The smoke qualifies the runner, not a campaign executor"

