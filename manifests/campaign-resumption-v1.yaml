          effect: "the planning dates (DATA FREEZE 2026-12-15, FINAL FREEZE 2027-01-08, LACCEI full-paper submission 2027-01-29) are not changed by this record; the attempt is made and the position is reviewed in about two days (about 2026-11-04); no campaign is dropped by this record"
