      question_sha256: 5ebd444543043efb44aaf07215ce22d082cffddc05f7ce2f64045114602dcdb9
      options_as_presented:
        - "Web/API en orden (Recomendada): empiezo preparando E02 (completa H2, reutiliza lo de E03), luego E04/E05 (H3), E08-E11 y E12. E06/E07 quedan sin celdas moviles porque el runner movil sigue en UNRESOLVED_AFTER_FALLBACK_FAILURE. Preparo solo borradores de configuracion; cada START y cada dispatch siguen pidiendo tu autorizacion."
