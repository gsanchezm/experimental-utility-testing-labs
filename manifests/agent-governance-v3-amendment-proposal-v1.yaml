 PROTO-U20 (2026-10-02; adopted as written by the human research lead), which authorizes DRAFT preparation only; decision package manifests/agent-governance-v3-amendment-proposal-v1.yaml; protocol/unresolved.md PROTO-U20 |\n \n-## What changed relative to v1, and why\n+**DRAFT — PROPOSED POST-DATA SUCCESSOR, NOT IN FORCE.**\n \n-Repository history through the E01 freeze established six roles besides ORCHESTRATOR (AUDITOR-SUT01-OMNIPIZZA … AUDITOR-SUT06-WEBDRIVERIO, ADJUDICATOR-EU-01, QUALIFIER-MOBILE-01), none of which is authorized to execute an experimental campaign under experiments/E02–E12 (auditors are scoped to E01 only, by definition and by write boundary; ADJUDICATOR-EU-01 reads audits and writes only derived-data/adjudication/; QUALIFIER-MOBILE-01 is scoped to the mobile runner qualification gate and compatibility smoke, not to any SUT's experimental data). Now that a human has selected E03-resetability as the next campaign for PRE-START preparation (2026-09-21), this version adds the minimum role needed to eventually execute E03, and nothing else:\n+- It is a proposed successor to protocol/agent-governance-v2.md; v2 remains the agent-governance document in force until this draft is explicitly approved and frozen by a human decision.\n+- It is prepared after data collection began (`data_collection_started` has been true since 2026-09-17, manifests/study-manifest.yaml); if approved it is a post-data change under protocol/change-control-v1.md, section 5.\n+- It reinterprets nothing collected under v1 or v2.\n+- No workflow for E02 or E04–E12 may be authored, and no campaign may be executed, under it while DRAFT (protocol/change-control-v1.md, section 2).\n \n-- **Added:** Section 3.5, role **EXECUTOR-E03-RESETABILITY**.\n-- **Unchanged:** every role, responsibility, write boundary, and rule from v1 (sections 1, 2, 3.1–3.4, 4 apart from the one added row, 5, 6) is carried forward verbatim in substance; this document restates v1's structure for completeness (frozen documents are never edited in place, so a full restated document is the versioning mechanism,\
    \ per protocol/change-control-v1.md, section 4) but changes nothing about ORCHESTRATOR, the six auditors, ADJUDICATOR-EU-01, or QUALIFIER-MOBILE-01.\n-- **Not created:** no generic \"EXECUTOR\" role for E02 or E04–E12. Each future campaign that needs an executor role gets its own minimum addition, on its own campaign-selection operation, per AGENT-INSTRUCTIONS.md rule 15 and this document's own Section 3.5 scope limit.\n-- **Not created:** the E03 executor's frozen agent prompt (prompts/frozen/). That is a separate, later step in the campaign-start sequence (prompts/README.md; protocol/change-control-v1.md, section 6, step 6 — applied here at campaign start, not protocol freeze, since protocol v1 is already frozen and this is a campaign-level prompt).\n+## What changed relative to v2, and why\n \n-**Revision (same day, 2026-09-21, still DRAFT — no freeze occurred between revisions):** reconciled against the finalized E03 configuration-completion work: (a) the Section 3.5 counting-rule citation now points to `protocol/setup-effort-v2.md` (FROZEN-PRE-DATA), since issue (xviii) was resolved by human ruling `ISSUE-XVIII-RULING-01` in the same operational thread; (b) Section 3.5 gains explicit CI/CD-related permissions and an explicit prohibition on rewriting a previous attempt, matching the reproducibility/attempt model in `experiments/E03-resetability/ci-cd-execution-model.md`; (c) Section 4 gains one new, **proposed, not granted**, write-boundary row for a future CI-config path (`.github/` or equivalent), since no such path is authorized for any role today and this document cannot grant it unilaterally. Still DRAFT throughout; nothing in this revision changes the freeze requirement below.\n+Human decisions of 2026-10-02, given to the study's independent orchestration reviewer and relayed to the ORCHESTRATOR (verbatim with SHA-256 in manifests/agent-governance-v3-amendment-proposal-v1.yaml), make GitHub Actions the execution substrate for E02-state-establishment and for E04-repeatability through E12-localization-i18n, executed under ORCHESTRATOR coordination without a new executor role, and choose this successor over a representation-only escalation record. The frozen v2 limits the ORCHESTRATOR's `.github/workflows/**` permission to \"authorized E03-resetability GitHub Actions infrastructure only\" (Sections 3.1 and 4), and AGENT-INSTRUCTIONS.md rule 16 makes this document the definition of write boundaries, so a second CI grant recorded only in AGENT-INSTRUCTIONS.md would leave the frozen role definition narrower than the authority in force. Coordinated execution itself was already permitted by v2 (Section 4, row `raw-data/` (E02, E04–E12): \"Campaign execution only, under ORCHESTRATOR coordination\"); this version states its rules explicitly. Since 2026-10-02, approvals and instructions also reach the ORCHESTRATOR through the study's independent orchestration reviewer, a channel v2 does not describe (protocol/unresolved.md, PROTO-U20).\n \n-**Revision (2026-09-22, still DRAFT — no freeze occurred; explicit human decisions of the E03 PRE-START corrective operation, applied and nothing more):** (a) Section 3.5 gains an explicit **READ boundary** for EXECUTOR-E03-RESETABILITY (what it may read; that it must never read another SUT's measured outputs during campaign execution; that common pre-frozen study inputs are readable by every executor); (b) Section 3.5's CI/CD permissions are concretized for **GitHub Actions**, the human-selected E03 orchestrator, with an explicit prohibition on authoring or modifying any workflow and on changing repository settings, runner images, retry, concurrency, pinned runtime versions, or artifact-retention policy, merging pull requests, or approving its own changes; (c) Section 3.5's **WRITE boundary** now lists every path this role must not modify, including `.github/workflows/**`, `research-status.html`, and `AGENT-INSTRUCTIONS.md`; (d) Section 4's CI-config row is no longer \"proposed\": the `