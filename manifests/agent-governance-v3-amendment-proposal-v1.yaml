  - OP-PREP-01 (your draft, sha256 031e1fce2e856eb744666a788eb07615e808a741c255e5f5f6198118860aa947), whose compatibility analysis the reviewer re-read and accepts: the execution model is compatible with the frozen agent-governance-v2 (section 4 row for raw-data/ of E02, E04–E12; section 3.5), but the workflow-authoring scope is not (section 3.1 and the section 4 cell limit `.github/workflows/**` to "authorized E03-resetability GitHub Actions infrastructure only"; AGENT-INSTRUCTIONS.md rule 16 makes the governance document the definition of write boundaries). The reviewer's earlier reading "no governance amendment needed" was correct for the execution model and incorrect for workflow authoring; the reviewer adopts your Option A and will put it to the human as a decision at the freeze gate.
  - The reviewer's decision of 2026-10-02 (answer to OP-GOV-01 open point 4): the external orchestration-review relay channel is to be recorded in a PROTO-U row and incorporated in the governance successor.

  WHAT TO PREPARE
  1. protocol/agent-governance-v3.md — DRAFT; header (Document, Protocol version v3, Protocol state DRAFT, Study, Created, Supersedes "none while DRAFT; proposed successor of protocol/agent-governance-v2.md …", Freeze approval "none (DRAFT, not approved)"); a "What changed relative to v2, and why" section; everything else carried over from v2 verbatim except the minimal delta:
