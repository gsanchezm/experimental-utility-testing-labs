  text: |
    ### Campaign CI/CD infrastructure for E02 and E04–E12 — authorization (CAMPAIGN-CI-WRITE-AUTH-01)

    Human decisions, 2026-10-02 (given to the study's independent orchestration reviewer and relayed to the ORCHESTRATOR): **GitHub Actions is the execution substrate for E02-state-establishment, E04-repeatability, E05-determinism, E06-cross-platform-parity, E07-cross-layer-continuity, E08-performance, E09-accessibility, E10-visual, E11-security, and E12-localization-i18n**, and these campaigns are executed under ORCHESTRATOR coordination without a new executor role (protocol/agent-governance-v3.md, Section 3.6; Section 4, row "`raw-data/` (E02, E04–E12): Campaign execution only, under ORCHESTRATOR coordination"). The workflow-authoring scope of this authorization is incorporated in protocol/agent-governance-v3.md, Sections 3.1 and 4, frozen together with this section; the human research lead chose that governance successor on 2026-10-02 (manifests/agent-governance-v3-amendment-proposal-v1.yaml). Under this specific authorization only:

    - The ORCHESTRATOR role may create and maintain `.github/workflows/**` for authorized GitHub Actions infrastructure of E02, E04, E05, E06, E07, E08, E09, E10, E11, and E12: configuration validation, provisioning / environment verification, and gated measured execution. `.github/workflows/**` remains the only CI-configuration path any role may write, and no other path under `.github/` is authorized for any role. The E03 grant (E03-CI-WRITE-AUTH-01, above) is unchanged.
    - **Execution model (ORCHESTRATOR coordination).** The ORCHESTRATOR dispatches a campaign workflow only on an explicit human approval of that exact dispatch, records the dispatch before it runs and the run identity after it starts, and never re-runs a run or a job: a further attempt is a new dispatch under its own approval. Every artifact enters the repository only through an import by the ORCHESTRATOR that first verifies every archive against its GitHub digest; MEASURED_EXPERIMENT artifacts are written only under `raw-data/<campaign-id>/<SUT>/**` (raw-data/README.md), and non-measured records never enter raw-data/. Measured outputs of different SUTs stay isolated: a measured job checks out only the common frozen inputs and its own SUT's raw-data subtree, never another SUT's, and no measured output of one SUT is an input to a measured job of another SUT (protocol/agent-governance-v3.md, Section 3.6, applying the isolation rule of Section 3.5). No executor role exists for these campaigns, and none is launched.
    - Every **MEASURED_EXPERIMENT** of these campaigns runs only through its frozen GitHub Actions execution path. Local executions are permitted only as DEVELOPMENT, SYNTAX_VALIDATION, TOOL_QUALIFICATION, SMOKE, ENVIRONMENT_VERIFICATION, or DRY_RUN and never enter a measured dataset. Each measured workflow fails closed unless every frozen input and gate it enumerates is present: the campaign's START (protocol/change-control-v1.md, section 7) and its human authorization id; the locked "Campaign configuration" record; a FROZEN mapping record for every canonical scenario the campaign uses (protocol/equivalent-scenario-mapping-v1.md); the run-manifest schema the configuration names; frozen agent governance; for Android and iOS cells, an admissible mobile runner (protocol/mobile-runner-policy-v3.md) and the compatibility smoke of the exact SUT × platform × runner; a controlled instance verified on GitHub Actions for every condition that requires one (protocol/study-design-v1.md, section 10.3); the pinned repository commit and workflow revision; the frozen prompt and the frozen implementation that the configuration names for the run; first attempt only; default branch only.
    - This section does not authorize: the START, selection, configuration, or freeze of any campaign; any dispatch without an explicit human approval of that dispatch; any executor role; other CI platforms; repository build automation unrelated to the study; any change to the E03 workflows or gates.
    - The public-repository requirement and the publication-hygiene rule of the E03 section (above) apply unchanged to every workflow, job, artifact, commit, and record made under this authorization.
