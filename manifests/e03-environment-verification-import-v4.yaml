instruction_verbatim: |
  EUS-2026-001 — OP-ENV-10 — IMPORT THE RUN 37354458611 ENVIRONMENT_VERIFICATION ARTIFACT BYTE-EXACT AND TRANSCRIBE THE GITHUB ACTIONS VERIFICATION STATE OF E03-CS001-SUT05-API (VERIFIED UNDER THE OP-CI-02 REVISION; THE EIGHT OTHER CONDITIONS KEEP RUN 37265782721; ALL NINE VERIFIED UNDER THE LATEST-RUN RULE; NON-MEASURED; NO DISPATCH; NO EXPORT)

