audit_of_the_imports:
  method: >
    two read-only scripts (untracked scratch, not part of the repository; audit_e11.py and audit_redownload_e11.py of the operator records), the first run on the dispatch worktree (branch head 48e3f3c3b4e3c5cf2d6c2609a2640f1e4213916b, against the base 5b0675f6)
    and the GitHub run list, the second over the 28 archives with the option that re-downloads them from GitHub (GET only); both before any edit of the freeze
  checks: >
    the directories equal the expected set (50 run directories plus the job directory for each of the 14 cells); every import record names its record class, campaign, cell, SUT, attempt, operation and authorization, and is consistent (workflow success, three jobs success,
    run attempt 1, head sha equal to public main, 50 manifests, both archives verified against the digest GitHub reports at the import, verification flags true); the files each record lists equal the files on disk, with their bytes and sha256; every run manifest names its campaign, SUT, cell, run id,
    attempt, role, prompt version, protocol version, platform and environment and every file it lists exists with the listed sha256; the run manifests' category counts equal the condition summary of the record (consistency only, no interpretation); the ci-provenance of every run directory is byte-identical to the job-level one
    and names the run, the workflow hash, the implementation and the prompt; each dispatch record has the events in the locked order under its authorization, the cells in the locked order, each dispatch recorded before its clock reading and after the import of the cell before it,
    and the run id, clock readings and bundle digest equal those of the import record; in git, each DISPATCH_RECORDED line was committed before the dispatch clock reading of its cell, the dispatch records only ever grew by appended lines, no path was modified, deleted or renamed in the range, the range holds exactly the two record-opening commits and the 14 import commits,
    and no commit message carries an attribution token; GitHub lists exactly 14 runs of the measured workflow, all success, all workflow_dispatch on main at the pinned head, and the artifact digests equal the recorded ones; the 28 archives were re-downloaded from GitHub, every digest equals the recorded one and every member (9830 in all) equals the committed file
  result: {run_directories: 700, job_directories: 14, files_listed_and_verified: 9816, archives_redownloaded: 28, archive_members_compared: 9830, defects: 0}
  note_on_the_first_run: "the first run of audit_e11.py reported one finding: the script expected the workflow run numbers in a wrong sequence (it expected 1 and 2 and then 1 to 12, instead of 1 to 14, the contiguous numbers of the workflow's run list, which is what the 14 import records hold); the expectation of the script was corrected and the second run reported zero findings; no finding was about the data"
  observed_outcomes: "workflow conclusion success in 14 of 14 runs (700 of 700 executions imported); the one anomaly each import record quotes from the job log is the GitHub notice that the actions in use target Node.js 20 and are run on Node.js 24, the same kind of line in all 14; no tally of the run-manifest outcome or category fields is recorded here, because the frozen dispatch prompt (section 5) forbids summarizing across runs or conditions, as in the E04, E06 and E07 freezes; the outcomes stay in the run manifests, the attempt records and the condition summaries of the import records, unanalyzed"
effect: >
  From this moment raw-data/E11-security/ is append-only in the sense of raw-data/README.md: every existing raw file is immutable, and a further run may be appended only with a "run appended after campaign
  freeze" row in protocol/CHANGELOG.md stating the reason (raw-data/README.md, rule 1). The campaign configuration record is immutable. The measured-execution workflow requires the campaign status IN_PROGRESS (gate G-1),
  so it refuses every dispatch from the freeze on; a run appended after the freeze would need its own change-log row and a CI correction. Reopening the campaign follows protocol/change-control-v1.md, section 5 in full.
