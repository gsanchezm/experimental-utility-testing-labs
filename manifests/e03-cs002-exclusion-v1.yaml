notes: |
  The ruling text above was supplied verbatim in the instruction that authorized this operation
  (section 1.3) and is reproduced without alteration. The instruction also fixed the general
  methodological rule for E03 canonical scenarios (independence from SUT-specific implementation
  evidence), which this record restates by citing the frozen protocol text it corresponds to
  rather than authoring new rule text. E03-resetability remains NOT_STARTED; nothing in this
  record authorizes execution.
