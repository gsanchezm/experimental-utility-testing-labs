        commit_sha: 3cdbe6596a1ab5ef2058ba4259c44da96a0fa03a  # commit underlying tag v1.1.8; default-branch HEAD is 9ca37674d374e9303912e259641ee86baf3aabe1
        release: v1.1.8
        endpoint: null
        provenance_status: PINNED_RELEASE
        pin_timestamp: "2026-09-16T23:20:44Z"
        verified_by: ORCHESTRATOR
        verified_at: "2026-09-16"
        notes: "Release v1.1.8 published 2026-07-22, target main. Android artifact: omnipizza-release.apk (also omnipizza-debug-androidTest.apk). Binary not downloaded during this orchestration task."
      ios:
        presence: UNCONFIRMED
