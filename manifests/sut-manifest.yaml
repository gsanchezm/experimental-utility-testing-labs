# manifests/sut-manifest.yaml
# Registry of the six evaluated testing laboratory ecosystems (SUT = system under test) for EUS-2026-001.
# Phase: SETUP. Every SUT uses the identical record structure; no SUT is privileged.
# Component entries are surfaces to verify in E01-capability-audit, not claims of existence.
# Unknown values are null, never a guess. Editable by ORCHESTRATOR only (protocol/agent-governance-v1.md).
#
# Provenance pinned during E01 orchestration preparation (2026-09-16), under explicit human instruction
# naming each repository (manifests/README.md, "Provenance sequence", step 1; protocol/agent-governance-v1.md,
# section 3.1). `presence` stays UNCONFIRMED until E01 verifies it; a pinned repository is not capability
# evidence and does not imply any surface is present, functional, or controllable — that is an E01 finding.
# provenance_status vocabulary: PINNED_SOURCE (pinned to a source commit on the default branch);
# PINNED_RELEASE (pinned to the commit underlying a tagged release, used when the ecosystem ships or is
# evaluated as a built artifact); HOSTED_MAPPING_UNVERIFIED (a public hosted endpoint exists but its exact
# correspondence to the pinned commit is not independently verified — noted per component below, not a
# capability finding); COMPONENT_ELIGIBILITY_UNRESOLVED (not used below: every component considered for this
# manifest satisfied the component-eligibility rule; none remained unresolved).
manifest_version: v1
protocol_version: v1
unit_of_comparison: "testing laboratory ecosystem"
provenance_policy: >
  Unknown values are null. No commit SHA, release, repository URL, or deployment
  endpoint may be entered without recording who verified it and when. Component
  presence is UNCONFIRMED until the E01 audit verifies it; absence of a listed
  surface is a finding, not a manifest defect. Every ecosystem lists the same
  four surfaces (web, api, android, ios) with the identical record structure,
  so the manifest encodes no prior belief about what any ecosystem has. The
  provenance sequence (who pins the evaluated version, when, and who verifies
  presence) is defined in manifests/README.md. Environment is provenance, not
  utility: whether a controlled instance can be established is recorded per SUT
  after E01 (controlled_instance_available) and the environment of every run is
  recorded per run (environment_type); neither enters any capability score.
suts:
  SUT-01:
    ecosystem_name: OmniPizza
    role: "general-purpose candidate"
    audit_directory: audits/SUT-01-omnipizza
    controlled_instance_available: null  # true | false — true only if every surface E01 confirms present can run from the pinned version in a controlled environment (SELF_HOSTED/LOCAL for web, api; EMULATED/SIMULATED for android, ios); verified in E01 or, as here, by separately human-authorized provisioning at or before E03's campaign-configuration lock (protocol/unresolved.md, PROTO-U08 resolution), transcribed by ORCHESTRATOR; experimental-control fact, not a score (protocol/study-design-v1.md section 10.5). Status 2026-09-22: null — not inferred. 2026-09-22 (human-authorized NON-MEASURED PRE-START provisioning): the web and api surfaces run as a verified LOCAL controlled instance (manifests/provisioning/SUT-01/SUT01-PROV-0001.yaml; experiments/E03-resetability/environment-verification/SUT-01-web-api.json), but the E01-confirmed android and ios surfaces were not provisioned (no E03 condition uses them), so the every-confirmed-surface criterion of protocol/study-design-v1.md section 10.5 is not established; per-condition status: experiments/E03-resetability/controlled-instance-status.yaml
    evaluated_version_frozen: false
    # the same four surfaces are listed for every SUT and were verified in E01; presence transcribed from the E01 auditor record 2026-10-02
    # OmniPizza is one monorepo (gsanchezm/OmniPizza): web = frontend/, api = backend/, android+ios = frontend-mobile/
    # (one shared cross-platform mobile codebase). Eligibility: named explicitly by human instruction for this
    # study (manifests/README.md provenance sequence, step 1); repository is not a fork, MIT-licensed, active.
    components:
      web:
        presence: CONFIRMED
        component_id: SUT-01-web
        repository: https://github.com/gsanchezm/OmniPizza
        default_branch: main
        commit_sha: 9ca37674d374e9303912e259641ee86baf3aabe1
        release: null
        endpoint: https://omnipizza-frontend.onrender.com
        provenance_status: PINNED_SOURCE
        pin_timestamp: "2026-09-16T23:20:44Z"
        verified_by: ORCHESTRATOR
        verified_at: "2026-09-16"
        notes: "Hosted endpoint is a Render deployment; its exact correspondence to the pinned commit is not independently verified (HOSTED_MAPPING_UNVERIFIED caveat) — source pin above is the primary provenance."
      api:
        presence: CONFIRMED
        component_id: SUT-01-api
        repository: https://github.com/gsanchezm/OmniPizza
        default_branch: main
