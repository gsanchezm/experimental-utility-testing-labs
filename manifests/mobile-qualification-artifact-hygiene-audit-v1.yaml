  fragment_with_complete_signature_segment: 0
  redacted_forms_elsewhere: "record.json (22 per tree), harness-precheck.json (22 per tree), <platform>-catalog-snapshot.json (2 per tree): 12-character header prefix + <redacted-token> (header-only characters, a public constant)"
  host_local_paths: "0 in any text artifact (host-path placeholders only). Pattern hits inside PNG image data are byte-pattern noise (random drive-letter-like byte sequences in compressed pixel data); PNG metadata holds only eXIf chunks, none containing a path"
  unrelated_secrets: 0  # none of the secret families above
  false_positives_classified: ["the testID input-password (password-assignment pattern)", "Android framework strings ending in @classes.dex / @classes.vdex (e-mail pattern)"]
