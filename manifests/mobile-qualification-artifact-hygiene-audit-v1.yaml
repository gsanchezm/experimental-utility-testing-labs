    payload_segment: "truncated (101 or 107 characters kept); does not decode completely; visible claim keys: sub (the documented qualification test account), behavior, sid (session identifier, value cut mid-string: 23 or 26 characters kept, closing quote not reached); no expiry or issued-at claim visible"
    signature_segment: absent  # length 0 in every fragment
    truncation_marker: "runner log-line limit: ellipsis followed by a byte total (333 or 339 bytes)"
    distinct_tokens: "44 fragments, 44 distinct session-identifier prefixes (one login per MQ3 execution; none shared between lineages)"
