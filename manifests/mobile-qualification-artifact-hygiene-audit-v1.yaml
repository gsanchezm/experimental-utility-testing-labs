deviation:
  predeclared_statements:
    - {source: "qualification/mobilewright/README.md, section 'Scenario realization', MQ3 deep-link cell (locked: implementation-lock v2 section hash f79acf6380cb82acabd1971e90a5fcfc339bee54146a239501d6b53b57239018)", statement: "the token is redacted in every kept artifact"}
    - {source: "qualification/mobilewright/README.md, section 'Gate implementation', Publication hygiene paragraph", statement: "every kept artifact is scrubbed by the orchestrator of ... bearer tokens"}
  observed: "each MQ3 runner.log keeps the deep link as logged by the runner's debug output (mobilecli), cut by the runner's own log-line limit (the line ends with an ellipsis and a byte total); the kept span contains the complete JWT header segment and a truncated leading part of the payload segment of the access token"
  mechanism: "the locked scrubber (harness/run-gate.mjs scrubText and harness/backend.mjs redact) replaces only complete three-segment JWTs (a pattern requiring header, payload, and signature segments of at least five characters each); the truncated two-segment span in runner.log does not match and was kept. Records and prechecks, which held the complete token, carry the redacted form: a 12-character prefix of the header segment followed by <redacted-token>"
  qualifier_record_before_this_audit: "qualification/mobilewright/README.md, AUTH-03 Run provenance, row 'Kept-artifact hygiene' (commit 332b470), already described the truncated deep link in each MQ3 runner.log as 'header and part of the payload only; not a usable credential' without classifying it as a deviation from the statements above"
  classification: QUALIFICATION_ARTIFACT_HYGIENE_PROVENANCE_DEVIATION
  fragment_class: INCOMPLETE_UNUSABLE_TOKEN_FRAGMENT
  effects:
    artifact_hygiene_and_publication_handling_only: true
    changes_execution_outcome: false
    changes_attribution: false
    changes_gate_decision: false
    authorizes_rerun: false
    canonical_evidence_immutable: true  # no artifact is rewritten, redacted, or deleted in the canonical repository

method:
  scope: "every file under qualification/mobilewright/output/ (434 files, quarantined AUTH-01 lineage) and qualification/mobilewright/formal/MOBILE-QUALIFICATION-EXEC-AUTH-03/ (432 files, formal AUTH-03 lineage); the question of section 9 concerns the MQ3 runner.log files, the rest was scanned for completeness"
  checks: "JWT-looking spans (base64url text starting with the JSON-object prefix of a JWT header), their segment count and lengths, whether a signature segment exists, whether the header and the payload decode as JSON (decoded values were read by the script only to classify claim keys and completeness, never printed); Authorization headers and Bearer values; accessToken URL parameters; access_token JSON fields; host-local path prefixes (/Users/, /home/, /private/var/, /var/folders/, /opt/hostedtoolcache, /Volumes/, drive letters, /tmp/) in text; PNG text chunks (tEXt, zTXt, iTXt, eXIf); secret families (GitHub tokens, AWS access keys, provider API keys, Slack tokens, Google API keys, private-key blocks, Actions runtime tokens, password / secret / api-key assignments); cookie and authentication headers; e-mail addresses; IP addresses"
  output_policy: "counts, lengths, booleans, paths, and SHA-256 only"

