    classification: DOCUMENTED_PUBLIC_TEST_ACCOUNT_CREDENTIAL
    note: "the documented qualification test account password, which the frozen Scenario realization itself records verbatim (already public in qualification/mobilewright/README.md on public main); not an unrelated secret; not covered by the MQ3 access-token redaction statement; listed for the human's publication review"
