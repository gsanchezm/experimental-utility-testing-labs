# manifests/mobile-qualification-artifact-hygiene-audit-v1.yaml
# Post-run artifact-hygiene audit of the MQ3 runner.log files of both Mobilewright qualification lineages, performed by
# the ORCHESTRATOR on 2026-09-24 under the POST-QUALIFICATION RECORDING OPERATION instruction (verbatim in
# manifests/mobile-runner-switch-transcription-v1.yaml, section 9 of the instruction). It records counts, classes, hashes,
# and paths only: no token fragment, decoded claim value, or credential is reproduced here or in any report. Escalations:
# qualification/unresolved.md QUAL-U03 (recorded by QUALIFIER-MOBILE-01) and protocol/unresolved.md PROTO-U13 (ORCHESTRATOR
# mirror). Read-only audit: no artifact, realization, lock, harness file, or export record was modified. Not qualification
# evidence and never evidence about any system under test (SUT). Written once; corrected by a new version file.
