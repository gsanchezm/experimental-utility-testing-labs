    # EUS-2026-001 — PREPARE AND FREEZE APPIUM 3 COMPATIBILITY SMOKE

    I, gilbertosanchez, human research lead for EUS-2026-001, authorize a PRE-EXECUTION PREPARATION operation for the Appium 3 compatibility smoke required before the SUT-02 Android and iOS mobile conditions may become E03-ready.

    This instruction authorizes preparation only.

    It DOES NOT authorize execution of the compatibility smoke.

    It DOES NOT authorize any SUT launch, Appium session, Android emulator smoke, iOS Simulator smoke, workflow_dispatch, E03 START, or E03 measured execution.

    The objective is to produce a fully reviewable, version-pinned, fail-closed implementation baseline BEFORE any compatibility-smoke outcome is observed.

    ## 1. AUTHORITATIVE STARTING STATE

    Verify first from a fresh public v25 checkout:

    Public HEAD:

    `9540e03b203006027a4f76609f5d4f9a303280ff`

    Expected public tree:

    `a6220f379da6d5650a18d2cb70ca229022f01974`

    Expected v25 canonical source:

    `92b8c6e12a066d6f527d242122b3470e603ef5c8`

    Expected selected mobile runner:

    `Appium 3`

    Expected selected version pin:

    `3.7.0`

    Expected state:

    `MOBILEWRIGHT_QUALIFICATION = COMPLETE_FAIL`

    `AUTH_03 = ISSUED_VALID_CONSUMED`

    `AUTH_03_DISPATCH_COUNT = 1`

    `COMPATIBILITY_SMOKE = NOT_STARTED`

    `E03 = NOT_STARTED`

    Verify before changing anything.

    If these conditions do not hold, STOP.

    ## 2. DO NOT REOPEN MOBILEWRIGHT

    Do not:

    - execute Mobilewright;
    - create AUTH-04;
    - rerun AUTH-03;
    - alter the formal qualification result;
    - alter the frozen Section 8 switch;
    - change Appium 3 back to a candidate.

    The study-selected mobile runner is already Appium 3.7.0 as a mechanical consequence of the frozen Section 8 switch rule.

    This preparation is only for Section 9 compatibility smoke.

    ## 3. VERIFY SUT-02 MOBILE-SURFACE PROVENANCE

    Before preparing the smoke, reconcile the factual source records WITHOUT silently changing them.

    Verify in:

    `derived-data/e01-adjudicated-matrix/E01-adjudicated-matrix.json`

    that SUT-02 has:

    Android Native:
    - confirmation_state = CONFIRMED
    - effective_confirmed_score = 3

    iOS Native:
    - confirmation_state = CONFIRMED
    - effective_confirmed_score = 3

    Verify the supporting E01 evidence ids.

    Also inspect:

    `manifests/sut-manifest.yaml`

    The current public snapshot appears to retain:

    `presence: UNCONFIRMED`

    for the SUT-02 Android and iOS component entries despite the completed E01 adjudication.

    Do NOT silently reinterpret or overwrite this discrepancy.

    Determine whether this is:

    - stale representation awaiting E01 transcription; or
    - an intentional distinction between initial manifest presence and adjudicated E01 presence.

    Record the determination and provenance.

    If correcting the manifest would require a new human decision under existing governance, leave it unchanged and report the blocker.

    The compatibility-smoke scope itself is justified only by the authoritative completed E01 result, never by inference.

    ## 4. FIXED SMOKE SCOPE

    Prepare exactly two compatibility-smoke realizations:

    `SUT-02 × Android × Appium 3`

    and

    `SUT-02 × iOS × Appium 3`

    No other SUT is part of this operation.

    This does not waive future Section 9 smokes for other mobile-capable ecosystems before campaigns that require them.

    The two results remain independent.

    Android PASS must never imply iOS PASS.

    iOS PASS must never imply Android PASS.

    ## 5. GOVERNING FROZEN DEFINITION

    Use only:

    `protocol/mobile-runner-policy-v1.md`, Section 9.

    Each SUT × platform smoke consists of one clean execution that:

    - installs and launches the pinned build — MC-01;
    - locates one element by stable identifier — MC-02;
    - performs one navigation — MC-06;
    - performs one native-control interaction — MC-04;
    - reads one UI state — MC-08;
    - captures execution artifacts — MC-10.

    Result vocabulary remains:

    `PASS`

    `FAIL_RUNNER`

    `NOT_EXECUTED`

    Do not add additional pass criteria.

    Do not use duration as a criterion.

    Do not turn this into Appium-vs-Mobilewright benchmarking.

    Do not use the smoke as evidence about SUT-02.

    ## 6. PIN THE SUT-02 BUILDS BEFORE IMPLEMENTATION FREEZE

    Verify the pinned source/release identities already present for SUT-02.

    Expected Android lineage:

    repository:
    `https://github.com/saucelabs/my-demo-app-android`

    commit:
    `36b012eecdf6a2b488b9504e16b3d0c3ca9a0e7b`

    release:
    `2.2.0`

    expected release artifact name:
    `mda-2.2.0-25.apk`

    Expected iOS lineage:

    repository:
    `https://github.com/saucelabs/my-demo-app-ios`

    commit:
    `031358f56903742103a02d086f8af76735bb31a7`

    release:
    `2.2.2`

    reported release artifacts include:
    `SauceLabs-Demo-App-Runner.Simulator.XCUITest.zip`

    and an XCUITest IPA.

    Verify the actual current release records and artifact availability.

    Downloading artifacts for provenance/hash inspection is permitted.

    Launching or installing them is NOT permitted under this instruction.

    Compute and record SHA-256 for the exact artifacts that a future smoke would consume.

    For iOS, verify statically that the chosen artifact actually contains or yields an application installable on the pinned iOS Simulator substrate.

    Do not assume an IPA intended for physical devices is simulator-installable.

    If no reproducible simulator-installable pinned artifact can be established, STOP with:

    `IOS_SMOKE_PREPARATION_BLOCKED`

    Do not substitute another release or rebuild from source without explicit human review.

    ## 7. PIN THE APPIUM TOOLCHAIN COMPLETELY

    Appium core alone is not a complete execution toolchain.

    The existing selected core pin is:

    `Appium 3.7.0`

    Prepare exact compatible pins for the minimum additional tooling required to execute both smokes, including as applicable:

    - Android Appium driver;
    - iOS Appium driver;
    - Node runtime;
    - Appium client library;
    - any package manager / lockfile inputs necessary for deterministic installation.

    Use the minimum stack required.

    Do not introduce Appium 2.

    Do not globally install or execute Appium under this instruction.

    Package metadata inspection and lockfile-only dependency resolution are permitted.

    Record:

    - exact package;
    - exact version;
    - integrity/hash where available;
    - source/version provenance;
    - compatibility with Appium 3.7.0;
    - why each dependency is necessary.

    Avoid optional plugins unless the frozen smoke steps genuinely require them.

    ## 8. CONCRETE SMOKE REALIZATION MUST BE FIXED PRE-EXECUTION

    Using static source inspection, release metadata and documented identifiers only, define the exact realization for each platform BEFORE execution.

    For each SUT-02 platform predeclare:

    - application/package/bundle identity;
    - clean-start procedure;
    - launch procedure;
    - stable identifier used for MC-02;
    - exact navigation action used for MC-06;
    - exact native control used for MC-04;
    - exact UI state read for MC-08;
    - exact expected final state;
    - artifact set for MC-10;
    - timeout boundaries.

    Do not discover or change the realization after seeing an execution result.

    If static evidence is insufficient to establish a required identifier or expected state, report it as a preparation blocker.

    Do not run the app merely to discover an easier locator.

    ## 9. PLATFORM SUBSTRATES

    Prepare the compatibility smoke to run on controlled CI substrates suitable for the pinned apps and selected Appium toolchain.

    Prefer the already recorded study substrates where technically compatible:

    Android:
    - GitHub-hosted ubuntu-24.04;
    - API 35 google_apis x86_64;
    - pixel_7 profile;
    - EMULATED.

    iOS:
    - GitHub-hosted macos-15;
    - Xcode 16.4 build 16F6;
    - iPhone 16;
    - iOS 18.5;
    - SIMULATED.

    Verify compatibility rather than assuming it.

    Do not execute either substrate in smoke mode.

    Static workflow/configuration validation is permitted.

    ## 10. CREATE A DEDICATED FAIL-CLOSED SMOKE WORKFLOW

    No compatibility-smoke execution workflow currently exists.

    Prepare one narrowly scoped workflow for this operation.

    Treat it as E03 pre-start / qualification infrastructure and record the explicit human authorization for its creation.

    It must NOT run on push.

    It must require `workflow_dispatch`.

    It must fail closed unless supplied with a future, separately issued compatibility-smoke execution authorization id and explicit confirmation token.

    Prepare it so one future authorization can execute exactly:

    - SUT-02 Android once;
    - SUT-02 iOS once.

    The two results must remain independently recorded.

    Prefer a topology that makes provenance obvious, such as:

    gate
    → Android smoke
    → iOS smoke

    unless a documented technical reason requires another topology.

    No native GitHub re-run may silently replace either observation.

    Any repeat must require new explicit human authorization and new provenance.

    ## 11. WORKFLOW READINESS GATE

    Before either platform could run, the future workflow must verify at least:

    - frozen mobile-runner policy exists;
    - selected runner is exactly Appium 3;
    - selected version pin is exactly 3.7.0;
    - Mobilewright qualification is FAILED under the valid AUTH-03 lineage;
    - frozen Section 8 switch is recorded;
    - AUTH-03 is consumed and not being reused;
    - smoke authorization record is VALID, ISSUED and dispatch-eligible;
    - smoke implementation lock matches;
    - SUT-02 build identities/hashes match;
    - selected Appium dependency pins match;
    - exact Android/iOS realization exists;
    - output namespace for the new smoke authorization is absent/empty;
    - source records under qualification/compatibility-smoke/ are not pre-populated with results;
    - E03 remains NOT_STARTED.

    Preparation checks may exercise this gate statically only.

    Do not dispatch it.

    ## 12. OUTPUT ISOLATION

    Do not write execution data into the Mobilewright formal or quarantine trees.

    Prepare a dedicated immutable namespace under:

    `qualification/compatibility-smoke/`

    for the future Appium authorization.

    Do not create fake execution observations.

    Pre-execution metadata or `.gitkeep` is acceptable if consistent with repository conventions.

    The future platform executions must write separate Android and iOS artifacts with independent hashes.

    ## 13. IMPLEMENTATION LOCK

    Create an implementation lock for the compatibility-smoke realization analogous in purpose to the successful Mobilewright implementation lock, but do not copy unnecessary complexity.

    Lock the exact execution-critical artifacts, including:

    - workflow;
    - harness source;
    - package/lock files;
    - concrete smoke realization;
    - build acquisition/verification code;
    - Appium configuration;
    - platform scripts.

    Compute SHA-256 for each.

    Also compute one canonical hash for the complete concrete-realization section.

    The future readiness gate must recompute these hashes rather than merely trusting the lock manifest.

    ## 14. PREPARE, DO NOT ISSUE, THE EXECUTION AUTHORIZATION

    Prepare a new compatibility-smoke execution authorization id.

    Use a purpose-specific id, for example:

    `APPIUM3-COMPAT-SMOKE-AUTH-01`

    unless repository naming conventions require another exact form.

    Initial lifecycle must be equivalent to:

    `record_class: COMPATIBILITY_SMOKE_EXECUTION_AUTHORIZATION_DRAFT`

    `status: PREPARED_AWAITING_EXPLICIT_HUMAN_AUTHORIZATION`

    `authorizes_execution: false`

    `dispatch_eligibility: NOT_ELIGIBLE_UNTIL_ISSUED`

    `issued_by: null`

    `issued_at: null`

    This preparation is NOT issuance.

    Do not freeze/issue a live execution authorization merely because this instruction exists.

    The future human issuance must be a separate explicit act after review of this package.

    The actual workflow dispatch must then be a further separate explicit act unless the prepared lifecycle deliberately and transparently requires issuance + dispatch as two distinct steps.

    ## 15. WORKING PROMPT

    Prepare the working QUALIFIER-MOBILE-01 prompt for the future smoke.

    It must:

    - identify Appium 3.7.0 as the selected study runner;
    - restrict scope to SUT-02 Android and iOS;
    - use only the frozen Section 9 smoke definition;
    - forbid Mobilewright comparison;
    - forbid SUT evidence claims;
    - forbid changes to SUT/build/version;
    - forbid outcome-responsive repair;
    - forbid changing locators/steps after observing a failure;
    - require Android and iOS independent results;
    - require immutable artifacts;
    - distinguish FAIL_RUNNER from NOT_EXECUTED;
    - stop after the two smoke records are produced;
    - not start E03.

    Keep it WORKING / NOT DISPATCHABLE until separately frozen and issued.

    ## 16. MIRROR UPDATE RULE

    Do not change:

    `manifests/compatibility-smoke-status.yaml`

    to PASS during preparation.

    Its two entries remain:

    SUT-02 Android:
    `NOT_STARTED`

    SUT-02 iOS:
    `NOT_STARTED`

    Document the future transcription rule:

    Only after QUALIFIER-MOBILE-01 has produced a valid executed smoke record may ORCHESTRATOR mirror that exact result.

    No mirror value may precede its QUALIFIER source observation.

    ## 17. TOOLCHAIN MANIFEST

    Do not set Appium's study execution `version/install_date/platform` as though it had already been installed.

    The selected version pin remains 3.7.0.

    Any dependency pins prepared here are preparation metadata only.

    Actual installation facts are recorded only when the future authorized smoke installs/observes them.

    ## 18. STATUS DISCREPANCY HANDLING

    The current public dashboard has a minor stale "Public remote status" description referring to early exports.

    Do not let that affect this preparation.

    It may be corrected in the next publication snapshot after the compatibility-smoke phase.

    Do not create a new export solely for that cosmetic status text unless required by another correction.

    ## 19. STATIC TEST MATRIX

    Before returning, prove statically that the prepared workflow:

    - refuses the prepared-but-not-issued smoke authorization;
    - refuses a missing authorization;
