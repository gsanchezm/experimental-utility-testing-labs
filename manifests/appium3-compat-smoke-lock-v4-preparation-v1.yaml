facts_about_the_former_transport:  # observed in this operation by the static control test; no causal statement about the AUTH-02 run is made
  control_result: "control (observation only, not an assertion): failed after 301237 ms: POST /session: transport failure: fetch failed [error TypeError; cause HeadersTimeoutError/UND_ERR_HEADERS_TIMEOUT: Headers Timeout Error; after 301237 ms]"
  reading: "when no response arrives within about 300 s, the built-in fetch of Node.js 22 and 23 fails with a TypeError 'fetch failed' whose cause is HeadersTimeoutError (UND_ERR_HEADERS_TIMEOUT), however large the harness's own budget (here 1,200,000 ms); the corrected client waits the full 320 s delay and succeeds. The built-in fetch therefore could not honor the declared 1,200 s session-start budget, and its error carried the cause only in e.cause, which the former client discarded (QUAL-U06)."
  limit_of_the_reading: "the AUTH-02 iOS request ended 389 s after it reached Appium (record.json: step 08:02:54.548Z to 08:09:23.924Z; the request line of appium-server.log at 08:02:54.633), not about 300 s after, and the preserved artifacts carry no cause, so the control does not establish that the HTTP header timeout caused the AUTH-02 failure; the causal role of the former transport stays NOT_ESTABLISHED (qualification/unresolved.md QUAL-U06), and the remediation may end in any of the three results"
