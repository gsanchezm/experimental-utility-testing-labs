candidate_configuration_section: |
  ## Campaign configuration

  LOCKED at the E03 campaign START of {START_DATE} under the human authorization `{START_AUTH_ID}` (protocol/change-control-v1.md, section 7, moment 1: `campaign NOT_STARTED -> IN_PROGRESS`, change-log row of the same date). From that moment every item below is locked for the campaign: a change to any of them while IN_PROGRESS requires its own change-log row with the reason, and results collected before the change are analyzed under the earlier configuration. The section was promoted from `experiments/E03-resetability/campaign-configuration-draft.md` and is justified item by item in `manifests/e03-campaign-start-package-v1.yaml`; the executor realization rows, counting conventions, and the items confirmed at START are those of `experiments/E03-resetability/executor/README.md` (sections 3, 4, 11, 12) at the locked implementation hash.

  ### Canonical scenario and mapping record

  - Canonical scenario: **CS-001** (`experiments/scenario-mappings/CS-001.yaml`, sha256 `e251e3825ebbbe3aa1a0f3fee8a30131fa1e0910161ae583a09cb34d9f1cc583`), mapping_status FROZEN (`E03-CS001-FREEZE-AUTH-01`, 2026-09-21), the sole accepted canonical scenario of this campaign version; the active catalogue declares one scenario (`experiments/E03-resetability/canonical-scenario-catalogue.md`).
  - The second scenario record of the 2026-09-21 draft is EXCLUDED_FROM_CAMPAIGN (2026-09-22, human ruling; `protocol/CHANGELOG.md`; `manifests/e03-cs002-exclusion-v1.yaml`); it is preserved unchanged and is not an input to this configuration.
  - Population: six systems under test (SUT); SUT-06 stays a member and is NOT_COMPARABLE on CS-001 (NO_EQUIVALENT_INTENT), so it has no condition in this configuration.

  ### Pinned SUT versions

  `manifests/sut-manifest.yaml` (pinned 2026-09-16; presence transcribed 2026-10-02), copied here for the components that the executable conditions run; no pinned value is changed by the START.

  | SUT | Surface | Repository | Commit | Release |
  |---|---|---|---|---|
  | SUT-01 | web | https://github.com/gsanchezm/OmniPizza | 9ca37674d374e9303912e259641ee86baf3aabe1 | none |
  | SUT-01 | api | https://github.com/gsanchezm/OmniPizza | 9ca37674d374e9303912e259641ee86baf3aabe1 | none |
  | SUT-02 | web | https://github.com/saucelabs/sample-app-web | 60fdd634bb111c092282fa07977513a0a7765593 | none |
  | SUT-03 | web | https://github.com/browserstack/browserstack-demo-app | 7ab934d733f2f74d4b912e94e86f59ae0f6b7609 | none |
  | SUT-04 | web | https://github.com/mwinteringham/restful-booker-platform | d36bd3f8647a091d406e53bad463c5e3e5d2ece1 | 2.2 |
  | SUT-04 | api | https://github.com/mwinteringham/restful-booker-platform | d36bd3f8647a091d406e53bad463c5e3e5d2ece1 | 2.2 |
  | SUT-05 | api | https://github.com/juice-shop/juice-shop | 1618a611b173b4bf114028e6e02549950606e29d | v20.2.0 |

  The SUT-05 instance runs the packaged distribution of its pinned release v20.2.0; the tagged commit of that release (`5658473c`) differs from the pinned commit only in `screenshots/bundle-analysis.png` (executor README, section 2; the records of run 37354458611). The SUT-04 instance follows the route of the SUT's README (decision of 2026-10-06), as provisioned by the pinned workflow.

  ### Toolchain versions

  - Web runner: Playwright for Python 1.63.0, with the runtime dependencies pyee 13.0.1, greenlet 3.5.6, typing-extensions 4.16.0, each pinned by exact version with sha256 hashes in `experiments/E03-resetability/executor/requirements.txt` (sha256 `a88067fa0f79f0b2a92f5a3aca79908d5b6436db3c961f3836b8e9551df7a4ed`), installed with `--require-hashes --only-binary :all:`; Chromium is the build that this Playwright version names (chromium-1243, Chrome for Testing 153.0.8010.12), downloaded by `playwright install chromium`, not hash-pinned by the study, and its observed version is recorded per run (`manifests/toolchain-manifest.yaml`, `tools.web_runner`).
  - API client: the Python 3 standard library (`urllib.request`) of the runner's python3 (3.12 series on ubuntu-24.04); the observed version is recorded per run in the run manifest `toolchain` (`tools.api`).
  - Execution substrate: GitHub Actions, ubuntu-24.04 GitHub-hosted runners, through `.github/workflows/e03-measured-execution.yml` only; the SUT provisioning tools are those installed by that workflow at the pinned revision, and the workflow file sha256, the repository SHA, and the runner image are captured per run as gate and provenance outputs. For SUT-04 they are Temurin JDK 26, Apache Maven 3.9.14 (the version the SUT's README lists at the pinned commit; verified by its published SHA-512), and Node.js 24.21.0 (the version of the SUT-04 provisioning record); the SUT's README lists Node.js 24.14.1 and npm 11.11.0 as 'known to work with', and the study keeps 24.21.0 by the human decision of 2026-10-10 (sha256 `952750cd30bfeaf0ecd6f507c9f46106e311949d9f52b4de795b6bb6313a028f`), a difference documented here and not an operation of its own.
  - Mobile runner: not used (the two mobile conditions are blocked, below).

  ### Executor prompt, implementation, schema

  - Executor prompt version id: `EXECUTOR-E03-RESETABILITY-E03-resetability-v1` (frozen copy `prompts/frozen/EXECUTOR-E03-RESETABILITY-E03-resetability-v1.md`, sha256 `{PROMPT_SHA256}`).
  - Executor implementation: `experiments/E03-resetability/executor/run-condition.sh`, sha256 `b1ff4991233f31a3e43e54218c1c0605878251db329815b6cca0cee994836237` (3764 bytes); the digests embedded in that file cover every other implementation file (`executor/*.py`, `requirements.txt`), so this single hash locks the whole implementation (executor README, section 9).
  - Run-manifest schema: `schemas/run-manifest.schema.v2.json` (sha256 `9a86cf37c4ccd2abe3368866309e18a9f9554a2330f5dceeacda6d02a2932757`); `actions[].outcome` is mandatory on every emitted action record by campaign convention.
  - Agent governance: `protocol/agent-governance-v3.md` (sha256 `41429f2ccb7201da4ad55c2cd27df4057c9de41b43834d76cf6b943bd27922d4`), FROZEN-PRE-DATA since 2026-10-03.

  ### Conditions

  Nine conditions, all on CS-001, one per COMPARABLE SUT x surface used, reset direction only (establishing a state belongs to a different campaign). Seven are executable and are the conditions of this campaign (human decision D4 of 2026-10-05); two are recorded and blocked, not omitted.

  | Condition id | SUT | Surface | Reset mechanism | Predeclared reset-side Required Actions | environment_type | N per condition | Status at START |
  |---|---|---|---|---|---|---|---|
  | E03-CS001-SUT01-WEB | SUT-01 | WEB | API_RESET / SESSION_RESET (realization W-A of the executor README, section 4.2) | 2 | SELF_HOSTED (GitHub-hosted runner; verified by run 40361964609) | 50 (EX0001 to EX0050) | EXECUTABLE: CONTROLLED and VERIFIED on GitHub Actions |
  | E03-CS001-SUT01-API | SUT-01 | API | API_RESET / SESSION_RESET | 2 | SELF_HOSTED (GitHub-hosted runner; verified by run 40361964609) | 50 (EX0001 to EX0050) | EXECUTABLE: CONTROLLED and VERIFIED on GitHub Actions |
  | E03-CS001-SUT02-WEB | SUT-02 | WEB | APP_DATA_CLEAR | 2 | SELF_HOSTED (GitHub-hosted runner; verified by run 40361964609) | 50 (EX0001 to EX0050) | EXECUTABLE: CONTROLLED and VERIFIED on GitHub Actions |
  | E03-CS001-SUT03-WEB | SUT-03 | WEB | SESSION_RESET | 2 | SELF_HOSTED (GitHub-hosted runner; verified by run 40361964609) | 50 (EX0001 to EX0050) | EXECUTABLE: CONTROLLED and VERIFIED on GitHub Actions |
  | E03-CS001-SUT04-WEB | SUT-04 | WEB | API_RESET | 2 | SELF_HOSTED (GitHub-hosted runner; verified by run 40361964609) | 50 (EX0001 to EX0050) | EXECUTABLE: CONTROLLED and VERIFIED on GitHub Actions |
  | E03-CS001-SUT04-API | SUT-04 | API | API_RESET | 2 | SELF_HOSTED (GitHub-hosted runner; verified by run 40361964609) | 50 (EX0001 to EX0050) | EXECUTABLE: CONTROLLED and VERIFIED on GitHub Actions |
  | E03-CS001-SUT05-API | SUT-05 | API | ENVIRONMENT_RESTART | 2 | SELF_HOSTED (GitHub-hosted runner; verified by run 40361964609) | 50 (EX0001 to EX0050) | EXECUTABLE: CONTROLLED and VERIFIED on GitHub Actions |
  | E03-CS001-SUT02-ANDROID | SUT-02 | ANDROID | APP_DATA_CLEAR | 3 | EMULATED | none | BLOCKED, not executed (see below) |
  | E03-CS001-SUT02-IOS | SUT-02 | IOS | APP_DATA_CLEAR | 3 | SIMULATED | none | BLOCKED, not executed (see below) |

  The two blocked conditions are blocked from START and measurement by the study mobile-runner state (`mobile_runner_status` UNRESOLVED_AFTER_FALLBACK_FAILURE; `protocol/mobile-runner-policy-v2.md`, section 9.5, carried by `protocol/mobile-runner-policy-v3.md`); the remediation path of that policy's section 9.7 is not pursued before the planned manuscript's DATA FREEZE (human decision of 2026-10-20, `manifests/mobile-path-disposition-v1.yaml`); gate G-7 of the measured workflow refuses both. They have no sample size and are not executed; this section does not decide the mobile path.

  ### Sample size per condition

  N = 50 per executable condition (human decisions D2 of 2026-10-05 and Q7 of the executor README, section 11): execution ids EX0001 to EX0050, attempt 1 each, one dispatch per execution; 350 planned executions in all. Required Actions (reset) statistics are computed over the attempts that reached the reset action; ABORTED and ERROR attempts are reported beside them, never dropped.

  ### Exclusion and attribution rules

  None beyond the frozen E03 and setup-effort discipline: no run is excluded after the fact; an attempt keeps its recorded outcome; a further attempt (attempt + 1) is dispatched only on an explicit human instruction that names the condition and the execution; the first attempt of an execution is immutable; no attribution rule is introduced (the deferred issue (xix) belongs to other campaigns).

  ### CONFIRMATORY comparisons

  H2 (`protocol/statistical-analysis-plan-v1.md`, section 4.3): SUT-01 versus SUT-02 and SUT-01 versus SUT-03, on Required Actions (reset) per COMPARABLE canonical scenario, paired on the WEB surface (human decision D2 of 2026-10-05); this campaign contributes the reset side only. No comparison involving SUT-04 or SUT-05 is pre-registered CONFIRMATORY; they stay EXPLORATORY.

  ### Execution

  Every MEASURED_EXPERIMENT runs only through `.github/workflows/e03-measured-execution.yml` on the default branch of the PUBLIC repository (GitHub Actions reads the public tree, so the dispatches follow the publication of the START state), one condition, one execution, one attempt per dispatch, first attempt only, no GitHub re-run. Launch authorizations, one per SUT (human decision D5 of 2026-10-05), are separate records that this section does not issue.
