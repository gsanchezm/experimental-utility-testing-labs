  result: "ALL GATES PASSED for each of the 13 conditions (46 gates PASS, 0 FAIL, attempt 1, first execution 1). The executor tests (107) pass; they include the gate must-pass tree, one mutation per gate that must fail, the further-attempt gate with its matrix, the as-is repository that must fail closed, and runs of the isolation and validation steps on synthetic bundles."
