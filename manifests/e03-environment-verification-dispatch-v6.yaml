import_rules_fixed_before_the_run:  # verbatim from the instruction; applied by operation OP-ENV-14, issued separately and adopted by the human research lead separately
  R1: |-
    Each SUT-04 condition's github_actions_verification.status is the verification_result of the SUT-04 ENVIRONMENT_VERIFICATION record (the status file's own definition, header comment lines 9-10, wrapped there: "a VERIFIED GitHub Actions record for the condition"); github_job_conclusion is transcribed as observed. When the job concludes failure after its verify step wrote a VERIFIED record (a later step failed, for example the DRY_RUN step or an upload), both conditions are VERIFIED, the job conclusion is transcribed as failure, and the failed step is named; nothing is hidden.
  R2: |-
    Latest-run rule (the status file's github_actions_runs comment; multi-run semantics defined 2026-10-04): this run runs a job only for E03-CS001-SUT04-WEB and -SUT04-API, so it governs those two conditions, whatever its result; the seven other conditions keep the values of run 38018788066, and the import updates the comment's parenthetical that names that run for all nine; the earlier values stay in their import directories and import records.
  R3: |-
    reverification_required: neither SUT-04 condition carries the entry (operation OP-ENV-12 removed it; the summary reads reverification_required: []); the import adds none and removes none; gate G-8 then refuses a SUT-04 condition only if its github_actions_verification.status is not VERIFIED (both conditions are CONTROLLED).
  R4: |-
    Only the one ENVIRONMENT_VERIFICATION artifact is imported, byte-exact, under experiments/E03-resetability/environment-verification/github-actions/run<run id>-a1/sut-04-web-api/. The DRY_RUN bundles are downloaded to your scratchpad, verified against their GitHub digests, read, and never imported anywhere; only values read from them (numbers, statuses, quoted lines) and their digests enter tracked records.
  R5: |-
    Any private-path, vendor-term, or secret-like hit inside a member of the ENVIRONMENT_VERIFICATION artifact (for example in a SUT log that carries DRY_RUN traffic): STOP and report before any import; publication handling then follows the OP-ENV-05 precedent, and the canonical import stays byte-exact either way.
  R6: |-
    A DRY_RUN finding (a non-zero executor exit status, a failed validation, an outcome other than SUCCESS, an action count other than the predeclared 2, a settle that reached its bound, a missing file) is a DRAFT revision item of the executor before START (new digests, new commit), never a SUT finding. The executor README items P1 and O1 (labels of the OP-PREP-E03-REV-01b review; the README does not carry them) are corrected once, after the import of this run and before the lock, with the values that the hosted DRY_RUN runs observe (run 38018788066 and this run): P1, the idle-page figure "(0.9 to 1.1 s)" in section 12, item 6 (a figure quoted from one run of the synthetic checks); O1, the section 9 sentence that on the GitHub-hosted runner the login name in each SUT-04 service's start-up line is the runner account, not a private name (a prediction, first observable in this run).

