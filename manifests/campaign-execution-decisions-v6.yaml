    exact_text_sha256: 348de6334ffcd57f2a599de8a13f27e68219521baf4b5faed2cf25c9b764237f
    note: the answer of the question dialog, whole (the question texts as put to the human research lead and the option chosen for each); the chosen option is the decision
    exact_text: "Your questions have been answered: \"Lectura del código fuente de los SUT, que cierra D-11 (clases basadas en ausencia: SUT01-WEB-01, SUT02-WEB-01 y parte de SUT01-API-01), D-12 (campos MX requeridos, control de «realizar pedido», cuerpo del 500, códigos y mensajes marcados TBD, ruta del CAPTCHA) y D-13 (si el DateCheckValidator de SUT-04 usa solo las fechas de la solicitud o un reloj), y de paso dos puntos abiertos de E09 (si el h2 del catálogo de SUT-01 lleva aria-label, aria-labelledby o title, y la ruta /catalog). El código no está en el repositorio. ¿Autorizas lecturas de solo lectura (GET de archivos concretos, en el commit fijado de cada SUT, desde GitHub; sin clonar, sin instalar ni ejecutar nada), igual que la del README de SUT-01? Lo leído y su hash se registran en un registro nuevo; si algo no queda determinado por la lectura, te lo vuelvo a preguntar.\"=\"Sí, SUT-01, 02, 04 y 05 (Recomendado)\", \"E09, diseño de la detección en SUT-01 (seis decisiones; todas con la recomendación del brief). HD-1: una sola condición con el modo missing_name, N = 50 intentos y estratificación por la extracción realizada (no adaptativa, no tres condiciones). HD-2: el conteo de H5 para SUT-01 es 1 (solo el modo con regla nombrada). HD-3: regla esperada = solo empty-heading, porque image-alt no puede dispararse con alt vacío en el axe-core 4.14.0 fijado; se confirma con un sondeo antes del bloqueo, y si el h2 llevara aria-label o title se vuelve a decidir antes del bloqueo, nunca después de datos. HD-4: inclusión explícita de empty-heading en el conjunto de reglas, dejando registrado que es una regla de buenas prácticas de impacto menor, de modo que la verdad de referencia es más débil que una falla WCAG. HD-5: detectado = al menos un nodo coincidente con el selector predeclarado. HD-20: una no detección se registra como no detección del conjunto de reglas predeclarado sobre la condición DOM confirmada al escanear, sin inferir causa. ¿Las apruebas?\"=\"Aprobar las seis (Recomendado)\", \"E09, parámetros de las condiciones (cinco decisiones; todas con la recomendación del brief). HD-6: incluir la condición de control (standard_user, misma página y viewport, regla esperada ausente; no cuenta en H5). HD-7: mercado y lenguaje de E03 (MX, es). HD-8: solo la página del catálogo (el carrito requeriría su propio sondeo). HD-9: N = 50 intentos por condición (el estándar del protocolo; unos 17 serían extracciones missing_name si los tres modos fueran equiprobables, supuesto que los registros no establecen). HD-12: carga del escáner descargando el tarball fijado por URL, verificando sha512 e inyectando axe.min.js desde Python, sin Node en el ejecutor (el borrador del ejecutor ya está construido así). ¿Las apruebas?\"=\"Aprobar las cinco (Recomendado)\", \"E09, infraestructura y registros (siete decisiones; todas con la recomendación del brief). HD-10: E09 hace su propia verificación de entorno en GitHub Actions (no reutiliza la de E03; será un DRY_RUN que pedirá su propia aprobación con la línea exacta), la decisión de instancia controlada se registra solo por condición y el booleano controlled_instance_available del manifiesto de SUT queda en null. HD-11: se excluyen las violaciones incidentales (como las alt faltantes de SUT-03) porque no se pueden activar ni reiniciar. HD-13: sin registro de mapeo ahora (no existe condición de SUT-02 ni SUT-03); se decidirá antes de cualquier comparación de tasas entre SUT. HD-14: esquema de manifiesto v2, como E03. HD-15: sin Required Actions en E09. HD-17: sin prompt de procedimiento de despacho congelado (el despacho lo hace el ORCHESTRATOR bajo CAMPAIGN-CI-WRITE-AUTH-01). HD-18: bloqueo propio del ejecutor de E09 con los mismos pins, sin tocar el bloqueo de E03 (el borrador ya está así). ¿Las apruebas?\"=\"Aprobar las siete (Recomendado)\". You can now continue with these answers in mind."
