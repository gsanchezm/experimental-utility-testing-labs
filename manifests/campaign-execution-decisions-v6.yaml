    note: the answer of the question dialog, whole (the question texts as put to the human research lead and the option chosen for each); the chosen option is the decision
    exact_text: "Your questions have been answered: \"E05, convenciones de análisis y registro (cuatro decisiones; todas con la recomendación del brief, salvo la nota marcada como mía). D-05: intervalo de Wilson sin corrección de continuidad, porque el plan de análisis no especifica ninguna. D-07: para SUT01-API-05, SUT01-API-06 y SUT04-API-02 se predeclara una categoría esperada, el CEOR se reporta como descriptivo y la medida principal es H(Y) con los conteos por categoría. D-08: la fase del intento va en la etiqueta outcome_category, sin cambiar el esquema v2 congelado; además, propuesta mía (el brief la deja abierta y de baja prioridad): el reset no se emite también como actions[], porque E05 no cuenta Required Actions. D-19: convención de identificadores de E03 (execution_id = índice de repetición, attempt = índice de reejecución dentro de ella, run_id = condición__ejecución__A intento), con la diferencia respecto de la descripción del esquema registrada. ¿Las apruebas?\"=\"Aprobar las cuatro (Recomendado)\", \"D-06, denominador mínimo para evaluar H3 en una condición determinista (S = intentos cuya verificación del estado objetivo pasó; T = intentos válidos). El brief recomienda (a) S = T. Dato que conviene ver antes de decidir: en E03 2 de 350 intentos (0,6 %) y en E02 3 de 500 (0,6 %) fallaron antes de que corriera el ejecutor; con N = 50 la probabilidad de que una condición tenga al menos uno así es de unos 26 %, y bajo (a) ese solo intento dejaría H3 sin evaluar en esa condición aunque la causa sea de infraestructura (por D-09 esos intentos cuentan en T). ¿Qué regla fijamos antes del START?\"=\"b: mínimo S ≥ 45 de 50 (Recomendado por mí)\", \"E05, alcance y elegibilidad (cinco decisiones; todas con la recomendación del brief). D-01: SUT-05 web no tiene condición este ciclo (el reinicio de entorno está registrado para la API; el protocolo dice «registrado para ese ecosistema», no «para esa superficie»). D-14: SUT-03 sin condiciones hasta que exista una fila de evidencia de E01 que nombre un estímulo determinista; no se agrega una clase solo documental. D-15: las condiciones móviles de E05 quedan fuera y tendrían un diseño aparte sujeto a la política del runner móvil. D-17: solo estados objetivo de CS-001, sin escenario canónico nuevo. D-18: environment_type SELF_HOSTED por condición en runners hospedados por GitHub, y verificación de la instancia controlada de cada condición antes del START (esa verificación sería un DRY_RUN que pediría su propia aprobación con la línea exacta). ¿Las apruebas?\"=\"Aprobar las cinco (Recomendado)\", \"E05, clase de dos condiciones de SUT-01 (ambas con la recomendación del brief). D-04: SUT01-API-04 (retraso fijo de 3,0 s de performance_glitch_user) se declara determinista por mecanismo, con el tiempo límite del cliente muy por encima de 3,0 s fijado antes del START y la categoría S_CLIENT_TIMEOUT conservada; la alternativa conservadora sería «dependiente del tiempo». D-10: SUT01-API-02 (contenido estático) y SUT01-API-03 (el estímulo no actúa sobre el estado objetivo) cuentan para H3 con una marca de «estímulo nominal» y no se excluyen. ¿Las apruebas?\"=\"Aprobar ambas (Recomendado)\". You can now continue with these answers in mind."
  question_dialog_2:
    transcript_stamp: "2026-11-12T19:09:09.773Z"
