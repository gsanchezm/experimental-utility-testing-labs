    exact_text: "Your questions have been answered: \"HD-19, cómo registrar una discrepancia con E01. El registro congelado SUT01-EV-0019 espera que image-alt se dispare con alt vacío, pero en el axe-core 4.14.0 fijado image-alt solo falla con alt compuesto de espacios, así que esa mitad de la expectativa no puede ocurrir (la otra mitad, empty-heading sobre el h2 vacío, sí). Ningún registro de E01 se edita en ningún caso. El brief admite (i) o (ii); ¿cuál uso?\"=\"(i) Entrada en protocol/unresolved.md (Recomendado)\". You can now continue with these answers in mind."
decisions:
- id: D-05-WILSON-CONTINUITY
  dialog: 1
  chosen: "Aprobar las cuatro (Recomendado)"
  effect: "E05 Wilson intervals are computed without continuity correction (the statistical analysis plan specifies none); fixed before any analysis."
- id: D-07-EXPECTED-CATEGORY-RANDOM-CONDITIONS
  dialog: 1
  chosen: "Aprobar las cuatro (Recomendado)"
  effect: "SUT01-API-05, SUT01-API-06 and SUT04-API-02 each pre-declare one expected category; their CEOR is reported as descriptive and H(Y) with the category counts is the primary descriptive measure. SUT02-WEB-02 and SUT05-API-02 carry a declared expected category in the configuration instead (brief s.11)."
- id: D-08-SCHEMA-PHASE-LABELS-ACTIONS
  dialog: 1
  chosen: "Aprobar las cuatro (Recomendado)"
  effect: "(a) the phase of an attempt is carried in the outcome_category label (ESTABLISHMENT_, RESET_, S_, INTERRUPTED_), with no change to the frozen run-manifest schema v2; (c) the reset is not also emitted as actions[], because E05 counts no Required Actions (the item (c) proposal was the ORCHESTRATOR's; the brief left it open at low priority)."
- id: D-19-IDENTIFIERS
  dialog: 1
  chosen: "Aprobar las cuatro (Recomendado)"
  effect: "E03 convention: execution_id = repetition index EX0001 to EX00N (N = 50), attempt = re-execution index within it, run_id = condition__execution__A attempt; the difference from the schema's description is recorded in the configuration."
- id: D-06-MINIMUM-DENOMINATOR
  dialog: 1
  chosen: "b: mínimo S ≥ 45 de 50 (Recomendado por mí)"
  effect: "A deterministic condition is evaluable for H3 only when S is at least 45 of its N = 50 attempts (S = attempts whose target-state verification passed); below that, CEOR and H3 for the condition read 'not evaluable', with the reason. The brief recommended (a) S = T; the ORCHESTRATOR recommended (b) after showing that 2 of 350 attempts of E03 and 3 of 500 of E02 (0.6 percent each) failed before the executor ran, so that under (a) about 26 percent of conditions of N = 50 would be left unevaluable by infrastructure alone. The value 45 was proposed by the ORCHESTRATOR, not by the brief, and is fixed in the configuration before START; the raw rates still count every attempt (D-16)."
- id: D-01-SUT05-WEB
  dialog: 1
  chosen: "Aprobar las cinco (Recomendado)"
  effect: "SUT-05 web has no E05 condition in this cycle; the environment restart of SUT-05 stays recorded for its API surface only."
- id: D-14-SUT03-CONDITIONS
  dialog: 1
  chosen: "Aprobar las cinco (Recomendado)"
  effect: "No SUT-03 condition until an E01 evidence row names a deterministic stimulus; no documented-only class is added."
- id: D-15-MOBILE-E05
  dialog: 1
  chosen: "Aprobar las cinco (Recomendado)"
  effect: "Mobile E05 conditions are outside the current design; a separate design, gated by protocol/mobile-runner-policy-v3.md, would be needed."
- id: D-17-CANONICAL-SCENARIO
  dialog: 1
  chosen: "Aprobar las cinco (Recomendado)"
  effect: "E05 uses CS-001 target states only; no new canonical scenario record."
- id: D-18-ENVIRONMENT-TYPE
  dialog: 1
  chosen: "Aprobar las cinco (Recomendado)"
  effect: "environment_type SELF_HOSTED per condition on GitHub-hosted runners, and a controlled-instance verification of each condition before START; that verification would be a non-measured DRY_RUN whose exact line needs its own approval."
- id: D-04-PERFORMANCE-READ-CLASS
  dialog: 1
  chosen: "Aprobar ambas (Recomendado)"
  effect: "SUT01-API-04 is declared deterministic by mechanism; the client timeout is fixed well above the 3.0 s delay before START and the category S_CLIENT_TIMEOUT is kept (a timeout that occurs is an unexpected category and counts)."
- id: D-10-NOMINAL-STIMULI
  dialog: 1
  chosen: "Aprobar ambas (Recomendado)"
  effect: "SUT01-API-02 (static content) and SUT01-API-03 (the stimulus does not act on the target state) count toward H3 with a flag 'nominal stimulus'; they are not excluded."
- id: SOURCE-READS-AUTHORIZATION
  dialog: 2
  chosen: "Sí, SUT-01, 02, 04 y 05 (Recomendado)"
  effect: "Authorization of read-only reads (HTTPS GET of individual files at the pinned commit of SUT-01, SUT-02, SUT-04 and SUT-05 from their GitHub repositories; no clone, no install, no execution, no SUT start) to settle D-11, D-12 and D-13 of E05 and the E09 verification items on the SUT-01 catalog h2 (aria-label, aria-labelledby, title) and the /catalog route. What is read and its sha256 are recorded in a new record; anything the reading does not settle is put again to the human research lead. The reads are not themselves decisions of D-11, D-12 or D-13."
- id: E09-HD-1-HD-2-HD-3-HD-4-HD-5-HD-20-DETECTION-DESIGN
  dialog: 2
  chosen: "Aprobar las seis (Recomendado)"
  effect: "HD-1: one SUT-01 condition, the missing_name stratum, N = 50 attempts, stratified by the realized draw (not adaptive, not three conditions). HD-2: the H5 count for SUT-01 is 1. HD-3: the predeclared expected rule is empty-heading only (image-alt cannot fire on an empty alt in the pinned axe-core 4.14.0); confirmed by a probe before the lock, and re-decided before the lock, never after data, if the h2 carries aria-label, aria-labelledby or title. HD-4: empty-heading is included explicitly in the rule set, recorded as a best-practice, minor-impact rule, so the ground truth is weaker than a WCAG failure. HD-5: detected = at least one node matching the predeclared selector. HD-20: a non-detection is recorded as a non-detection of the predeclared rule set on the DOM condition confirmed at scan time, with no cause inferred (a DOM assertion beside the scanner only if the probe shows the DOM condition is unstable)."
- id: E09-HD-6-HD-7-HD-8-HD-9-HD-12-CONDITION-PARAMETERS
  dialog: 2
  chosen: "Aprobar las cinco (Recomendado)"
  effect: "HD-6: include the control condition (standard_user, same page and viewport, expected rule absent; not counted in H5). HD-7: market MX and language es, as in E03. HD-8: the catalog page only. HD-9: N = 50 attempts per condition. HD-12: scanner loaded by fetching the pinned tarball by URL, verifying its sha512 and injecting axe.min.js from Python, with no Node in the executor (the DRAFT executor is already built so)."
- id: E09-HD-10-HD-11-HD-13-HD-14-HD-15-HD-17-HD-18-INFRASTRUCTURE-AND-RECORDS
  dialog: 2
  chosen: "Aprobar las siete (Recomendado)"
  effect: "HD-10: E09 runs its own environment verification on GitHub Actions (a non-measured DRY_RUN needing its own exact-line approval), the controlled-instance decision is recorded per condition only, and controlled_instance_available in the SUT manifest stays null. HD-11: incidental violations (such as the missing alt attributes of SUT-03) are excluded. HD-13: no mapping record now; decided before any cross-SUT rate comparison. HD-14: run-manifest schema v2. HD-15: no Required Actions in E09. HD-17: no frozen dispatch-procedure prompt (the ORCHESTRATOR dispatches under CAMPAIGN-CI-WRITE-AUTH-01). HD-18: an E09 implementation lock of its own with the same pins, leaving the E03 lock untouched (the DRAFT is built so)."
- id: E09-HD-19-RECORDING-THE-SUT01-EV-0019-DISCREPANCY
  dialog: 3
  chosen: "(i) Entrada en protocol/unresolved.md (Recomendado)"
  effect: "An entry in protocol/unresolved.md describes that the image-alt half of the expected outcome of SUT01-EV-0019 cannot occur under the pinned axe-core, and points to the E09 configuration; no E01 record is edited (E01 is FROZEN) and no correction record is made. The ORCHESTRATOR reads the E01 Score 3 as unaffected because the missing_name mode keeps a documented violation (the empty h2); that reading is the ORCHESTRATOR's and is stated in the entry."
