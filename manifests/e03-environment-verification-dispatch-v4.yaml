  - "(1) the OP-CI-02 correction of the SUT-05 provision step at its first execution: npm start runs in a new session (start_new_session), so npm, the shell it spawns, and the node process that serves port 3000 are expected to share one process group; pid1.txt and pgid1.txt record its pid and group; the step fails if npm exits early or GET /rest/admin/application-version does not answer 200 within the readiness window (90 attempts, 3 s apart)"
  - "(2) the OP-CI-02 correction of the verification step: a process-tree snapshot before the stop (process-tree-before-stop.txt: the recorded group, every npm or node process, the listener(s) on port 3000 reported by ss, and SigIgn and SigCgt from /proc/<pid>/status); SIGTERM to the whole group (os.killpg); a fresh TCP connection to port 3000 attempted once per second until refused, window 60 s (stop_wait_window_seconds, port_3000_closed_after_stop, seconds_until_port_3000_closed), and only then api_after_stop_status; up to 15 s for the group to disappear (seconds_until_process_group_gone); a snapshot after the stop (process-tree-after-stop.txt; process_group_members_after_stop); a restart in a new session only if the port closed (restart_process_group; otherwise api_after_restart_status NOT_ATTEMPTED and NOT_VERIFIED); a snapshot after the restart (process-tree-after-restart.txt)"
  - "(3) VERIFIED requires GET /rest/admin/application-version 200, an HTTP status code for POST /rest/user/login (empty body) and for GET /api/BasketItems/ (unauthenticated), port_3000_closed_after_stop true, api_after_stop_status ERROR, and api_after_restart_status 200; the fourth reachability check, GET /rest/basket/1 (unauthenticated), is recorded and not required"
  - "(4) the observation of run 37265782721 to explain: api_after_stop_status 200 after pkill -P and kill of the npm pid and a 5 s wait; the three process-tree files are expected to show which processes formed the group (npm, the shell it spawns, node) and which one listened on port 3000; the cause stays narrowed, not established, until those files are read"
  - "(5) everything else of the job is unchanged from run 37265782721 (the pin read, the clone and the release-tag relation that fail closed, the packaged distribution of the pinned release with its GitHub digest check, the npm logs, the fallback NOT_VERIFIED record, the capture-time scrub of runner host paths, the upload); the kept-file list (EV_KEPT) and the upload list gain the three process-tree files"
  - "(6) the six other jobs do not run (skipped by the target); the conclusion of the run is the conclusion of the one job"

