# attempt that follows the preserved APPIUM3-COMPAT-SMOKE-AUTH-01 record (run 36340774530, attempt 1: SUT-02 android
# NOT_EXECUTED / HARNESS_ORCHESTRATION, SUT-02 ios not attempted; qualification/unresolved.md QUAL-U04). Successor of lock v2,
# which stays unchanged as the historical execution provenance of that run. Prepared before any execution under this lock;
# it becomes the execution baseline only when a new authorization naming it (APPIUM3-COMPAT-SMOKE-AUTH-02) is issued. The
# readiness gate of .github/workflows/e03-compatibility-smoke.yml recomputes every hash below from its own checkout and fails
# closed on any mismatch; it never trusts this file's values without recomputation.
