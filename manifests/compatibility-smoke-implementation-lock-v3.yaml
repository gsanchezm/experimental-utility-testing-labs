  defect: "lock v2 realized Android navigation (MC-06) by clicking the catalog title com.saucelabs.mydemoapp.android:id/titleTV reading Sauce Labs Backpack, a view without a click listener and without a clickable ancestor in the pinned build"
  corrected_target: "the product image com.saucelabs.mydemoapp.android:id/productIV of the same catalog item, located by the XPath //*[@resource-id=\"com.saucelabs.mydemoapp.android:id/productIV\" and ../*[@resource-id=\"com.saucelabs.mydemoapp.android:id/titleTV\" and @text=\"Sauce Labs Backpack\"]] (the productIV whose parent item view also contains the titleTV reading Sauce Labs Backpack)"
  semantic_action_unchanged: "open the catalog item Sauce Labs Backpack from the catalog; the arrival state (productTV reads Sauce Labs Backpack, plusIV present), the quantity reads 1 then 2 around one plusIV tap, the MC list, the timeouts, the builds, the runner and drivers, the substrates, and the attribution rules are as in lock v2"
  source_justification: "pinned SUT-02 Android source, commit 36b012eecdf6a2b488b9504e16b3d0c3ca9a0e7b: ProductsAdapter.java (blob 38640e3a787c7f0d10882ba5acc8a82ff0737dbf) onBindViewHolder sets the product title on holder.binding.titleTV (lines 46-47) and attaches the product-navigation OnClickListener to holder.binding.productIV of the same holder and position (lines 51-59), none to titleTV or the item root; item_products.xml (blob 68b653fca9f3cf14649b0cde28864898a63f3016) makes productIV and titleTV direct children of the same item root, which declares no click handler; ProductCatalogFragment.java (blob 4cb958d8bbac87cabdf3419db548684f65a6a70b, lines 149-160) opens the product-detail fragment of that position from the callback; the vendor Espresso test DashboardToCheckout.java (blob a476a5ad8dc759e88aee7f0b7ce4f8d0acfe3020, lines 53-54) opens the first product by clicking the catalog item. The productIV that shares its parent with the titleTV reading Sauce Labs Backpack is therefore that product's navigation view, by construction of the adapter"
  locator_strategy_availability: "xpath is among the locator strategies the pinned UiAutomator2 driver lists as valid (preserved AUTH-01 appium-server.log, line 239)"
  ios: "unchanged: the REALIZATION.ios object and every iOS cell of the realization section are byte-identical to lock v2 (no iOS execution exists; no evidence justifies a change)"
  not_claimed: "the corrected target is no evidence about what the AUTH-01 run would have produced; AUTH-01 stays NOT_EXECUTED permanently"
