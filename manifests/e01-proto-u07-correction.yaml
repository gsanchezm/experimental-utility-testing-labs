# manifests/e01-proto-u07-correction.yaml
# Post-data-collection change-control record for PROTO-U07 (protocol/unresolved.md), EUS-2026-001.
# Corrects a single provenance-representation defect in manifests/e01-campaign-freeze-v1.yaml: the
# "six_auditor_result_commits" field incorrectly named a pre-E01 template/checklist commit as if it were
# the six independent auditor-result commits. Prospective correction only: does not revisit any of the 54
# scientific cell determinations, does not revisit E01-HR-01 or E01-HR-02, does not perform H1-H5 analysis,
# and does not relaunch any auditor or ADJUDICATOR-EU-01. Editable by ORCHESTRATOR only
# (protocol/agent-governance-v1.md).
change_id: PROTO-U07
study_id: EUS-2026-001
discovery_point: >
  Discovered during a post-E01-freeze provenance sanity check (verification operation, 2026-09-18):
  manifests/e01-campaign-freeze-v1.yaml's six_auditor_result_commits field and the corresponding
  parenthetical in protocol/CHANGELOG.md's 2026-09-18 E01-freeze row cited commit
  b87c67c7df7810b3d5ff770e3ddadfe7cd3eb70a as representing the six auditors' result commits, with the note
  "all six audits/SUT-XX-.../ directories last touched at this single commit; unchanged since." Direct
  inspection (git show --stat, git log on each audits/SUT-0N-.../ path on main, git log -1 on each
  audit/e01-sut0N-* branch, git merge-base --is-ancestor, and reading each of the twelve relevant audit.md
  files — six at b87c67c, six at their real auditor commits) found the citation incorrect.
classification:
  category: "PROVENANCE"
  methodological: false
  representation_defect: false
  blocking_authorization_of_e01_matrix_or_h1: false
  invalidates_54_cell_scientific_determinations: false
  invalidates_e01_hr_01_or_e01_hr_02: false
  requires_re_adjudication: false
  note: >
    Human ruling (this operation, 2026-09-21): "PROTO-U07 is classified as a PROVENANCE defect only."
    Addresses exactly one thing: the identity of the commit(s) manifests/e01-campaign-freeze-v1.yaml cites
    as "the six auditor result commits." No other issue belongs in PROTO-U07.
human_ruling: >
  Classification ACCEPTED as instructed: PROVENANCE defect only. b87c67c7df7810b3d5ff770e3ddadfe7cd3eb70a
  is a pre-E01 checklist/template commit and MUST NOT be represented as the six independent E01
  auditor-result commits. The authoritative auditor-result commits are exactly the six listed in
  ground_truth_established_by_direct_inspection, below. No E01 effective score, adjudication result, human
  ruling, final matrix cell, or H1 result may change. Approved by gilbertosanchez.
