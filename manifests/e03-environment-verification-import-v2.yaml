  EUS-2026-001 — OP-ENV-05 — IMPORT THE RUN 37206291883 ENVIRONMENT_VERIFICATION ARTIFACTS BYTE-EXACT AND TRANSCRIBE THE GITHUB ACTIONS VERIFICATION STATE (7 VERIFIED / 2 NOT_VERIFIED; NON-MEASURED; NO DISPATCH; NO EXPORT)

  Role for this operation: ORCHESTRATOR (protocol/agent-governance-v3.md). Classification: import of non-measured verification evidence (class ENVIRONMENT_VERIFICATION, never raw-data/) and representation-only status transcription; not a human gate. Two phases with the reviewer's audit between them. Model: OP-ENV-02 (the import of run 37074152972: manifests/e03-environment-verification-import-v1.yaml and experiments/E03-resetability/environment-verification/github-actions/run37074152972-a1/IMPORT-RECORD.yaml), which is not edited. Start Phase A only on a clean tracked tree, in a lane (separate working tree) at f906d74486d5dddea3abdadc5ae7c82526d2e5b5.

  BASIS
  OP-ENV-04 second issue: the approved single dispatch (manifests/e03-environment-verification-dispatch-v2.yaml; run identity and completion block in manifests/e03-environment-verification-run-v2.yaml; commits 10bfabb, e55da48, c3e74df, f906d74) and your STEP 3 return of 2026-10-04 (sha256 f8a7dd469af8a613348dcd979e87fedb9ce9c3ba3502a2786d8439cd94bda58e). The reviewer checked the per-job findings independently on the Actions API and on its own download of the seven artifacts (every archive sha256 equal to its GitHub digest; 37 members).

  HUMAN DECISION ON THE PUBLICATION HANDLING OF THIS IMPORT (gilbertosanchez, human research lead, to the study's independent orchestration reviewer, received 2026-10-04T14:29:45Z = 2026-10-04 08:29 America/Mexico_City; exact text, 51 bytes UTF-8, no surrounding quotes, no trailing line feed: "D1-a), D2-ii, D3-sí, vamos por tus recomendaciones" — sha256 b09f0f826d4132a4a1f408c092666e78c69f748d50e581c3b36ae7fb6b28c5d5; the text is free of paths and session labels and may be recorded verbatim). Human-decision date: 2026-10-04. The option items presented to him name runner home paths and a third-party package name, so they are recorded as the paraphrase below, not verbatim (the precedent of manifests/qual-u07-publication-handling-v1.yaml, item_note).
  - D1, option a (host paths; public export only): the runner home paths found in the run-2 artifacts — the iOS record field checks.app_container and container.txt (1 line each, the macOS runner home, written here as "[/]Users/runner", followed by the CoreSimulator container path) and the SUT-05 npm-install.log (3 lines) and five npm debug logs (7, 5, 5, 5, 5 lines; the Linux runner home, "[/]home/runner", its npm configuration and log directories, and the workspace path) — 32 lines in 8 files — are handled in the public export by a new publication-only transformation class modeled on QUALIFICATION_HOST_PATH_REDACTION (same rule, marker <host-path>, prefixes extended to the Linux runner home and workspace), scoped to those eight exact files with expected changed-line counts and hashes, plus DETERMINISTIC_SANITIZED_ARCHIVE re-packs of the iOS and SUT-05 archives. The canonical bytes are not changed. Not selected: excluding those files from the export.
  - D2, option ii (third-party package name): the 16 occurrences in 11 lines of the 13_38_00 npm debug log of SUT-05 are one npm package name — the lowercase stem of one AI vendor followed by "-compatible", a dependency of the SUT at its pinned commit — which is SUT domain evidence, not attribution or branding; it is handled by the narrowest exemption of the validation workflow's hygiene pattern (that stem only when followed by "-compatible"; the other four stems and every other context unchanged), proven by a static matrix, recorded in PUBLIC-EXPORT-MANIFEST.yaml publication_hygiene_audit.classified_matches as SUT_DOMAIN_EVIDENCE; the file is exported UNCHANGED. Not selected: a publication-only redaction of the stem. The CI change is made under E03-CI-WRITE-AUTH-01 by OP-ENV-06, not here.
  - D3, yes (future runs): OP-ENV-06 adds a capture-time scrub of runner home paths to the workflow's own outputs (record field, container.txt, copied npm logs; marker <host-path>; the smoke_scrub precedent of the compatibility-smoke harness), so later imports need no transformation.
