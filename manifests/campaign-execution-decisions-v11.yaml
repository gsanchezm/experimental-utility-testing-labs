    exact_text: "Your questions have been answered: \"E07, escenarios canónicos (brief, sección 17, ítems 3, 4 y 5): DP-1 precondición = CLEAN_SESSION (el login ocurre dentro del escenario, como CS-003); DP-2 estado del actor = AUTHENTICATED_STANDARD (incluye el administrador de SUT-04); DP-3 un registro separado por dirección (CS-005 API a Web y CS-006 Web a API) en lugar de uno solo con la dirección como variable. ¿Adoptas los tres?\"=\"Adoptar los tres (Recomendada)\", \"E07, medición (ítems 6 y 7): sin latencia en la primera campaña, conteos de verificación solo descriptivos (no cuentan como Setup Effort); y los RUNNER_ERROR cuentan en las tasas primarias, con una tabla de sensibilidad EXPLORATORIA aparte. Con DP-4 estricto los ítems 9, 11 y 12 (diferencia de riesgo, diferencia mínima detectable, familia Holm) no tienen uso confirmatorio y las proporciones por condición quedan descriptivas con intervalo de Wilson. ¿Confirmas?\"=\"Confirmar (Recomendada)\", \"E07, DP-7, las dos celdas abiertas: SUT-01 Web a API (el audit solo da una inferencia arquitectónica; E03 registra un carrito web persistido en el cliente, así que no consta si el add-to-cart de la UI llega al carrito del servidor) y el listado admin de reservas de SUT-04. ¿Cómo las trato?\"=\"Medir en E07 y decidir después (Recomendada)\", \"E07, siguiente paso de preparación: redacto CS-006 (Web a API) y reescribo el borrador de configuración con estas decisiones, más la nota de alcance del README (el ítem 13: los pares móviles quedan fuera de este borrador y requieren la política móvil), todo como borrador sin START ni workflow. ¿Procedo?\"=\"Sí, procede (Recomendada)\". You can now continue with these answers in mind."
decisions:
  - id: D-E07-4
    subject: "DP-1, DP-2 and DP-3 (design brief, section 17, items 3, 4 and 5)"
    decision: "All three adopted as recommended: precondition_class CLEAN_SESSION (the login happens inside the scenario, as CS-003); actor_state AUTHENTICATED_STANDARD (including the SUT-04 administrator); one canonical record per direction, CS-005 (API to WEB) and CS-006 (WEB to API), without a template change."
