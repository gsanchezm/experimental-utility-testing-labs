questions_for_the_human_research_lead:
- id: Q1
  topic: the START authorization id
  text_says: E07-START-AUTH-01, the id of the human research lead's approval of the START
  recommendation: adopt
  note: the id is assigned by the ORCHESTRATOR to the approval, as for the earlier campaigns; the START row of protocol/CHANGELOG.md and the START record carry it
- id: Q2
  topic: the attribution of a runner cancelled or lost by the workflow, at import
  text_says: the ORCHESTRATOR records such an execution at import as TOOLING of that execution; the executor does not implement it
  recommendation: adopt (the E04 proposal, carried over)
  note: IMPLEMENTATION-NOTES item 11
- id: Q3
  topic: the attribution rules as implemented by the executor
  recommendation: confirm all four
  text_says:
  - a transport failure of an HTTP call (no answer) is a recorded failure of the block, attributed SUT, as in E04
  - an exception of the browser or of the executor is RUNNER_ERROR, attributed TOOLING
  - a bundle that cannot be written is RUNNER_ERROR, TOOLING, cause BUNDLE_NOT_WRITTEN (STUB_NO_BUNDLE of E04 is not carried; five categories are the whole set)
  - the sid claim of the SUT-01 key confirms the session binding (both layers hold the same login token); rounds 1 to 3 showed the sid equal on both layers in every SUT-01 execution
  note: IMPLEMENTATION-NOTES items 5 to 7; the transport-failure rule treats a read with no answer as NOT_VERIFIED (SUT), where the wording "the observation completed" would also admit RUNNER_ERROR
- id: Q5
  topic: platform and modality of the run manifests of a cross-layer record
  text_says: both follow the source layer (IMPLEMENTATION-NOTES item 8); the schema leaves the cross-layer convention open
  recommendation: adopt, and fix at the START
  note: the convention is not written in the configuration text; the executor README states it
- id: Q6
  topic: dispatch order and concurrency
  text_says: 'SUT-01: E07-CS005-SUT01-API-WEB then E07-CS006-SUT01-WEB-API; SUT-04: E07-CS005-SUT04-API-WEB then E07-CS006-SUT04-WEB-API; one condition at a time per SUT, a dispatch only after the previous
    run of its authorization has concluded and been imported; the two SUT chains independent and concurrent'
  recommendation: adopt
- id: Q7
  topic: the job timeout and the per-execution watchdog
  recommendation: keep 60 minutes and 600 seconds
  data: 'per execution, in the DRY_RUN executions read: 0.916 s to 3.562 s over rounds 2 and 3 (12 executions, read from the artifacts) and 0.961 s to 2.864 s in round 1 (record). Per job (gh api, runs
    44529314764, 44564694778 and 44567888786): the seven jobs of a condition that finished took 72, 79, 257, 259, 288, 315, 490 and 681 s (the failed job of round 2, 84 s, stopped in its Maven build); the
    step that installs the executor venv and Chromium took 26 s to 484 s (a 19-fold spread between jobs of the same workflow; 417 s in the round 2 job of SUT-01 API to WEB and 484 s in the round 3 job of
    SUT-04 API to WEB), the Maven install 18 to 70 s and build 86 to 122 s, the SUT start 11 to 34 s, and the executor step for three executions 8 to 13 s. A measured job repeats that set-up and then runs
    50 sequential executions: at the worst per-execution time seen (3.6 s) that is about 180 s, so the slowest job seen (681 s) extended to 50 executions is about 850 s, about 14 minutes, and the ceiling
    of 60 minutes is about four times that. The bound is empirical: the install step depends on the network and its spread is large; a DRY_RUN of three executions does not measure the per-execution time
    over 50 sequential executions on one instance (E04 and E05 ran 50 per condition under the same ceiling); the watchdog bounds a stuck execution at 600 s'
  note: the 60-minute ceiling is inherited from E04 and E05 and is hashed inside the locked measured workflow (gate G-9); lowering it needs a workflow change and a new hash; the watchdog (common.WATCHDOG_S)
    is inside the executor hash
- id: Q8
  topic: the controlled-instance basis
  recommendation: accept rounds 2 and 3 as the basis; round 1 is historical
  text_says: the four conditions are VERIFIED by the DRY_RUN rounds 2 and 3, both under the locked implementation hash, three executions each (E04 used one round); the failed job of round 2 is stated in
    the text
  finding: 'round 2 (run 44564694778, public main 4992205) holds three conditions; its job E07-CS005-SUT04-API-WEB failed in the Maven build step before the executor ran (parent POM not resolved from Maven
    Central; no execution; cause not established beyond the job log, read as a toolchain or network item of the hosted runner; the same step passed in rounds 1 and 3), so round 3 (run 44567888786, limited
    to that condition) repeated it: 3 of 3 VERIFIED with the check-out compared. Round 1 ran the previous implementation d1c48df5 and is not a basis. The controlled-instance status VERIFIED is the status
    of the instance; E07-CS006-SUT01-WEB-API recorded NOT_VERIFIED in every DRY_RUN execution of rounds 1 and 2 (a continuity observation, decision D-E07-11: a measured 0 of 50 is expected for that cell)
    and the status file and the text say so'
- id: Q9
  topic: stale statements of the E07 README outside the locked section
  recommendation: leave as in the E04 START (not edited)
  finding: the README still carries "Future ... (candidate - not frozen)" headings and the sentence "form TBD before freeze"; the E02 START corrected twelve such statements, the E04 START none; the Current
    status section and one word of the scope note are updated by this START
  note: correcting them would change the E07 README beyond the START edit set
- id: Q10
  topic: the working dispatch prompt before it is frozen
  recommendation: accept the correction of commit 88e70361 (already on main and public since export v71) and leave the status wording
  finding: the working prompt carried a stray placeholder @@E07@@ where it names the E04 prompt it was derived from (corrected on main in commit 88e70361, sha256 0d893ae5... to 60c0cc08..., published by
    export v71); its header describes the pre-START state (NOT_STARTED, the scenario records DRAFT, WORKING / NOT DISPATCHABLE) and the frozen copy repeats it byte for byte, as the frozen E04 prompt does
- id: Q11
  topic: the admin web session in both SUT-04 conditions
  text_says: both SUT-04 conditions log in to the admin web app in the reset block (IMPLEMENTATION-NOTES item 10); rounds 1 to 3 ran both that way
  recommendation: keep
